<script>
/* ---- modules/diary-panel.js ---- */
/* «Дневник»: настройки в боковой палитре страницы (кнопка-палитра): у каждого дневника своё название, цвет, шрифт, размер,
   интервал и цвет текста записей. Цвет и название — в таблице diaries (diary-store.updateDiary), остальное — app_settings
   (ключи modules.diary.d.<id>.<параметр>, каталог в settings-model.js). window.LifeDiaryPanel */
(function (global) {
  'use strict';
  const SM = global.LifeSettingsModel, DM = global.LifeDiaryModel;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const LIGHTS = [64, 50, 38, 26];                       /* светлые цвета нужны для тёмной темы */
  const SWATCHES = LIGHTS.reduce((a, l) => a.concat(Array.from({ length: 12 }, (_, i) => DM.hsl(i * 30, 66, l))), []).concat(['#9e9e9e', '#e0e0e0']);

  /* Стиль текста записей дневника: {fontFamily, fontSize, lineHeight, color} для inline-применения */
  function textStyle(SS, id, diaryColor) {
    const g = p => SS.get(SM.diaryKey(id, p)), f = g('font'), sz = g('size'), lh = g('lh'), ink = g('ink');
    return { fontFamily: f && SM.FONTS[f] ? SM.FONTS[f].stack : '', fontSize: sz ? sz + 'px' : '', lineHeight: lh ? String(lh / 100) : '', color: ink === 'normal' ? 'var(--ui-text)' : diaryColor };
  }

  /* o: {S: хранилище дневника, SS: хранилище настроек, current(): id выбранного в форме дневника, color(d): цвет дневника} → panel(box, ctx) */
  function create(o) {
    return function panel(box, ctx) {
      const S = o.S, SS = o.SS, handles = []; let timers = {}, shownIds = '';
      const sorted = () => S.D.diaries.slice().sort((a, b) => (a.created_at < b.created_at ? -1 : 1));
      const sample = (d) => { const st = textStyle(SS, d.id, o.color(d)); return Object.keys(st).map(k => k.replace(/[A-Z]/g, m => '-' + m.toLowerCase()) + ':' + st[k]).filter(x => !/:$/.test(x)).join(';'); };
      const KC = 'modules.diary.opt.lockCode', KP = 'modules.diary.opt.pageChars';
      let unlocked = false, relockT = null;
      const BOOK = `<div class="pg-book"><div class="pg-sub">Тетрадка</div><div class="pg-row"><label>Знаков на странице</label><span class="pg-ctl"><input class="ui-in" type="number" data-pc min="100" max="6000" step="50" style="width:92px"></span></div>
        <div class="pg-sub">Защита записей</div><div class="pg-row"><label>Цифровой код</label><span class="pg-ctl"><input class="ui-in" data-lc inputmode="numeric" maxlength="12" autocomplete="off" style="width:130px"><button type="button" class="ui-btn sm" data-lcsave>Сохранить</button></span></div>
        <div class="pg-msg" data-lcmsg role="status" style="font-size:12px;color:var(--ui-mut)"></div></div>`;
      const code = () => String(SS.get(KC) || ''), pageChars = () => { const v = +SS.get(KP); return v >= 100 ? Math.min(6000, Math.round(v)) : 500; };
      const lmsg = (m, bad) => { const n = box.querySelector('[data-lcmsg]'); if (n) { n.textContent = m || ''; n.style.color = bad ? 'var(--ui-bad)' : 'var(--ui-mut)'; } };
      /* поле кода: код не показывается и не меняется, пока не пройдено окно блокировки */
      function syncCode() {
        const f = box.querySelector('[data-lc]'); if (!f) return;
        if (!code()) { f.value = f === document.activeElement ? f.value : ''; f.placeholder = 'задайте 4–12 цифр'; f.readOnly = false; return; }
        if (unlocked) { f.readOnly = false; f.placeholder = ''; return; }
        f.readOnly = true; f.value = '••••••'; f.placeholder = '';
      }
      function lockWindow(onOk) {
        const ov = document.createElement('div'); ov.className = 'dy-lockov';
        ov.innerHTML = '<div class="dy-lockbox" role="dialog" aria-modal="true" aria-label="Код защиты"><b>Введите текущий код</b><input type="password" inputmode="numeric" autocomplete="off" maxlength="12" class="ui-in" data-lk-in><div class="dy-lkmsg" role="status"></div><div class="dy-lkrow"><button type="button" class="ui-btn primary" data-lk-ok>Открыть</button><button type="button" class="ui-btn" data-lk-x>Отмена</button></div></div>';
        document.body.appendChild(ov); const inp = ov.querySelector('input'), mm = ov.querySelector('.dy-lkmsg'); inp.focus();
        const close = () => ov.remove(), go = () => { if (inp.value === code()) { close(); onOk(); } else { mm.textContent = 'Неверный код'; inp.value = ''; inp.focus(); } };
        ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-lk-x]')) close(); else if (e.target.closest('[data-lk-ok]')) go(); });
        ov.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') go(); else if (e.key === 'Escape') close(); });
      }
      function askUnlock() {
        if (unlocked || !code()) return;
        lockWindow(() => { unlocked = true; clearTimeout(relockT); relockT = setTimeout(() => { unlocked = false; syncCode(); }, 60000); const f = box.querySelector('[data-lc]'); if (f) { f.readOnly = false; f.value = code(); f.focus(); } });
      }
      function build() {
        handles.splice(0).forEach(h => h.destroy());
        const ds = sorted(); shownIds = ds.map(d => d.id).join(',');
        if (!ds.length) { box.innerHTML = '<div class="ui-mut" style="font-size:12px">Дневников пока нет. Создайте первый кнопкой «+ Запись».</div>'; return; }
        const openId = o.current() || ds[0].id;
        box.innerHTML = BOOK + ds.map(d => `<details class="pg-dy" data-d="${esc(d.id)}" ${d.id === openId ? 'open' : ''}><summary><i class="pg-dot" style="background:${esc(o.color(d))}"></i><span data-nm>${esc(d.name)}</span></summary><div>
          <div class="pg-row"><label>Название</label><span class="pg-ctl"><input class="ui-in" data-dn maxlength="80" value="${esc(d.name)}" style="flex:1;min-width:0"></span></div>
          <div class="pg-row"><label>Цвет</label><span class="pg-ctl"><span class="pg-swatches">${SWATCHES.map(c => `<button type="button" data-sw="${c}" style="background:${c}" aria-label="Цвет ${c}"></button>`).join('')}</span><input type="color" data-dc value="${esc(o.color(d))}" aria-label="Свой цвет дневника"></span></div>
          <div class="pg-fields"></div><div class="pg-msg" role="status" style="color:var(--ui-bad);font-size:12px"></div>
          <div class="pg-sample" data-sample>Так выглядит текст записи в этом дневнике: съешь ещё этих мягких французских булок, 0123456789.</div></div></details>`).join('');
        ds.forEach(d => {
          const blk = box.querySelector(`[data-d="${CSS.escape(d.id)}"]`), K = p => SM.diaryKey(d.id, p);
          handles.push(ctx.fields(blk.querySelector('.pg-fields'), [{ key: K('font'), fallback: SM.entry(K('font')).opts[0][0], label: 'Шрифт записей' }, { key: K('size'), fallback: 14 }, { key: K('lh'), fallback: 140 }, { key: K('ink'), fallback: 'diary' }]));
        });
        sync();
      }
      function sync() {
        const pc = box.querySelector('[data-pc]'); if (pc && pc !== document.activeElement) pc.value = pageChars(); syncCode();
        const ds = sorted(); if (ds.map(d => d.id).join(',') !== shownIds) return build();
        ds.forEach(d => {
          const blk = box.querySelector(`[data-d="${CSS.escape(d.id)}"]`); if (!blk) return; const c = o.color(d);
          blk.querySelector('.pg-dot').style.background = c; blk.querySelector('[data-nm]').textContent = d.name;
          blk.querySelectorAll('[data-sw]').forEach(b => b.classList.toggle('on', b.dataset.sw.toLowerCase() === c.toLowerCase()));
          const dc = blk.querySelector('[data-dc]'); if (dc !== document.activeElement) dc.value = c;
          const dn = blk.querySelector('[data-dn]'); if (dn !== document.activeElement) dn.value = d.name;
          blk.querySelector('[data-sample]').setAttribute('style', sample(d));
        });
      }
      const say = (blk, msg) => { const m = blk.querySelector('.pg-msg'); if (m) m.textContent = msg || ''; };
      box.addEventListener('click', e => {
        const b = e.target.closest('[data-sw]'); if (!b) return; const blk = b.closest('[data-d]'), r = S.updateDiary(blk.dataset.d, { color: b.dataset.sw }); say(blk, r.ok ? '' : r.msg);
      });
      box.addEventListener('input', e => {
        const t = e.target; if (!t.matches('[data-dc]')) return; const blk = t.closest('[data-d]'); clearTimeout(timers.c); timers.c = setTimeout(() => say(blk, (S.updateDiary(blk.dataset.d, { color: t.value }) || {}).msg), 300);
      });
      box.addEventListener('change', e => {
        if (e.target.matches('[data-pc]')) { const v = Math.min(6000, Math.max(100, Math.round(+e.target.value) || 500)); e.target.value = v; SS.set(KP, v); return; }
      });
      box.addEventListener('focusin', e => { if (e.target.matches('[data-lc]') && code() && !unlocked) { e.target.blur(); askUnlock(); } });
      box.addEventListener('mousedown', e => { if (e.target.matches('[data-lc]') && code() && !unlocked) { e.preventDefault(); askUnlock(); } });
      box.addEventListener('click', e => {
        if (!e.target.closest('[data-lcsave]')) return;
        const f = box.querySelector('[data-lc]'); if (code() && !unlocked) { askUnlock(); return; }
        const v = String(f.value || '').trim(); if (!/^\d{4,12}$/.test(v)) { lmsg('Код: от 4 до 12 цифр.', true); return; }
        SS.set(KC, v); unlocked = false; clearTimeout(relockT); syncCode(); lmsg('Код сохранён.');
      });
      box.addEventListener('change', e => {
        const t = e.target, blk = t.closest && t.closest('[data-d]'); if (!blk) return;
        if (t.matches('[data-dn]')) { const r = S.updateDiary(blk.dataset.d, { name: t.value }); say(blk, r.ok ? '' : r.msg); if (!r.ok) { const d = S.D.diaries.find(x => x.id === blk.dataset.d); t.value = d ? d.name : ''; } }
        else if (t.matches('[data-dc]')) { clearTimeout(timers.c); const r = S.updateDiary(blk.dataset.d, { color: t.value }); say(blk, r.ok ? '' : r.msg); }
      });
      build();
      const off1 = SS.subscribe(sync), off2 = o.onDiaries(sync);
      return { sync, destroy() { clearTimeout(relockT); off1(); off2(); handles.splice(0).forEach(h => h.destroy()); Object.keys(timers).forEach(k => clearTimeout(timers[k])); box.innerHTML = ''; } };
    };
  }
  global.LifeDiaryPanel = { create, textStyle, SWATCHES };
})(window);

</script>
<script>
/* ---- modules/diary.js ---- */
/* «Дневник» (компьютер): экран. Данные и действия — diary-store.js, расчёты — diary-model.js, стили — diary-css.js.

   видимого дневника; день выбранного дневника; новая запись (клик по дате или кнопка), правка (значок «Редакция»), удаление в два нажатия. */
(function (global) {
  'use strict';
  const M = global.LifeDiaryModel;
  global.LifeModules = global.LifeModules || {};
  const UI_KEY = 'lifeerp-diary-ui';

  function mount(el, ctxIn) {

    const core = ctxIn.core || global.LifeCore, TZ = core.TZ, S = global.LifeDiaryStore.create(core), D = S.D;
    if (!document.getElementById('dy-css')) { const s = document.createElement('style'); s.id = 'dy-css'; s.textContent = global.LifeDiaryCss; document.head.appendChild(s); }
    const ui = (() => { const u = core.store.get(UI_KEY, null) || {}; return { on: Array.isArray(u.on) ? u.on : null }; })();
    const saveUi = () => core.store.set(UI_KEY, { on: ui.on });
    const t0 = S.today(), p0 = M.dayParts(t0);
    let y = p0.y, mo = p0.m, bk = { dy: null, sp: null }, chars0 = 0, reveal = {}, revT = {}, armed = null, buf = '', armT = null, bmsg = '', form = null, editing = null, delAsk = null, open = {}, mk = null, alive = true, imp = { text: '', busy: false, confirm: false };
    const visible = id => ui.on === null ? true : ui.on.indexOf(id) >= 0;
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const diaryColor = d => (d && M.validColor(d.color) ? d.color : '#404040');
    /* Настройки: у каждого дневника свой шрифт/размер/интервал/цвет текста записей (панель страницы, diary-panel.js) */
    let SS = ctxIn.settings; if (!SS) { SS = global.LifeSettingsStore.create(core); SS.fromCache(); }
    const panelSubs = [];
    el.innerHTML = '<div class="dy-app"></div>'; const root = el.firstChild;
    function applyType() {

    chars0 = pageChars();
/* высота страницы тетради не зависит от числа записей: по пробному тексту нужного объёма тем же шрифтом */
    function fitBook() {
      const sp = root.querySelector('.dy-spread'), pg = sp && sp.querySelector('.dy-pg'); if (!pg) return;
      const dd = root.querySelector('.dy-book').dataset.ddBook, d = D.diaries.find(x => x.id === dd), st = global.LifeDiaryPanel.textStyle(SS, dd, diaryColor(d));
      const pr = document.createElement('div'); pr.className = 'dy-x'; pr.style.cssText = 'visibility:hidden;margin:0;font-family:' + st.fontFamily + ';font-size:' + st.fontSize + ';line-height:' + st.lineHeight;
      pr.textContent = 'съешь ещё этих мягких французских булок да выпей же чаю '.repeat(Math.ceil(chars0 / 57)).slice(0, chars0);
      pg.appendChild(pr); const h = pr.offsetHeight, head = (pg.querySelector('.dy-ph') || { offsetHeight: 24 }).offsetHeight + 6; pr.remove();
      sp.style.setProperty('--pgh', Math.ceil(h + head + 90) + 'px');
    }
    const offSS = SS.subscribe(() => { if (!alive) return; if (pageChars() !== chars0) { chars0 = pageChars(); render(); } else { applyType(); fitBook(); } });

    function entryHtml(e, dr, withDate, book) {
      const c = diaryColor(dr), ed = editing && editing.id === e.id, ts = Date.parse(e.ts), stamp = withDate ? M.fmtDM(ts, TZ) : M.hm(ts, TZ);
      let body;
      if (ed) body = `<textarea class="dy-ta" data-f="edit" data-dd="${esc(dr && dr.id)}" style="color:${c}">${esc(editing.tx)}</textarea>${editing.err ? `<div class="dy-warn">${esc(editing.err)}</div>` : ''}<div class="dy-row"><button class="dy-btn primary" data-act="edit-save">Сохранить</button><button class="dy-btn" data-act="edit-cancel">Отмена</button></div>`;
      else if (book) body = `<div class="dy-x" data-dd="${esc(dr && dr.id)}" style="color:${c}">${esc(e.body)}</div>${open[e.id] ? `<div class="dy-row"><button class="dy-btn sm" data-act="edit" data-id="${esc(e.id)}">Исправить</button><button class="dy-btn sm" data-act="del" data-id="${esc(e.id)}">${delAsk === e.id ? 'Точно удалить?' : 'Удалить'}</button></div>` : ''}`;
      else if (open[e.id]) body = `<div class="dy-x" data-dd="${esc(dr && dr.id)}" style="color:${c}">${esc(e.body)}</div><div class="dy-row"><button class="dy-btn sm" data-act="edit" data-id="${esc(e.id)}">Исправить</button><button class="dy-btn sm" data-act="del" data-id="${esc(e.id)}">${delAsk === e.id ? 'Точно удалить?' : 'Удалить'}</button></div>`;

    const lockCode = () => String(SS.get('modules.diary.opt.lockCode') || '');
    const LK = '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';

    const arm = id => { armed = id; buf = ''; clearTimeout(armT); armT = setTimeout(() => { if (armed === id) { disarm(); render(); } }, 20000); };
    const hideAll = () => { Object.keys(revT).forEach(k => clearTimeout(revT[k])); revT = {}; reveal = {}; disarm(); };
    const say = m => { bmsg = m; render(); setTimeout(() => { if (bmsg === m) { bmsg = ''; if (alive) render(); } }, 6000); };

      ev.preventDefault(); const c = lockCode(); if (!c) return;

      if (buf === c) { const id = armed; disarm(); reveal[id] = true; clearTimeout(revT[id]); revT[id] = setTimeout(() => { delete reveal[id]; if (alive) render(); }, 90000); render(); }
    }
    document.addEventListener('keydown', onKey);

    /* кусок записи на странице тетради; запись, перенесённая с другой страницы, идёт без метки времени */
    function segHtml(x, dr) {
      const e = x.e, c = diaryColor(dr), ed = editing && editing.id === e.id, id = esc(dr && dr.id), hid = hidden(e);
      if (ed) { if (!x.first) return ''; return `<div class="dy-e"><span class="dy-stamp">${esc(M.fmtDM(Date.parse(e.ts), TZ))}</span><textarea class="dy-ta" data-f="edit" data-dd="${id}" style="color:${c}">${esc(editing.tx)}</textarea>${editing.err ? `<div class="dy-warn">${esc(editing.err)}</div>` : ''}<div class="dy-row"><button class="dy-btn primary" data-act="edit-save">Сохранить</button><button class="dy-btn" data-act="edit-cancel">Отмена</button></div></div>`; }
      const btns = x.last && open[e.id] && !hid ? `<div class="dy-row"><button class="dy-btn sm" data-act="edit" data-id="${esc(e.id)}">Исправить</button><button class="dy-btn sm" data-act="del" data-id="${esc(e.id)}">${delAsk === e.id ? 'Точно удалить?' : 'Удалить'}</button>${e.is_protected ? `<button class="dy-btn sm" data-act="unprot" data-id="${esc(e.id)}">Снять защиту</button>` : ''}</div>` : '';
      const lock = x.first ? `<button class="dy-lk ${e.is_protected ? 'on' : ''}" data-act="lock" data-id="${esc(e.id)}" title="${e.is_protected ? (hid ? 'Защищена: клик и ввод кода' : 'Защищена: скрыть снова') : 'Защитить запись'}" aria-label="Защита записи">${e.is_protected ? LK : UL}</button>` : '';
      const text = hid ? x.text.replace(/\S/g, 'о') : x.text;
      return `<div class="dy-e ${x.first ? '' : 'cont'} ${hid ? 'locked' : ''} ${armed === e.id ? 'armed' : ''}" data-act="tog" data-id="${esc(e.id)}">${x.first ? `<span class="dy-stamp">${esc(M.fmtDM(Date.parse(e.ts), TZ))}</span>${e.edited_at ? `<span class="dy-badge" title="Запись исправлена">Редакция · ${esc(M.fmtShort(Date.parse(e.edited_at), TZ))}</span>` : ''}${lock}${armed === e.id ? '<span class="dy-hint">введите код с клавиатуры</span>' : ''}` : ''}<div class="dy-x ${hid ? 'dy-blur' : ''}" data-dd="${id}" style="color:${c}">${esc(text)}</div>${btns}</div>`;
    }
    /* «Тетрадка»: вкладки видимых дневников, разворот из двух страниц, листание стрелками в нижних углах */
    function book(vis) {
      if (!vis.length) return '';
      const cur = vis.find(d => d.id === bk.dy) || vis[0]; bk.dy = cur.id;
      const pgs = M.pages(D.entries.filter(e => e.diary_id === cur.id), chars0), nsp = Math.max(1, Math.ceil(pgs.length / 2));
      let sp = bk.sp == null ? nsp - 1 : Math.max(0, Math.min(nsp - 1, bk.sp)); bk.sp = sp === nsp - 1 && bk.sp == null ? null : sp;
      const tabs = vis.map(d => { const c = diaryColor(d), on = d.id === cur.id; return `<button class="dy-tab ${on ? 'on' : ''}" data-act="tab" data-id="${esc(d.id)}" style="background:${c};color:${M.inkOn(c)}" title="${esc(d.name)}" aria-label="Дневник ${esc(d.name)}" aria-pressed="${on}">${esc((String(d.name).trim()[0] || '?').toUpperCase())}</button>`; }).join('');
      const page = (pg, cls) => pg ? `<div class="dy-pg ${cls}"><div class="dy-ph">${esc(M.pageHead(pg))}</div>${pg.map(x => segHtml(x, cur)).join('')}</div>` : `<div class="dy-pg ${cls} blank">${!pgs.length && cls === 'l' ? '<div class="dy-mut">Записей пока нет.</div>' : ''}</div>`;
      const c = diaryColor(cur);
      return `${bmsg ? `<div class="dy-warn" role="status">${esc(bmsg)}</div>` : ''}<div class="dy-book" data-dd-book="${esc(cur.id)}"><div class="dy-tabs" role="tablist">${tabs}<span class="dy-bn" style="color:${c}">${esc(cur.name)}</span></div><div class="dy-spread" style="border-color:${c}">${page(pgs[sp * 2], 'l')}${page(pgs[sp * 2 + 1], 'r')}<button class="dy-flip l" data-act="flip" data-d="-1" ${sp <= 0 ? 'disabled' : ''} aria-label="Назад к более ранним записям">‹</button><span class="dy-pn">${pgs.length ? 'стр. ' + (sp * 2 + 1) + (pgs[sp * 2 + 1] ? '–' + (sp * 2 + 2) : '') + ' из ' + pgs.length : ''}</span><button class="dy-flip r" data-act="flip" data-d="1" ${sp >= nsp - 1 ? 'disabled' : ''} aria-label="Вперёд к более новым записям">›</button></div></div>`;
    }

    function render() {
      if (!alive) return;
      const keep = { y: window.scrollY }; const ta = root.querySelector('[data-f]'); const focusF = ta && document.activeElement === ta ? ta.dataset.f : null;
      const ds = D.diaries.slice().sort((a, b) => (a.created_at < b.created_at ? -1 : 1)), vis = ds.filter(d => visible(d.id));
      const noteBad = S.state === 'error' || /Нет связи|неотправленные/.test(S.note);
      let h = `<div class="dy-bar"><span class="dy-note ${noteBad ? 'warn' : ''}" role="status">${S.state === 'loading' ? 'Загрузка…' : esc(S.note)}</span><button class="dy-btn" data-act="new">+ Запись</button><button class="dy-btn" data-act="reload">Обновить</button></div>`;
      if (S.state === 'error' && !D.diaries.length && !D.entries.length) h += `<div class="dy-empty">${esc(S.note)}</div>`;
      else {
        h += ds.length ? `<div class="dy-chips"><span class="dy-mut">Дневники:</span>${ds.map(d => { const on = visible(d.id); return `<button class="dy-chip ${on ? 'on' : ''}" data-act="chip" data-id="${esc(d.id)}" style="border-color:${on ? diaryColor(d) : 'var(--line)'};color:${on ? diaryColor(d) : '#777'}" title="${on ? 'Скрыть' : 'Показать'} записи дневника">${esc(d.name)}</button>`; }).join('')}<button class="dy-btn sm" data-act="all-on">Показать все</button><button class="dy-btn sm" data-act="all-off">Скрыть все</button></div>${vis.length ? '' : '<div class="dy-mut">Выберите дневник, чтобы увидеть его записи на календаре и в тетради.</div>'}`
          : '<div class="dy-empty">Дневников пока нет. Нажмите «+ Запись», там же можно создать первый дневник.</div>';
        const g = M.monthGrid(y, mo), cnt = M.counts(D.entries, visible, g.prefix);
        h += `<div class="dy-nav"><button class="dy-btn sm" data-act="prev" aria-label="Предыдущий месяц">‹</button><b>${M.MONTHS[mo]} ${y}</b><button class="dy-btn sm" data-act="next" aria-label="Следующий месяц">›</button><button class="dy-btn sm" data-act="cur">Сегодня</button></div><div class="dy-grid">${M.DOW.map(x => `<div class="dy-h">${x}</div>`).join('')}${'<div></div>'.repeat(g.lead)}`;
        for (let d = 1; d <= g.days; d++) {

          h += `<div class="dy-c ${k === t0 ? 't' : ''} ${nums.length ? '' : 'em'}" data-act="open-new" data-day="${k}" title="Новая запись на эту дату"><span class="n">${d}</span><span class="dy-w">${nums.map(x => `<b style="color:${diaryColor(x)}" title="${esc(x.name)}" data-act="show" data-id="${esc(x.id)}" data-day="${k}">${c[x.id]}</b>`).join('')}</span></div>`;

        if (form) {

          if (mk) h += `<div class="dy-box"><input class="dy-in" data-f="mkname" maxlength="80" placeholder="Название дневника" value="${esc(mk.name)}"><div class="dy-sw">${M.PALETTE.map(p => `<i data-act="mk-col" data-c="${p}" style="background:${p}" class="${mk.color === p ? 'on' : ''}"></i>`).join('')}</div>${mk.err ? `<div class="dy-warn">${esc(mk.err)}</div>` : ''}<div class="dy-row"><button class="dy-btn primary" data-act="mk-save">Создать</button><button class="dy-btn" data-act="mk-cancel">Отмена</button></div></div>`;
          h += `<div class="dy-mut">Время фиксируется при записи (пояс ${esc(TZ)}).</div><textarea class="dy-ta" data-f="text" data-dd="${esc(cur && cur.id)}" placeholder="Текст записи" style="color:${c}">${esc(form.tx)}</textarea>${form.err ? `<div class="dy-warn">${esc(form.err)}</div>` : ''}<div class="dy-row"><button class="dy-btn primary" data-act="form-save">Записать</button></div></div>`;
        }
        h += book(vis);
        h += `<details class="dy-det"><summary>Перенос из старой системы</summary><div class="dy-row"><span class="dy-mut">Вставьте файл «Данные браузера» (JSON) или выберите его. Уже существующие записи не перезаписываются, повторный перенос безопасен.</span></div><div class="dy-row"><input type="file" accept=".json,application/json" data-f="impfile"></div><textarea class="dy-ta" data-f="imp" style="min-height:70px" placeholder="JSON выгрузки">${esc(imp.text)}</textarea><div class="dy-row"><button class="dy-btn" data-act="imp-go" ${imp.busy ? 'disabled' : ''}>${imp.confirm ? 'Точно перенести?' : 'Перенести'}</button></div><div class="dy-mut" data-f="impinfo" role="status">${esc(imp.info || '')}</div></details>`;
      }
      root.innerHTML = h;
      if (focusF) { const n = root.querySelector('[data-f="' + focusF + '"]'); if (n) { n.focus(); try { n.setSelectionRange(n.value.length, n.value.length); } catch (e) { /* поле без выделения */ } } }
      applyType(); fitBook(); window.scrollTo(0, keep.y);
    }

    S.onChange = () => { if (alive) { render(); panelSubs.slice().forEach(f => f()); } };
    const setUi = v => { ui.on = v; saveUi(); };
    const allIds = () => D.diaries.map(d => d.id);
    const field = n => root.querySelector('[data-f="' + n + '"]');
    root.addEventListener('input', ev => {
      const f = ev.target.dataset && ev.target.dataset.f;
      if (f === 'text' && form) form.tx = ev.target.value; else if (f === 'edit' && editing) editing.tx = ev.target.value; else if (f === 'mkname' && mk) mk.name = ev.target.value; else if (f === 'imp') { imp.text = ev.target.value; imp.confirm = false; }
    });
    root.addEventListener('change', ev => {
      const f = ev.target.dataset && ev.target.dataset.f;
      if (f === 'dy' && form) { form.dy = ev.target.value; render(); } else if (f === 'day' && form && M.isDay(ev.target.value)) { form.day = ev.target.value; render(); }
      else if (f === 'impfile') { const file = ev.target.files && ev.target.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => { imp.text = String(r.result || ''); imp.confirm = false; imp.info = 'Файл прочитан (' + Math.round(imp.text.length / 1024) + ' КБ). Нажмите «Перенести».'; render(); const d = root.querySelector('.dy-det'); if (d) d.open = true; }; r.readAsText(file); }
    });
    root.addEventListener('click', async ev => {
      if (armed) { const en = ev.target.closest('.dy-e'); if (!en || en.dataset.id !== armed) { disarm(); render(); } }
      const t = ev.target.closest('[data-act]'); if (!t) return; const a = t.dataset.act, id = t.dataset.id;
      if (a === 'show') { ev.stopPropagation(); const pgs = M.pages(D.entries.filter(e => e.diary_id === id), chars0); bk = { dy: id, sp: Math.floor(M.pageOfDay(pgs, t.dataset.day) / 2) }; render(); const b = root.querySelector('.dy-book'); if (b) b.scrollIntoView({ block: 'nearest' }); return; }
      if (a === 'tab') { bk = { dy: id, sp: null }; editing = null; hideAll(); render(); return; }
      if (a === 'flip') { const pgs = M.pages(D.entries.filter(e => e.diary_id === bk.dy), chars0), nsp = Math.max(1, Math.ceil(pgs.length / 2)), cur = bk.sp == null ? nsp - 1 : bk.sp; bk.sp = Math.max(0, Math.min(nsp - 1, cur + (+t.dataset.d))); editing = null; hideAll(); render(); return; }
      if (a === 'tog') { if (ev.target.closest('button,textarea')) return; const en = D.entries.find(x => x.id === id); if (en && hidden(en)) { if (!lockCode()) { say('Сначала задайте код защиты: палитра страницы → «Защита записей».'); return; } arm(id); render(); return; } delAsk = null; open[id] = !open[id]; render(); return; }
      if (a === 'lock') { const en = D.entries.find(x => x.id === id); if (!en) return;
        if (en.is_protected) { if (hidden(en)) { if (!lockCode()) { say('Код защиты не задан.'); return; } arm(id); render(); } else { delete reveal[id]; clearTimeout(revT[id]); open[id] = false; render(); } return; }
        if (!lockCode()) { say('Сначала задайте код защиты: палитра страницы → «Защита записей».'); return; }
        const r0 = S.setProtected(id, true); if (!r0.ok) { say(r0.msg); return; } delete reveal[id]; render(); return; }
      if (a === 'unprot') { const r0 = S.setProtected(id, false); if (!r0.ok) say(r0.msg); delete reveal[id]; render(); return; }
      if (a === 'chip') { const on = (ui.on === null ? allIds() : ui.on.slice()), k = on.indexOf(id); if (k >= 0) { on.splice(k, 1); } else on.push(id); setUi(on); render(); return; }
      if (a === 'all-on') { setUi(allIds()); render(); return; }
      if (a === 'all-off') { setUi([]); render(); return; }
      if (a === 'prev' || a === 'next') { mo += a === 'next' ? 1 : -1; if (mo < 0) { mo = 11; y--; } if (mo > 11) { mo = 0; y++; } render(); return; }
      if (a === 'cur') { y = p0.y; mo = p0.m; render(); return; }
      if (a === 'reload') { S.load(); return; }
      if (a === 'new' || a === 'open-new') { form = { dy: (form && form.dy) || (D.diaries[0] && D.diaries[0].id) || '', day: a === 'open-new' ? t.dataset.day : S.today(), tx: form ? form.tx : '', err: '' }; mk = null; render(); const x = field('text'); if (x) { x.focus(); x.scrollIntoView({ block: 'center' }); } return; }
      if (a === 'form-close') { form = null; mk = null; render(); return; }
      if (a === 'mk-open') { mk = { name: '', color: M.PALETTE[0], err: '' }; render(); const x = field('mkname'); if (x) x.focus(); return; }
      if (a === 'mk-cancel') { mk = null; render(); return; }
      if (a === 'mk-col') { mk.color = t.dataset.c; render(); return; }
      if (a === 'mk-save') { const r = S.addDiary(mk.name, mk.color); if (!r.ok) { mk.err = r.msg; render(); return; } form.dy = r.id; if (ui.on !== null && ui.on.indexOf(r.id) < 0) setUi(ui.on.concat(r.id)); mk = null; render(); return; }
      if (a === 'form-save') { const r = S.addEntry(form.dy, form.day, form.tx); if (!r.ok) { form.err = r.msg; render(); return; } if (!visible(form.dy)) setUi((ui.on || []).concat(form.dy)); bk = { dy: form.dy, sp: null }; { const p = M.dayParts(form.day); y = p.y; mo = p.m; } form = null; mk = null; render(); return; }
      if (a === 'edit') { const e = D.entries.find(x => x.id === id); if (e) { editing = { id, tx: e.body, err: '' }; delAsk = null; render(); } return; }
      if (a === 'edit-cancel') { editing = null; render(); return; }
      if (a === 'edit-save') { const r = S.editEntry(editing.id, editing.tx); if (!r.ok) { editing.err = r.msg; render(); return; } editing = null; render(); return; }
      if (a === 'del') { if (delAsk !== id) { delAsk = id; render(); return; } S.deleteEntry(id); delAsk = null; delete open[id]; render(); return; }
      if (a === 'imp-go') {
        let obj = null; try { obj = JSON.parse(imp.text.trim()); } catch (e) { /* ниже скажем */ }
        const info = field('impinfo');
        if (!obj || !M.legacyRows(obj)) { imp.info = 'Не узнал файл: нужна выгрузка «Данные браузера» старой системы (в ней есть раздел diary).'; imp.confirm = false; render(); return; }
        const r = M.legacyRows(obj);
        if (!imp.confirm) { imp.confirm = true; imp.info = `В файле: дневников ${r.diaries.length}, записей ${r.entries.length}. Нажмите ещё раз.`; render(); const d = root.querySelector('.dy-det'); if (d) d.open = true; return; }
        imp.confirm = false; imp.busy = true; imp.info = 'Перенос…'; render();
        try { const res = await S.importLegacy(obj); imp.info = res.ok ? res.text : res.msg; if (res.ok) imp.text = ''; } catch (e) { imp.info = 'Не удалось: ' + (e.message || e); }
        imp.busy = false; render(); const d = root.querySelector('.dy-det'); if (d) d.open = true; if (info) { /* ссылка на старый узел больше не нужна */ }
      }
    });
    const onAuth = setInterval(() => { if (S.authLost && ctxIn.onAuthLost) { S.authLost = false; ctxIn.onAuthLost(); } }, 800);
    render(); S.load();
    const panel = global.LifeDiaryPanel.create({ S, SS, current: () => (form && form.dy) || '', color: diaryColor, onDiaries: f => { panelSubs.push(f); return () => { const i = panelSubs.indexOf(f); if (i >= 0) panelSubs.splice(i, 1); }; } });
    const onRs = () => { if (alive) fitBook(); }; window.addEventListener('resize', onRs);
    return { reload: () => S.load(), panel, unmount() { alive = false; document.removeEventListener('keydown', onKey); hideAll(); window.removeEventListener('resize', onRs); offSS(); clearInterval(onAuth); S.onChange = null; el.innerHTML = ''; } };
  }
  global.LifeModules.diary = { mount };
})(window);

<script>
/* ---- modules/timers-model.js ---- */
/* «Таймеры»: чистые расчёты без экрана и без базы (можно проверять отдельно).
   Данные D = {cards, targets, runs, entries, items}:
     cards    — timer_cards (живые), targets — timer_targets (и удалённые: нужны, чтобы показать название в старых записях),
     runs     — идущие таймеры (timer_runs без deleted_at), entries — time_entries с meta.card (сессии, ручные записи, поправки),
     items    — {id: {title, done}} дела из «Сфер и дел» (для названий).
   День — строка YYYY-MM-DD по поясу владельца (core.TZ). window.LifeTimersModel */
(function (global) {
  'use strict';
  const pad = n => (n < 10 ? '0' + n : '' + n);
  const MAX_TARGETS = 20, BELLS = [0, 1, 3, 5, 7, 10, 15];

  function fmt(ms) { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? h + ':' + pad(m) + ':' + pad(s % 60) : m + ':' + pad(s % 60); }
  function fmtClock(ms) { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? h + ':' + pad(m) + ':' + pad(s % 60) : pad(m) + ':' + pad(s % 60); }
  function fmtCorr(c) { const a = Math.abs(c), h = Math.floor(a / 60), m = a % 60; return (c < 0 ? '−' : '+') + (h ? h + ' ч' + (m ? ' ' + m + ' мин' : '') : m + ' мин'); }
  function fmtCorrShort(c) { const a = Math.abs(c), h = Math.floor(a / 60), m = a % 60; return (c < 0 ? '−' : '+') + (h ? h + 'ч' + (m ? m + 'м' : '') : m + 'м'); }

  /* ---- время и часовой пояс ---- */
  function dayKey(ms, tz) { return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ms)); }
  function offsetMin(ms, tz) { // смещение пояса от UTC в минутах на момент ms
    const p = {}; new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' })
      .formatToParts(new Date(ms)).forEach(x => { p[x.type] = x.value; });
    return Math.round((Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - Math.floor(ms / 1000) * 1000) / 60000);
  }
  /* «2026-11-15» + «10:30» в поясе tz → миллисекунды (NaN, если не разобрать) */
  function zonedTs(date, hm, tz) {
    const d = /^(\d{4})-(\d\d)-(\d\d)$/.exec(date || ''), t = /^(\d\d):(\d\d)(?::(\d\d))?$/.exec(hm || '');
    if (!d || !t) return NaN;
    const guess = Date.UTC(+d[1], +d[2] - 1, +d[3], +t[1], +t[2], +(t[3] || 0));
    let ts = guess - offsetMin(guess, tz) * 60000;
    ts = guess - offsetMin(ts, tz) * 60000;
    return ts;
  }
  function hm(ms, tz) { const p = {}; new Intl.DateTimeFormat('en-GB', { timeZone: tz, hourCycle: 'h23', hour: '2-digit', minute: '2-digit' }).formatToParts(new Date(ms)).forEach(x => { p[x.type] = x.value; }); return p.hour + ':' + p.minute; }
  function isoZoned(ms, tz) {

<script>
/* ---- modules/emo-store.js ---- */
/* «Эмоции»: данные и действия (без экрана). LifeEmoStore.create(core) → объект S.

          try { core.commit({ writes, journal: j }); } catch (e) { S.note = 'Не сохранено: ' + (e.message || e); }
          changed(); return T;
        },
        /* отмена: прежние версии возвращаются, созданное заново помечается удалённым */
        undo(summary) {
          const U = tx(), seen = {};

            const k = b.table + '/' + b.id; if (seen[k]) return; seen[k] = 1;
            const first = before.find(x => x.table === b.table && x.id === b.id), cur = D[TBL[b.table]].find(r => r.id === b.id);
            if (first.prev) U.put(b.table, first.prev); else if (cur) U.del(b.table, cur);

    }
    S.tx = tx;
    const newId = p => p + '_' + core.uuid().replace(/-/g, '').slice(0, 12);
    const tagRow = (o, base) => Object.assign({ id: o.id, name: '', sort: 0, created_at: iso(Date.now()), deleted_at: null }, base || {}, o);
    const nextSort = () => D.tags.reduce((a, t) => Math.max(a, t.sort), -1) + 1;
    const activeCount = () => D.tags.filter(t => !t.deleted_at).length;
    S.tags = () => M.activeTags(D);

    /* найти активную метку по названию, вернуть убранную с тем же названием или создать новую (внутри tx T) */

        const t = ensureTag(T, n, st); ids.push(t.id); names.push(t.name); added++;
      });
      if (!added) return { added: 0, msg: String(text).trim() ? 'Такая метка уже есть, либо меток уже ' + M.MAX_TAGS + '.' : '' };
      T.log('create', 'tag', ids.join(','), 'Добавлены метки: ' + names.join(', ')); T.commit(); return { added, ids, tx: T };
    };

    };
    S.deleteTag = function (id) {

      const T = tx(); T.del('mood_tags', t); T.log('delete', 'tag', id, 'Метка убрана из списка: ' + t.name); T.commit(); return T;
    };

    /* ---------- записи ---------- */
    const markRow = (o) => Object.assign({ id: o.id, ts: iso(o.at), local_date: TM.dayKey(o.at, TZ), value: o.val == null ? null : o.val, note: o.note || '', tag_ids: o.tagIds || [], created_at: iso(Date.now()), deleted_at: null }, {});
    S.addMark = function ({ tagIds, val, note, at }) {
      const ids = (tagIds || []).filter(id => D.tags.some(t => t.id === id && !t.deleted_at));
      if (!ids.length) return { error: 'Выберите хотя бы одно чувство.' };
      if (!Number.isInteger(val) || val === 0 || Math.abs(val) > 5) return { error: 'Выберите значение от −5 до +5.' };
      at = at == null ? Date.now() : at; if (at > Date.now() + 1000) return { error: 'Время записи не может быть в будущем.' };

      const T = tx(), id = newId('mk'); T.put('mood_marks', markRow({ id, at, val, note, tagIds: ids }));
      T.log('create', 'mark', id, 'Эмоция ' + M.fmtVal(val) + ': ' + ids.map(i => M.tagName(D, i)).join(', ') + (note ? ' · ' + note : '')); T.commit();
      return { ok: true, id, tx: T, at, count: ids.length };
    };
    S.removeMark = function (id) {
      const m = D.marks.find(x => x.id === id); if (!m) return null;
      const T = tx(); T.del('mood_marks', m); T.log('delete', 'mark', id, 'Запись удалена: ' + M.fmtVal(m.value) + ' ' + M.markTags(D, m).join(', ')); T.commit(); return T;
    };
    S.setTime = function (id, at) {
      const m = D.marks.find(x => x.id === id); if (!m) return null;
      const T = tx(); T.put('mood_marks', Object.assign({}, m, { ts: iso(at), local_date: TM.dayKey(at, TZ) }));
      T.log('change', 'mark', id, 'Время записи: ' + TM.hm(at, TZ)); T.commit(); return T;
    };

    /* ---------- импорт (общий для файла emo и старой копии) ---------- */
    S.importRecords = function (records, extraTags, label) {
      const T = tx(), st = { sort: nextSort() - 1 }; let added = 0, dup = 0;
      const byKey = {}; D.marks.forEach(m => { byKey[Math.floor(M.tsOf(m) / 1000) + '|' + m.value + '|' + (m.note || '')] = m; });
      (extraTags || []).forEach(n => { if (activeCount() < M.MAX_TAGS || M.findActive(D, n)) ensureTag(T, n, st); });
      records.forEach(r => {
        const tg = ensureTag(T, r.tag, st), k = Math.floor(r.at / 1000) + '|' + r.val + '|' + r.note, ex = byKey[k];
        if (ex) { if (ex.tag_ids.includes(tg.id)) { dup++; return; } byKey[k] = T.put('mood_marks', Object.assign({}, ex, { tag_ids: ex.tag_ids.concat(tg.id) })); added++; return; }

      });

    };
    S.importLegacy = function (obj) {
      const em = obj && obj.emo; if (!em || !Array.isArray(em.entries)) return { ok: false, msg: 'В копии нет раздела «Эмо» (нужна кнопка «Резервная копия» старых Карточек времени).' };
      const p = M.fromLegacy(em), r = S.importRecords(p.records, p.tags, 'Импорт Эмо из «Карточек времени»');
      return { ok: true, added: r.added, text: r.summary + (p.bad.length ? ', с ошибкой ' + p.bad.length : '') + '.', tx: r.tx };
    };
    S.importFile = function (data) {
      const p = M.parseImport(data, TZ); if (p.error) return { error: p.error };
      const r = S.importRecords(p.records, [], 'Импорт Эмо'); let msg = 'Добавлено ' + r.added + ', дублей пропущено ' + r.dup + ', с ошибкой ' + p.bad.length + '.';
      if (p.bad.length) msg += ' ' + p.bad.slice(0, 3).join('; ') + (p.bad.length > 3 ? '…' : '.');
      return { ok: true, added: r.added, msg, tx: r.tx };
    };
    S.firstDay = function () { let min = today(); D.marks.forEach(m => { if (m.local_date < min) min = m.local_date; }); return min; };
    return S;
  }

})(window);

<script>
/* ---- modules/tracks-model.js ---- */
/* «Треки»: чистые функции (без экрана и сети): дни, разбор ввода в клетке, итоги строки, порог, «дней с последнего», разбор
   выгрузки старой системы. window.LifeTracksModel. Самодостаточен (ни от каких модулей не зависит). */
(function (global) {
  'use strict';
  const STATUS = { wish: 'желание', new: 'новая', cur: 'текущая', off: 'неактивная' };
  const KIND = { habit: 'Трек', in: 'Доход', out: 'Расход' };
  const GROUPS = ['Треки', 'Доходы', 'Расходы'];
  const SUMMARY = { none: 'не показывать', avgall: 'среднее за период таблицы (все дни, пустые = 0)', auto: 'по умолчанию (сумма)', sum: 'сумма', avg: 'среднее (по дням с записью)', last: 'последнее значение', max: 'максимум', min: 'минимум', count: 'число дней с записью' };

  const THR = { none: 'без порога', below: 'ниже: норма ≤ порога', exact: 'точное значение: норма = порога', above: 'выше: норма ≥ порога' };

  const isDay = s => /^\d{4}-\d\d-\d\d$/.test(String(s || '')) && !isNaN(Date.parse(s + 'T12:00:00Z'));
  const dayKey = (ms, tz) => new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ms));
  const shiftDay = (k, n) => { const d = new Date(k + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const daysBetween = (a, b) => Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 864e5); // b - a
  const weekday = k => WD[new Date(k + 'T12:00:00Z').getUTCDay()];
  const round1 = x => Math.round(x * 10) / 10;
  const fmt = x => String(Math.round(x * 100) / 100).replace('.', ',');

  function indexEntries(entries) { // {trackId: {day: [entry,...]}}
    const m = {}; entries.forEach(e => { ((m[e.track_id] = m[e.track_id] || {})[e.day] = m[e.track_id][e.day] || []).push(e); }); return m;
  }
  /* Последний столбец строки по видимым дням: days = [{day, sum|null}] (sum = null, если в этот день записей нет) */
  function summarize(mode, days) {
    const v = days.filter(d => d.sum != null).map(d => d.sum), m = !mode || mode === 'auto' ? 'sum' : mode;

    else if (m === 'last') x = days.filter(d => d.sum != null).sort((a, b) => (a.day < b.day ? 1 : -1))[0].sum;

  /* последнее событие: самая свежая из базовой даты и дней с записью > 0 (не позже сегодня) */
  function lastEventDay(t, byDay, today) {
    let m = t.baseline_last || ''; Object.keys(byDay || {}).forEach(d => { if (d <= today && d > m && sumOf(byDay[d]) > 0) m = d; }); return m;
  }
  const daysSince = (t, byDay, today) => { const l = lastEventDay(t, byDay, today); return l ? Math.max(0, daysBetween(l, today)) : null; };
  const lastEntryDay = byDay => Object.keys(byDay || {}).sort().pop() || '';
  /* «спит»: для желания и новой дней с самого свежего из создания, записи, «оставить» */
  const dormantDays = (t, byDay, today) => { const a = [t.created, lastEntryDay(byDay), t.acked].filter(Boolean).sort().pop(); return a ? Math.max(0, daysBetween(a, today)) : 0; };

    const from = shiftDay(today, -(n - 1)); let s = 0; const days = new Set();
    Object.keys(byDay || {}).forEach(d => { if (d >= from && d <= today) { s += sumOf(byDay[d]); days.add(d); } }); return { sum: round1(s), days: days.size };
  };

  /* Выгрузка старой системы {state:{habits:[{id,name,unit,kind,st,created,start,ack,need,rel,th:{m,v},dsl,last,cm:{день:текст},en:[{d,v}]}], cfg}}
     → строки таблиц. Поддерживается и сам объект state, и объект {habits}. */
  function legacyRows(obj) {
    const st = obj && obj.state && Array.isArray(obj.state.habits) ? obj.state : (obj && Array.isArray(obj.habits) ? obj : null);
    if (!st) return null;
    const tracks = [], entries = [], notes = [], skipped = { badEntry: 0, badNote: 0, dupTrack: 0 }, seen = new Set(), cnt = [0, 0, 0];
    st.habits.forEach(h => {
      if (!h || !h.id || seen.has(h.id)) { skipped.dupTrack++; return; } seen.add(h.id);
      const kind = KIND[h.kind] ? h.kind : 'habit', status = kind !== 'habit' ? 'cur' : (STATUS[h.st] ? h.st : 'cur'), g = groupOf({ kind });
      const dt = x => (isDay(x) ? x : null), th = h.th || {};
      tracks.push({ id: String(h.id), name: String(h.name || 'Без названия').slice(0, 80), kind, unit: kind !== 'habit' ? 'тыс. ₸' : String(h.unit || '').slice(0, 20), status, created: dt(h.created) || dt(((h.en || []).map(e => e.d).sort()[0])) || '2026-01-01',
        started: dt(h.start), acked: dt(h.ack), need: String(h.need || ''), released: dt(h.rel), threshold_mode: kind === 'habit' && ['below', 'above', 'exact'].includes(th.m) ? th.m : 'none',
        threshold_value: kind === 'habit' && th.m ? (+th.v || 0) : 0, show_days_since: !!h.dsl, baseline_last: dt(h.last), sort_order: cnt[g]++, summary_mode: 'auto', deleted_at: null });
      const per = {}; (h.en || []).forEach(e => {
        const v = +e.v; if (!e || !isDay(e.d) || !isFinite(v) || v < 0) { skipped.badEntry++; return; }
        const k = per[e.d] = (per[e.d] || 0) + 1; entries.push({ id: 'te_' + h.id + '_' + e.d + '_' + k, track_id: String(h.id), day: e.d, value: v, deleted_at: null });
      });

    });

  }

  global.LifeTracksModel = { STATUS, KIND, GROUPS, SUMMARY, SUMMARY_SIGN, THR, WD, isDay, dayKey, shiftDay, daysBetween, weekday, round1, fmt, groupOf, parseCell, sumOf, indexEntries, summarize, okThreshold, lastEventDay, daysSince, lastEntryDay, dormantDays, periodStats, legacyRows };
})(window);


</script>
<script>
/* ---- modules/tracks-shark.js ---- */
/* «Треки»: тип SHARKDAYS (календарь циклов). Чистые расчёты без экрана. window.LifeTracksShark.
   Начало цикла: клетка со значением ровно 1. Дальше дни нумеруются по порядку до плановой длины цикла (если новой «1» нет),
   дни из диапазона «овуляция» (например 11-14) подсвечиваются. Новая «1» начинает следующий цикл, фактическая длина прежнего = дней между «1». */
(function (global) {
  'use strict';
  const between = (a, b) => Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 864e5);
  const DEF = { len: 28, ov: '11-14' };
  /* «11-14», «11–14», «11 14», «11,14» → [11, 14]; одно число «12» → [12, 12]; иначе null */
  function parseOv(s) {
    const m = String(s == null ? '' : s).trim().match(/^(\d{1,2})(?:\s*[-–—,;\s]\s*(\d{1,2}))?$/); if (!m) return null;
    const a = +m[1], b = m[2] == null ? a : +m[2]; if (a < 1 || b < a || b > 90) return null; return [a, b];
  }
  const planOf = t => { const n = Math.round(+(t && t.cycle_len)); return n >= 10 && n <= 90 ? n : DEF.len; };
  /* дни, в которых значение ровно 1 (byDay: день → записи [{value}]) */
  function starts(byDay, sumOf) {
    return Object.keys(byDay || {}).filter(d => { const es = byDay[d] || []; return es.length && Math.abs(sumOf(es) - 1) < 1e-9; }).sort();
  }
  /* циклы: [{start, len (фактическая, null у текущего), plan}] по возрастанию */
  function cycles(st, plan) { return st.map((d, i) => ({ start: d, len: i + 1 < st.length ? between(d, st[i + 1]) : null, plan })); }
  /* функция «день → {n, start, ovul} | null» для строки таблицы */
  function layout(st, plan, ov) {
    const o = typeof ov === 'string' ? parseOv(ov) : ov;
    return function (day) {
      let lo = -1; for (let i = 0; i < st.length; i++) { if (st[i] <= day) lo = i; else break; }
      if (lo < 0) return null;
      const n = between(st[lo], day) + 1, closed = lo + 1 < st.length;
      if (!closed && n > plan) return null;
      return { n, start: n === 1, ovul: !!(o && n >= o[0] && n <= o[1]) };
    };
  }

  global.LifeTracksShark = { between, parseOv, planOf, starts, cycles, layout, fmtLen, DEF };
})(window);

</script>

<script>
/* ---- modules/tracks-store.js ---- */
/* «Треки»: данные и действия (без экрана). LifeTracksStore.create(core) → S.
   Таблицы tracks, track_entries (значения клеток, несколько записей в день), track_day_notes (комментарий клетки), миграция 0009.
   Пишется через core.commit (офлайн-очередь), строки целиком. В журнал идут короткие строки без текста комментариев. */
(function (global) {
  'use strict';

    const TZ = core.TZ;
    const D = { tracks: [], entries: [], notes: [], cycles: [] };

    /* настройки «слоты новых / сон желаний / дней до «текущей»» лежат на устройстве (в базе под них нет подходящей таблицы) */

    S.hasShark = false; S.hasCycles = false; /* есть ли столбцы tracks.sharkdays… и таблица track_cycles (миграция 0016) */
    S.hasHidden = false; /* есть ли в базе столбец tracks.hidden (миграция 0015): иначе скрытие хранится только на устройстве */
    const track = id => D.tracks.find(t => t.id === id) || null; S.track = track;
    let idx = null; const reindex = () => { idx = M.indexEntries(D.entries); };
    S.byDay = id => (idx && idx[id]) || {};
    const noteOf = (id, day) => D.notes.find(n => n.track_id === id && n.day === day) || null; S.noteOf = noteOf;

    function apply(d) {
      D.tracks = (d.tracks || []).filter(r => !r.deleted_at); S.hasHidden = D.tracks.some(t => 'hidden' in t); S.hasShark = D.tracks.some(t => 'sharkdays' in t); D.cycles = (d.cycles || []).filter(r => !r.deleted_at); S.hasCycles = d.cycles != null; const live = new Set(D.tracks.map(t => t.id));
      D.entries = (d.entries || []).filter(r => !r.deleted_at && live.has(r.track_id)); D.notes = (d.notes || []).filter(r => !r.deleted_at && live.has(r.track_id)); reindex();
    }
    const saveCache = () => core.cache.set(CACHE, { tracks: D.tracks, entries: D.entries, notes: D.notes, cycles: S.hasCycles ? D.cycles : null });
    S.load = async function () {

      try { await core.flush(); } catch (e) { /* очередь повторит */ }

        const [tracks, entries, notes, cycles] = await Promise.all([core.select('tracks', f), core.select('track_entries', Object.assign({ order: 'id' }, f)), core.select('track_day_notes', Object.assign({ order: 'id' }, f)), core.select('track_cycles', f).catch(e => { if (e && (e.auth || e.net)) throw e; return null; })]);
        apply({ tracks, entries, notes, cycles: tracks.length && !tracks.some(t => 'sharkdays' in t) ? null : cycles }); saveCache(); S.state = 'ready'; S.note = ''; S.loadedAt = Date.now();
      } catch (e) {

        const c = core.cache.get(CACHE);
        if (c && (e.net || e.pendingQueue)) { apply(c.data); S.state = 'ready'; S.note = e.pendingQueue ? 'Есть неотправленные изменения, показаны данные на устройстве.' : 'Нет связи, показаны данные на устройстве.'; }
        else { S.state = 'error'; S.note = e.net ? 'нет связи с базой и нет копии на устройстве' : (e.message || 'ошибка чтения'); }
      }
      changed();
    };

    function tx() {
      const w = {}, j = [];
      const T = {
        put(table, row) {
          row = Object.assign({}, row, { updated_at: core.now() });
          const arr = D[TBL[table]], i = arr.findIndex(r => r.id === row.id);
          if (row.deleted_at) { if (i >= 0) arr.splice(i, 1); } else if (i >= 0) arr[i] = row; else arr.push(row);
          if (table === 'track_entries') reindex();
          const out = Object.assign({}, row); delete out.user_id; delete out.updated_by; (w[table] = w[table] || {})[row.id] = out; return row;
        },
        log(op, kind, id, summary) { j.push({ op, module: MOD, entity_kind: kind, entity_id: id, summary }); },
        /* история циклов SHARKDAYS: по каждому затронутому треку пересчитываем строки track_cycles из клеток со значением 1 */
        syncCycles(ids) {

          [...new Set(ids)].forEach(id => {
            const t = D.tracks.find(x => x.id === id); if (!t || !t.sharkdays) return;
            const want = SH.cycles(SH.starts(idx && idx[id], M.sumOf), SH.planOf(t)), keep = {};

            });

        commit() {

    }

      threshold_mode: t.threshold_mode || 'none', threshold_value: t.threshold_value || 0, show_days_since: !!t.show_days_since, baseline_last: t.baseline_last || null, sort_order: t.sort_order || 0, summary_mode: t.summary_mode || 'auto', deleted_at: null }, S.hasHidden ? { hidden: !!t.hidden } : {}, S.hasShark ? { sharkdays: !!t.sharkdays, cycle_len: global.LifeTracksShark.planOf(t), ovulation: t.ovulation || '11-14' } : {}, o || {});
    const er = (e, o) => Object.assign({ id: e.id, track_id: e.track_id, day: e.day, value: e.value, deleted_at: null }, o || {});
    const nr = (n, o) => Object.assign({ id: n.id, track_id: n.track_id, day: n.day, note: n.note, deleted_at: null }, o || {});
    let seq = 0; const newId = p => p + Date.now().toString(36) + (seq++).toString(36);
    const nextSort = kind => D.tracks.filter(t => M.groupOf(t) === M.groupOf({ kind })).reduce((a, t) => Math.max(a, t.sort_order || 0), -1) + 1;

    S.addTrack = function (name, kind, unit, status) {
      name = String(name || '').trim(); if (!name) return { ok: false, msg: 'Введите название' }; if (name.length > 80) return { ok: false, msg: 'Название длиннее 80 знаков' };
      kind = M.KIND[kind] ? kind : 'habit'; const money = kind !== 'habit', st = money ? 'cur' : (status === 'new' ? 'new' : 'wish'), now = today();
      const t = tr({ id: 'h' + Date.now(), name, kind, unit: money ? 'тыс. ₸' : String(unit || '').trim().slice(0, 20), status: st, created: now, started: st === 'new' ? now : null, sort_order: nextSort(kind) });
      const T = tx(); T.put('tracks', t); T.log('create', 'track', t.id, (money ? (kind === 'in' ? 'Доход' : 'Расход') : 'Трек') + ' «' + name + '», статус ' + M.STATUS[st]); T.commit(); return { ok: true, id: t.id };
    };
    const LBL = { name: 'название', need: 'потребность / причина', unit: 'единица', threshold_mode: 'порог: режим', threshold_value: 'порог: значение', show_days_since: 'дни с последнего события', baseline_last: 'базовая дата', summary_mode: 'последний столбец', hidden: 'скрыт/показан в таблице', sharkdays: 'SHARKDAYS (календарь цикла)', cycle_len: 'длина цикла', ovulation: 'овуляция' };
    S.editTrack = function (id, patch) {
      const t = track(id); if (!t) return { ok: false, msg: 'Трек не найден' }; const T = tx(), next = tr(t); let any = false;
      Object.keys(patch).forEach(k => {
        let v = patch[k]; if (k === 'name') { v = String(v || '').trim(); if (!v) return; } if (k === 'threshold_value') v = parseFloat(String(v).replace(',', '.')) || 0; if (k === 'baseline_last') v = M.isDay(v) ? v : null;

    };

    };

    /* order — id треков в том порядке, как они показаны; двигаем внутри группы */
    S.move = function (id, dir, order) {
      const t = track(id); if (!t) return false; const g = M.groupOf(t), list = order.map(track).filter(x => x && M.groupOf(x) === g), k = list.findIndex(x => x.id === id), o = list[k + dir];
      if (k < 0 || !o) return false;
      const a = list.map(x => x.id); a.splice(k, 1); a.splice(k + dir, 0, id); const T = tx();
      const slots = list.map(x => x.sort_order).sort((x, y) => x - y); let ch = false;

      if (ch) { T.log('change', 'track', id, 'Порядок строк: «' + t.name + '» ' + (dir < 0 ? 'выше' : 'ниже') + ', рядом «' + o.name + '»'); T.commit(); } return true;
    };
    S.deleteTrack = function (id) { const t = track(id); if (!t) return { ok: false }; const n = (S.byDay(id) && Object.keys(S.byDay(id)).length) || 0, T = tx(); T.put('tracks', tr(t, { deleted_at: iso(Date.now()) })); T.log('delete', 'track', id, 'Трек «' + t.name + '» удалён, дней с записями: ' + n); T.commit(); return { ok: true }; };

    S.setCell = function (id, day, raw, how) {

      if (p.kind === 'bad') { T.log('error', 'cell', c, '«' + t.name + '» ' + day + ': некорректное значение, изменение отклонено'); T.commit(); return { ok: false, rejected: true, msg: 'Ожидалось число, например 5, 5,5 или +5' }; }

      if (p.kind === 'add') { T.put('track_entries', { id: newId('te'), track_id: id, day, value: p.v, deleted_at: null }); T.log(es.length ? 'change' : 'create', 'cell', c, '«' + t.name + '» ' + day + ': +' + M.fmt(p.v) + ' ' + u + ' (итого ' + M.fmt(old + p.v) + ')'); T.commit(); return { ok: true }; }
      if (es.length && Math.abs(old - p.v) < 1e-9 && es.length === 1) return { ok: true, same: true };

      T.log(es.length ? 'change' : 'create', 'cell', c, '«' + t.name + '» ' + day + ': ' + (es.length ? M.fmt(old) + ' → ' : 'ввод ') + M.fmt(p.v) + ' ' + u + (es.length > 1 ? ' (было записей: ' + es.length + ', объединены)' : '') + (how ? ' (' + how + ')' : '')); T.commit(); return { ok: true };
    };
    S.addEntry = function (id, day, raw) { // панель клетки: «Добавить» (пусто или 0 = 1, как в старой системе)
      const t = track(id); if (!t) return { ok: false }; let v = parseFloat(String(raw).replace(',', '.')); if (!(v > 0)) v = 1;
      const old = M.sumOf(S.byDay(id)[day] || []), T = tx(); T.put('track_entries', { id: newId('te'), track_id: id, day, value: v, deleted_at: null }); T.log(old ? 'change' : 'create', 'cell', id + '@' + day, '«' + t.name + '» ' + day + ': +' + M.fmt(v) + ' ' + (t.unit || 'раз')); T.commit(); return { ok: true };
    };
    S.delEntry = function (entryId) { const e = D.entries.find(x => x.id === entryId); if (!e) return; const t = track(e.track_id), T = tx(); T.put('track_entries', er(e, { deleted_at: iso(Date.now()) })); T.log('delete', 'cell', e.track_id + '@' + e.day, '«' + (t ? t.name : '?') + '» ' + e.day + ': запись ' + M.fmt(e.value) + ' удалена'); T.commit(); };
    S.setNote = function (id, day, text) {
      const t = track(id); if (!t) return; text = String(text || '').trim(); const cur = noteOf(id, day); if ((cur ? cur.note : '') === text) return;
      const T = tx(), row = cur || { id: 'tn_' + id + '_' + day, track_id: id, day };
      if (!text) { T.put('track_day_notes', nr(cur, { deleted_at: iso(Date.now()) })); T.log('delete', 'cell', id + '@' + day, '«' + t.name + '» ' + day + ': комментарий удалён'); }

    };

    /* Перенос из выгрузки старой системы. Трек из файла ищется в базе по номеру, затем по названию и типу.
       Найденный трек не меняется: в него добавляются только дни, которых в базе нет (повторный перенос безопасен).
       Дни, где значения в базе и в файле разные, по умолчанию остаются как в базе и попадают в отчёт;
       opts.replace = true заменяет такие дни значениями из файла (старые записи удаляются мягко).

      try { await S.load(); } catch (e) { /* ниже проверим состояние */ }
      if (S.state !== 'ready' || S.note) return { ok: false, msg: 'Не удалось сверить с базой (' + (S.note || 'нет связи') + '). Перенос отложен, чтобы не перезаписать правки.' };
      const norm = x => String(x || '').trim().toLowerCase(), byId = new Map(D.tracks.map(t => [t.id, t])), used = new Set(), map = new Map();
      r.tracks.forEach(ft => { const t = byId.get(ft.id); if (t) { map.set(ft.id, t); used.add(t.id); } });
      r.tracks.forEach(ft => {
        if (map.has(ft.id)) return;
        const c = D.tracks.filter(t => !used.has(t.id) && t.kind === ft.kind && norm(t.name) === norm(ft.name))
          .sort((x, y) => (y.name === ft.name) - (x.name === ft.name) || (y.status === ft.status) - (x.status === ft.status) || D.entries.filter(e => e.track_id === y.id).length - D.entries.filter(e => e.track_id === x.id).length)[0];
        if (c) { map.set(ft.id, c); used.add(c.id); }
      });
      const nt = r.tracks.filter(t => !map.has(t.id)), newIds = new Set(nt.map(t => t.id));
      const base = [0, 1, 2].map(g => D.tracks.filter(t => M.groupOf(t) === g).reduce((a, t) => Math.max(a, t.sort_order || 0), -1) + 1);
      nt.forEach(t => { t.sort_order += base[M.groupOf(t)]; });
      const putT = [], putE = [], putN = [], conf = [], taken = new Set(D.entries.map(e => e.id));
      let same = 0, repl = 0;
      const vals = a => a.map(e => e.value).sort((x, y) => x - y).join(',');
      nt.forEach(t => {
        r.entries.filter(e => e.track_id === t.id).forEach(e => putE.push(e)); r.notes.filter(n => n.track_id === t.id).forEach(n => putN.push(n));
      });
      r.tracks.forEach(ft => {
        const db = map.get(ft.id); if (!db) return;
        const fe = r.entries.filter(e => e.track_id === ft.id), days = [...new Set(fe.map(e => e.day))].sort();
        days.forEach(day => {

          if (!cur.length) add();
          else if (vals(cur) === vals(f)) same++;
          else if (opts.replace) { cur.forEach(e => putE.push(er(e, { deleted_at: iso(Date.now()) }))); add(); repl++; }
          else conf.push(db.name + ' ' + day.slice(8) + '.' + day.slice(5, 7) + ': в базе ' + M.fmt(cur.reduce((a, e) => a + e.value, 0)) + ', в файле ' + M.fmt(f.reduce((a, e) => a + e.value, 0)));
        });
        r.notes.filter(n => n.track_id === ft.id).forEach(n => {
          const cur = noteOf(db.id, n.day);
          if (!cur) putN.push(Object.assign({}, n, { id: 'tn_' + db.id + '_' + n.day, track_id: db.id }));
          else if (cur.note !== n.note) { if (opts.replace) { putN.push(nr(cur, { note: n.note })); repl++; } else conf.push(db.name + ' ' + n.day.slice(8) + '.' + n.day.slice(5, 7) + ': комментарий в базе другой'); }
        });
      });
      const addE = putE.filter(e => !e.deleted_at).length, addN = putN.length, found = r.tracks.length - nt.length;
      const text = `${opts.dry ? 'В файле' : 'Перенос треков'}: треков ${r.tracks.length}, значений ${r.entries.length}, комментариев ${r.notes.length}. ` +
        `Уже есть в базе ${found} треков (по номеру или названию), новых ${nt.length}. ` +
        `Будет добавлено значений ${addE}, комментариев ${addN}; совпало дней ${same}` +
        (repl ? `; заменено дней/комментариев ${repl}` : '') +
        (conf.length ? `; расходится ${conf.length}${opts.replace ? '' : ' (оставлено как в базе)'}${conf.length > 0 ? ': ' + conf.slice(0, 6).join('; ') + (conf.length > 6 ? '…' : '') : ''}` : '') +
        (r.skipped.badEntry + r.skipped.badNote + r.skipped.dupTrack ? `; пропущено (значений ${r.skipped.badEntry}, комментариев ${r.skipped.badNote}, дублей треков ${r.skipped.dupTrack})` : '') + '.';
      const stat = { tracks: nt.length, found, entries: addE, notes: addN, same, replaced: repl, conflicts: conf.length };
      if (opts.dry) return { ok: true, text, plan: stat, conflicts: conf };
      const T = tx();
      nt.forEach(t => T.put('tracks', t)); putE.forEach(e => T.put('track_entries', e)); putN.forEach(n => T.put('track_day_notes', n));
      if (nt.length || putE.length || putN.length) { T.log('sys', 'import', 'tracks', text.replace(/: расходится.*$/, '')); T.commit(); } else changed();
      try { await core.flush(); } catch (e) { /* повторится */ }
      return { ok: true, text, added: stat, conflicts: conf };
    };
    return S;
  }

})(window);

<script>
/* ---- modules/tracks-details.js ---- */
/* «Треки» → «Детали»: в панели клетки показывает содержимое чека, записанного в клетку кнопкой «В базу» из «Покупок»,
   и даёт кнопку «В Вещицы» у каждого товара. Данные чеков читает сам (общий LifeShopStore), только когда клетка с такой записью открыта.
   window.LifeTracksDetails: placeholder(entries) → html, fill(root, ctx), drop(ctx) */
(function (global) {
  'use strict';
  const RC = 'te_rc_';
  const rcOf = e => (String(e.id).startsWith(RC) ? String(e.id).slice(RC.length, String(e.id).length - String(e.track_id).length - 1) : null);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const states = new WeakMap();

  function placeholder(entries) {
    const ids = [...new Set((entries || []).map(rcOf).filter(Boolean))]; if (!ids.length) return '';
    return `<div class="tk-rcd" data-rcs="${esc(ids.join(','))}"></div>`;
  }
  function state(ctx) {
    let st = states.get(ctx);
    if (!st) {
      const SS = global.LifeShopStore.create(ctx.core); st = { S: SS, ready: false, loading: false, msg: '', open: new Set() }; states.set(ctx, st);
      SS.onChange = () => { if (ctx.alive()) paint(ctx, st); };
    }
    return st;
  }
  const PAPER = '<svg viewBox="0 0 22 26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 1.5h16v21l-2.67-2-2.66 2-2.67-2-2.67 2-2.66-2L3 22.5z"/><path d="M7 7h8M7 11h8M7 15h5"/></svg>';
  const num = n => { const r = Math.round(n * 100) / 100; return r.toLocaleString('ru-RU', { maximumFractionDigits: 2 }); };
  function paper(ctx, M, r) {
    const hm = global.LifeTimersModel.hm, L = (a, b2, x) => `<div class="pl"><span>${a}</span><span class="am">${b2}</span><span class="ex">${x || ''}</span></div>`;

    r.goods.forEach(p => { h += L(esc(p.name) + ', ' + esc(M.fmtQ(+p.qty, p.unit)), num(+p.amount), p.thing_id ? '<span class="nt">в Вещицах</span>' : `<button class="th" data-act="det-thing" data-line="${esc(p.id)}">В Вещицы</button>`); });
    if (r.bagS || r.bagL) h += L('Пакеты ' + (r.bagS ? 'М' + r.bagS : '') + (r.bagS && r.bagL ? ' ' : '') + (r.bagL ? 'Б' + r.bagL : ''), num(r.bagsAmount));
    return h + '<hr>' + L('<b>ИТОГО</b>', '<b>' + num(r.amount) + ' тг</b>') + '</div>';
  }
  function paint(ctx, st) {
    const root = document.querySelector('.tk-app'); if (!root) return;
    const M = global.LifeShopModel, D = st.S.D, all = M.receiptsOf(D);
    root.querySelectorAll('.tk-rcd').forEach(box => {
      const ids = box.dataset.rcs.split(','); let ics = '', pp = '';
      ids.forEach(id => {
        const r = st.ready ? all.find(x => x.id === id) : null, open = st.open.has(id);
        ics += `<button type="button" class="ic ${open ? 'on' : ''}" data-act="det-open" data-rc="${esc(id)}" title="${r ? 'Показать чек' : ''}">${PAPER}<span>${r ? 'чек на ' + num(r.amount) + ' тг' : (st.ready ? 'чек не найден' : 'чек…')}</span></button>`;
        if (r && open) pp += paper(ctx, M, r);

    });
  }
  async function fill(root, ctx) {
    if (!root.querySelector('.tk-rcd')) return;
    const st = state(ctx); paint(ctx, st);
    if (!st.ready && !st.loading) {
      st.loading = true;
      try { await st.S.load(); st.ready = st.S.state === 'ready'; st.msg = st.ready ? '' : (st.S.note || 'нет данных'); } catch (e) { st.msg = e.message || 'ошибка'; }
      st.loading = false;

      root.addEventListener('click', async ev => {
        const ic = ev.target.closest('[data-act=det-open]');

        const b = ev.target.closest('[data-act=det-thing]'); if (!b) return; ev.stopPropagation();
        b.disabled = true; b.textContent = '…'; const r = await st.S.moveToThing(b.dataset.line);
        if (!r.ok) { b.disabled = false; b.textContent = 'В Вещицы'; b.title = r.msg; b.insertAdjacentHTML('afterend', `<span class="tk-warn">${esc(r.msg)}</span>`); return; }
        paint(ctx, st);

</script>

    const ar = (a, o) => Object.assign({ id: a.id, name: a.name, hours: a.hours, color: a.color || null, note: a.note || '', sort_order: a.sort_order || 0, deleted_at: null }, o || {});
    const ir = (i, o) => Object.assign({ id: i.id, activity_id: i.activity_id, grp: i.grp || '', name: i.name || '', price: i.price || 0, sort_order: i.sort_order || 0, deleted_at: null }, o || {});
    const sr = (y, b, k, id, m) => ({ id: slotId(y, b, k), year: y, block: b, slot: k, activity_id: id || null, multiplier: id ? m : 1 });
    const nz = x => { x = parseFloat(String(x).replace(',', '.')); return isFinite(x) && x >= 0 ? x : null; };

    S.addAct = function (name) {
      name = String(name || '').trim(); if (!name) return { ok: false, msg: 'Введите название активности' }; if (name.length > 80) return { ok: false, msg: 'Название длиннее 80 знаков' };
      const a = { id: 'a' + Date.now(), name, hours: 0, color: null, note: '', sort_order: D.acts.reduce((m, x) => Math.max(m, x.sort_order || 0), -1) + 1 };
      const T = tx(); T.put('activities', ar(a)); T.log('create', 'activity', a.id, 'Активность «' + name + '» создана'); T.commit(); return { ok: true, id: a.id };
    };
    S.editAct = function (id, patch) {
      const a = act(id); if (!a) return { ok: false }; const p = {}, L = [];
      if ('name' in patch) { const n = String(patch.name || '').trim(); if (!n || n.length > 80) return { ok: false, msg: 'Название от 1 до 80 знаков' }; if (n !== a.name) { p.name = n; L.push('название «' + a.name + '» → «' + n + '»'); } }
      if ('hours' in patch) { const h = nz(patch.hours); if (h === null) return { ok: false, msg: 'Часы: число от 0' }; if (h !== +a.hours) { p.hours = h; L.push('часы ' + M.fmt(a.hours) + ' → ' + M.fmt(h)); } }
      if ('color' in patch) { const c = patch.color && M.isColor(patch.color) ? patch.color : null; if (c !== (a.color || null)) { p.color = c; L.push('цвет изменён'); } }
      if ('note' in patch) { const n = String(patch.note || ''); if (n !== (a.note || '')) { p.note = n; L.push('комментарий ' + (a.note ? (n ? 'изменён' : 'удалён') : 'добавлен') + ', символов ' + n.length); } }
      if (!L.length) return { ok: true, same: true };
      const T = tx(); T.put('activities', ar(a, p)); T.log('change', 'activity', id, '«' + a.name + '»: ' + L.join('; ')); T.commit(); return { ok: true };
    };
    S.deleteAct = function (id) {
      const a = act(id); if (!a) return { ok: false }; const T = tx(), now = iso(Date.now());
      const used = D.slots.filter(s => s.activity_id === id);
      used.forEach(s => T.put('plan_slots', sr(s.year, s.block, s.slot, null, 1)));
      itemsOf(id).forEach(i => T.put('activity_cost_items', ir(i, { deleted_at: now })));
      T.put('activities', ar(a, { deleted_at: now })); T.log('delete', 'activity', id, 'Активность «' + a.name + '» удалена, снята с недель: ' + used.length); T.commit(); return { ok: true, cleared: used.length };
    };
    S.addItem = function (actId, grp) {
      const a = act(actId); if (!a) return { ok: false }; const its = itemsOf(actId);
      const i = { id: uid('ci_' + actId + '_'), activity_id: actId, grp: grp || '', name: '', price: 0, sort_order: its.reduce((m, x) => Math.max(m, x.sort_order || 0), -1) + 1 };
      const T = tx(); T.put('activity_cost_items', ir(i)); T.log('create', 'item', i.id, '«' + a.name + '»: новая пустая статья' + (grp ? ' в группе «' + grp + '»' : '')); T.commit(); return { ok: true, id: i.id };
    };
    S.editItem = function (id, patch) {
      const i = D.items.find(x => x.id === id); if (!i) return { ok: false }; const a = act(i.activity_id), p = {}, L = [];
      if ('name' in patch) { const n = String(patch.name || '').trim().slice(0, 120); if (n !== i.name) { p.name = n; L.push('название «' + i.name + '» → «' + n + '»'); } }
      if ('price' in patch) { const v = nz(patch.price); if (v === null) return { ok: false, msg: 'Цена: число от 0' }; if (v !== +i.price) { p.price = v; L.push('цена ' + M.fmt(i.price) + ' → ' + M.fmt(v)); } }
      if ('grp' in patch) { const g = String(patch.grp || '').trim().slice(0, 80); if (g !== (i.grp || '')) { p.grp = g; L.push('группа «' + (i.grp || '') + '» → «' + g + '»'); } }
      if (!L.length) return { ok: true, same: true };
      const T = tx(); T.put('activity_cost_items', ir(i, p)); T.log('change', 'item', id, '«' + (a ? a.name : '?') + '», статья: ' + L.join('; ')); T.commit(); return { ok: true };
    };
    S.delItem = function (id) {
      const i = D.items.find(x => x.id === id); if (!i) return { ok: false }; const a = act(i.activity_id), T = tx();
      T.put('activity_cost_items', ir(i, { deleted_at: iso(Date.now()) })); T.log('delete', 'item', id, '«' + (a ? a.name : '?') + '»: статья «' + (i.name || 'без названия') + '» ' + M.fmt(i.price)); T.commit(); return { ok: true };
    };
    S.renGroup = function (actId, oldG, newG) {
      const a = act(actId); newG = String(newG || '').trim().slice(0, 80); if (!a || newG === oldG) return { ok: false };
      const its = itemsOf(actId).filter(i => (i.grp || '') === oldG); if (!its.length) return { ok: false };
      const T = tx(); its.forEach(i => T.put('activity_cost_items', ir(i, { grp: newG }))); T.log('change', 'item', actId, '«' + a.name + '»: группа «' + oldG + '» → «' + (newG || 'без группы') + '»'); T.commit(); return { ok: true };
    };
    S.setSlot = function (year, block, slot, actId) {
      const cur = S.slotAt(year, block, slot), o = cur && cur.activity_id ? act(cur.activity_id) : null, n = actId ? act(actId) : null;
      if ((cur ? cur.activity_id || '' : '') === (actId || '')) return { ok: true, same: true };
      const T = tx(); T.put('plan_slots', sr(year, block, slot, actId, cur ? cur.multiplier : 1));
      T.log(!o ? 'create' : !n ? 'delete' : 'change', 'slot', slotId(year, block, slot), 'Неделя ' + block + ', слот ' + slot + ', ' + year + ': «' + (o ? o.name : '—') + '» → «' + (n ? n.name : '—') + '»'); T.commit(); return { ok: true };
    };
    S.setMul = function (year, block, slot, m) {
      const cur = S.slotAt(year, block, slot); if (!cur || !cur.activity_id || M.MULTS.indexOf(m) < 0) return { ok: false };
      const n = +cur.multiplier === m ? 1 : m, a = act(cur.activity_id), F = x => x === 1 ? 'без множителя' : '×' + String(x).replace('.', ',');
      const T = tx(); T.put('plan_slots', sr(year, block, slot, cur.activity_id, n)); T.log('change', 'slot', slotId(year, block, slot), 'Неделя ' + block + ', слот ' + slot + ', ' + year + ': «' + (a ? a.name : '?') + '» ' + F(+cur.multiplier) + ' → ' + F(n)); T.commit(); return { ok: true };
    };

    /* Перенос из выгрузки старой системы. Активность из файла ищется в базе по номеру, затем по названию.
       Найденная не меняется, если статьи и поля совпали; если нет, остаётся как в базе и попадает в отчёт.
       opts.replace = true заменяет такие активности и слоты данными файла (старые статьи удаляются мягко).
       opts.dry = true только считает и ничего не пишет. */
    S.importLegacy = async function (obj, opts) {
      opts = opts || {};
      const r = M.legacyRows(obj);
      if (!r) return { ok: false, msg: 'В файле нет раздела моделирования (нужна выгрузка «Данные браузера» старой системы, в ней state.acts).' };
      try { await S.load(); } catch (e) { /* ниже проверим состояние */ }
      if (S.state !== 'ready' || S.note) return { ok: false, msg: 'Не удалось сверить с базой (' + (S.note || 'нет связи') + '). Перенос отложен, чтобы не перезаписать правки.' };
      const norm = x => String(x || '').trim().toLowerCase(), map = new Map(), used = new Set();
      r.acts.forEach(fa => { const a = act(fa.id); if (a) { map.set(fa.id, a); used.add(a.id); } });
      r.acts.forEach(fa => { if (map.has(fa.id)) return; const a = D.acts.find(x => !used.has(x.id) && norm(x.name) === norm(fa.name)); if (a) { map.set(fa.id, a); used.add(a.id); } });
      const putA = [], putI = [], putS = [], conf = [], taken = new Set(D.items.map(i => i.id)), now = iso(Date.now());
      let same = 0, repl = 0, newActs = 0, base = D.acts.reduce((m, x) => Math.max(m, x.sort_order || 0), -1) + 1;
      const key = i => [i.grp || '', i.name || '', +i.price || 0].join('|'), sig = a => a.map(key).sort().join('\n');
      const newItemId = (aid, j) => { let id = 'ci_' + aid + '_' + j, n = 0; while (taken.has(id)) id = 'ci_' + aid + '_' + j + 'f' + (++n); taken.add(id); return id; };
      const addItems = (db, fi) => fi.forEach((it, j) => putI.push(Object.assign({}, it, { id: newItemId(db, j + 1), activity_id: db })));
      r.acts.forEach(fa => {
        const fi = r.items.filter(i => i.activity_id === fa.id), db = map.get(fa.id);
        if (!db) { newActs++; map.set(fa.id, fa); putA.push(Object.assign({}, fa, { sort_order: base++ })); addItems(fa.id, fi); return; }
        const cur = itemsOf(db.id), fieldsSame = (+db.hours === +fa.hours) && ((db.color || null) === (fa.color || null)) && (db.note || '') === (fa.note || '');
        if (!cur.length && fi.length) { addItems(db.id, fi); repl += 0; }
        else if (sig(cur) !== sig(fi) || !fieldsSame) {
          if (opts.replace) {
            putA.push(ar(db, { hours: fa.hours, color: fa.color, note: fa.note }));
            if (sig(cur) !== sig(fi)) { cur.forEach(i => putI.push(ir(i, { deleted_at: now }))); addItems(db.id, fi); }
            repl++;
          } else conf.push(db.name + ': ' + (sig(cur) !== sig(fi) ? 'статьи ' + M.fmt(M.actCost(cur)) + ' в базе, ' + M.fmt(M.actCost(fi)) + ' в файле' : 'часы, цвет или комментарий другие'));
        } else same++;
      });
      r.slots.forEach(fs => {
        const dbAct = fs.activity_id ? (map.get(fs.activity_id) || null) : null, aid = dbAct ? dbAct.id : null, cur = S.slotAt(fs.year, fs.block, fs.slot);
        if (!cur || !cur.activity_id) { if (aid || fs.multiplier !== 1) putS.push(sr(fs.year, fs.block, fs.slot, aid, fs.multiplier)); return; }
        if (cur.activity_id === aid && +cur.multiplier === +fs.multiplier) { same++; return; }
        if (opts.replace) { putS.push(sr(fs.year, fs.block, fs.slot, aid, fs.multiplier)); repl++; }
        else conf.push('неделя ' + fs.block + ' ' + fs.year + ', слот ' + fs.slot + ': в базе другая активность или множитель');
      });
      const text = `${opts.dry ? 'В файле' : 'Перенос моделирования'}: активностей ${r.acts.length}, статей ${r.items.length}, слотов плана ${r.slots.length}. ` +
        `Уже есть в базе ${r.acts.length - newActs} активностей (по номеру или названию), новых ${newActs}. Будет добавлено статей ${putI.filter(i => !i.deleted_at).length}, слотов ${putS.length}; совпало ${same}` +
        (repl ? `; заменено ${repl}` : '') + (conf.length ? `; расходится ${conf.length}${opts.replace ? '' : ' (оставлено как в базе)'}: ${conf.slice(0, 6).join('; ')}${conf.length > 6 ? '…' : ''}` : '') +
        (r.skipped.dupAct + r.skipped.badSlot ? `; пропущено (дубли активностей ${r.skipped.dupAct}, неверные слоты ${r.skipped.badSlot})` : '') + '.';
      const stat = { acts: newActs, found: r.acts.length - newActs, items: putI.filter(i => !i.deleted_at).length, slots: putS.length, same, replaced: repl, conflicts: conf.length };
      if (opts.dry) return { ok: true, text, plan: stat, conflicts: conf };
      const T = tx(); putA.forEach(a => T.put('activities', a)); putI.forEach(i => T.put('activity_cost_items', i)); putS.forEach(s => T.put('plan_slots', s));
      if (putA.length || putI.length || putS.length) { T.log('sys', 'import', 'plan', text.replace(/; расходится.*$/, '.')); T.commit(); } else changed();
      try { await core.flush(); } catch (e) { /* повторится */ }
      return { ok: true, text, added: stat, conflicts: conf };
    };

  }

<script>
/* ---- modules/plan.js ---- */
/* «Моделирование» (компьютер): экран. Данные и действия — plan-store.js, расчёты — plan-model.js, стили — plan-css.js.
   Точка входа: LifePlanModules → LifeModules.plan.mount(элемент, {core, onAuthLost}) → {unmount, reload}.
   Каталог активностей (статьи расходов с группами, часы, цвет, комментарий) и план года по календарным неделям
   (4 слота, множители ×1,5 и ×2 для денег, итоги недели, месяца и года). */
(function (global) {

    const ui = (() => { const u = core.store.get(UI_KEY, null) || {}; return { open: u.open !== false, year: +u.year >= 2000 ? +u.year : cy }; })();
    const saveUi = () => core.store.set(UI_KEY, { open: ui.open, year: ui.year });
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let alive = true, ex = {}, closedG = {}, delAsk = null, newName = '', err = '', imp = { open: false, text: '', info: '', busy: false, confirm: false, replace: false };
    el.innerHTML = '<div class="pl-app"></div>'; const root = el.firstChild;
    const num = v => String(v == null ? 0 : v);

    function actCard(a) {

      let h = `<div class="pl-card" style="${cc ? 'border-left:8px solid ' + cc : ''}"><div class="pl-top"><input class="pl-in" data-f="aname" data-id="${esc(a.id)}" value="${esc(a.name)}" maxlength="80"><span class="pl-badge">${M.fmt(M.actCost(its))} тыс. ₸ · ${M.fmt(a.hours)} ч</span></div>`;
      h += `<div class="pl-sw">${M.PALETTE.map(p => `<i data-act="color" data-id="${esc(a.id)}" data-c="${p}" style="background:${p}" class="${cc === p ? 'on' : ''}"></i>`).join('')}<i class="none" data-act="color" data-id="${esc(a.id)}" data-c="" title="без цвета">×</i></div>`;

    function settings() {
