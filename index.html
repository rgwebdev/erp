<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeERP</title>
</head>
<body>
<div id="app"></div>
<script>
/* ---- core/core.js ---- */
/* LifeERP core: вход, сессия, запросы к Supabase, чтение, запись через lifeerp_upsert,
   офлайн-очередь и журнал. Без библиотек, один файл. Подключается обычным <script>, даёт window.LifeCore.

   Ключи localStorage те же, что у старого клиента: lifeerp-conn (адрес и ключ), lifeerp-sess (сессия).
   Поэтому вход, сделанный в старом клиенте на том же адресе, действует и здесь. */
(function (global) {
  'use strict';

  const K = { conn: 'lifeerp-conn', sess: 'lifeerp-sess', queue: 'lifeerp-queue', dead: 'lifeerp-dead', cache: 'lifeerp-cache:' };
  const TZ = 'Asia/Yekaterinburg';
  const OPS = ['create', 'change', 'delete', 'error', 'sys']; // допустимые коды ref_action_type

  /* ---------- localStorage, который не ломается ---------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* нет доступа: ничего страшного */ } }
  };

  /* ---------- события ---------- */
  const handlers = {};
  function on(name, fn) { (handlers[name] = handlers[name] || []).push(fn); return () => { handlers[name] = (handlers[name] || []).filter(f => f !== fn); }; }
  function emit(name, arg) { (handlers[name] || []).slice().forEach(f => { try { f(arg); } catch (e) { console.error('LifeCore handler', name, e); } }); }

  /* ---------- настройки ---------- */
  const cfg = { url: '', key: '', device: 'desktop', timeoutMs: 20000 };
  function init(o) {
    o = o || {};
    const saved = store.get(K.conn, {}) || {};
    cfg.url = String(o.url || saved.url || '').trim().replace(/\/+$/, '');
    cfg.key = String(o.key || saved.key || '').trim();
    if (o.device) cfg.device = o.device;
    sess = store.get(K.sess, null);
    queue = store.get(K.queue, []);
    dead = store.get(K.dead, []);
    viewId = null;
    if (typeof window !== 'undefined' && !init.bound) {
      init.bound = true;
      window.addEventListener('online', () => { emit('net', true); flush(); });
      window.addEventListener('offline', () => emit('net', false));
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') flush(); });
      window.addEventListener('storage', ev => { if (ev.key !== K.sess) return; if (ev.newValue === null) { if (sess) { sess = null; viewId = null; emit('auth', false); } } else reloadSession(); });
    }
    if (me()) flush();
    return api;
  }
  function setConn(url, key) {
    cfg.url = String(url || '').trim().replace(/\/+$/, ''); cfg.key = String(key || '').trim();
    store.set(K.conn, { url: cfg.url, key: cfg.key });
  }
  const configured = () => !!(cfg.url && cfg.key);

  /* ---------- вспомогательное ---------- */
  function uuid() {
    const c = global.crypto;
    if (c && c.randomUUID) return c.randomUUID();
    const b = new Uint8Array(16); (c && c.getRandomValues) ? c.getRandomValues(b) : b.forEach((_, i) => { b[i] = Math.random() * 256; });
    b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  }
  let lastStamp = 0;
  /* Метка времени правки: строго возрастает, чтобы две быстрые правки одной строки не сравнялись. */
  function now() { const t = Math.max(Date.now(), lastStamp + 1); lastStamp = t; return new Date(t).toISOString(); }
  /* День владельца по его часовому поясу (YYYY-MM-DD). */
  function localDate(d, tz) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: tz || TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d || new Date());
  }
  function jwtClaims(t) {
    try {
      let p = String(t).split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      while (p.length % 4) p += '=';
      return JSON.parse(decodeURIComponent(escape(atob(p))));
    } catch (e) { return {}; }
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- сессия ---------- */
  let sess = null, viewId = null, refreshing = null;
  const me = () => (sess ? (sess.uid || jwtClaims(sess.access).sub || null) : null);
  const email = () => (sess ? sess.email || '' : '');
  function setSess(d, em) {
    const cl = jwtClaims(d.access_token);
    sess = { access: d.access_token, refresh: d.refresh_token, exp: Date.now() + (d.expires_in || 3600) * 1000,
      email: (d.user && d.user.email) || em || cl.email || '', uid: (d.user && d.user.id) || cl.sub || null };
    store.set(K.sess, sess);
  }
  /* Чьи данные смотрим. По умолчанию свои; мастер может указать другого пользователя. */
  function setViewUser(uid) { viewId = uid || null; emit('view', viewUser()); }
  const viewUser = () => viewId || me();

  async function signIn(em, pw) {
    em = String(em || '').trim();
    if (!configured()) throw new Error('Не заданы адрес проекта и публичный ключ');
    if (!em || !pw) throw new Error('Введите email и пароль');
    const r = await raw('/auth/v1/token?grant_type=password', { method: 'POST', noAuth: true, body: { email: em, password: pw } });
    setSess(r.data, em);
    emit('auth', true);
    flush();
    return { uid: me(), email: email() };
  }
  async function signOut() {
    try { if (sess) await raw('/auth/v1/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + sess.access } }); } catch (e) { /* выходим локально в любом случае */ }
    sess = null; viewId = null; store.del(K.sess);
    emit('auth', false);
  }
  /* Вход общий с другим клиентом на этой же странице (старая система в окне внутри оболочки): токен обновления
     у сервера одноразовый, поэтому перед обновлением берём то, что уже записал другой, и не расходимся. */
  function reloadSession() {
    const s = store.get(K.sess, null);
    if (s && s.access && (!sess || s.exp >= sess.exp || s.refresh !== sess.refresh)) sess = s;
    return !!sess;
  }
  async function refreshSession(force) {
    if (!sess || !sess.refresh) return;
    if (!force && sess.exp > Date.now() + 60000) return;
    reloadSession();
    if (!sess || !sess.refresh) return;
    if (!force && sess.exp > Date.now() + 60000) return;
    if (!refreshing) {
      refreshing = (async () => {
        try {
          const r = await raw('/auth/v1/token?grant_type=refresh_token', { method: 'POST', noAuth: true, body: { refresh_token: sess.refresh } });
          setSess(r.data, sess.email);
        } catch (e) {
          // Сеть пропала: сессию не трогаем. Сервер отказал (токен отозван): выходим.
          if (e.status === 400 || e.status === 401 || e.status === 403) { sess = null; store.del(K.sess); emit('auth', false); }
          throw e;
        } finally { refreshing = null; }
      })();
    }
    return refreshing;
  }

  /* ---------- HTTP ---------- */
  async function raw(path, o) {
    o = o || {};
    if (!configured()) throw Object.assign(new Error('Не заданы адрес проекта и публичный ключ'), { config: true });
    const h = Object.assign({ apikey: cfg.key, 'Content-Type': 'application/json' }, o.headers || {});
    if (!h.Authorization) h.Authorization = 'Bearer ' + ((!o.noAuth && sess && sess.access) || cfg.key);
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), cfg.timeoutMs) : null;
    let r;
    try {
      r = await fetch(cfg.url + path, { method: o.method || 'GET', headers: h, body: o.body !== undefined ? JSON.stringify(o.body) : undefined, signal: ctl ? ctl.signal : undefined });
    } catch (e) {
      throw Object.assign(new Error('Нет связи с базой'), { net: true });
    } finally { if (timer) clearTimeout(timer); }
    const tx = await r.text();
    let data = null; try { data = tx ? JSON.parse(tx) : null; } catch (e) { data = tx; }
    if (!r.ok) {
      const m = (data && (data.message || data.msg || data.error_description || data.error)) || tx || ('HTTP ' + r.status);
      throw Object.assign(new Error(String(m)), { status: r.status, body: data });
    }
    return { data, headers: r.headers, status: r.status };
  }
  /* Запрос от имени вошедшего пользователя: обновляет токен, добавляет заголовки устройства. */
  async function request(path, o) {
    o = Object.assign({}, o);
    o.headers = Object.assign({ 'X-LifeERP-Device': cfg.device }, o.headers || {});
    for (let attempt = 0; ; attempt++) {
      if (!sess) throw Object.assign(new Error('Нужно войти'), { status: 401, auth: true });
      try { await refreshSession(false); } catch (e) { if (e.net) throw e; if (!sess) throw Object.assign(new Error('Нужно войти'), { status: 401, auth: true }); }
      try { return await raw(path, o); }
      catch (e) {
        if (e.status === 401 && attempt === 0) { try { await refreshSession(true); continue; } catch (e2) { throw e2.net ? e2 : Object.assign(e, { auth: true }); } }
        if (e.status === 401) e.auth = true;
        throw e;
      }
    }
  }

  /* ---------- чтение ---------- */
  /* select('things_view', {filters:['deleted_at=is.null'], order:'name'}) :
     всегда добавляет user_id=eq.<чьи данные смотрим> (мастер по RLS видит строки всех, поэтому фильтр обязателен). */
  async function select(table, o) {
    o = o || {};
    const uid = o.asUser || viewUser();
    if (!uid) throw Object.assign(new Error('Нужно войти'), { status: 401, auth: true });
    const base = ['select=' + encodeURIComponent(o.columns || '*'), 'user_id=eq.' + encodeURIComponent(uid)]
      .concat((o.filters || []).map(f => { const i = f.indexOf('='); return encodeURIComponent(f.slice(0, i)) + '=' + encodeURIComponent(f.slice(i + 1)).replace(/%2C/gi, ',').replace(/%28/g, '(').replace(/%29/g, ')'); }));
    if (o.order) base.push('order=' + o.order);
    const out = [], page = 1000;
    for (let off = 0; ; off += page) {
      const r = await request('/rest/v1/' + table + '?' + base.concat(['limit=' + page, 'offset=' + off]).join('&'));
      const a = Array.isArray(r.data) ? r.data : [];
      out.push(...a);
      if (a.length < page) break;
    }
    return out;
  }

  /* Локальный кэш прочитанного (для запуска без сети). Привязан к пользователю, чьи данные смотрим. */
  const cache = {
    get(key) { const u = viewUser(); return u ? store.get(K.cache + u + ':' + key, null) : null; },
    set(key, data) { const u = viewUser(); if (u) { if (!store.set(K.cache + u + ':' + key, { ts: Date.now(), data })) emit('storage', 'Не удалось сохранить копию данных в браузере'); } },
    clear(key) { const u = viewUser(); if (u) store.del(K.cache + u + ':' + key); }
  };

  /* ---------- офлайн-очередь записи ---------- */
  let queue = [], dead = [], flushing = null, retryTimer = null, retryStep = 0, lastError = '';
  const BACKOFF = [2000, 5000, 15000, 30000, 60000];
  function persist() {
    const ok = store.set(K.queue, queue) && store.set(K.dead, dead);
    if (!ok) emit('storage', 'Не удалось сохранить очередь записи в браузере: пока не закрывайте вкладку, пока не пропадёт «ожидает отправки».');
  }
  function enqueue(it) { it.id = uuid(); it.ts = Date.now(); it.actor = me(); queue.push(it); }
  function retryable(e) { return e.net || e.status === 408 || e.status === 425 || e.status === 429 || e.status >= 500; }
  function scheduleRetry() {
    if (retryTimer) return;
    const ms = BACKOFF[Math.min(retryStep++, BACKOFF.length - 1)];
    retryTimer = setTimeout(() => { retryTimer = null; flush(); }, ms);
  }

  async function sendItem(it) {
    if (it.kind === 'upsert') {
      const body = { p_table: it.table, p_rows: it.rows };
      if (it.owner && it.owner !== it.actor) body.p_user = it.owner;
      const r = await request('/rest/v1/rpc/lifeerp_upsert', { method: 'POST', body, headers: it.corr ? { 'X-LifeERP-Correlation': it.corr } : {} });
      if (r.data && r.data.skipped > 0) emit('conflict', { table: it.table, applied: r.data.applied, skipped: r.data.skipped });
    } else if (it.kind === 'journal') {
      const row = { owner_id: it.owner || it.actor, actor_id: it.actor, op: it.op, module: it.module || '', entity_kind: it.entity_kind || '',
        entity_id: String(it.entity_id == null ? '' : it.entity_id), summary: it.summary || '', client_ts: new Date(it.ts).toISOString(),
        device: cfg.device, correlation_id: it.corr || null, meta: Object.assign({ client_id: it.id }, it.meta || {}) };
      if (it.before !== undefined) row.before = it.before;
      if (it.after !== undefined) row.after = it.after;
      await request('/rest/v1/journal', { method: 'POST', body: row, headers: { Prefer: 'return=minimal' } });
    }
  }

  /* Отправляет очередь по порядку. Сеть пропала: останавливается и повторяет позже (и при событии online).
     Сервер отверг строку (ошибка данных или прав): строка уходит в список «не принято», очередь идёт дальше. */
  function flush() {
    if (flushing) return flushing;
    flushing = (async () => {
      // Без этого пустая очередь завершала бы функцию синхронно: «finally» сбросил бы flushing раньше,
      // чем ему присвоят этот промис, и отправка навсегда считалась бы «уже идёт».
      await null;
      let sentAny = false;
      try {
        for (;;) {
          const uid = me();
          if (!uid) break;
          const it = queue.find(x => x.actor === uid);
          if (!it) { retryStep = 0; break; }
          try {
            await sendItem(it);
            queue.splice(queue.indexOf(it), 1); sentAny = true; persist(); emit('queue', status());
          } catch (e) {
            lastError = e.message || String(e);
            if (e.auth) break;
            if (retryable(e)) { scheduleRetry(); break; }
            queue.splice(queue.indexOf(it), 1);
            dead.push({ item: it, error: lastError, at: Date.now() });
            if (dead.length > 100) dead.shift();
            persist(); emit('dead', status());
          }
        }
      } finally { flushing = null; emit('queue', status()); if (sentAny && !queue.length) emit('drained', status()); }
    })();
    return flushing;
  }

  /* Одно действие пользователя = одна correlation_id на все его записи и строки журнала.
     {writes:[{table, rows:[полные строки]}], journal:[{op, module, entity_kind, entity_id, summary, before?, after?}], owner?}
     Возвращает correlation_id сразу после постановки в очередь (отправка идёт в фоне, офлайн тоже работает). */
  function commit(a) {
    a = a || {};
    if (!me()) throw Object.assign(new Error('Нужно войти'), { auth: true });
    const corr = uuid(), owner = a.owner || viewUser();
    (a.writes || []).forEach(w => { if (w.rows && w.rows.length) enqueue({ kind: 'upsert', table: w.table, rows: w.rows, owner, corr }); });
    (a.journal || []).forEach(j => enqueue({ kind: 'journal', owner, corr, op: OPS.includes(j.op) ? j.op : 'sys', module: j.module, entity_kind: j.entity_kind,
      entity_id: j.entity_id, summary: j.summary, before: j.before, after: j.after, meta: j.meta }));
    persist(); emit('queue', status());
    flush();
    return corr;
  }
  const upsert = (table, rows, o) => commit({ writes: [{ table, rows }], journal: (o && o.journal) || [], owner: o && o.owner });
  const log = (entry, owner) => commit({ journal: [entry], owner });

  function status() {
    const uid = me();
    return { online: typeof navigator === 'undefined' ? true : navigator.onLine !== false, signedIn: !!uid, email: email(),
      pending: queue.filter(x => x.actor === uid).length, dead: dead.length, flushing: !!flushing, lastError };
  }
  const deadList = () => dead.slice();
  function retryDead() { dead.forEach(d => queue.push(d.item)); dead = []; persist(); emit('queue', status()); return flush(); }
  function clearDead() { dead = []; persist(); emit('dead', status()); }

  const api = { init, setConn, configured, config: cfg, on, signIn, signOut, session: () => sess, me, email, setViewUser, viewUser, reloadSession,
    request, select, cache, commit, upsert, log, flush, status, deadList, retryDead, clearDead, uuid, now, localDate, store, TZ };
  global.LifeCore = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ---- core/login-ui.js ---- */
/* Простая форма входа поверх LifeCore. LifeLogin.mount(элемент, {onDone}) */
(function (global) {
  'use strict';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function mount(el, o) {
    o = o || {};
    const core = global.LifeCore;
    const needConn = !core.configured();
    el.innerHTML = `<form class="lg-form" autocomplete="on" style="max-width:360px;margin:40px auto;padding:16px;font:14px system-ui,sans-serif">
      <h2 style="margin:0 0 12px;font-size:18px">Вход в LifeERP</h2>
      ${needConn ? `<label style="display:block;margin-bottom:8px">Адрес проекта Supabase<br><input name="url" style="width:100%;padding:6px" placeholder="https://xxxx.supabase.co"></label>
      <label style="display:block;margin-bottom:8px">Публичный ключ (anon)<br><input name="key" style="width:100%;padding:6px"></label>` : ''}
      <label style="display:block;margin-bottom:8px">Email<br><input name="email" type="email" autocomplete="username" style="width:100%;padding:6px" value="${esc(core.email())}"></label>
      <label style="display:block;margin-bottom:8px">Пароль<br><input name="pass" type="password" autocomplete="current-password" style="width:100%;padding:6px"></label>
      <button type="submit" style="padding:7px 16px">Войти</button>
      <div class="lg-msg" style="margin-top:10px;color:#b3261e;white-space:pre-wrap"></div></form>`;
    const f = el.querySelector('form'), msg = el.querySelector('.lg-msg');
    f.addEventListener('submit', async ev => {
      ev.preventDefault(); msg.textContent = '';
      const v = n => (f.elements[n] ? f.elements[n].value : '');
      try {
        if (needConn) { if (!v('url').trim() || !v('key').trim()) throw new Error('Введите адрес проекта и публичный ключ'); core.setConn(v('url'), v('key')); }
        await core.signIn(v('email'), v('pass'));
        f.elements.pass.value = '';
        if (o.onDone) o.onDone();
      } catch (e) {
        msg.textContent = e.net ? 'Нет связи с базой. Проверьте интернет и адрес проекта.' : (e.message === 'Invalid login credentials' ? 'Неверный email или пароль.' : e.message);
      }
    });
  }
  global.LifeLogin = { mount };
})(window);

</script>
<script>
/* ---- modules/things.js ---- */
/* Модуль «Вещицы»: дерево групп и вещицы (есть / купить). Данные в Supabase через LifeCore.
   Точка входа: LifeModules.things.mount(элемент, {core}). Возвращает {unmount, reload}.
   Цена вещицы хранится в money_entries (kind=estimate, subject_module=things, subject_kind=thing),
   читается из things_view. «Свёрнуто/развёрнуто» хранится на устройстве, а не в базе (чтобы не писать в журнал на каждый клик). */
(function (global) {
  'use strict';
  const MOD = 'things', UI_KEY = 'lifeerp-things-ui';
  const STATUS = ['Посмотреть всё', 'Уже есть', 'Нужно купить'];
  const REVIEW = ['Общий', 'Понятно', 'Разобраться'];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = n => Number(n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
  const parseMoney = s => { const v = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isNaN(v) ? null : v; };
  const SYM = { KZT: 'тг', USD: '$', EUR: '€', RUB: '₽' };
  const cmpName = (a, b) => String(a.name).localeCompare(String(b.name), 'ru');

  const CSS = `
.th-app{--line:#dcdcdc;font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#404040;padding:14px;max-width:920px}
.th-app *{box-sizing:border-box}.th-app button{font:inherit;color:inherit;cursor:pointer}
.th-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.th-btn{border:1px solid #c9c9c9;background:#fff;border-radius:6px;padding:5px 10px}.th-btn:hover{background:#efefef}
.th-btn.primary{background:#404040;border-color:#404040;color:#fff}
.th-sum{flex:1;min-width:180px;font-variant-numeric:tabular-nums}
.th-sync{font-size:12px;opacity:.75}.th-sync.warn{color:#b3261e;opacity:1;cursor:pointer;text-decoration:underline}
.th-note{background:#f2f2f2;border-radius:6px;padding:6px 10px;margin-bottom:10px;font-size:13px}
.th-empty{padding:40px 20px;text-align:center;opacity:.8}
.th-g{background:rgba(255,255,255,.55);border:1px solid #cfcfcf;border-radius:8px;margin-bottom:8px;padding:6px 8px 2px}
.th-gh{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.th-gn{font-weight:600}.th-gs{flex:1;font-size:12px;opacity:.7}
.th-gb{padding-left:10px;border-left:2px dashed rgba(0,0,0,.15);margin:0 0 6px 4px}
.th-tog{width:16px;height:16px;border:0;background:transparent;padding:0;font-size:13px;line-height:1}

.th-fl.have{color:#5e9a6e}.th-fl.buy{color:#ef6c00}

.th-md{background:#fff;border-radius:10px;padding:16px;width:100%;max-width:440px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.th-md h3{margin:0 0 10px;font-size:16px}
.th-f{margin-bottom:10px}.th-f label{display:block;font-size:12px;opacity:.75;margin-bottom:2px}
.th-f input,.th-f select,.th-f textarea{width:100%;padding:6px;font:inherit;border:1px solid #c9c9c9;border-radius:5px}
.th-f textarea{min-height:70px;resize:vertical}
.th-r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th-bt{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
@media(max-width:600px){.th-app{padding:8px}}`;

  function mount(el, ctx) {
    ctx = ctx || {};
    const core = ctx.core || global.LifeCore;
    const store = core.store;
    let groups = [], things = [], entries = new Map(), currencies = [], fx = [];
    let ui = Object.assign({ ths: 0, thr: 0, usd: false, col: {} }, store.get(UI_KEY, {}) || {});
    let state = 'loading', note = '', errText = '', menuKey = null, loadedAt = 0, alive = true, clickTimer = null;
    const offs = [];

    if (!document.getElementById('th-css')) { const s = document.createElement('style'); s.id = 'th-css'; s.textContent = CSS; document.head.appendChild(s); }
    el.innerHTML = `<div class="th-app">
      <div class="th-bar">
        <button class="th-btn primary" data-act="g-new">+ Группа</button><button class="th-btn primary" data-act="t-new">+ Вещица</button>
        <button class="th-btn" data-act="f-status"></button><button class="th-btn" data-act="f-review"></button>
        <button class="th-btn" data-act="expand"></button><button class="th-btn" data-act="cur" title="Показывать суммы в тенге или в долларах"></button>
        <span class="th-sum"></span><span class="th-sync"></span></div>

    const root = el.firstElementChild, $ = s => root.querySelector(s);
    const uiSave = () => store.set(UI_KEY, ui);

    /* ---------- справочники и деньги ---------- */
    const baseCode = () => { const b = currencies.find(c => c.is_base && !c.deleted_at); return b ? b.code : 'KZT'; };
    function rateOf(code) {
      if (code === baseCode()) return 1;
      let best = null;
      fx.forEach(r => { if (r.currency === code && !r.deleted_at && (!best || r.on_date > best.on_date)) best = r; });
      return best ? +best.rate : null;
    }
    const usdRate = () => rateOf('USD');
    const toBase = t => { if (!(t.cost > 0)) return 0; const r = rateOf(t.cost_currency || baseCode()); return r == null ? 0 : t.cost * r; };
    const sym = c => SYM[c] || c;
    const costText = t => num(t.cost) + ((t.cost_currency && t.cost_currency !== baseCode()) ? ' ' + sym(t.cost_currency) : '');

    }

    /* ---------- дерево ---------- */
    const gMap = () => new Map(groups.map(g => [g.id, g]));
    const parentOf = g => (g.parent_id && groups.some(x => x.id === g.parent_id) ? g.parent_id : null);
    const ownerOf = t => (t.group_id && groups.some(x => x.id === t.group_id) ? t.group_id : null);
    const names = id => { const m = gMap(), p = []; let c = id ? m.get(id) : null, k = 0; while (c && k++ < 40) { p.unshift(c.name); c = c.parent_id ? m.get(c.parent_id) : null; } return p; };
    const pathOf = t => names(t.group_id).concat(t.name).join(' / ');
    function descendants(id, depth) { const out = []; if ((depth || 0) > 40) return out; groups.filter(g => g.parent_id === id).forEach(k => { out.push(k); out.push(...descendants(k.id, (depth || 0) + 1)); }); return out; }
    function flat(pid, depth, out) { if (depth > 40) return out; kidsOf(pid).forEach(g => { out.push(g); flat(g.id, depth + 1, out); }); return out; }
    const kidsOf = pid => groups.filter(g => parentOf(g) === pid).sort((a, b) => (a.sort - b.sort) || cmpName(a, b));

    function sums(gid, depth) {

        <span class="th-gn">${esc(g.name)}</span><span class="th-gs">есть ${money(s.have)} (${s.nh}) · купить ${money(s.buy)} (${s.nb})</span>

        <button class="th-sm" data-act="g-sort" data-id="${esc(g.id)}" title="${g.sort_dir ? 'Сейчас: от дорогой к дешёвой. Клик: наоборот' : 'Сейчас: от дешёвой к дорогой. Клик: наоборот'}">Сортировка ${g.sort_dir ? '&gt;' : '&lt;'}</button>
        <button class="th-sm" data-act="menu" data-kind="g" data-id="${esc(g.id)}" title="Изменить, удалить">···</button></div>${body ? `<div class="th-gb">${body}</div>` : ''}</div>`;
    }
    function render() {
      if (!alive) return;
      const list = $('.th-list');

      else {
        const kids = kidsOf(null).filter(shown), its = thingsOf(null).filter(vis);
        list.innerHTML = (kids.length || its.length) ? kids.map(g => groupHtml(g, 0)).join('') + its.map(thingHtml).join('')
          : ((groups.length || things.length) ? '<div class="th-empty">Нет вещиц под выбранные фильтры.</div>' : '<div class="th-empty">Список пуст.<br>Нажмите «+ Группа» или «+ Вещица».</div>');
      }
      const r = sums(null);
      $('.th-sum').textContent = state === 'ready' ? `есть ${r.nh}: ${money(r.have)} · купить ${r.nb}: ${money(r.buy)}` : '';
      $('[data-act="f-status"]').textContent = STATUS[ui.ths];
      $('[data-act="f-review"]').textContent = REVIEW[ui.thr];
      $('[data-act="expand"]').textContent = groups.some(g => !isCol(g)) ? 'Свернуть всё' : 'Развернуть всё';
      $('[data-act="cur"]').textContent = ui.usd ? '$' : sym(baseCode());
      const n = $('.th-note'); n.hidden = !note; n.textContent = note;
      syncBadge();
    }
    function syncBadge() {
      const s = core.status(), b = $('.th-sync');
      b.classList.toggle('warn', s.dead > 0);
      b.dataset.act = s.dead > 0 ? 'dead' : '';

    }

    /* ---------- загрузка ---------- */
    const snap = () => ({ groups, things, entries: Array.from(entries.values()), currencies, fx });
    function apply(d) {
      groups = d.groups || []; things = d.things || []; currencies = d.currencies || []; fx = d.fx || [];
      entries = new Map((d.entries || []).map(e => [e.id, e]));
    }
    const cacheSave = () => core.cache.set(MOD, snap());
    async function load() {
      state = state === 'ready' ? 'ready' : 'loading'; render();
      try { await core.flush(); } catch (e) { /* очередь сама повторит */ }
      const pending = core.status().pending > 0;
      try {
        if (pending) throw Object.assign(new Error('очередь не пуста'), { net: true, pending: true });
        const f = ['deleted_at=is.null'];
        const [g, t, e, c, x] = await Promise.all([
          core.select('thing_groups', { filters: f }),
          core.select('things_view'),
          core.select('money_entries', { filters: ['subject_module=eq.things', 'kind=eq.estimate', 'deleted_at=is.null'] }),
          core.select('currencies', { filters: f }),
          core.select('fx_rates', { filters: f })
        ]);
        t.forEach(r => { r.cost = r.cost == null ? 0 : +r.cost; });
        apply({ groups: g, things: t, entries: e, currencies: c, fx: x });
        cacheSave(); state = 'ready'; note = ''; loadedAt = Date.now();
      } catch (e) {
        if (e.auth) { state = 'error'; errText = 'нужно войти'; if (ctx.onAuthLost) ctx.onAuthLost(); render(); return; }
        const c = core.cache.get(MOD);
        if (c && (e.net || e.pending)) {
          apply(c.data); state = 'ready';
          note = e.pending ? 'Есть неотправленные изменения. Показана копия из браузера, она включает ваши правки.' : 'Нет связи с базой. Показана копия данных из браузера (на ' + new Date(c.ts).toLocaleString('ru-RU') + ').';
        } else { state = 'error'; errText = e.net ? 'нет связи с базой и нет копии в браузере' : e.message; }
      }
      render();
    }

    /* ---------- запись ---------- */
    const gRow = (g, over) => Object.assign({ id: g.id, parent_id: g.parent_id || null, name: g.name, collapsed: !!g.collapsed, sort_dir: g.sort_dir ? 1 : 0, sort: g.sort || 0, created_at: g.created_at, updated_at: g.updated_at, deleted_at: null }, over || {});
    const tRow = (t, over) => Object.assign({ id: t.id, group_id: t.group_id || null, name: t.name, description: t.description || '', have: !!t.have, review: !!t.review, created_at: t.created_at, updated_at: t.updated_at, deleted_at: null }, over || {});
    /* Цена: полная строка money_entries (недостающие поля база не додумает, например occurred_on). Возвращает строку или null. */
    function setCost(t, amount, cur, stamp) {
      amount = Math.round((+amount || 0) * 100) / 100; cur = cur || baseCode();
      if (!(amount > 0) && !t.cost_entry_id) return null;
      const prev = t.cost_entry_id ? entries.get(t.cost_entry_id) : null;
      const row = Object.assign({}, prev || {}, { id: t.cost_entry_id || core.uuid(), subject_module: MOD, subject_kind: 'thing', subject_id: t.id, direction: 'out', kind: 'estimate',
        amount, currency: cur, occurred_on: (prev && prev.occurred_on) || core.localDate(), tz: (prev && prev.tz) || core.TZ, category: (prev && prev.category) || '',
        comment: (prev && prev.comment) || '', meta: (prev && prev.meta) || {}, source_device: core.config.device, updated_at: stamp, deleted_at: null });
      delete row.user_id; delete row.updated_by;
      row.created_at = (prev && prev.created_at) || stamp;
      entries.set(row.id, row);
      t.cost = amount; t.cost_currency = cur; t.cost_entry_id = row.id;
      return row;
    }
    function done(w, j) {
      cacheSave();
      try { core.commit({ writes: [{ table: 'thing_groups', rows: w.groups || [] }, { table: 'things', rows: w.things || [] }, { table: 'money_entries', rows: w.money || [] }], journal: j }); }
      catch (e) { note = 'Не сохранено: ' + (e.message || e); }
      render();
    }
    const jr = (op, kind, id, summary) => ({ op, module: MOD, entity_kind: kind, entity_id: id, summary });
    const q40 = x => '«' + (x.length > 40 ? x.slice(0, 40) + '…' : x) + '»';

        /* Вещица стала «есть»: связанные задачи из «Сфер и дел» отмечаются выполненными, стоимость вещицы записывается им расходом. */
        async function syncLinkedTasks(t) {
          try {
            const links = await core.select('entity_links', { filters: ['relation=eq.linked_thing', 'to_module=eq.things', 'to_id=eq.' + t.id, 'from_module=eq.spheres', 'deleted_at=is.null'] });
            const items = [], money = [], jrn = [], st = core.now();
            for (const l of links) {
              const rows = await core.select('sphere_items', { filters: ['id=eq.' + l.from_id, 'deleted_at=is.null'] }), r = rows && rows[0];
              if (!r || r.done || r.kind !== 'task') continue;
              const row = Object.assign({}, r, { done: true, updated_at: st }); delete row.user_id; delete row.updated_by; items.push(row);
              jrn.push({ op: 'change', module: 'spheres', entity_kind: 'item', entity_id: r.id, summary: `Отмечено выполненным: ${r.title}; вещица «${t.name}» стала «есть»` });
              if (+t.cost > 0) {
                const at = Date.now();
                money.push({ id: core.uuid(), subject_module: 'spheres', subject_kind: 'item', subject_id: r.id, direction: 'out', kind: 'fact', amount: Math.round(+t.cost * 100) / 100, currency: t.cost_currency || baseCode(), fx_rate: null,
                  occurred_on: core.localDate(), tz: core.TZ, category: '', comment: 'Вещица: ' + t.name, meta: {}, source_device: core.config.device, created_at: new Date(at).toISOString(), updated_at: st, deleted_at: null });
                jrn.push({ op: 'create', module: 'spheres', entity_kind: 'money_entry', entity_id: r.id, summary: `Расход добавлен: ${r.title}; ${num(t.cost)}; «Вещица: ${t.name}»` });
              }
            }
            if (!items.length) return;
            core.commit({ writes: [{ table: 'sphere_items', rows: items }, { table: 'money_entries', rows: money }], journal: jrn });
          } catch (e) { note = 'Вещица отмечена, но связанные задачи в «Сферах и делах» не обновились (' + (e.message || e) + '). Отметьте их там вручную.'; render(); }
        }
        function saveThing(t, f) {
      const st = core.now(), isNew = !t, ch = [];
      let before = '';
      if (isNew) {
        t = { id: 'th_' + core.uuid().replace(/-/g, '').slice(0, 12), created_at: st, cost: 0 }; things.push(t);
        if (f.group_id && ui.col[f.group_id] !== false) { ui.col[f.group_id] = false; uiSave(); }
      } else {
        before = pathOf(t);
        const cmp = (l, a, b, fm) => { if (a !== b) ch.push(`${l}: ${fm ? fm(a) : a} → ${fm ? fm(b) : b}`); };
        cmp('название', t.name, f.name, q40); cmp('группа', ownerOf(t) || '', f.group_id || '', x => x ? names(x).join(' / ') : 'без группы'); cmp('описание', t.description || '', f.description, q40);
        cmp('стоимость', +t.cost || 0, f.cost, num); cmp('валюта', t.cost_currency || baseCode(), f.currency); cmp('статус', !!t.have, f.have, x => x ? 'есть' : 'купить');
        if (!ch.length) return;
      }
      const becameHave = !isNew && !t.have && !!f.have;
      Object.assign(t, { name: f.name, group_id: f.group_id || null, description: f.description, have: f.have, updated_at: st, review: !!t.review });
      const money = setCost(t, f.cost, f.currency, st);

            }
    function saveGroup(g, f) {

        if (f.parent_id && ui.col[f.parent_id] !== false) { ui.col[f.parent_id] = false; uiSave(); }

      if (!ch.length) return;

    }
    function toggleFlag(id, what) {

      done({ things: [tRow(t)] }, [jr('change', 'thing', t.id, what === 'have'
        ? `Изменён статус: ${pathOf(t)}; ${t.have ? 'купить → есть' : 'есть → купить'}`
                : (t.review ? `Отмечено: Разобраться: ${pathOf(t)}` : `Снята отметка Разобраться: ${pathOf(t)}`))]);
              if (becameHave) syncLinkedTasks(t);
            }
    function sortGroup(id) {

      g.sort_dir = g.sort_dir ? 0 : 1; g.updated_at = core.now();
      done({ groups: [gRow(g)] }, [jr('change', 'thing_group', g.id, `Сортировка группы: ${names(g.id).join(' / ')}; ${g.sort_dir ? 'от дорогой к дешёвой' : 'от дешёвой к дорогой'}`)]);
    }
    function deleteThing(id) {
      const t = things.find(x => x.id === id); if (!t) return;
      const st = core.now(), where = pathOf(t), money = [], e = t.cost_entry_id ? entries.get(t.cost_entry_id) : null;
      if (e) { const row = Object.assign({}, e, { updated_at: st, deleted_at: st }); delete row.user_id; delete row.updated_by; money.push(row); entries.delete(e.id); }
      const row = tRow(t, { updated_at: st, deleted_at: st }); things = things.filter(x => x !== t);
      done({ things: [row], money }, [jr('delete', 'thing', id, `Удалена вещица: ${where}; стоимость ${costText(t)}; ${t.have ? 'есть' : 'купить'}`)]);
    }
    function deleteGroup(id) {
      const g = groups.find(x => x.id === id); if (!g) return;
      const st = core.now(), gs = [g].concat(descendants(id)), ids = new Set(gs.map(x => x.id)), ths = things.filter(t => ids.has(ownerOf(t))), where = names(id).join(' / ');
      const money = [];
      ths.forEach(t => { const e = t.cost_entry_id ? entries.get(t.cost_entry_id) : null; if (e) { const r = Object.assign({}, e, { updated_at: st, deleted_at: st }); delete r.user_id; delete r.updated_by; money.push(r); entries.delete(e.id); } });
      const rg = gs.map(x => gRow(x, { updated_at: st, deleted_at: st })), rt = ths.map(t => tRow(t, { updated_at: st, deleted_at: st }));

    }

    /* ---------- окна и формы ---------- */
    function closeModal() { const o = root.querySelector('.th-ov'); if (o) o.remove(); }
    function modal(title, body, onSave, saveLabel) {
      closeModal();
      const o = document.createElement('div'); o.className = 'th-ov';
      o.innerHTML = `<form class="th-md"><h3>${esc(title)}</h3>${body}<div class="th-bt"><button type="button" class="th-btn" data-m="cancel">Отмена</button>${onSave ? `<button type="submit" class="th-btn primary">${saveLabel || 'Сохранить'}</button>` : ''}</div></form>`;
      root.appendChild(o);
      const form = o.firstElementChild;
      o.addEventListener('mousedown', e => { if (e.target === o) closeModal(); });

    const groupOpts = (sel, excl) => flat(null, 0, []).filter(g => !excl || !excl.has(g.id)).map(g => `<option value="${esc(g.id)}" ${g.id === sel ? 'selected' : ''}>${esc(names(g.id).join(' / '))}</option>`).join('');

    function thingForm(id, gid) {
      const t = id ? things.find(x => x.id === id) : null, g = t ? ownerOf(t) : (gid || null);
      const cur = (t && t.cost_currency) || baseCode(), codes = currencies.filter(c => !c.deleted_at).map(c => c.code);
      if (!codes.includes(cur)) codes.push(cur); if (!codes.length) codes.push('KZT');
      modal(t ? 'Изменить вещицу' : 'Новая вещица',
        field('Название', `<input name="name" maxlength="200" required value="${esc(t ? t.name : '')}">`) +
        field('Группа', `<select name="grp"><option value="">без группы</option>${groupOpts(g)}</select>`) +
        field('Описание', `<textarea name="desc">${esc(t ? t.description : '')}</textarea>`) +
        `<div class="th-r2">${field('Стоимость', `<input name="cost" inputmode="decimal" value="${t && t.cost ? esc(String(t.cost).replace('.', ',')) : ''}">`)}${field('Валюта', `<select name="cur">${codes.map(c => `<option ${c === cur ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>`)}</div>` +
        field('Статус', `<select name="have"><option value="0" ${t && t.have ? '' : 'selected'}>купить</option><option value="1" ${t && t.have ? 'selected' : ''}>есть</option></select>`),
        f => {
          const name = f.elements.name.value.trim(); if (!name) { f.elements.name.focus(); return false; }
          const raw = f.elements.cost.value.trim(), cost = raw ? parseMoney(raw) : 0;

          saveThing(t, { name, group_id: f.elements.grp.value || null, description: f.elements.desc.value.trim(), cost: Math.round(cost * 100) / 100, currency: f.elements.cur.value, have: f.elements.have.value === '1' });

    }
    function groupForm(id, parentId) {
      const g = id ? groups.find(x => x.id === id) : null, excl = new Set(g ? [g.id].concat(descendants(g.id).map(x => x.id)) : []);
      const pid = g ? parentOf(g) : (parentId || null);
      modal(g ? 'Изменить группу' : 'Новая группа',
        field('Название', `<input name="name" maxlength="80" required value="${esc(g ? g.name : '')}">`) +
        field('Родительская группа', `<select name="par"><option value="">верхний уровень</option>${groupOpts(pid, excl)}</select>`), f => {

    function deadModal() {

      modal('Не принято сервером', l.length
        ? `<div class="th-f">Эти записи база отклонила (ошибка данных или прав). Остальные изменения сохранены.</div>` + l.map(d => `<div class="th-f"><b>${esc(d.item.table || d.item.kind)}</b>: ${esc(d.error)}</div>`).join('')
        : '<div class="th-f">Список пуст.</div>', null);
      const bt = root.querySelector('.th-ov .th-bt');
      if (l.length) { const a = document.createElement('button'); a.type = 'button'; a.className = 'th-btn'; a.textContent = 'Повторить отправку'; a.onclick = () => { core.retryDead(); closeModal(); };
        const b = document.createElement('button'); b.type = 'button'; b.className = 'th-btn'; b.textContent = 'Убрать из списка'; b.onclick = () => { core.clearDead(); closeModal(); syncBadge(); }; bt.prepend(b); bt.prepend(a); }
    }

    /* ---------- меню и события ---------- */
    function closeMenu() { const m = root.querySelector('.th-menu'); if (m) m.remove(); menuKey = null; }
    function openMenu(b) {
      const key = b.dataset.kind + ':' + b.dataset.id;
      if (menuKey === key) { closeMenu(); return; }
      closeMenu(); menuKey = key;
      const k = b.dataset.kind, id = esc(b.dataset.id);
      const m = document.createElement('div'); m.className = 'th-menu';
      m.innerHTML = `<button data-act="${k}-edit" data-id="${id}">Изменить</button><button data-act="${k}-del" data-id="${id}" data-confirm="1">Удалить</button>`;
      const r = b.getBoundingClientRect(); m.style.top = Math.min(r.bottom + 2, innerHeight - 90) + 'px'; m.style.left = Math.max(4, Math.min(r.left - 90, innerWidth - 170)) + 'px';
      root.appendChild(m);
    }
    function onClick(e) {
      const b = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!b || !root.contains(b)) { closeMenu(); return; }
      const a = b.dataset.act, id = b.dataset.id;
      if (a === 'dead') { deadModal(); return; }
      if (a === 'menu') { openMenu(b); return; }
      if (b.dataset.confirm && !b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Точно?'; return; }
      closeMenu();
      switch (a) {
        case 'g-new': groupForm(null, id || null); break;
        case 'g-edit': groupForm(id); break;
        case 'g-del': deleteGroup(id); break;
        case 'g-sort': sortGroup(id); break;
        case 'g-toggle': { const g = groups.find(x => x.id === id); if (g) { ui.col[id] = !isCol(g); uiSave(); render(); } break; }
        case 't-new': thingForm(null, b.dataset.gid || null); break;
        case 't-edit': thingForm(id); break;
        case 't-del': deleteThing(id); break;
        case 't-flag': toggleFlag(id, 'have'); break;
        case 't-name': clearTimeout(clickTimer); clickTimer = setTimeout(() => thingForm(id), 250); break;
        case 'f-status': ui.ths = (ui.ths + 1) % 3; uiSave(); render(); break;
        case 'f-review': ui.thr = (ui.thr + 1) % 3; uiSave(); render(); break;
        case 'expand': { const open = groups.some(g => !isCol(g)); groups.forEach(g => { ui.col[g.id] = open; }); uiSave(); render(); break; }
        case 'cur': if (!ui.usd && !usdRate()) { note = 'Курс доллара не задан (таблица fx_rates).'; render(); break; } ui.usd = !ui.usd; uiSave(); render(); break;
        case 'reload': load(); break;

    }
    function onDbl(e) {
      const row = e.target.closest ? e.target.closest('[data-row]') : null;
      if (!row || (e.target.closest && e.target.closest('button'))) return;

    root.addEventListener('click', onClick); root.addEventListener('dblclick', onDbl); document.addEventListener('keydown', onKey);
    offs.push(core.on('queue', syncBadge), core.on('dead', syncBadge), core.on('net', syncBadge));
    offs.push(core.on('conflict', () => { note = 'В базе есть более новые правки этих строк. Данные перечитаны.'; load(); }));
    const onVis = () => { if (document.visibilityState === 'visible' && state === 'ready' && Date.now() - loadedAt > 120000 && !core.status().pending) load(); };
    document.addEventListener('visibilitychange', onVis);

      reload: load,
      unmount() { alive = false; offs.forEach(f => f()); document.removeEventListener('keydown', onKey); document.removeEventListener('visibilitychange', onVis); clearTimeout(clickTimer); el.innerHTML = ''; }
    };
  }

  global.LifeModules = global.LifeModules || {};
  global.LifeModules.things = { id: MOD, title: 'Вещицы', mount };
})(window);

<script>
/* ---- modules/spheres-model.js ---- */
/* «Сферы и дела»: чистые расчёты и модель (без экрана и записи).
   buildModel: строки базы -> модель, buildCtx: итоги/статусы/фильтры (перенесено из del.html без изменений).
   Доступ: window.LifeSpheresModel */
(function (global) {
  'use strict';
  const IMP = ['без метки', 'Важно', 'Особо'];
  const PALETTE0 = '#e6194b';

  /* ---------- утилиты (как в del.html) ---------- */
  const pad = n => String(n).padStart(2, '0');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDT = ts => { const d = new Date(ts); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  function fmtDur(sec) {
    sec = Math.round(sec); const neg = sec < 0; sec = Math.abs(sec);
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return (neg ? '−' : '') + (h ? `${h}ч ${pad(m)}м` : m ? `${m}м` : s ? `${s}с` : '0м');
  }
  const fmtClock = sec => { sec = Math.max(0, Math.floor(sec)); return `${Math.floor(sec / 3600)}:${pad(Math.floor(sec % 3600 / 60))}:${pad(sec % 60)}`; };
  const fmtMoney = n => Number(n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
  const fmtCur = (x, usd, rate) => usd ? '$' + (x / rate).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : fmtMoney(x) + ' тг';
  const fmtMin = min => min ? fmtDur(min * 60) : '0';
  const fmtPlanMoney = n => n ? fmtMoney(n) : '0';
  const textOn = hex => { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = n >> 8 & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#404040' : '#fff'; };
  function hexToHsl(hex) {
    const n = parseInt(hex.slice(1), 16); let r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2; let h = 0, sat = 0;
    if (mx !== mn) { const d = mx - mn; sat = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
    return [Math.round(h), Math.round(sat * 100), Math.round(l * 100)];
  }
  const shadeOf = (hex, i) => { const [h, sat] = hexToHsl(hex); return `hsl(${h},${Math.max(sat, 30)}%,${Math.round(82 - 58 * i / 15)}%)`; };
  const tsOf = v => { const t = v ? Date.parse(v) : NaN; return isNaN(t) ? 0 : t; };

  /* ---------- модель: строки базы -> то, с чем работает расчёт из del.html ---------- */
  function buildModel(d) {
    const bySort = (a, b) => (a.sort || 0) - (b.sort || 0) || tsOf(a.created_at) - tsOf(b.created_at);
    const spheres = (d.spheres || []).slice().sort(bySort).map(s => ({ id: s.id, name: s.name || 'Сфера', color: /^#[0-9a-f]{6}$/i.test(s.color) ? s.color : PALETTE0 }));
    const groups = (d.groups || []).slice().sort(bySort).map(g => ({ id: g.id, sphereId: g.sphere_id, name: g.name || 'Группа' }));
    const items = (d.items || []).slice().sort(bySort).map(r => {
      const type = r.kind === 'task' ? 'task' : 'project';
      return { id: r.id, sphereId: r.sphere_id, parentId: r.parent_id || null, groupId: r.parent_id ? null : (r.group_id || null), type,
        title: r.title || 'Без названия', note: r.note || '', done: !!r.done, imp: (+r.importance === 1 || +r.importance === 2) ? +r.importance : 0,
        shade: (type !== 'task' && Number.isInteger(r.shade) && r.shade >= 0 && r.shade < 16) ? r.shade : null,
        actDays: +r.act_days > 0 ? +r.act_days : 0, actMin: +r.act_min > 0 ? +r.act_min : 0,
        timerStart: r.timer_start ? tsOf(r.timer_start) : null, created: tsOf(r.created_at),
        planMin: 0, planMoney: 0, entries: [], thingId: null, dependsOn: null, dependsThing: null };
    });
    const idx = {}; items.forEach(i => { idx[i.id] = i; });
    (d.times || []).forEach(t => {
      const it = idx[t.subject_id]; if (!it) return;
      if (t.kind === 'plan') it.planMin += (+t.duration_sec || 0) / 60;
      else it.entries.push({ id: t.id, tbl: 'time_entries', n: +((t.meta || {}).n) || 0, kind: t.kind === 'correction' ? 'corr' : 'time', sec: +t.duration_sec || 0, amount: 0,
        ts: tsOf(t.ended_at) || tsOf(t.started_at) || tsOf(t.created_at), start: t.started_at ? tsOf(t.started_at) : null, comment: t.comment || '' });
    });
    (d.moneys || []).forEach(m => {
      const it = idx[m.subject_id]; if (!it) return;
      if (m.kind === 'plan') { if (m.direction !== 'in') it.planMoney += +m.amount || 0; }
      else if (m.kind === 'fact') it.entries.push({ id: m.id, tbl: 'money_entries', n: +((m.meta || {}).n) || 0, kind: 'money', sec: 0, amount: (m.direction === 'in' ? -1 : 1) * (+m.amount || 0), ts: tsOf(m.created_at), start: null, comment: m.comment || '' });
    });
    (d.links || []).forEach(l => {
      const it = idx[l.from_id]; if (!it) return;
      if (l.relation === 'depends_on' && l.to_module === 'spheres') it.dependsOn = l.to_id;
      else if (l.relation === 'depends_on' && l.to_module === 'things') it.dependsThing = l.to_id;
      else if (l.relation === 'linked_thing' && it.type === 'task') it.thingId = l.to_id;
    });
    /* номера записей (как в del.html): если номера повторяются или их нет, нумеруем по времени */
    items.forEach(it => {
      const ns = it.entries.map(e => e.n).filter(Boolean), dup = new Set(ns).size !== ns.length, sorted = it.entries.slice().sort((a, b) => a.ts - b.ts);
      if (dup) sorted.forEach((e, i) => { e.n = i + 1; });
      else { let max = ns.reduce((m, x) => Math.max(m, x), 0); sorted.forEach(e => { if (!e.n) e.n = ++max; }); }
    });
    const things = (d.things || []).map(t => ({ id: t.id, name: t.name, have: !!t.have }));
    return { spheres, groups, items, things };
  }

  /* ---------- расчёты (buildCtx из del.html) ---------- */
  function buildCtx(S, now) {
    const idx = {}, thById = {}, kids = {}, roots = {}, groupRoots = {}, gset = new Set(S.groups.map(g => g.id));
    S.items.forEach(i => { idx[i.id] = i; });
    S.things.forEach(t => { thById[t.id] = t; });
    S.items.forEach(i => {
      if (i.parentId && idx[i.parentId]) (kids[i.parentId] = kids[i.parentId] || []).push(i);
      else if (i.groupId && gset.has(i.groupId)) (groupRoots[i.groupId] = groupRoots[i.groupId] || []).push(i);
      else (roots[i.sphereId] = roots[i.sphereId] || []).push(i);
    });
    const memo = {};
    function own(i) {
      let sec = 0, money = 0, last = 0;
      for (const e of i.entries) { if (e.kind === 'money') money += e.amount; else { sec += e.sec; if (e.sec > 0 && e.ts > last) last = e.ts; } }
      if (i.timerStart) { sec += Math.max(0, (now - i.timerStart) / 1000); last = now; }
      return { sec, money, planMin: i.planMin || 0, planMoney: i.planMoney || 0, last };
    }
    function calc(id) {
      if (memo[id]) return memo[id];
      const t = own(idx[id]); memo[id] = t;
      (kids[id] || []).forEach(k => { const c = calc(k.id); t.sec += c.sec; t.money += c.money; t.planMin += c.planMin; t.planMoney += c.planMoney; if (c.last > t.last) t.last = c.last; });
      return t;
    }
    function win(i, days, depth) {
      if (depth > 60) return 0;
      const from = now - days * 864e5; let s = 0;
      for (const e of i.entries) if (e.kind !== 'money' && e.ts >= from) s += e.sec;
      if (i.timerStart) s += (now - Math.max(i.timerStart, from)) / 1000;
      (kids[i.id] || []).forEach(k => { s += win(k, days, depth + 1); });
      return Math.max(0, s);
    }
    function blocked(i) {
      let c = i, g = 0;
      while (c && g++ < 60) {
        const t = c.dependsOn && idx[c.dependsOn];
        if (t && !t.done && t.id !== c.id) return { own: c === i, by: { title: t.title, thing: false } };
        const th = c.dependsThing && thById[c.dependsThing];
        if (th && !th.have) return { own: c === i, by: { title: th.name, thing: true } };
        c = c.parentId ? idx[c.parentId] : null;
      }
      return null;
    }
    const redMemo = {};
    function hasRed(id) {
      if (id in redMemo) return redMemo[id];
      redMemo[id] = false;
      return (redMemo[id] = (kids[id] || []).some(k => status(k).k === 'red' || hasRed(k.id)));
    }
    function status(i) {
      if (i.done) return { k: 'done' };
      const bl = blocked(i); if (bl) return { k: 'blocked', own: bl.own, by: bl.by };
      if (!i.actDays) return { k: 'normal' };
      const c = calc(i.id), age = now - (c.last || i.created);
      if (age > i.actDays * 864e5) return { k: 'gray', days: Math.floor(age / 864e5) };
      if (i.actMin > 0) {
        if (now - i.created < i.actDays * 864e5) return { k: 'normal' };
        const got = win(i, i.actDays, 0) / 60;
        if (got < i.actMin) return { k: 'red', ratio: Math.min(1, 1 - got / i.actMin), got };
      }
      return { k: 'normal' };
    }
    return { now, idx, thById, kids, roots, groupRoots, calc, own, status, hasRed, get: id => idx[id] };
  }

  global.LifeSpheresModel = { IMP, PALETTE0, pad, esc, fmtDT, fmtDur, fmtClock, fmtMoney, fmtCur, fmtMin, fmtPlanMoney, textOn, hexToHsl, shadeOf, tsOf, buildModel, buildCtx };
})(window);

</script>
<script>
/* ---- modules/spheres-css.js ---- */
/* «Сферы и дела»: стили экрана (подключаются один раз). Доступ: window.LifeSpheresCss */
(function (global) {
  'use strict';
  const CSS = `
.d-app{--text:#404040;--line:#dcdcdc;--bg:#f2f2f2;--panel:#fff;--dark:#404040;font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);min-height:calc(100vh - 46px);padding-bottom:40px}

<script>
/* ---- modules/spheres-edit.js ---- */
/* «Сферы и дела»: правки (запись в базу через очередь ядра, формы, перетаскивание, меню «···»).
   Подключается из экрана: LifeSpheresEdit.install(env) -> набор функций и общие инструменты (tx, modal, field …) для других частей.
   env: { core, root, MOD, ui, uiSave, render, S (модель), raw (строки базы), detailsId, setNote(текст) } — S/raw/detailsId читаются и пишутся через env.
   Доступ: window.LifeSpheresEdit */
(function (global) {
  'use strict';
  const M = global.LifeSpheresModel;
  const { esc, fmtMin, fmtPlanMoney, shadeOf, tsOf, buildModel } = M, IMP = M.IMP;

  function install(env) {
    const { core, root, MOD, ui, uiSave } = env;
    const render = () => env.render();
      /* ---------- запись: полные строки в очередь ядра ---------- */
      const TBL = { spheres: 'spheres', sphere_groups: 'groups', sphere_items: 'items', time_entries: 'times', money_entries: 'moneys', entity_links: 'links', things: 'things' };
      const STEP = 1024, forms = [], hooks = {};
      const sortOf = (a, b) => (a.sort || 0) - (b.sort || 0) || tsOf(a.created_at) - tsOf(b.created_at);
      const rawRow = (table, id) => (env.raw[TBL[table]] || []).find(r => r.id === id);
      const newId = p => p + '_' + core.uuid().replace(/-/g, '').slice(0, 12);
      const dev = () => (core.config && core.config.device) || 'desktop';
      const getItem = id => env.S.items.find(i => i.id === id), getSphere = id => env.S.spheres.find(s => s.id === id), getGroup = id => env.S.groups.find(g => g.id === id);
      const rebuild = () => { env.S = buildModel(env.raw); };
      function descendants(id) { const out = []; env.S.items.filter(i => i.parentId === id).forEach(k => { out.push(k, ...descendants(k.id)); }); return out; }
      function pathParts(it) {
        const p = []; let c = it, g = 0;
        while (c && g++ < 50) { p.unshift(c.title); c = c.parentId ? getItem(c.parentId) : null; }
        let top = it, k = 0; while (top.parentId && getItem(top.parentId) && k++ < 50) top = getItem(top.parentId);
        const sp = getSphere(it.sphereId), gr = top.groupId ? getGroup(top.groupId) : null;
        return [sp ? sp.name : '?', ...(gr ? [gr.name] : []), ...p];
      }
      const pathOf = it => pathParts(it).join(' / ');
      const q40 = x => '«' + (String(x).length > 40 ? String(x).slice(0, 40) + '…' : x) + '»';
      const typeName = t => t === 'task' ? 'задача' : 'проект';

      function tx() {
        const w = {}, j = [];
        const T = {
          put(table, row, opts) {
          opts = opts || {}; row = Object.assign({}, row, { updated_at: core.now() });
          const key = opts.key || TBL[table], arr = env.raw[key] = env.raw[key] || [], i = arr.findIndex(r => r.id === row.id);
            if (row.deleted_at) { if (i >= 0) arr.splice(i, 1); } else if (i >= 0) arr[i] = row; else arr.push(row);
            const out = opts.send ? opts.send(row) : Object.assign({}, row); delete out.user_id; delete out.updated_by;
            (w[table] = w[table] || {})[row.id] = out; return row;
          },
          del(table, row) { return T.put(table, Object.assign({}, row, { deleted_at: core.now() })); },
          log(op, kind, id, action, where, details, module) { j.push({ op, module: module || MOD, entity_kind: kind, entity_id: id, summary: action + (where ? ': ' + where : '') + (details ? '; ' + details : '') }); },
          empty() { return !Object.keys(w).length && !j.length; },
          commit() {
            rebuild(); core.cache.set(MOD, env.raw);
            const writes = Object.keys(w).map(t => ({ table: t, rows: Object.keys(w[t]).map(k => w[t][k]) }));
            try { core.commit({ writes, journal: j }); } catch (e) { env.setNote('Не сохранено: ' + (e.message || e)); }
            render();
          }
        };
        return T;
      }
      /* Порядок хранится числом sort (общий по всем строкам таблицы). Ставим между соседями; если места нет, перенумеровываем с шагом 1024. */
      function placeSort(T, table, movedId, dst) {
        const order = (env.raw[TBL[table]] || []).filter(r => r.id !== movedId).sort(sortOf);
        let idx = -1;
        if (dst.beforeId) idx = order.findIndex(x => x.id === dst.beforeId);
        else if (dst.afterId) { idx = order.findIndex(x => x.id === dst.afterId); if (idx >= 0) idx++; }
        if (idx < 0) idx = order.length;
        const prev = order[idx - 1], next = order[idx];
        if (!prev && !next) return STEP;
        if (!prev) return (next.sort || 0) - STEP;
        if (!next) return (prev.sort || 0) + STEP;
        if ((next.sort || 0) - (prev.sort || 0) >= 2) return Math.floor(((prev.sort || 0) + (next.sort || 0)) / 2);
        order.forEach((r, i) => { const v = ((i < idx ? i : i + 1) + 1) * STEP; if (r.sort !== v) T.put(table, Object.assign({}, r, { sort: v })); });
        return (idx + 1) * STEP;
      }
      const lastSort = table => (env.raw[TBL[table]] || []).reduce((m, r) => Math.max(m, r.sort || 0), 0) + STEP;

      function timePlanRow(itemId, sec) {
        return { id: core.uuid(), subject_module: MOD, subject_kind: 'item', subject_id: itemId, kind: 'plan', duration_sec: sec, started_at: null, ended_at: null,
          local_date: core.localDate(), tz: core.TZ, comment: '', tags: [], meta: {}, source_device: dev(), created_at: core.now(), updated_at: core.now(), deleted_at: null };
      }
      function moneyPlanRow(itemId, amount, currency) {
        return { id: core.uuid(), subject_module: MOD, subject_kind: 'item', subject_id: itemId, direction: 'out', kind: 'plan', amount, currency: currency || 'KZT', fx_rate: null,
          occurred_on: core.localDate(), tz: core.TZ, category: '', comment: '', meta: {}, source_device: dev(), created_at: core.now(), updated_at: core.now(), deleted_at: null };
      }
      /* План дела = записи «план» в общих таблицах. Меняем только если значение изменилось. */
      function setPlan(T, itemId, pmin, pmoney) {
        const tr = (env.raw.times || []).filter(r => r.subject_module === MOD && r.subject_id === itemId && r.kind === 'plan');
        const sec = Math.round(pmin * 60), curSec = tr.reduce((s, r) => s + (+r.duration_sec || 0), 0);
        if (sec !== curSec) {
          if (sec > 0 && tr.length) { T.put('time_entries', Object.assign({}, tr[0], { duration_sec: sec })); tr.slice(1).forEach(r => T.del('time_entries', r)); }
          else if (sec > 0) T.put('time_entries', timePlanRow(itemId, sec));
          else tr.forEach(r => T.del('time_entries', r));
        }
        const mr = (env.raw.moneys || []).filter(r => r.subject_module === MOD && r.subject_id === itemId && r.kind === 'plan' && r.direction !== 'in');
        const curM = mr.reduce((s, r) => s + (+r.amount || 0), 0);
        if (Math.round(pmoney * 100) !== Math.round(curM * 100)) {
          if (pmoney > 0 && mr.length) { T.put('money_entries', Object.assign({}, mr[0], { amount: pmoney })); mr.slice(1).forEach(r => T.del('money_entries', r)); }
          else if (pmoney > 0) T.put('money_entries', moneyPlanRow(itemId, pmoney, 'KZT'));
          else mr.forEach(r => T.del('money_entries', r));
        }
      }
      const linkRow = (itemId, toModule, toId) => ({ id: core.uuid(), from_module: MOD, from_kind: 'item', from_id: itemId, to_module: toModule, to_kind: toModule === MOD ? 'item' : 'thing',
        to_id: toId, relation: 'depends_on', meta: {}, created_at: core.now(), updated_at: core.now(), deleted_at: null });
      function setDeps(T, itemId, dep, depTh) {
        const want = []; if (dep) want.push([MOD, dep]); if (depTh) want.push(['things', depTh]);
        const have = (env.raw.links || []).filter(l => l.from_module === MOD && l.from_id === itemId && l.relation === 'depends_on');
        have.forEach(l => { if (!want.some(w => w[0] === l.to_module && w[1] === l.to_id)) T.del('entity_links', l); });
        want.forEach(w => { if (!have.some(l => l.to_module === w[0] && l.to_id === w[1])) T.put('entity_links', linkRow(itemId, w[0], w[1])); });
      }
      /* Удаление дел: сами дела, их записи времени/денег и связи (в обе стороны) помечаются удалёнными. */
      function removeItems(T, ids) {
        const set = new Set(ids); let ent = 0;
        (env.raw.items || []).filter(r => set.has(r.id)).forEach(r => T.del('sphere_items', r));
        (env.raw.times || []).filter(r => set.has(r.subject_id)).forEach(r => { if (r.kind !== 'plan') ent++; T.del('time_entries', r); });
        (env.raw.moneys || []).filter(r => set.has(r.subject_id)).forEach(r => { if (r.kind !== 'plan') ent++; T.del('money_entries', r); });
        (env.raw.links || []).filter(l => (l.from_module === MOD && set.has(l.from_id)) || (l.to_module === MOD && set.has(l.to_id))).forEach(l => T.del('entity_links', l));
        return ent;
      }

      /* ---------- окна ---------- */
      function modal(title, body, buttons, cls) {
        const back = document.createElement('div'); back.className = 'd-back';
        back.innerHTML = `<div class="d-modal ${cls || ''}" role="dialog" aria-modal="true"><div class="d-mh"><b>${esc(title)}</b><button class="d-x" type="button" aria-label="Закрыть">✕</button></div><div class="d-mb">${body}</div><div class="d-mf"></div></div>`;
        const close = () => { back.remove(); const i = forms.indexOf(back); if (i >= 0) forms.splice(i, 1); };
        const mf = back.querySelector('.d-mf'); let primary = null;
        buttons.forEach(b => {
          const x = document.createElement('button'); x.type = 'button'; x.className = 'd-btn ' + (b.cls || ''); x.textContent = b.label;
          x.onclick = () => { if (b.fn && b.fn(back, x) === false) return; close(); };

        back.addEventListener('keydown', e => { if (e.key === 'Enter' && primary && e.target.tagName === 'INPUT') { e.preventDefault(); primary.click(); } });

      }

      function confirmBox(title, text, okLabel, fn) {

      }
      const PALETTE = ['#e6194b', '#f58231', '#ffe119', '#bfef45', '#3cb44b', '#42d4f4', '#4363d8', '#911eb4', '#f032e6', '#9a6324', '#800000', '#469990', '#000075', '#fabed4', '#aaffc3', '#dcbeff'];

      /* ---------- сфера ---------- */
      function sphereForm(id) {
        const sp = id ? getSphere(id) : null;

    /* общее состояние для файла правок: читается и пишется через env */
    const env = { core, root, MOD, ui, uiSave, render: () => render(), setNote: t => { note = t; },
      get S() { return S; }, set S(v) { S = v; }, get raw() { return raw; }, set raw(v) { raw = v; },

    /* ---------- данные ---------- */
    function apply(d) {
      raw = d; S = buildModel(d);
      const usd = (d.fx || []).filter(r => r.currency === 'USD' && !r.deleted_at).sort((a, b) => String(b.on_date).localeCompare(String(a.on_date)))[0];

    }
    async function load() {

        const nd = ['deleted_at=is.null'];

        const [spheres, groups, items, times, moneys, links, things, fx, thEntries] = await Promise.all([
          core.select('spheres', { filters: nd }), core.select('sphere_groups', { filters: nd }), core.select('sphere_items', { filters: nd }),
          core.select('time_entries', { filters: sub }), core.select('money_entries', { filters: sub }),
          core.select('entity_links', { filters: ['from_module=eq.spheres', 'deleted_at=is.null'] }),
          core.select('things_view'), core.select('fx_rates', { filters: nd }),
                    core.select('money_entries', { filters: ['subject_module=eq.things', 'kind=eq.estimate', 'deleted_at=is.null'] })
        ]);
        apply({ spheres, groups, items, times, moneys, links, things, fx, thEntries });
        core.cache.set(MOD, raw); state = 'ready'; note = ''; loadedAt = Date.now();
      } catch (e) {
        if (e.auth) { state = 'error'; errText = 'нужно войти'; if (ctxIn.onAuthLost) ctxIn.onAuthLost(); render(); return; }
        const c = core.cache.get(MOD);
        if (c && e.net) { apply(c.data); state = 'ready'; note = 'Нет связи с базой. Показана копия от ' + fmtDT(c.ts) + '.'; }
        else { state = 'error'; errText = e.net ? 'нет связи с базой и нет копии в браузере' : (e.message || 'ошибка чтения'); }
      }
      render();
    }

    /* ---------- отрисовка ---------- */
    const vis = i => (i.type === 'task' ? (ui.showTask && (ui.showDone || !i.done) && (!ui.zeroOnly || !i.planMoney)) : ui.showProj) && ui.imp[i.imp || 0];
    function flat(list, c) { const out = []; (list || []).forEach(i => { if (vis(i)) out.push(i); else out.push(...flat(c.kids[i.id], c)); }); return out; }
    const isCol = id => !!ui.col[id];

    function cardHtml(it, c, sp) {
      const t = c.calc(it.id), st = c.status(it), kids = c.kids[it.id] || [];
      const isProj = it.type === 'project', shaded = isProj && it.shade != null;

      else if (st.k === 'red') { col = `hsl(0,78%,${Math.round(58 - 16 * st.ratio)}%)`; mix = Math.round(16 + 24 * st.ratio); cls = 'st-red'; }
      else if (st.k === 'done') { col = '#5e9a6e'; mix = 8; cls = 'st-done'; }
      else if (st.k === 'blocked') { col = '#9a9a9a'; mix = 12; cls = 'st-blocked' + (st.own ? ' own' : ''); }
      const run = !!it.timerStart;
      const timerBtn = `<button class="d-sm d-tmb ${run ? 'tm-on' : ''}" data-act="timer" data-id="${esc(it.id)}" title="${run ? 'Остановить таймер' : 'Запустить таймер'}">${run ? '■ <span data-live="clock" data-id="' + esc(it.id) + '">' + fmtClock((c.now - it.timerStart) / 1000) + '</span>' : '▶\uFE0E'}</button>`;
            const timer = timerBtn.replace(' d-tmb', '');
      let actLine = '';
      if (st.k === 'blocked' && st.own) actLine = `<div class="d-act">ждёт ${st.by.thing ? 'покупки' : 'завершения'}: ${esc(st.by.title)}</div>`;
      else if (it.actDays) {
        if (st.k === 'red') actLine = `<div class="d-act red">мало: за ${it.actDays} дн набрано ${fmtDur(st.got * 60)} из ${it.actMin} мин</div>`;
        else if (st.k === 'gray') actLine = `<div class="d-act">нет работы ${st.days} дн (порог ${it.actDays})</div>`;
        else actLine = `<div class="d-act">порог ${it.actDays} дн${it.actMin ? ' / ' + it.actMin + ' мин' : ''}${t.last ? ' · последняя работа ' + fmtDT(t.last).slice(0, 10) : ''}</div>`;
      }
      const eid = esc(it.id), menuBtn = (cl, ti) => `<button class="d-sm ${cl}" data-act="menu" data-kind="item" data-id="${eid}" title="Изменить, завершить, удалить">···</button>`;
      return `<div class="d-card ${cls} ${run ? 'running' : ''}" style="--c:${col};--mix:${mix}%" draggable="true" data-dk="item" data-did="${eid}" data-card="${eid}">

      ${kids.length ? `<button class="d-tog" data-act="toggle" data-id="${esc(it.id)}" title="Свернуть/развернуть">${isCol(it.id) ? '+' : '−'}</button>` : ''}
       ${isProj ? '' : timerBtn}<span class="d-imp i${it.imp || 0}" data-act="imp"  data-id="${eid}" title="Метка важности: клик меняет">${IMP[it.imp || 0]}</span>
      <div class="d-title ${isProj ? 'proj' : 'tlink'}${c.hasRed(it.id) ? ' redkid' : ''}"${isProj ? '' : ` data-act="details" data-id="${esc(it.id)}" title="Записи времени и расходов"`}>${esc(it.title)}${(!isProj && it.thingId && c.thById[it.thingId]) ? ' <span class="d-lnk">(вещица)</span>' : ''}</div>
      <div class="d-sts"><span class="nw fact" title="Факт: время · деньги"><b data-live="time" data-id="${eid}">${fmtDur(t.sec)}</b> · <b>${fmtMoney(t.money)}</b></span><span class="nw plan" title="План: время · деньги">${fmtMin(t.planMin)} · ${fmtPlanMoney(t.planMoney)}</span></div>
      ${isProj ? '' : menuBtn('d-more d-more-t')}
    </div>
    ${it.note ? `<div class="d-note">${esc(it.note)}</div>` : ''}
    ${isProj ? `<div class="d-btns">${timer}<button class="d-sm" data-act="details" data-id="${eid}" title="Записи времени и расходы">≡</button><button class="d-sm" data-act="addp" data-id="${eid}">+проект</button><button class="d-sm" data-act="addt" data-id="${eid}">+задача</button>${menuBtn('d-more')}</div>` : (timer ? `<div class="d-btns">${timer}</div>` : '')}
    ${actLine}
    ${kids.length && !isCol(it.id) ? `<div class="d-kids">${flat(kids, c).map(k => cardHtml(k, c, sp)).join('')}</div>` : ''}
  </div>`;
    }
    function sphereTotals(c, spId) {
      const t = { sec: 0, money: 0, planMin: 0, planMoney: 0 };
      const list = (c.roots[spId] || []).slice();
      S.groups.filter(g => g.sphereId === spId).forEach(g => list.push(...(c.groupRoots[g.id] || [])));
      list.forEach(r => { const x = c.calc(r.id); t.sec += x.sec; t.money += x.money; t.planMin += x.planMin; t.planMoney += x.planMoney; });
      return t;
    }
    function groupHtml(g, c, sp) {
      const list = c.groupRoots[g.id] || [];
      let sec = 0, money = 0; list.forEach(r => { const x = c.calc(r.id); sec += x.sec; money += x.money; });
      const gid = esc(g.id);
      return `<div class="d-grp" data-grp="${gid}"><div class="d-grph" draggable="true" data-dk="group" data-did="${gid}">
      <button class="d-tog" data-act="gr-toggle" data-id="${gid}" title="Свернуть/развернуть">${isCol(g.id) ? '+' : '−'}</button><span class="d-gname">${esc(g.name)}</span>
      <button class="d-sm" data-act="addroot" data-id="${esc(sp.id)}" data-gid="${gid}" data-type="project">+проект</button><button class="d-sm" data-act="addroot" data-id="${esc(sp.id)}" data-gid="${gid}" data-type="task">+задача</button>
      <button class="d-sm d-more" data-act="menu" data-kind="group" data-id="${gid}" title="Переименовать, удалить">···</button></div>
    ${isCol(g.id) ? `<div class="d-gsum" style="margin:0 0 6px 14px">${fmtDur(sec)} · ${fmtMoney(money)} · дел: ${list.length}</div>` : flat(list, c).map(r => cardHtml(r, c, sp)).join('')}</div>`;
    }
    function colHtml(sp, c) {
      const t = sphereTotals(c, sp.id), tc = textOn(sp.color);
      const withKids = S.items.filter(i => i.sphereId === sp.id && (c.kids[i.id] || []).length);
      const grs = S.groups.filter(g => g.sphereId === sp.id);
      const foldable = withKids.length || grs.length, anyOpen = withKids.some(i => !isCol(i.id)) || grs.some(g => !isCol(g.id));
      return `<section class="d-col" data-col="${esc(sp.id)}">
    <header class="d-colh" style="background:${sp.color};color:${tc}" draggable="true" data-dk="sphere" data-did="${esc(sp.id)}">

        <button class="d-ib" data-act="menu" data-kind="sphere" data-id="${esc(sp.id)}" title="Изменить, удалить">···</button></div>
      <div class="d-cols"><span data-live="stime" data-sid="${esc(sp.id)}">${fmtDur(t.sec)}</span> / ${fmtMin(t.planMin)} · ${fmtMoney(t.money)} / ${fmtPlanMoney(t.planMoney)}</div>
    </header>
    <div class="d-colb">${grs.map(g => groupHtml(g, c, sp)).join('')}${flat(c.roots[sp.id], c).map(r => cardHtml(r, c, sp)).join('')}
      <div class="d-addrow"><button data-act="gr-add" data-id="${esc(sp.id)}">+группа</button><button data-act="addroot" data-id="${esc(sp.id)}" data-type="project">+проект</button><button data-act="addroot" data-id="${esc(sp.id)}" data-type="task">+задача</button></div></div></section>`;
    }
    function entryRows(it) {
      const kn = { time: 'Таймер', corr: 'Поправка', money: 'Расход' };
      const rows = it.entries.slice().sort((a, b) => b.ts - a.ts).map(e => {
        const v = e.kind === 'money' ? `<span class="${e.amount < 0 ? 'd-neg' : ''}">${fmtMoney(e.amount)} тг</span>`
          : e.kind === 'corr' ? `<span class="${e.sec < 0 ? 'd-neg' : 'd-pos'}">${En.entryText(e)}</span>` : fmtDur(e.sec);
        const ids = `data-id="${esc(it.id)}" data-eid="${esc(e.id)}"`;
        return `<tr><td>${e.n}</td><td>${kn[e.kind]}</td><td style="white-space:nowrap"><span class="d-dtl" data-act="ent-dt" ${ids} title="Изменить дату и время">${fmtDT(e.ts)}</span></td><td><b>${v}</b></td><td>${esc(e.comment)}</td>
          <td style="white-space:nowrap"><button class="d-sm" data-act="ent-edit" ${ids}>изм.</button> <button class="d-sm" data-act="ent-del" ${ids}>×</button></td></tr>`;
      });
      return `<table class="d-et"><thead><tr><th>№</th><th>Тип</th><th>Дата и время</th><th>Значение</th><th>Комментарий</th><th></th></tr></thead><tbody>${rows.join('') || '<tr><td colspan="6" class="d-muted">Записей пока нет</td></tr>'}</tbody></table>`;
    }
    function detailsHtml(it, c) {
      const t = c.calc(it.id), own = c.own(it), st = c.status(it);
      const path = []; let cur = it, g = 0; while (cur && g++ < 50) { path.unshift(cur.title); cur = cur.parentId ? c.idx[cur.parentId] : null; }
      let top = it, k = 0; while (top.parentId && c.idx[top.parentId] && k++ < 50) top = c.idx[top.parentId];
      const sp = S.spheres.find(s => s.id === it.sphereId), gr = top.groupId ? S.groups.find(x => x.id === top.groupId) : null;
      const where = [sp ? sp.name : '?', ...(gr ? [gr.name] : []), ...path].map(esc).join(' / ');
      const dep = [];
      if (it.dependsOn && c.idx[it.dependsOn]) dep.push(`зависит от дела «${esc(c.idx[it.dependsOn].title)}»${c.idx[it.dependsOn].done ? ' (готово)' : ''}`);
      if (it.dependsThing && c.thById[it.dependsThing]) dep.push(`зависит от вещицы «${esc(c.thById[it.dependsThing].name)}» (${c.thById[it.dependsThing].have ? 'уже есть' : 'нужно купить'})`);
      if (it.thingId && c.thById[it.thingId]) dep.push(`связана с вещицей «${esc(c.thById[it.thingId].name)}»`);
      const stTxt = { done: 'выполнено', blocked: 'ждёт', gray: 'давно без работы', red: 'мало работы', normal: '' }[st.k] || '';
      return `<div class="d-back" data-act="close"><div class="d-modal" role="dialog" aria-modal="true" data-modal>
    <div class="d-mh"><b${it.type === 'task' ? ` data-linkpick="${esc(it.id)}" title="Двойной клик: связать с вещицей"` : ''}>${esc(it.title)}${(it.type === 'task' && it.thingId && c.thById[it.thingId]) ? ' <span class="d-lnk">(вещица)</span>' : ''}</b><button class="d-x" data-act="close" aria-label="Закрыть">✕</button></div>
    <div class="d-mb"><div class="d-muted" style="margin-bottom:8px">${where}</div>
      <div class="d-sum"><div><small>Время: факт / план</small><b>${fmtDur(t.sec)} / ${fmtMin(t.planMin)}</b></div><div><small>Деньги: факт / план</small><b>${fmtMoney(t.money)} / ${fmtPlanMoney(t.planMoney)} тг</b></div>
        ${it.type === 'project' ? `<div><small>Только по самому проекту</small><b>${fmtDur(own.sec)} · ${fmtMoney(own.money)}</b></div>` : ''}<div><small>Статус</small><b>${esc(stTxt) || '—'}</b></div></div>
      ${it.note ? `<div class="d-note" style="max-width:none;margin-bottom:8px">${esc(it.note)}</div>` : ''}
      ${dep.length ? `<div class="d-muted" style="margin-bottom:8px">${dep.join('<br>')}</div>` : ''}
      <div class="d-dbtns"><button class="d-btn ${it.timerStart ? 'danger' : 'primary'}" data-act="timer" data-id="${esc(it.id)}">${it.timerStart ? 'Стоп <span data-live="clock" data-id="' + esc(it.id) + '">' + fmtClock((c.now - it.timerStart) / 1000) + '</span>' : 'Запустить таймер'}</button>
              <button class="d-btn" data-act="det-exp" data-id="${esc(it.id)}">+ Расход</button><button class="d-btn" data-act="det-plus" data-id="${esc(it.id)}">+ Время</button><button class="d-btn" data-act="det-minus" data-id="${esc(it.id)}">− Время</button></div>
            ${entryRows(it)}</div></div></div>`;
    }

    function syncBadge() {
      const b = root.querySelector('.d-sync'); if (!b) return; const s = core.status();
      b.classList.toggle('warn', s.dead > 0);
      b.textContent = s.dead > 0 ? `не принято сервером: ${s.dead}` : (s.pending > 0 ? `ожидает отправки: ${s.pending}` : (s.online ? '' : 'нет связи'));
    }
    function render() {
      if (!alive) return;
      const head = `<div class="d-top"><h1>СФЕРЫ И ДЕЛА</h1><span class="d-muted">`
        + `<button class="d-flt ${ui.showProj ? '' : 'off'}" data-act="f-proj" title="Показать/скрыть проекты">проекты</button> · <button class="d-flt ${ui.showTask ? '' : 'off'}" data-act="f-task" title="Показать/скрыть задачи">задачи</button>`
        + (ui.showTask ? ` · <button class="d-flt ${ui.zeroOnly ? '' : 'off'}" data-act="f-zero" title="Только задачи без планируемой суммы">показывать только бесплатные</button> · <button class="d-flt ${ui.showDone ? '' : 'off'}" data-act="f-done" title="Показывать выполненные задачи">выполненные</button>` : '')
        + ` · <button class="d-flt i1 ${ui.imp[1] ? '' : 'off'}" data-act="f-imp" data-v="1">Важно</button> · <button class="d-flt i2 ${ui.imp[2] ? '' : 'off'}" data-act="f-imp" data-v="2">Особо</button> · <button class="d-flt i0 ${ui.imp[0] ? '' : 'off'}" data-act="f-imp" data-v="0">без метки</button>`
        + ` · <button class="d-flt" data-act="f-expand" title="Раскрыть все свёрнутые списки (проекты и группы)">раскрыть все списки</button>`
        + ` · <span class="d-fc fm" data-act="f-cur" title="Прогноз денег по всем сферам. Клик: тг / $"><b data-fc="money">—</b></span> · <span class="d-fc ft" title="Прогноз времени по всем сферам"><b data-fc="time">—</b></span></span>`
        + `<span class="d-grow"></span><span class="d-sync"></span>${state === 'ready' ? '<button class="d-btn" data-act="sp-add">+ Сфера</button>' : ''}<button class="d-btn" data-act="reload">Обновить</button></div>`
        + `<div class="d-note1">Здесь можно создавать и править дела, группы и сферы, переставлять их перетаскиванием, отмечать выполненными и удалять. Таймеры, записи времени и расходов, связь с вещицами пока только в старой системе (вкладка рядом). Пока старая система не заменена, вносите правки дел в одном месте, не в обоих.</div>`
