      if (age === null) h += '<div class="dt-stale">С этого устройства ещё ни разу не скачивалась копия базы. Скачайте её сейчас.</div>';
      else if (age >= STALE_DAYS) h += `<div class="dt-stale">Последняя выгрузка была ${age} дн. назад. Скачайте свежую.</div>`;
      h += `<div class="dt-card"><h2>Скачать всю базу</h2><div class="dt-mut">Один JSON-файл со всеми вашими данными (треки, дневник, моделирование, эмоции, таймеры, покупки, вещицы, сферы и дела, удалённое тоже). Пароли и ключи в него не попадают. Файл содержит ваши личные записи, храните его у себя.</div>` +
        `<div class="dt-row"><button class="dt-btn primary" data-act="export" ${busy ? 'disabled' : ''}>Скачать всю базу</button><span class="dt-mut">${last.at ? 'Последняя выгрузка: ' + esc(new Date(last.at).toLocaleString('ru-RU')) + ', строк ' + esc(last.rows) : ''}</span></div></div>`;
      h += `<div class="dt-card"><h2>Восстановить из файла</h2><div class="dt-mut">Сначала будет отчёт, ничего не записывается. Восстановление только дописывает: добавляет недостающие строки и заменяет версии, которые в файле новее, чем в базе. Более свежее в базе остаётся, ничего не удаляется.</div>` +
        `<div class="dt-row"><input type="file" accept=".json,application/json" data-f="file" ${busy ? 'disabled' : ''}></div>`;
      if (planObj) {
        h += `<table class="dt-tb"><tr><th>Таблица</th><th>в файле</th><th>добавится</th><th>обновится</th><th>совпало</th><th>в базе новее</th></tr>` +
          planObj.tables.map(t => `<tr><td>${esc(t.name)}</td><td>${t.total}</td><td>${t.added}</td><td>${t.upd}</td><td>${t.same}</td><td>${t.newer}</td></tr>`).join('') + '</table>';
        h += `<div class="dt-row">${esc(M.planText(planObj))}</div>`;
        if (foreign) h += `<label class="dt-row dt-warn"><input type="checkbox" data-f="foreign" ${okForeign ? 'checked' : ''}> Файл сделан под другим входом (${esc(file.user && file.user.email)}). Всё равно записать в мою базу.</label>`;
        h += `<div class="dt-row"><button class="dt-btn primary" data-act="restore" ${busy || !planObj.toWrite || (foreign && !okForeign) ? 'disabled' : ''}>${confirm ? 'Точно восстановить?' : 'Восстановить (' + planObj.toWrite + ' строк)'}</button><button class="dt-btn" data-act="cancel">Отмена</button></div>`;
      }
      h += '</div>';
      h += `<div class="dt-row ${msgBad ? 'dt-warn' : 'dt-ok'}" role="status" data-f="msg">${esc(busy || msg)}</div></div>`;
      root.innerHTML = h;
    }

    async function doExport() {
      busy = 'Читаю базу…'; msg = ''; render();
      try {
        const f = await S.exportAll(p => { busy = p; render(); });
        const rows = M.totalRows(f), blob = new Blob([JSON.stringify(f, null, 1)], { type: 'application/json' }), a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'lifeerp-backup-' + M.stamp(new Date()) + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        saveLast({ at: new Date().toISOString(), rows });
        busy = ''; msg = 'Готово: выгружено таблиц ' + Object.keys(f.tables).length + ', строк ' + rows + '. Файл скачан.'; msgBad = false;
      } catch (e) { busy = ''; msg = e.net ? 'Нет связи с базой, выгрузка не выполнена.' : 'Не удалось: ' + (e.message || e); msgBad = true; }
      render();
    }
    async function loadFile(txt) {
      planObj = null; file = null; confirm = false; msg = ''; const r = M.parseFile(txt);
      if (!r.ok) { msg = r.error; msgBad = true; render(); return; }
      file = r.file; foreign = !!(file.user && file.user.id && core.viewUser() && file.user.id !== core.viewUser()); okForeign = false;
      busy = 'Сверяю с базой…'; render();
      try { planObj = await S.plan(file, p => { busy = p; render(); }); busy = ''; msg = planObj.toWrite ? '' : 'В базе уже всё есть, восстанавливать нечего.'; msgBad = false; }
      catch (e) { busy = ''; planObj = null; msg = e.net ? 'Нет связи с базой, сверка не выполнена.' : 'Не удалось сверить: ' + (e.message || e); msgBad = true; }
      render();
    }
    async function doRestore() {
      busy = 'Записываю…'; render();
      try {
        const r = await S.restore(file, planObj, p => { busy = p; render(); });
        busy = ''; msgBad = r.dead > 0 || r.pending > 0;
        msg = 'Отправлено строк ' + r.sent + (r.dead ? '; не принято сервером: ' + r.dead + ' (смотрите «Обновить» и список не принятого)' : '') + (r.pending ? '; ещё в очереди: ' + r.pending + ' (дождитесь связи)' : '') + (msgBad ? '' : '. Перезагрузите страницу, чтобы все вкладки перечитали базу.');
        planObj = null; file = null; confirm = false;
      } catch (e) { busy = ''; msg = 'Не удалось: ' + (e.message || e); msgBad = true; }
      render();
    }
    root.addEventListener('change', ev => {
      const i = ev.target, f = i.dataset && i.dataset.f;
      if (f === 'file') { const fl = i.files && i.files[0]; if (!fl) return; const r = new FileReader(); r.onload = () => loadFile(String(r.result || '')); r.readAsText(fl); }
      else if (f === 'foreign') { okForeign = i.checked; render(); }
    });
    root.addEventListener('click', ev => {
      const t = ev.target.closest('[data-act]'); if (!t || busy) return; const a = t.dataset.act;
      if (a === 'export') doExport();
      else if (a === 'cancel') { planObj = null; file = null; confirm = false; msg = ''; render(); }
      else if (a === 'restore') { if (!confirm) { confirm = true; render(); return; } confirm = false; doRestore(); }
    });
    render();
    return { reload() { render(); }, unmount() { alive = false; el.innerHTML = ''; } };
  }
  global.LifeModules.data = { mount };
})(window);

<script>
/* ---- shell/lock.js ---- */
/* Замок экрана (компьютер): размывает всё окно и открывается по паролю. Включается значком замка в верхней строке или Ctrl+Alt+L.
   Пароль замка хранится в базе в виде соли и хэша (PBKDF2-SHA256, 200 000 кругов) в таблице app_settings (scope 'modules', key 'lock.pass'):
   один пароль на все устройства, без сети работает из копии на устройстве. Состояние «заблокировано» помнится на устройстве, обновление страницы замок не снимает.
   Это защита от чужого взгляда, не от человека с инструментами разработчика. Доступ: LifeLock.install({core, signOut}) → {lock, setup, refresh, has}. */
(function (global) {
  'use strict';
  const ID = 'modules.lock.pass', CFG_KEY = 'lifeerp-lock-cfg', ON_KEY = 'lifeerp-lock-on', ITER = 200000, IDLES = [0, 1, 5, 10, 15, 30, 60];

  const b64 = u8 => btoa(String.fromCharCode(...u8)), unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const CSS = `
.lk-ov{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--ui-bg,#f4f1ea) 38%,transparent);-webkit-backdrop-filter:blur(26px) saturate(.85);backdrop-filter:blur(26px) saturate(.85);color:var(--ui-text,#222);font-family:inherit}
.lk-box{width:100%;max-width:340px;background:var(--ui-card,#fff);border:1px solid var(--ui-line,#ddd);border-radius:16px;padding:22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px;text-align:center}
.lk-box svg{width:34px;height:34px;margin:0 auto;color:var(--ui-main,#2a7)}.lk-box h2{margin:0;font-size:17px;font-weight:650}.lk-box p{margin:0;font-size:12.5px;color:var(--ui-mut,#777)}
.lk-box input,.lk-box select{font:inherit;font-size:15px;border:1px solid var(--ui-line,#ccc);border-radius:10px;padding:9px 11px;background:var(--ui-card,#fff);color:inherit;width:100%;box-sizing:border-box}
.lk-box label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ui-mut,#777);text-align:left}
.lk-row{display:flex;gap:8px}.lk-row>*{flex:1}.lk-err{min-height:16px;font-size:12.5px;color:var(--ui-bad,#c33)}
.lk-box .lk-link{background:none;border:0;color:var(--ui-mut,#777);font-size:12px;cursor:pointer;text-decoration:underline;padding:2px}
.lk-box .primary{background:var(--ui-main,#2a7);border-color:var(--ui-main,#2a7);color:var(--ui-on-main,#fff)}
.lk-ov.lk-modal{background:rgba(0,0,0,.35)}`;
  const LOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

  async function derive(pw, salt, iter) {
    if (!(global.crypto && global.crypto.subtle)) throw new Error('Нужно защищённое соединение (https): без него браузер не даёт проверить пароль.');

  async function check(cfg, pw) {
    const h = await derive(pw, unb64(cfg.salt), cfg.iter || ITER), g = unb64(cfg.hash); let d = h.length ^ g.length;
    for (let i = 0; i < h.length; i++) d |= h[i] ^ (g[i] || 0); return d === 0;
  }

  function install(env) {
    const core = env.core, store = core.store;

    let cfg = store.get(CFG_KEY, null), ov = null, locked = false, last = Date.now(), fails = 0, waitUntil = 0, idleTimer = null;
    const saveCfg = c => { cfg = c; store.set(CFG_KEY, c); startIdle(); };

    async function refresh() { /* пароль из базы (общий для устройств); сеть недоступна: остаётся копия на устройстве */
      try {

        if (rows[0] && rows[0].value && rows[0].value.hash) saveCfg(rows[0].value); else if (!rows.length && cfg && !core.status().pending) saveCfg(null);

      core.commit({ owner: core.me(), writes: [{ table: 'app_settings', rows: [row] }], journal: [{ op: 'change', module: 'settings', entity_kind: 'setting', entity_id: ID, summary: what }] });
    }
    const others = () => [...document.body.children].filter(e => e !== ov && !e.classList.contains('lk-ov'));
    function dialog(html, cls) { const d = document.createElement('div'); d.className = 'lk-ov ' + (cls || ''); d.innerHTML = '<div class="lk-box" role="dialog" aria-modal="true">' + html + '</div>'; document.body.appendChild(d); return d; }

    function show() {
      if (ov) return; locked = true; store.set(ON_KEY, true);
      ov = dialog(`${LOCK_SVG}<h2>Экран заблокирован</h2><input type="password" class="lk-pw" placeholder="Пароль" autocomplete="current-password" aria-label="Пароль замка"><div class="lk-err" role="alert"></div><button type="button" class="ui-btn primary lk-go">Открыть</button><button type="button" class="lk-link lk-forgot">Забыли пароль?</button>`);
      others().forEach(e => { e.inert = true; e.setAttribute('aria-hidden', 'true'); });
      const pw = ov.querySelector('.lk-pw'), err = ov.querySelector('.lk-err');
      async function go() {
        const left = waitUntil - Date.now(); if (left > 0) { err.textContent = 'Подождите ' + Math.ceil(left / 1000) + ' с'; return; }
        if (!pw.value) return; err.textContent = '';
        let okk = false; try { okk = await check(cfg, pw.value); } catch (e) { err.textContent = e.message; return; }
        if (okk) { fails = 0; unlock(); return; }
        fails++; pw.value = ''; if (fails >= 3) waitUntil = Date.now() + Math.min(30, Math.pow(2, fails - 2)) * 1000; err.textContent = 'Неверный пароль'; pw.focus();
      }
      ov.querySelector('.lk-go').addEventListener('click', go); pw.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      ov.querySelector('.lk-forgot').addEventListener('click', () => {
        if (!confirm('Выйти из аккаунта? Замок снимется, а войти придётся паролем от аккаунта.')) return;
        unlock(); write(null, 'Замок экрана снят при выходе'); store.set(CFG_KEY, null); cfg = null; if (env.signOut) env.signOut();
      });
      setTimeout(() => pw.focus(), 30);
    }
    function unlock() { if (!ov) return; ov.remove(); ov = null; locked = false; store.set(ON_KEY, false); others().forEach(e => { e.inert = false; e.removeAttribute('aria-hidden'); }); last = Date.now(); }

    /* окно «задать / сменить пароль, автоблокировка» */
    function setup(after) {
      if (ov) return;
      const idleOpts = cur => IDLES.map(m => `<option value="${m}" ${m === cur ? 'selected' : ''}>${m ? 'через ' + m + ' мин без действий' : 'не блокировать само'}</option>`).join('');
      const d = dialog(`${LOCK_SVG}<h2>${has() ? 'Замок экрана' : 'Пароль замка'}</h2><p>Пароль хранится в базе в виде хэша и одинаков на всех устройствах. Быстрая клавиша: Ctrl+Alt+L.</p>`
        + (has() ? '<label>Текущий пароль<input type="password" class="lk-old" autocomplete="current-password"></label>' : '')
        + `<label>${has() ? 'Новый пароль (пусто: оставить прежний)' : 'Пароль'}<input type="password" class="lk-n1" autocomplete="new-password"></label><label>Повторите пароль<input type="password" class="lk-n2" autocomplete="new-password"></label>`
        + `<label>Автоблокировка<select class="lk-idle">${idleOpts(has() ? cfg.idle || 0 : 0)}</select></label><div class="lk-err" role="alert"></div><div class="lk-row"><button type="button" class="ui-btn lk-cancel">Отмена</button><button type="button" class="ui-btn primary lk-save">Сохранить</button></div>`
        + (has() ? '<button type="button" class="lk-link lk-del">Убрать замок совсем</button>' : ''), 'lk-modal');
      const q = s => d.querySelector(s), err = q('.lk-err'); let busy = false;
      const close = () => d.remove(); q('.lk-cancel').addEventListener('click', close);
      d.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
      async function verifyOld() { if (!has()) return true; const v = q('.lk-old').value; if (!v) { err.textContent = 'Введите текущий пароль'; return false; } if (!(await check(cfg, v))) { err.textContent = 'Текущий пароль неверный'; return false; } return true; }
      q('.lk-save').addEventListener('click', async () => {
        if (busy) return; busy = true; err.textContent = '';
        try {
          if (!(await verifyOld())) return;
          const n1 = q('.lk-n1').value, n2 = q('.lk-n2').value, idle = +q('.lk-idle').value;
          if (n1 || !has()) {
            if (n1.length < 4) { err.textContent = 'Пароль не короче 4 знаков'; return; } if (n1 !== n2) { err.textContent = 'Пароли не совпадают'; return; }
            const c = await make(n1, idle); saveCfg(c); write(c, 'Пароль замка экрана задан или изменён');
          } else { const c = Object.assign({}, cfg, { idle }); saveCfg(c); write(c, 'Автоблокировка замка: ' + (idle ? idle + ' мин' : 'выкл')); }
          close(); if (after) after();
        } catch (e) { err.textContent = e.message || String(e); } finally { busy = false; }
      });
      if (has()) q('.lk-del').addEventListener('click', async () => {
        err.textContent = ''; try { if (!(await verifyOld())) return; } catch (e) { err.textContent = e.message; return; }
        write(null, 'Замок экрана убран'); saveCfg(null); close();
      });
      setTimeout(() => q(has() ? '.lk-old' : '.lk-n1').focus(), 30);
    }
    /* значок замка и Ctrl+Alt+L: пароля ещё нет, значит сначала зададим его */
    function lock() { if (locked) return; if (!has()) { setup(show); return; } show(); }
    document.addEventListener('keydown', e => { if (e.ctrlKey && e.altKey && !e.shiftKey && (e.code === 'KeyL' || e.key === 'l' || e.key === 'L')) { e.preventDefault(); lock(); } }, true);
    ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { last = Date.now(); }, true));
    function startIdle() {
      clearInterval(idleTimer); if (!has() || !(cfg.idle > 0)) return;
      idleTimer = setInterval(() => { if (!locked && Date.now() - last >= cfg.idle * 60000 && !document.querySelector('.lk-ov')) show(); }, 5000);
    }
    startIdle();
    /* если страницу обновили на заблокированном экране, замок возвращается сразу, без ожидания сети */
    if (store.get(ON_KEY, false) && has()) show();
    return { lock, setup: () => setup(), refresh, has, isLocked: () => locked };
  }
  global.LifeLock = { install, _check: check, _make: make };
})(window);

</script>
<script>

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function start(el) {

        <button type="button" data-tab="settings">Настройки: профиль, оформление, модули</button><button type="button" data-tab="data">Данные: выгрузка и восстановление</button><button type="button" data-tab="legacy">Старая система (состояние, дневник)</button><button type="button" data-lockset>Замок экрана: пароль и автоблокировка</button><hr><button type="button" class="sh-out">Выйти</button></div></aside>

        <button type="button" class="ui-btn sh-pgb" data-pagestyle aria-pressed="false" title="Оформление этой страницы: цвета, шрифт, масштаб" aria-label="Оформление этой страницы" hidden>${PALETTE_SVG}</button><button type="button" class="ui-btn sh-lock" data-lock title="Заблокировать экран (Ctrl+Alt+L)" aria-label="Заблокировать экран">${ICON.lock}</button><button type="button" class="ui-btn sh-phone" data-phone aria-pressed="false" title="Телефонная версия: Таймеры, Покупки, Эмоции (правая колонка)" aria-label="Телефонная версия">${PHONE_SVG}</button></header>

    const $ = s => el.querySelector(s), top = $('.sh-top'), rail = $('.sh-rail'), menu = $('.sh-menu'), main = $('.sh-main'), banner = $('.sh-banner'), sel = $('.sh-view select'), dock = $('.sh-dock');

    /* Настройки пользователя: таблицы app_settings / app_presets. Тема применяется сразу из копии на устройстве, потом уточняется по базе. */

    const myName = () => { const r = profiles.find(p => p.user_id === core.me()); return String((r && r.display_name) || ST.get('profile.name') || core.store.get(nameKey(), '') || core.email() || '').trim(); };
    function paintLogo() {
      const l = $('.sh-logo'), img = ST.get('profile.avatar') || core.store.get(imgKey(), ''), nm = myName();
      const ch = esc((nm.charAt(0) || '?').toUpperCase());
      l.innerHTML = img ? '<img alt="">' + (ST.get('profile.showLetter') ? '<span class="ltr">' + ch + '</span>' : '') : ch; if (img) l.firstChild.src = img;
      l.title = nm ? 'Профиль и настройки: ' + nm : 'Профиль и настройки';
    }
    async function saveName(name) {
      if (name !== ((profiles.find(p => p.user_id === core.me()) || {}).display_name || '')) {

    }

    const PS = global.LifePageStyle.create({ store: ST, host: el, openGlobal: () => go('settings') });
    top.addEventListener('click', e => { if (e.target.closest('[data-pagestyle]')) { const m = pageMod(); if (m) { PS.toggle(m, mod); syncPg(); } } });

    ST.subscribe(() => { if (ST.state === 'ready' || ST.state === 'loading') { if (core.session()) { applyTheme(); paintLogo(); if (!isShown(tab)) { tab = SM.startModule(ST.all()); show(); } else renderTabs(); } } });

    const modules = [
      { id: 'overview', title: 'Обзор', rail: 'Обзор', icon: 'home', mount: (box, ctx) => global.LifeModules.overview.mount(box, ctx) },
      { id: 'spheres', title: 'Сферы и дела', rail: 'Сферы', icon: 'grid', mount: (box, ctx) => global.LifeModules.spheres.mount(box, ctx) },
      { id: 'things', title: 'Вещицы', rail: 'Вещи', icon: 'box', mount: (box, ctx) => global.LifeModules.things.mount(box, ctx) },
      { id: 'tracks', title: 'Треки', rail: 'Треки', icon: 'bars', mount: (box, ctx) => global.LifeModules.tracks.mount(box, ctx) },
      { id: 'plan', title: 'Деньги', rail: 'Деньги', icon: 'coin', mount: (box, ctx) => global.LifeModules.money.mount(box, ctx) },
      { id: 'time', title: 'Время', rail: 'Время', icon: 'clock', mount: (box, ctx) => global.LifeModules.treport.mount(box, ctx) },
      { id: 'diary', title: 'Дневник', rail: 'Дневник', icon: 'book', mount: (box, ctx) => global.LifeModules.diary.mount(box, ctx) },
      { id: 'state', title: 'Состояние', rail: 'Состояние', icon: 'heart', mount: (box, ctx) => global.LifeModules.state.mount(box, ctx) },
      { id: 'settings', title: 'Настройки', menu: true, mount: (box, ctx) => global.LifeModules.settings.mount(box, ctx) },
      { id: 'data', title: 'Данные', menu: true, mount: (box, ctx) => global.LifeModules.data.mount(box, ctx) },
      { id: 'legacy', title: 'Старая система: состояние, дневник', menu: true, own: true, mount(box) {
        const f = document.createElement('iframe'); f.src = 'life-system.html'; f.title = 'Старая система'; box.appendChild(f);
        return { unmount() { f.remove(); } };

    ];
    let mod = null, profiles = [], loadedFor = null;
    /* Какие вкладки видны и в каком порядке — по настройкам пользователя */

    const isShown = id => { const m = modules.find(x => x.id === id); return !!m && (m.menu || railMods().some(x => x.id === id)); };
    let tab = core.store.get(TAB_KEY, '') || ''; if (!modules.some(m => m.id === tab)) tab = 'overview';

    /* Правый док «Телефон»: та же страница pocket.html в узкой колонке (?embed=1). Она берёт у оболочки общий core:

    function show() {

      if (loadedFor !== core.me()) { loadedFor = core.me(); if (global.LifeLockRefresh) global.LifeLockRefresh(); moved = false; dockApplied = false; ST.fromCache(); applyTheme(); const kept = core.store.get(TAB_KEY, ''); if (kept && isShown(kept)) { tab = kept; moved = true; } else tab = SM.startModule(ST.all()); loadSettings(); }
      top.hidden = false; rail.hidden = false; paintLogo(); $('.sh-who').textContent = core.email();

    }
    function renderTabs() {
      $('.sh-tabs').innerHTML = railMods().map(m => `<button type="button" class="sh-tab ${m.id === tab ? 'on' : ''}" data-tab="${esc(m.id)}">${ICON[m.icon]}<span>${esc(m.rail)}</span></button>`).join('');
      const ph = $('[data-phone]'); ph.classList.toggle('on', dockOn); ph.setAttribute('aria-pressed', String(dockOn));

      top.querySelector('small').textContent = new Intl.DateTimeFormat('ru-RU', { timeZone: core.TZ, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date());
    }
    function setPhone(on) { if (on === undefined) return dockOn; if (!!on === dockOn) return dockOn; dockOn = !!on; core.store.set(DOCK_KEY, dockOn); renderTabs(); applyDock(); return dockOn; }
    function go(id) { if (!modules.some(m => m.id === id) || id === tab) return; moved = true; tab = id; core.store.set(TAB_KEY, tab); closeMenu(); show(); }
    function closeMenu() { menu.hidden = true; $('[data-settings]').setAttribute('aria-expanded', 'false'); }

    $('.sh-tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });

    /* Переключатель «чьи данные»: виден только мастеру, когда в системе больше одного пользователя. */
    async function loadProfiles() {
      try {
        const r = await core.request('/rest/v1/profiles?select=user_id,display_name,role&order=created_at');
        profiles = Array.isArray(r.data) ? r.data : [];
      } catch (e) { profiles = []; }
      paintLogo();
      const meRow = profiles.find(p => p.user_id === core.me());
      const can = !!meRow && meRow.role === 'master' && profiles.length > 1;
      $('.sh-view').hidden = !can;
      if (!can) { if (core.viewUser() !== core.me()) core.setViewUser(null); return; }
      sel.innerHTML = profiles.map(p => `<option value="${esc(p.user_id)}" ${p.user_id === core.viewUser() ? 'selected' : ''}>${p.user_id === core.me() ? 'Я' : esc(p.display_name || p.user_id)}</option>`).join('');
      updateBanner();
    }
    sel.addEventListener('change', () => {
      const n = core.status().pending;
      if (n && !confirm('Есть неотправленные изменения: ' + n + '. Они уйдут тому, чьи данные были выбраны, когда вы их вносили. Переключить?')) { sel.value = core.viewUser(); return; }
      core.setViewUser(sel.value === core.me() ? null : sel.value);
    });
    core.on('view', () => { if (core.session()) { show(); applyDock(true); } });

    /* Индикатор очереди записи для любой вкладки. */
    function syncBadge() {
      const s = core.status(), b = $('.sh-sync');
      b.classList.toggle('warn', s.dead > 0);
      b.textContent = s.dead > 0 ? `не принято сервером: ${s.dead}` : (s.pending > 0 ? `ожидает отправки: ${s.pending}${s.online ? '' : ' (нет сети)'}` : (s.online ? '' : 'нет сети'));
    }
    ['queue', 'dead', 'net'].forEach(n => core.on(n, syncBadge)); syncBadge();

    $('.sh-out').addEventListener('click', async () => {
      const n = core.status().pending;
      if (n && !confirm('Есть неотправленные изменения: ' + n + '. Они останутся в браузере и уйдут при следующем входе. Выйти?')) return;
      await core.signOut(); core.store.set(TAB_KEY, ''); loadedFor = null; show();
    });
    core.on('auth', ok => { if (!ok) show(); });
    const LK = global.LifeLock.install({ core, signOut: async () => { await core.signOut(); core.store.set(TAB_KEY, ''); loadedFor = null; show(); } });
    global.LifeLockRefresh = () => LK.refresh();
    top.addEventListener('click', e => { if (e.target.closest('[data-lock]')) LK.lock(); });
    menu.addEventListener('click', e => { if (e.target.closest('[data-lockset]')) { closeMenu(); LK.setup(); } });
    show();
    global.LifeShell.core = core; global.LifeShell.refresh = show;
    return { show, core };
  }

  global.LifeShell = { start };
})(window);


</script>
<script>LifeShell.start(document.getElementById('app'));</script>
</body>
