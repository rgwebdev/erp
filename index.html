<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Голосование</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --night:#1c0f2e; --plum:#2d1650; --line:rgba(246,211,138,.22);
  --gold:#f6d38a; --coral:#ff6a5c; --ivory:#fff8ec; --mute:#b9a9d6; --ok:#7fe3b1;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ivory);font:400 16px/1.5 var(--body);
  background:radial-gradient(900px 600px at 80% -10%,var(--plum),transparent 70%),var(--night);background-attachment:fixed;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 64px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:28px} h2{font-size:19px}
p{margin:0}
.mute{color:var(--mute)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hide{display:none!important}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}
.top .who{font-weight:600}
.link{background:none;border:0;color:var(--gold);padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* auth */
.auth{padding-top:8vh}
.auth h1{margin-bottom:10px}
.auth .lead{color:var(--mute);margin-bottom:28px}
.tabs{display:flex;gap:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 0;color:var(--mute);font-weight:700;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--gold);border-color:var(--gold)}
label{display:block;font-weight:600;margin:16px 0 6px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:17px}
input::placeholder{color:#7d6fa0}
.hint{font-size:14px;color:var(--mute);margin-top:6px}
.btn{display:block;width:100%;margin-top:24px;padding:15px;border:0;border-radius:10px;background:var(--gold);color:#2a1500;font-weight:700;font-size:17px;cursor:pointer}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ivory);margin-top:10px}
.err{margin-top:16px;color:var(--coral);font-weight:600;min-height:1.5em}

/* poll */
.poll-head{margin-bottom:34px}
.poll-head p{margin-top:8px}
.status{display:inline-block;margin-bottom:10px;color:var(--gold);font-weight:700}
.nom{margin-bottom:44px}
.nom>h2{margin-bottom:4px}
.nom>.mute{margin-bottom:16px}
.cands{display:flex;flex-direction:column;gap:12px}
.cand{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:12px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.04)}
.num{font-family:var(--display);font-weight:700;font-size:30px;color:var(--gold);text-align:center}
.cand-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.cand-name{font-weight:700;font-size:18px;overflow-wrap:anywhere}
.cand-costume{color:var(--mute);overflow-wrap:anywhere}
.cand img{grid-column:1/-1;width:100%;max-height:320px;object-fit:cover;border-radius:10px;order:-1}
.vote{margin-top:10px;align-self:flex-start;padding:10px 18px;border-radius:999px;border:1px solid var(--gold);background:none;color:var(--gold);font-weight:700;cursor:pointer}
.vote:active{background:var(--gold);color:#2a1500}
.note{padding:14px 16px;border-radius:12px;border:1px dashed var(--line);color:var(--mute)}
.note.ok{border-style:solid;border-color:rgba(127,227,177,.4);color:var(--ok);font-weight:600}

/* results */
.res{position:relative;display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:10px;margin-bottom:8px;overflow:hidden;border:1px solid var(--line)}
.res i{position:absolute;inset:0 auto 0 0;background:rgba(246,211,138,.16);z-index:0}
.res span,.res b{position:relative;z-index:1}
.res.win{border-color:var(--gold)}
.res.win i{background:rgba(246,211,138,.38)}

/* modal */
.modal{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,4,20,.7);z-index:10;padding:16px}
.sheet{width:100%;max-width:520px;background:var(--plum);border:1px solid var(--line);border-radius:18px;padding:22px}
.sheet p{margin:10px 0 4px}
@media (min-width:600px){.modal{align-items:center}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:0}}}
</style>
</head>
<body>
<div class="wrap">

  <!-- ВХОД / РЕГИСТРАЦИЯ -->
  <section id="auth" class="auth hide">
    <h1>Выбираем лучшие костюмы</h1>
    <p class="lead">Войдите по номеру телефона и отдайте свой голос.</p>
    <div class="tabs" role="tablist">
      <button id="tab-login" role="tab" aria-selected="true">Вход</button>
      <button id="tab-reg" role="tab" aria-selected="false">Регистрация</button>
    </div>
    <form id="form" novalidate>
      <div id="name-row" class="hide">
        <label for="name">Как вас зовут</label>
        <input id="name" autocomplete="name" placeholder="Имя и фамилия" maxlength="80">
      </div>
      <label for="phone">Номер телефона</label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 701 123 45 67">
      <label for="pin" id="pin-label">Пароль</label>
      <input id="pin" type="password" autocomplete="current-password" placeholder="Ваш пароль">
      <p class="hint hide" id="pin-hint">Придумайте 6 цифр. Они понадобятся, чтобы войти снова.</p>
      <button class="btn" id="submit" type="submit">Войти</button>
      <p class="err" id="auth-err" role="alert"></p>
    </form>
  </section>

  <!-- ПРИЛОЖЕНИЕ -->
  <section id="app" class="hide">
    <div class="top">
      <span class="who" id="who"></span>
      <button class="link" id="logout">Выйти</button>
    </div>
    <div id="view"></div>
  </section>
</div>

<div class="modal hide" id="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <h2 id="m-title"></h2>
    <p id="m-text"></p>
    <p class="err" id="m-err" role="alert"></p>
    <button class="btn" id="m-ok">Отдать голос</button>
    <button class="btn ghost" id="m-cancel">Отмена</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== НАСТРОЙКИ: вставьте данные вашего проекта Supabase (Project Settings -> API) =====
const SUPABASE_URL = 'https://XXXXXXXX.supabase.co';
const SUPABASE_ANON_KEY = 'ВСТАВЬТЕ_PUBLIC_ANON_KEY';
// =========================================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const state = { uid:null, profile:null, polls:[], poll:null, noms:[], cands:[], voted:new Set(), results:{} };
let mode = 'login', channel = null, timer = null;

const ERR = {
  already_voted:'Вы уже проголосовали в этой номинации.',
  voting_closed:'Голосование сейчас закрыто.',
  self_vote_forbidden:'За себя голосовать нельзя.',
  not_allowed:'Вас нет в списке участников голосования.',
  candidate_not_found:'Участник не найден. Обновите страницу.',
  not_authenticated:'Сессия закончилась. Войдите снова.'
};
const errText = e => { const m = (e && e.message) || ''; for (const k in ERR) if (m.includes(k)) return ERR[k]; return 'Не получилось. Проверьте интернет и попробуйте ещё раз.'; };

function esc(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return h;}
function normPhone(raw){
  let d = String(raw).replace(/\D/g,'');
  if (/^8\d{10}$/.test(d)) d = '7' + d.slice(1);
  if (/^\d{10}$/.test(d)) d = '7' + d;
  return d;
}
const emailOf = d => `${d}@vote.local`;

/* ---------- вход / регистрация ---------- */
function setMode(m){
  mode = m;
  const reg = m === 'reg';
  $('#tab-login').setAttribute('aria-selected', !reg);
  $('#tab-reg').setAttribute('aria-selected', reg);
  $('#name-row').classList.toggle('hide', !reg);
  $('#pin-hint').classList.toggle('hide', !reg);
  $('#pin-label').textContent = reg ? 'PIN из 6 цифр' : 'Пароль';
  const pin = $('#pin');
  pin.placeholder = reg ? '••••••' : 'Ваш пароль';
  pin.autocomplete = reg ? 'new-password' : 'current-password';
  pin.inputMode = reg ? 'numeric' : 'text';
  pin.maxLength = reg ? 6 : 72;
  $('#submit').textContent = reg ? 'Зарегистрироваться' : 'Войти';
  $('#auth-err').textContent = '';
}
$('#tab-login').onclick = () => setMode('login');
$('#tab-reg').onclick = () => setMode('reg');

$('#form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = $('#auth-err'), btn = $('#submit');
  err.textContent = '';
  const phone = normPhone($('#phone').value), pin = $('#pin').value, name = $('#name').value.trim();
  if (!/^\d{11,15}$/.test(phone)) return err.textContent = 'Проверьте номер телефона.';
  if (mode === 'reg') {
    if (!name) return err.textContent = 'Напишите, как вас зовут.';
    if (!/^\d{6}$/.test(pin)) return err.textContent = 'PIN должен состоять из 6 цифр.';
  } else if (!pin) return err.textContent = 'Введите пароль.';

  btn.disabled = true;
  try {
    const email = emailOf(phone);
    const { data, error } = mode === 'reg'
      ? await sb.auth.signUp({ email, password: pin, options: { data: { display_name: name, phone } } })
      : await sb.auth.signInWithPassword({ email, password: pin });
    if (error) {
      const m = error.message || '';
      err.textContent = /already registered/i.test(m) ? 'Этот номер уже зарегистрирован. Перейдите на вкладку «Вход».'
        : /invalid login/i.test(m) ? 'Неверный номер или пароль.'
        : /rate|too many/i.test(m) ? 'Слишком много попыток. Подождите минуту.'
        : 'Не получилось войти: ' + (m || 'неизвестная ошибка');
    } else if (!data.session) {
      err.textContent = 'Регистрация прошла, но вход не выполнен. Попробуйте войти.';
    }
  } finally { btn.disabled = false; }
});

$('#logout').onclick = () => sb.auth.signOut();

/* ---------- данные ---------- */
sb.auth.onAuthStateChange((_ev, session) => {
  if (session?.user) { if (state.uid !== session.user.id) start(session.user.id); }
  else stop();
});

async function start(uid){
  state.uid = uid;
  $('#auth').classList.add('hide'); $('#app').classList.remove('hide');
  const { data: prof } = await sb.from('profiles').select('display_name,is_admin').eq('id', uid).maybeSingle();
  state.profile = prof;
  $('#who').textContent = prof ? prof.display_name + (prof.is_admin ? ' · админ' : '') : '';
  await loadPolls();
  channel = sb.channel('reveals')
    .on('postgres_changes', { event:'*', schema:'public', table:'nomination_reveals' }, () => refresh())
    .subscribe();
  timer = setInterval(() => { if (!document.hidden) refresh(); }, 20000);
}
function stop(){
  state.uid = null; state.poll = null;
  if (channel) { sb.removeChannel(channel); channel = null; }
  clearInterval(timer);
  $('#app').classList.add('hide'); $('#auth').classList.remove('hide');
}

async function loadPolls(){
  const { data, error } = await sb.from('polls').select('*').in('status',['open','closed','revealed']).order('created_at',{ascending:false});
  if (error) return $('#view').innerHTML = `<p class="note">${esc(errText(error))}</p>`;
  state.polls = data || [];
  if (state.polls.length === 1) return openPoll(state.polls[0].id);
  state.poll = null; render();
}

async function openPoll(id){
  const poll = state.polls.find(p => p.id === id) || state.poll;
  const [nm, cd, rc, rv] = await Promise.all([
    sb.from('nominations').select('*').eq('poll_id', id).order('sort_order').order('created_at'),
    sb.from('candidates').select('*').eq('poll_id', id).order('created_at'),
    sb.from('vote_receipts').select('nomination_id').eq('voter_id', state.uid),
    sb.from('nomination_reveals').select('nomination_id')
  ]);
  const { data: fresh } = await sb.from('polls').select('*').eq('id', id).maybeSingle();
  state.poll = fresh || poll;
  state.noms = nm.data || [];
  state.cands = (cd.data || []).map((c,i) => ({ ...c, number: i + 1 }));
  state.voted = new Set((rc.data || []).map(r => r.nomination_id));
  const shown = new Set((rv.data || []).map(r => r.nomination_id));
  state.results = {};
  await Promise.all(state.noms.filter(n => shown.has(n.id)).map(async n => {
    const { data } = await sb.rpc('get_results', { p_nomination: n.id });
    if (data) state.results[n.id] = data.map(r => ({ ...r, votes: Number(r.votes) }));
  }));
  render();
}
const refresh = () => state.poll ? openPoll(state.poll.id) : loadPolls();

/* ---------- отрисовка ---------- */
const STATUS = { open:'Голосование идёт', closed:'Голосование завершено', revealed:'Итоги объявлены' };

function render(){
  const v = $('#view');
  if (!state.poll) {
    v.innerHTML = state.polls.length
      ? `<h1>Голосования</h1><div class="cands" style="margin-top:20px">${state.polls.map(p =>
          `<button class="cand" style="text-align:left;cursor:pointer;grid-template-columns:1fr" data-poll="${p.id}">
             <span class="cand-body"><span class="cand-name">${esc(p.title)}</span><span class="cand-costume">${STATUS[p.status]}</span></span></button>`).join('')}</div>`
      : `<h1>Пока ничего нет</h1><p class="mute" style="margin-top:10px">Голосование ещё не открыто. Загляните позже.</p>`;
    return;
  }
  const p = state.poll;
  const order = [...state.cands].sort((a,b) => hash(state.uid + a.id) - hash(state.uid + b.id));
  v.innerHTML = `
    ${state.polls.length > 1 ? '<button class="link" data-back>← Все голосования</button>' : ''}
    <div class="poll-head">
      <span class="status">${STATUS[p.status] || ''}</span>
      <h1>${esc(p.title)}</h1>
      ${p.description ? `<p class="mute">${esc(p.description)}</p>` : ''}
    </div>
    ${state.noms.length ? state.noms.map(n => nomHTML(n, order)).join('') : '<p class="note">Номинации ещё не добавлены.</p>'}`;
}

function nomHTML(n, order){
  let body;
  const res = state.results[n.id];
  if (res) {
    const max = Math.max(1, ...res.map(r => r.votes));
    body = res.map((r,i) => `<div class="res ${i===0 && r.votes>0 ? 'win':''}"><i style="width:${r.votes/max*100}%"></i>
      <span>${esc(r.candidate_name)}</span><b>${r.votes}</b></div>`).join('');
  } else if (state.voted.has(n.id)) {
    body = '<p class="note ok">✓ Ваш голос принят</p>';
  } else if (state.poll.status === 'open') {
    body = `<div class="cands">${order.map(c => `
      <div class="cand">
        <div class="num">${c.number}</div>
        <div class="cand-body">
          <span class="cand-name">${esc(c.name)}</span>
          ${c.costume_title ? `<span class="cand-costume">${esc(c.costume_title)}</span>` : ''}
          <button class="vote" data-nom="${n.id}" data-cand="${c.id}">Голосовать</button>
        </div>
        ${c.photo_url && /^https:\/\//.test(c.photo_url) ? `<img src="${esc(c.photo_url)}" alt="Костюм: ${esc(c.name)}" loading="lazy">` : ''}
      </div>`).join('')}</div>`;
  } else {
    body = '<p class="note">Голосование завершено. Итоги покажем на церемонии.</p>';
  }
  return `<div class="nom"><h2>${esc(n.title)}</h2>${n.description ? `<p class="mute">${esc(n.description)}</p>` : ''}<div style="height:14px"></div>${body}</div>`;
}

/* ---------- клики и подтверждение голоса ---------- */
let pending = null;
$('#view').addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.poll) return openPoll(t.dataset.poll);
  if ('back' in t.dataset) { state.poll = null; return loadPolls(); }
  if (t.dataset.vote !== undefined || t.dataset.cand) {
    const nom = state.noms.find(n => n.id === t.dataset.nom), c = state.cands.find(c => c.id === t.dataset.cand);
    pending = { nom, c };
    $('#m-title').textContent = nom.title;
    $('#m-text').textContent = `Отдать голос за участника №${c.number} — ${c.name}? Изменить его потом нельзя.`;
    $('#m-err').textContent = '';
    $('#modal').classList.remove('hide');
    $('#m-ok').focus();
  }
});
$('#m-cancel').onclick = () => { $('#modal').classList.add('hide'); pending = null; };
$('#m-ok').onclick = async () => {
  if (!pending) return;
  const btn = $('#m-ok'); btn.disabled = true; $('#m-err').textContent = '';
  const { error } = await sb.rpc('cast_vote', { p_nomination: pending.nom.id, p_candidate: pending.c.id });
  btn.disabled = false;
  if (error) {
    if (/already_voted/.test(error.message)) { state.voted.add(pending.nom.id); $('#modal').classList.add('hide'); render(); }
    else $('#m-err').textContent = errText(error);
    return;
  }
  state.voted.add(pending.nom.id);
  $('#modal').classList.add('hide'); pending = null; render();
};

/* ---------- старт ---------- */
setMode('login');
sb.auth.getSession().then(({ data }) => { if (!data.session) $('#auth').classList.remove('hide'); });
</script>
</body>
</html>
