      }
      root.innerHTML = head + body + (detailsId && ctx && ctx.idx[detailsId] ? detailsHtml(ctx.idx[detailsId], ctx) : '');
      if (state === 'ready') {
        let pm = 0, pt = 0; S.spheres.forEach(sp => { const t = sphereTotals(ctx, sp.id); pm += t.planMoney; pt += t.planMin; });
        const fm = root.querySelector('[data-fc="money"]'), ft = root.querySelector('[data-fc="time"]');
        if (fm) fm.textContent = fmtCur(pm, ui.usd, usdRate); if (ft) ft.textContent = fmtMin(pt);
      }
      syncBadge();
    }

    /* ---------- события ---------- */
    function allFoldable(spId) {
      const ids = []; S.items.forEach(i => { if (i.sphereId === spId && (ctx.kids[i.id] || []).length) ids.push(i.id); });
      S.groups.forEach(g => { if (g.sphereId === spId) ids.push(g.id); }); return ids;
    }
    function onClick(e) {
      if (!(e.target.closest && e.target.closest('.d-menu'))) closeMenu();
      const b = e.target.closest ? e.target.closest('[data-act]') : null; if (!b || !root.contains(b)) return;
      if (b.dataset.act === 'close') { if (e.target.closest('[data-modal]') && !e.target.closest('.d-x')) return; detailsId = null; render(); return; }
      const id = b.dataset.id;
      switch (b.dataset.act) {
        case 'toggle': case 'gr-toggle': if (ui.col[id]) delete ui.col[id]; else ui.col[id] = 1; uiSave(); render(); break;
        case 'sp-fold': { const ids = allFoldable(id), open = ids.some(x => !ui.col[x]); ids.forEach(x => { if (open) ui.col[x] = 1; else delete ui.col[x]; }); uiSave(); render(); break; }
        case 'f-expand': ui.col = {}; uiSave(); render(); break;

        case 'f-cur': ui.usd = !ui.usd; uiSave(); render(); break;
        case 'details': detailsId = id; render(); break;
        case 'reload': load(); break;
        case 'imp': cycleImp(id); break;
        case 'menu': openMenu(b); break;
        case 'm-edit': closeMenu(); if (b.dataset.kind === 'item') itemForm({ id }); else if (b.dataset.kind === 'group') groupForm({ id }); else sphereForm(id); break;
        case 'm-done': closeMenu(); toggleDone(id); break;
        case 'm-del': closeMenu(); if (b.dataset.kind === 'item') deleteItem(id); else if (b.dataset.kind === 'group') deleteGroup(id); else deleteSphere(id); break;
        case 'addp': itemForm({ type: 'project', parentId: id, sphereId: (getItem(id) || {}).sphereId }); break;
        case 'addt': itemForm({ type: 'task', parentId: id, sphereId: (getItem(id) || {}).sphereId }); break;
        case 'addroot': itemForm({ type: b.dataset.type, sphereId: id, groupId: b.dataset.gid || null }); break;
        case 'gr-add': groupForm({ sphereId: id }); break;

<script>
/* ---- modules/diary-store.js ---- */
/* «Дневник»: данные и действия (без экрана). LifeDiaryStore.create(core) → объект S.
   Таблицы diaries и diary_entries (миграция 0008). Пишется через core.commit (офлайн-очередь), строки целиком.
   В журнал уходят короткие строки БЕЗ текста записей. */
(function (global) {
  'use strict';
  const M = global.LifeDiaryModel;
  const MOD = 'diary', CACHE = 'diary';

  function create(core) {
    const TZ = core.TZ;
    const D = { diaries: [], entries: [] };
    const S = { D, TZ, state: 'loading', note: '', loadedAt: 0, onChange: null };
    const iso = ms => new Date(ms).toISOString();
    const changed = () => { if (S.onChange) S.onChange(); };
    S.today = () => M.dayKey(Date.now(), TZ);
    const diary = id => D.diaries.find(d => d.id === id) || null;
    S.diary = diary;

    function apply(d) { D.diaries = (d.diaries || []).filter(r => !r.deleted_at); D.entries = (d.entries || []).filter(r => !r.deleted_at); }

        const f = { filters: ['deleted_at=is.null'] };

        apply({ diaries, entries }); core.cache.set(CACHE, { diaries: D.diaries, entries: D.entries }); S.state = 'ready'; S.note = ''; S.loadedAt = Date.now();
      } catch (e) {
        if (e.auth) { S.state = 'error'; S.note = 'нужно войти'; S.authLost = true; changed(); return; }
        const c = core.cache.get(CACHE);
        if (c && (e.net || e.pendingQueue)) { apply(c.data); S.state = 'ready'; S.note = e.pendingQueue ? 'Есть неотправленные изменения, показаны данные на устройстве.' : 'Нет связи, показаны данные на устройстве.'; }
        else { S.state = 'error'; S.note = e.net ? 'нет связи с базой и нет копии на устройстве' : (e.message || 'ошибка чтения'); }

        },
        log(op, kind, id, summary) { j.push({ op, module: MOD, entity_kind: kind, entity_id: id, summary }); },
        commit() {

      if (D.diaries.some(d => d.name.toLowerCase() === name.toLowerCase())) return { ok: false, msg: 'Дневник с таким названием уже есть' };

    };

        (r.skipped.noDiary + r.skipped.noText + r.skipped.badDate ? `; пропущено (нет дневника ${r.skipped.noDiary}, пустой текст ${r.skipped.noText}, неверная дата ${r.skipped.badDate})` : '') + '.';
      if (nd.length || ne.length) { T.log('sys', 'import', 'diary', text); T.commit(); } else changed();

        const info = field('impinfo');

        const r = M.legacyRows(obj);
        if (!imp.confirm) { imp.confirm = true; imp.info = `В файле: дневников ${r.diaries.length}, записей ${r.entries.length}. Нажмите ещё раз.`; render(); const d = root.querySelector('.dy-det'); if (d) d.open = true; return; }

        try { const res = await S.importLegacy(obj); imp.info = res.ok ? res.text : res.msg; if (res.ok) imp.text = ''; } catch (e) { imp.info = 'Не удалось: ' + (e.message || e); }

<script>
/* ---- modules/tracks-model.js ---- */
/* «Треки»: чистые функции (без экрана и сети): дни, разбор ввода в клетке, итоги строки, порог, «дней с последнего», разбор
   выгрузки старой системы. window.LifeTracksModel. Самодостаточен (ни от каких модулей не зависит). */
(function (global) {
  'use strict';
  const STATUS = { wish: 'желание', new: 'новая', cur: 'текущая', off: 'неактивная' };
  const KIND = { habit: 'Трек', in: 'Доход', out: 'Расход' };
  const GROUPS = ['Треки', 'Доходы', 'Расходы'];
  const SUMMARY = { auto: 'по умолчанию (сумма)', sum: 'сумма', avg: 'среднее (по дням с записью)', last: 'последнее значение', max: 'максимум', min: 'минимум', count: 'число дней с записью' };
  const SUMMARY_SIGN = { auto: 'Σ', sum: 'Σ', avg: 'ср', last: 'послед.', max: 'макс', min: 'мин', count: 'дней' };
  const THR = { none: 'без порога', below: 'ниже: норма ≤ порога', exact: 'точное значение: норма = порога', above: 'выше: норма ≥ порога' };
  const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  const isDay = s => /^\d{4}-\d\d-\d\d$/.test(String(s || '')) && !isNaN(Date.parse(s + 'T12:00:00Z'));
  const dayKey = (ms, tz) => new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ms));
  const shiftDay = (k, n) => { const d = new Date(k + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const daysBetween = (a, b) => Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 864e5); // b - a
  const weekday = k => WD[new Date(k + 'T12:00:00Z').getUTCDay()];
  const round1 = x => Math.round(x * 10) / 10;
  const fmt = x => String(Math.round(x * 100) / 100).replace('.', ',');
  const groupOf = t => (t.kind === 'in' ? 1 : t.kind === 'out' ? 2 : 0);

  /* Что набрано в клетке: пусто → удалить; «5» или «5,5» → установить сумму дня; «+5» → прибавить; иное → ошибка */
  function parseCell(raw) {
    const t = String(raw == null ? '' : raw).trim().replace(/\s/g, '');
    if (t === '') return { kind: 'empty' };
    const m = /^(\+)?(\d+(?:[.,]\d+)?|[.,]\d+)$/.exec(t); if (!m) return { kind: 'bad', text: String(raw).trim() };
    const v = parseFloat(m[2].replace(',', '.')); if (!isFinite(v)) return { kind: 'bad', text: String(raw).trim() };
    return { kind: m[1] ? 'add' : 'set', v };
  }
  const sumOf = list => list.reduce((a, e) => a + (+e.value || 0), 0);
  function indexEntries(entries) { // {trackId: {day: [entry,...]}}
    const m = {}; entries.forEach(e => { ((m[e.track_id] = m[e.track_id] || {})[e.day] = m[e.track_id][e.day] || []).push(e); }); return m;
  }
  /* Последний столбец строки по видимым дням: days = [{day, sum|null}] (sum = null, если в этот день записей нет) */
  function summarize(mode, days) {
    const v = days.filter(d => d.sum != null).map(d => d.sum), m = !mode || mode === 'auto' ? 'sum' : mode;
    if (!v.length) return { mode: m, value: null, text: '' };
    let x;
    if (m === 'sum') x = v.reduce((a, b) => a + b, 0); else if (m === 'avg') x = v.reduce((a, b) => a + b, 0) / v.length;
    else if (m === 'last') x = days.filter(d => d.sum != null).sort((a, b) => (a.day < b.day ? 1 : -1))[0].sum;
    else if (m === 'max') x = Math.max(...v); else if (m === 'min') x = Math.min(...v); else if (m === 'count') x = v.length; else x = v.reduce((a, b) => a + b, 0);
    x = round1(x); return { mode: m, value: x, text: fmt(x) };
  }
  const okThreshold = (mode, v, s) => (mode === 'below' ? s <= v + 1e-9 : mode === 'above' ? s >= v - 1e-9 : mode === 'exact' ? Math.abs(s - v) < 1e-9 : null);
  /* последнее событие: самая свежая из базовой даты и дней с записью > 0 (не позже сегодня) */
  function lastEventDay(t, byDay, today) {
    let m = t.baseline_last || ''; Object.keys(byDay || {}).forEach(d => { if (d <= today && d > m && sumOf(byDay[d]) > 0) m = d; }); return m;
  }
  const daysSince = (t, byDay, today) => { const l = lastEventDay(t, byDay, today); return l ? Math.max(0, daysBetween(l, today)) : null; };
  const lastEntryDay = byDay => Object.keys(byDay || {}).sort().pop() || '';
  /* «спит»: для желания и новой дней с самого свежего из создания, записи, «оставить» */
  const dormantDays = (t, byDay, today) => { const a = [t.created, lastEntryDay(byDay), t.acked].filter(Boolean).sort().pop(); return a ? Math.max(0, daysBetween(a, today)) : 0; };
  const periodStats = (byDay, today, n) => { // за последние n дней (включая сегодня)
    const from = shiftDay(today, -(n - 1)); let s = 0; const days = new Set();
    Object.keys(byDay || {}).forEach(d => { if (d >= from && d <= today) { s += sumOf(byDay[d]); days.add(d); } }); return { sum: round1(s), days: days.size };
  };

  /* Выгрузка старой системы {state:{habits:[{id,name,unit,kind,st,created,start,ack,need,rel,th:{m,v},dsl,last,cm:{день:текст},en:[{d,v}]}], cfg}}
     → строки таблиц. Поддерживается и сам объект state, и объект {habits}. */
  function legacyRows(obj) {

<script>
/* ---- modules/tracks.js ---- */
/* «Треки» (компьютер): экран. Данные и действия — tracks-store.js, расчёты — tracks-model.js, стили — tracks-css.js, карточка трека,
   желания, добавление, настройки и перенос — tracks-card.js. Точка входа: LifeModules.tracks.mount(элемент, {core, onAuthLost}) → {unmount, reload}.
   Таблица: даты по горизонтали (14 или 28 дней, листаем неделями), строки: Треки, Доходы, Расходы; в последнем столбце расчёт по видимым клеткам
   (сумма, среднее и др. на выбор для каждой строки); клетка: число задаёт сумму дня, «+число» прибавляет, пусто удаляет; у клетки есть комментарий. */
(function (global) {
  'use strict';
  const M = global.LifeTracksModel;
  global.LifeModules = global.LifeModules || {};
  const UI_KEY = 'lifeerp-tracks-ui';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    if (!document.getElementById('tk-css')) { const s = document.createElement('style'); s.id = 'tk-css'; s.textContent = global.LifeTracksCss; document.head.appendChild(s); }
    const u0 = core.store.get(UI_KEY, null) || {};
    const V = { n: u0.n === 28 ? 28 : 14, off: 0, showOff: false, onlyMoney: false, onlyTr: false, cell: null, card: null, wishOpen: !!u0.wishOpen, delAsk: null, addOpen: false };
    const saveUi = () => core.store.set(UI_KEY, { n: V.n, wishOpen: V.wishOpen });

    function rowsList() {
      return D.tracks.filter(t => (t.status === 'new' || t.status === 'cur' || (V.showOff && t.status === 'off')) && (!V.onlyMoney || t.kind !== 'habit') && (!V.onlyTr || t.kind === 'habit'))
        .sort((a, b) => M.groupOf(a) - M.groupOf(b) || (a.sort_order || 0) - (b.sort_order || 0) || (a.created < b.created ? -1 : 1));
    }

      const noteBad = S.state === 'error' || /Нет связи|неотправленные/.test(S.note);

      let h = `<div class="tk-bar"><span class="tk-note ${noteBad ? 'warn' : ''}" role="status">${S.state === 'loading' ? 'Загрузка…' : esc(S.note)}</span><button class="tk-btn" data-act="reload">Обновить</button></div>`;
      if (S.state === 'error' && !D.tracks.length) h += `<div class="tk-empty">${esc(S.note)}</div>`;
      else {
        h += `<div class="tk-row"><button class="tk-btn sm" data-act="nav" data-n="7">‹ неделя</button><span class="tk-mut">${fmtDM(days[0])} – ${fmtDM(days[days.length - 1])}</span><button class="tk-btn sm" data-act="nav" data-n="-7" ${V.off ? '' : 'disabled'}>неделя ›</button><span style="flex:1"></span>` +
          `<button class="tk-btn sm ${V.showOff ? 'on' : ''}" data-act="showoff">Неактивные (${nOff})</button><button class="tk-btn sm ${V.onlyMoney ? 'on' : ''}" data-act="onlymoney">Только деньги</button><button class="tk-btn sm ${V.onlyTr ? 'on' : ''}" data-act="onlytr">Только треки</button>` +
          `<button class="tk-btn sm ${V.n === 14 ? 'on' : ''}" data-act="span" data-n="14">14 дн.</button><button class="tk-btn sm ${V.n === 28 ? 'on' : ''}" data-act="span" data-n="28">28 дн.</button><button class="tk-btn primary sm" data-act="add-open">+ Добавить</button></div>`;
        h += global.LifeTracksCard.addForm(ctx);
        h += `<div class="tk-gw"><table class="tk-g"><tr><th class="nmc"></th>${days.map((d, j) => `<th class="${offs[j] === 0 ? 'td' : ''}">${d.slice(8)}<br><span class="tk-mut" style="${offs[j] === 0 ? 'color:#fff;opacity:.85' : ''}">${M.weekday(d)}</span></th>`).join('')}<th>Итог</th></tr>`;
        let lg = -1;
        rows.forEach(t => {
          const g = M.groupOf(t);
          if (g !== lg) { lg = g; h += `<tr class="gh"><td colspan="${days.length + 2}">${M.GROUPS[g]}${g === 1 ? ` <span style="color:var(--cin);font-weight:400;font-size:12px">${M.fmt(tk('in'))}</span>` : g === 2 ? ` <span style="color:var(--cout);font-weight:400;font-size:12px">${M.fmt(tk('out'))}</span>` : ''}</td></tr>`; }
          const by = S.byDay(t.id), sums = days.map(d => (by[d] ? M.sumOf(by[d]) : null)), mx = Math.max(0, ...sums.filter(x => x != null)), col = colorOf(t), sm = M.summarize(t.summary_mode, days.map((d, j) => ({ day: d, sum: sums[j] })));
          const thr = t.kind === 'habit' && t.threshold_mode && t.threshold_mode !== 'none' ? t : null, ds = t.show_days_since ? M.daysSince(t, by, today) : null;
          h += `<tr><td class="nmc ${V.card === t.id ? 'sel' : ''}" data-act="card" data-t="${esc(t.id)}" title="${esc(t.name)}">${t.kind === 'habit' ? `<span class="tk-sq" style="background:${col}"></span>` : t.kind === 'in' ? '＋ ' : '− '}<b>${esc(t.name)}</b>${t.kind === 'habit' ? ` <span class="tk-mut">${esc(t.unit || 'раз')}</span>` : ''}<span class="tk-ar"><a data-act="mv" data-t="${esc(t.id)}" data-d="-1">▲</a><a data-act="mv" data-t="${esc(t.id)}" data-d="1">▼</a></span></td>`;
          days.forEach((d, j) => {
            const s = sums[j], has = s != null, cm = S.noteOf(t.id, d), on = V.cell && V.cell.t === t.id && V.cell.d === d; let bg = '';
            if (has) { if (thr) bg = `color-mix(in srgb,${M.okThreshold(thr.threshold_mode, thr.threshold_value, s) ? 'var(--ok)' : 'var(--bad)'} 55%,transparent)`; else if (s > 0) bg = `color-mix(in srgb,${col} ${Math.round(25 + s / (mx || 1) * 65)}%,transparent)`; }
            const ph = !has && ds != null && offs[j] === 0 ? ` placeholder="${ds}"` : '';
            h += `<td class="tk-c ${on ? 'cs' : ''} ${cm ? 'hcm' : ''}" ${cm ? `title="${esc(cm.note)}"` : ''} ${bg ? `style="background:${bg}"` : ''}><input class="tk-ci" id="c_${esc(t.id)}_${d}" data-t="${esc(t.id)}" data-d="${d}" value="${has ? M.fmt(s) : ''}"${ph} inputmode="decimal" autocomplete="off"></td>`;
          });
          h += `<td class="tk-sg" title="${esc(M.SUMMARY[t.summary_mode || 'auto'])}">${sm.text ? `${sm.mode === 'sum' ? '' : `<small>${M.SUMMARY_SIGN[sm.mode]}</small>`}${sm.text}` : ''}</td></tr>`;
        });
        h += '</table></div>';
        if (!rows.length) h += '<div class="tk-empty">В таблице пока пусто. Нажмите «+ Добавить» или включите «Неактивные».</div>';
        h += global.LifeTracksCard.panel(ctx, days);
        h += global.LifeTracksCard.wishes(ctx) + global.LifeTracksCard.settings(ctx);
      }
      const keep = window.scrollY, fx = focusNext; focusNext = null;
      const ae = document.activeElement, hadFocus = ae && ae.classList && ae.classList.contains('tk-ci') ? ae.id : null;
      root.innerHTML = h; window.scrollTo(0, keep);
      const want = fx || hadFocus; if (want) { const n = root.querySelector('[id="' + want + '"]'); if (n) { n.focus(); n.select(); } }
    }

    /* перерисовка отложенно и не посреди нажатия мыши: иначе клик по строке, с которого ушёл фокус из клетки, теряется (элемент успевают заменить) */
    let rt = 0, down = false, pending = false;
    const sched = () => { clearTimeout(rt); rt = setTimeout(() => { if (down) { pending = true; return; } pending = false; render(); }, 0); };
    const md = () => { down = true; }, mu = () => { down = false; if (pending) sched(); };
    document.addEventListener('mousedown', md, true); document.addEventListener('mouseup', mu, true);
    S.onChange = () => { if (alive) sched(); }; /* отложенно: иначе перерисовка отнимает фокус у соседней клетки */
    const dayOf = o => M.shiftDay(S.today(), -o);
    root.addEventListener('focusin', ev => {
      const i = ev.target; if (!i.classList || !i.classList.contains('tk-ci')) return; i.select();
      if (V.cell && V.cell.t === i.dataset.t && V.cell.d === i.dataset.d) return;
      V.cell = { t: i.dataset.t, d: i.dataset.d }; V.card = null; const was = i.id; focusNext = was; render();
    });
    function commit(i, how) { const r = S.setCell(i.dataset.t, i.dataset.d, i.value, how); if (r && r.rejected) { global.alert && 0; } return r; }
    root.addEventListener('keydown', ev => {
      const i = ev.target; if (i.dataset && i.dataset.f === 'addv' && ev.key === 'Enter') { ev.preventDefault(); const b = root.querySelector('[data-act=addv]'); if (b) b.click(); return; }
      if (!i.classList || !i.classList.contains('tk-ci')) return;
      if (ev.key === 'Escape') { i.value = i.defaultValue; i.blur(); return; }
      if (ev.key !== 'Enter') return; ev.preventDefault(); i.dataset.done = '1';
      const t = i.dataset.t, d = i.dataset.d, rows = rowsList().map(x => x.id), k = rows.indexOf(t); let nt = t, nd = d;
      if (ev.shiftKey) { if (k >= 0 && k < rows.length - 1) nt = rows[k + 1]; } else if (d < S.today()) nd = M.shiftDay(d, 1);
      const r = commit(i, ev.shiftKey ? 'Shift+Enter' : 'Enter'); focusNext = 'c_' + nt + '_' + nd; V.cell = { t: nt, d: nd }; V.card = null;
      if (!r || r.same || r.rejected) render();
    });
    root.addEventListener('change', ev => {
      const i = ev.target; if (i.classList && i.classList.contains('tk-ci')) { if (i.dataset.done) { delete i.dataset.done; return; } commit(i, 'потеря фокуса'); return; }
      global.LifeTracksCard.onChange(ctx, ev);
    });
    root.addEventListener('input', ev => { const i = ev.target; if (i.classList && i.classList.contains('tk-ci')) { const v = i.value.replace(/\./g, ',').replace(/[^0-9,+]/g, ''); if (v !== i.value) i.value = v; return; } global.LifeTracksCard.onInput(ctx, ev); });
    root.addEventListener('click', async ev => {
      const t = ev.target.closest('[data-act]'); if (!t) return; const a = t.dataset.act;
      if (a === 'nav') { V.off = Math.max(0, V.off + +t.dataset.n); render(); return; }
      if (a === 'span') { V.n = +t.dataset.n; saveUi(); render(); return; }
      if (a === 'showoff') { V.showOff = !V.showOff; render(); return; }
      if (a === 'onlymoney') { V.onlyMoney = !V.onlyMoney; if (V.onlyMoney) V.onlyTr = false; render(); return; }
      if (a === 'onlytr') { V.onlyTr = !V.onlyTr; if (V.onlyTr) V.onlyMoney = false; render(); return; }
      if (a === 'reload') { S.load(); return; }
      if (a === 'mv') { ev.stopPropagation(); S.move(t.dataset.t, +t.dataset.d, rowsList().map(x => x.id)); render(); return; }
      if (a === 'card') { focusNext = null; V.card = V.card === t.dataset.t ? null : t.dataset.t; V.cell = null; V.delAsk = null; render(); return; }
      await global.LifeTracksCard.onClick(ctx, t, a, ev);
    });
    const poll0 = 0; const poll = setInterval(() => { if (S.authLost && ctxIn.onAuthLost) { S.authLost = false; ctxIn.onAuthLost(); } }, 800);
    render(); S.load();
    return { reload: () => S.load(), unmount() { alive = false; clearInterval(poll); clearTimeout(rt); document.removeEventListener('mousedown', md, true); document.removeEventListener('mouseup', mu, true); S.onChange = null; el.innerHTML = ''; } };
  }
  global.LifeModules.tracks = { mount };
})(window);

</script>
<script>
/* ---- shell/shell.js ---- */
/* Оболочка (компьютер): верхняя панель, вкладки модулей, переключатель «чьи данные», индикатор очереди записи.
   Старая система подключается как есть, в окне внутри страницы (файл life-system.html рядом).
   LifeShell.start(элемент) */
(function (global) {
  'use strict';
  const TAB_KEY = 'lifeerp-shell-tab', DOCK_KEY = 'lifeerp-shell-dock';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const CSS = `
body{margin:0;background:#f2f2f2}
.sh-top{position:sticky;top:0;z-index:1000;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 14px;background:#fff;border-bottom:1px solid #dcdcdc;font:13px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#404040;min-height:32px}
.sh-top[hidden]{display:none}
.sh-top b{font-size:15px}.sh-fill{flex:1}
.sh-tabs{display:flex;gap:4px;flex-wrap:wrap}
.sh-tab{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 10px;font:inherit;color:inherit;cursor:pointer}
.sh-tab:hover{background:#efefef}.sh-tab.on{background:#404040;color:#fff}
.sh-view select{font:inherit;padding:3px;border:1px solid #c9c9c9;border-radius:5px}
.sh-sync{font-size:12px;opacity:.75}.sh-sync.warn{color:#b3261e;opacity:1}
.sh-out{font:inherit;padding:4px 10px;border:1px solid #c9c9c9;background:#fff;border-radius:6px;cursor:pointer}
.sh-banner{background:#fff4d6;border-bottom:1px solid #e6d29a;padding:6px 14px;font:13px system-ui,sans-serif;color:#5b4a10}
.sh-main iframe{display:block;width:100%;height:calc(100vh - 46px);border:0;background:#fff}
.sh-body{display:flex;align-items:flex-start}
.sh-main{flex:1 1 auto;min-width:0}
.sh-dock{flex:none;width:min(420px,50vw);box-sizing:border-box;position:sticky;top:var(--sh-top,46px);height:calc(100vh - var(--sh-top,46px));border-left:1px solid #dcdcdc;background:#fff}
.sh-dock[hidden]{display:none}
.sh-dock iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.sh-phone{display:inline-flex;align-items:center;padding:5px 8px}
.sh-phone svg{width:16px;height:16px;display:block}`;

  function start(el) {
    const core = global.LifeCore.init({ device: 'desktop' });
    if (!document.getElementById('sh-css')) { const s = document.createElement('style'); s.id = 'sh-css'; s.textContent = CSS; document.head.appendChild(s); }
    el.innerHTML = `<header class="sh-top" hidden><b>LifeERP</b><nav class="sh-tabs"></nav><span class="sh-fill"></span>
      <label class="sh-view" hidden>Данные: <select></select></label><span class="sh-sync"></span><span class="sh-who"></span><button class="sh-out" type="button">Выйти</button></header>
      <div class="sh-banner" hidden></div><div class="sh-body"><main class="sh-main"></main><aside class="sh-dock" hidden aria-label="Телефонная версия: Таймеры, Покупки, Эмоции"></aside></div>`;
    const $ = s => el.querySelector(s), top = $('.sh-top'), main = $('.sh-main'), banner = $('.sh-banner'), sel = $('.sh-view select'), dock = $('.sh-dock');

    const modules = [
      { id: 'things', title: 'Вещицы', mount: (box, ctx) => global.LifeModules.things.mount(box, ctx) },
      { id: 'spheres', title: 'Сферы и дела', mount: (box, ctx) => global.LifeModules.spheres.mount(box, ctx) },
      { id: 'tracks', title: 'Треки', mount: (box, ctx) => global.LifeModules.tracks.mount(box, ctx) },
      { id: 'diary', title: 'Дневник', mount: (box, ctx) => global.LifeModules.diary.mount(box, ctx) },
      { id: 'legacy', title: 'Состояние, дневник (старая система)', own: true, mount(box) {
        const f = document.createElement('iframe'); f.src = 'life-system.html'; f.title = 'Старая система'; box.appendChild(f);
        return { unmount() { f.remove(); } };
      } }
    ];
    let tab = (core.store.get(TAB_KEY, 'things') || 'things'), mod = null, profiles = [];
    if (!modules.some(m => m.id === tab)) tab = 'things';

    /* Правый док «Телефон»: та же страница pocket.html в узкой колонке (?embed=1). Она берёт у оболочки общий core:
       один вход, одна очередь записи. Включён/выключен запоминается; выключенный док выгружается целиком. */
    let dockOn = !!core.store.get(DOCK_KEY, false);
    const PHONE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>';
    function dockMounted() { return !!dock.querySelector('iframe'); }
    function unloadDock() { dock.innerHTML = ''; dock.hidden = true; }
    function applyDock(force) {
      document.documentElement.style.setProperty('--sh-top', (top.hidden ? 0 : top.offsetHeight) + 'px');
      if (!core.session() || !dockOn) { unloadDock(); return; }
      if (force) dock.innerHTML = '';
      if (!dockMounted()) { const f = document.createElement('iframe'); f.src = 'pocket.html?embed=1'; f.title = 'Телефонная версия'; dock.appendChild(f); }
      dock.hidden = false;
    }
    global.addEventListener('resize', () => applyDock());

    function unmountModule() { if (mod) { try { mod.unmount(); } catch (e) { /* окно уже убрано */ } mod = null; } main.innerHTML = ''; }
    function updateBanner() {
      const m = modules.find(x => x.id === tab), other = core.viewUser() !== core.me();
      if (m.own && other) { banner.hidden = false; banner.textContent = 'Старая система всегда показывает только ваши данные, выбор пользователя на неё не действует.'; }
      else if (other) { const p = profiles.find(x => x.user_id === core.viewUser()); banner.hidden = false; banner.textContent = 'Вы смотрите и правите данные пользователя: ' + ((p && p.display_name) || core.viewUser()) + '. Выбор «Я» вернёт ваши.'; }
      else banner.hidden = true;
    }
    function show() {
      unmountModule();
      if (!core.session()) { top.hidden = true; banner.hidden = true; unloadDock(); global.LifeLogin.mount(main, { onDone: show }); return; }
      core.reloadSession();
      top.hidden = false; $('.sh-who').textContent = core.email();
      renderTabs(); updateBanner(); applyDock();
      const m = modules.find(x => x.id === tab);
      mod = m.mount(main, { core, onAuthLost: show });
      loadProfiles();
    }
    function renderTabs() {
      const phone = `<button type="button" class="sh-tab sh-phone ${dockOn ? 'on' : ''}" data-phone aria-pressed="${dockOn}" title="Телефонная версия: Таймеры, Покупки, Эмоции (правая колонка)" aria-label="Телефонная версия">${PHONE_SVG}</button>`;
      $('.sh-tabs').innerHTML = modules.map(m => `<button type="button" class="sh-tab ${m.id === tab ? 'on' : ''}" data-tab="${esc(m.id)}">${esc(m.title)}</button>` + (m.id === 'spheres' ? phone : '')).join('');
    }
    $('.sh-tabs').addEventListener('click', e => {
      if (e.target.closest('[data-phone]')) { dockOn = !dockOn; core.store.set(DOCK_KEY, dockOn); renderTabs(); applyDock(); return; }
      const b = e.target.closest('[data-tab]'); if (!b || b.dataset.tab === tab) return;
      tab = b.dataset.tab; core.store.set(TAB_KEY, tab); show();
    });

    /* Переключатель «чьи данные»: виден только мастеру, когда в системе больше одного пользователя. */
    async function loadProfiles() {
      try {
        const r = await core.request('/rest/v1/profiles?select=user_id,display_name,role&order=created_at');
        profiles = Array.isArray(r.data) ? r.data : [];
      } catch (e) { profiles = []; }
      const meRow = profiles.find(p => p.user_id === core.me());
      const can = !!meRow && meRow.role === 'master' && profiles.length > 1;
      $('.sh-view').hidden = !can;
      if (!can) { if (core.viewUser() !== core.me()) core.setViewUser(null); return; }
      sel.innerHTML = profiles.map(p => `<option value="${esc(p.user_id)}" ${p.user_id === core.viewUser() ? 'selected' : ''}>${p.user_id === core.me() ? 'Я' : esc(p.display_name || p.user_id)}</option>`).join('');
      updateBanner();
    }
    sel.addEventListener('change', () => {
      const n = core.status().pending;
      if (n && !confirm('Есть неотправленные изменения: ' + n + '. Они уйдут тому, чьи данные были выбраны, когда вы их вносили. Переключить?')) { sel.value = core.viewUser(); return; }
      core.setViewUser(sel.value === core.me() ? null : sel.value);
    });
    core.on('view', () => { if (core.session()) { show(); applyDock(true); } });

    /* Индикатор очереди записи для любой вкладки. */
    function syncBadge() {
      const s = core.status(), b = $('.sh-sync');
      b.classList.toggle('warn', s.dead > 0);
      b.textContent = s.dead > 0 ? `не принято сервером: ${s.dead}` : (s.pending > 0 ? `ожидает отправки: ${s.pending}${s.online ? '' : ' (нет сети)'}` : (s.online ? '' : 'нет сети'));
    }
    ['queue', 'dead', 'net'].forEach(n => core.on(n, syncBadge)); syncBadge();

    $('.sh-out').addEventListener('click', async () => {
      const n = core.status().pending;
      if (n && !confirm('Есть неотправленные изменения: ' + n + '. Они останутся в браузере и уйдут при следующем входе. Выйти?')) return;
      await core.signOut(); show();
    });
    core.on('auth', ok => { if (!ok) show(); });
    show();
    global.LifeShell.core = core; global.LifeShell.refresh = show;
    return { show, core };
  }

  global.LifeShell = { start };
})(window);

</script>
<script>LifeShell.start(document.getElementById('app'));</script>
