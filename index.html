        `<div class="pl-row"><input type="file" accept=".json,application/json" data-f="impfile"></div><textarea class="pl-ta" data-f="imp" style="min-height:70px" placeholder="JSON выгрузки">${esc(imp.text)}</textarea>` +
        `<label class="pl-row pl-mut"><input type="checkbox" data-f="imprep" ${imp.replace ? 'checked' : ''}> Заменить активности и слоты, где в базе и в файле разное (по файлу)</label>` +
        `<div class="pl-row"><button class="pl-btn" data-act="imp-go" ${imp.busy ? 'disabled' : ''}>${imp.confirm ? 'Точно перенести?' : 'Перенести'}</button></div><div class="pl-mut" role="status" data-f="impinfo">${esc(imp.info)}</div></details>`;
    }

    function render() {

        h += `<div class="pl-row"><button class="pl-btn sm" data-act="otog">${ui.open ? 'Скрыть' : 'Показать'} активности (${acts.length})</button><input class="pl-in fl" data-f="newact" placeholder="Новая активность, например «Баня»" value="${esc(newName)}" maxlength="80"><button class="pl-btn" data-act="addact">Добавить</button></div>${err ? `<div class="pl-note warn">${esc(err)}</div>` : ''}`;
        if (ui.open) h += `<div class="pl-ag">${acts.map(a => ex[a.id] ? actCard(a) : `<div class="pl-at" data-act="aex" data-id="${esc(a.id)}" title="${esc(a.name + (a.note ? '\n' + a.note : ''))}" style="${a.color ? 'border-left:6px solid ' + a.color + ';background:color-mix(in srgb,' + a.color + ' 16%,transparent)' : ''}"><b>${esc(a.name)}</b><span>${M.fmt(M.actCost(itemsBy[a.id] || []))} тыс. ₸ · ${M.fmt(a.hours)} ч</span></div>`).join('')}</div>`;
        const slots = S.slotsOf(ui.year), T = M.totals(ui.year, acts, itemsBy, slots), byId = {}; acts.forEach(a => { byId[a.id] = a; });

<script>
/* ---- modules/state-model.js ---- */
/* «Состояние» (компьютер): чистые расчёты без экрана и без базы. window.LifeStateModel.

   График и подсказка повторяют старую браузерную систему: день и 3 дня точками отметок, неделя и месяц средним за день. */

  function dayAvg(marks, k) { const v = dayRecs(marks, k).filter(m => m.value != null).map(m => m.value); return v.length ? avgA(v) : null; }

<script>
/* ---- modules/state.js ---- */
/* «Состояние» (компьютер): экран, как в старой браузерной системе. Данные и действия — LifeEmoStore (те же таблицы mood_tags и mood_marks,
   что у телефонной вкладки «Эмоции»), расчёты — state-model.js, стили — state-css.js.
   Точка входа: LifeModules.state.mount(элемент, {core, onAuthLost}) → {unmount, reload}.
   Шкала −5…+5 (минус неприятно, плюс приятно), чувства (метки), заметка, отметки за сегодня, график, подсказка. */
(function (global) {
  'use strict';
  const M = global.LifeStateModel, TM = global.LifeTimersModel;
  global.LifeModules = global.LifeModules || {};
  const UI_KEY = 'lifeerp-state-ui';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function mount(el, ctxIn) {
    ctxIn = ctxIn || {};
    const core = ctxIn.core || global.LifeCore, TZ = core.TZ, S = global.LifeEmoStore.create(core), D = S.D, T = global.LifeTracksStore ? global.LifeTracksStore.create(core) : null;
    if (!document.getElementById('st-css')) { const s = document.createElement('style'); s.id = 'st-css'; s.textContent = global.LifeStateCss; document.head.appendChild(s); }
    let SS = ctxIn.settings; if (!SS) { SS = global.LifeSettingsStore.create(core); SS.fromCache(); }
    const applyPal = () => M.setPalette({ pos: SS.get('modules.state.opt.colPos'), neg: SS.get('modules.state.opt.colNeg'), zero: SS.get('modules.state.opt.colZero') });
    applyPal();
    const u0 = core.store.get(UI_KEY, null) || {};
    const ui = { mode: M.CMN[u0.mode] ? u0.mode : (M.CMN[SS.get('modules.state.opt.range')] ? SS.get('modules.state.opt.range') : 'day'), emin: isFinite(+u0.emin) && u0.emin !== '' && u0.emin != null ? +u0.emin : 0, tlOpen: !!u0.tlOpen };
    const saveUi = () => core.store.set(UI_KEY, { mode: ui.mode, emin: ui.emin, tlOpen: ui.tlOpen });
    let alive = true, P = 0, sel = [], off = 0, err = '', note = '', newTag = '', imp = { open: false, text: '', info: '', busy: false, confirm: false };
    el.innerHTML = '<div class="st-app"></div>'; const root = el.firstChild;

    function slotsInfo() {
      if (!T || T.state !== 'ready') return null; const tm = global.LifeTracksModel, today = T.today(), cfg = T.cfg;
      const used = T.D.tracks.filter(t => t.status === 'new' && t.kind === 'habit').length;
      const sleepers = T.D.tracks.filter(t => t.kind === 'habit' && t.status !== 'off' && tm.dormantDays(t, T.byDay(t.id), today) >= cfg.sl).length;
      return { free: cfg.cap - used, sleepers };
    }

    function render() {
      if (!alive) return;
      const today = S.today(), marks = D.marks, tags = D.tags, noteBad = S.state === 'error' || /Нет связи|неотправленные/.test(S.note);
      let h = `<div class="st-bar"><span class="st-note ${noteBad ? 'warn' : ''}" role="status">${S.state === 'loading' ? 'Загрузка…' : esc(S.note)}</span><button class="st-btn" data-act="reload">Обновить</button></div>`;
      if (S.state === 'error' && !marks.length && !tags.length) { root.innerHTML = h + `<div class="st-empty">${esc(S.note)}</div>`; return; }
      const hn = M.hint(marks, today, ui.emin, slotsInfo());
      h += `<div class="st-hint" role="status"><b>${esc(hn.title)}</b>${esc(hn.text)}</div>`;
      h += `<div class="st-card"><h2>Состояние</h2><div class="st-mut">Отмечайте столько раз в день, сколько хочется.</div><div class="st-lbl">Интенсивность переживания</div><div class="st-mut">Знак задаёт тип эмоции (минус неприятная, плюс приятная), число уровень чувствования.</div><div class="st-row">` +
        [-5, -4, -3, -2, -1, 1, 2, 3, 4, 5].map(i => `<button class="st-r" data-act="pick" data-v="${i}" style="${P === i ? `background:${M.vCol(i, 0.85)};border-color:${M.vCol(i, 0.85)};color:#fff` : `border-color:${M.vCol(i, 0.5)}`}">${i > 0 ? '+' + i : '−' + Math.abs(i)}</button>`).join('') + '</div>';
      const fs = M.feelsSorted(tags, marks);
      h += `<div class="st-lbl">Чувство</div><div class="st-row">${fs.length ? fs.map(f => `<span class="st-fc"><button class="st-btn sm ${sel.includes(f.id) ? 'on' : ''}" data-act="tag" data-id="${esc(f.id)}" title="Использовано: ${f.n}">${esc(f.name)}</button><a class="st-fx" data-act="deltag" data-id="${esc(f.id)}" title="Убрать из списка чувств">×</a></span>`).join('') : '<span class="st-mut">Добавьте первое чувство в поле ниже.</span>'}</div>`;
      h += `<div class="st-row"><input class="st-in" data-f="newtag" maxlength="60" placeholder="Что ты чувствуешь?" value="${esc(newTag)}"><button class="st-btn sm" data-act="addtag">+ чувство</button></div>`;
      h += `<div class="st-row"><input class="st-in" data-f="note" maxlength="500" placeholder="Заметка (по желанию)" value="${esc(note)}"><button class="st-btn primary" data-act="addmark">Записать отметку</button></div>${err ? `<div class="st-warn">${esc(err)}</div>` : ''}`;
      const tc = M.dayRecs(marks, today);
      h += `<div class="st-lbl st-tog" data-act="tl">${ui.tlOpen ? '▾' : '▸'} Сегодня отметок: ${tc.length}</div>`;
      if (ui.tlOpen) h += tc.map(m => `<div class="st-li"><span class="st-mut">${TM.hm(Date.parse(m.ts), TZ)}</span> интенсивность ${m.value == null ? '-' : (m.value > 0 ? '+' : '−') + Math.abs(m.value)} ${M.tagNames(tags, m).map(n => `<span class="st-tg">${esc(n)}</span>`).join('')}${m.note ? '<br>' + esc(m.note) : ''} <button class="st-btn sm" data-act="delmark" data-id="${esc(m.id)}" title="Удалить отметку">×</button></div>`).join('');
      const c = M.chartModel(marks, tags, today, ui.mode, off, TZ);
      h += `<div class="st-lbl">График</div><div class="st-row">${M.MODES.map(([k, l]) => `<button class="st-btn sm ${ui.mode === k ? 'on' : ''}" data-act="mode" data-k="${k}">${l}</button>`).join('')}</div>` +
        `<div class="st-row"><button class="st-btn sm" data-act="nav" data-d="1" aria-label="Назад">‹</button><span class="st-mut">${c.label}</span><button class="st-btn sm" data-act="nav" data-d="-1" ${off ? '' : 'disabled'} aria-label="Вперёд">›</button></div><div class="st-chart">${M.chartSvg(c)}</div></div>`;
      h += `<details class="st-det" ${imp.open ? 'open' : ''}><summary>Настройки и перенос из старой системы</summary><div class="st-row"><span class="st-mut">Норма состояния (для подсказки сверху), хранится на этом устройстве</span><input class="st-in" data-f="emin" style="max-width:80px;flex:none" inputmode="decimal" value="${esc(String(ui.emin).replace('.', ','))}"></div>` +
        `<div class="st-row"><span class="st-mut">Отметки старой системы (state.checks): вставьте файл «Данные браузера» или выберите его. Переносятся отметки с силой и хотя бы одним чувством; записи, сделанные в одну секунду с одной силой и заметкой, дублей не создают.</span></div><div class="st-row"><input type="file" accept=".json,application/json" data-f="impfile"></div><textarea class="st-ta" data-f="imp" placeholder="JSON выгрузки">${esc(imp.text)}</textarea>` +
        `<div class="st-row"><button class="st-btn" data-act="imp-go" ${imp.busy ? 'disabled' : ''}>${imp.confirm ? 'Точно перенести?' : 'Перенести'}</button></div><div class="st-mut" role="status" data-f="impinfo">${esc(imp.info)}</div></details></div>`;
      const ae = document.activeElement, fo = ae && root.contains(ae) && ae.dataset && ae.dataset.f && /^(INPUT|TEXTAREA)$/.test(ae.tagName) && ae.type !== 'file' ? ae : null, keep = window.scrollY;
      root.innerHTML = h; window.scrollTo(0, keep);
      if (fo) { const n = root.querySelector(fo.tagName.toLowerCase() + '[data-f="' + fo.dataset.f + '"]'); if (n) { n.focus(); try { n.setSelectionRange(n.value.length, n.value.length); } catch (e) { /* поле без выделения */ } } }
    }

    let rt = 0, down = false, pending = false;
    const sched = () => { clearTimeout(rt); rt = setTimeout(() => { if (down) { pending = true; return; } pending = false; render(); }, 0); };
    const md = () => { down = true; }, mu = () => { down = false; if (pending) sched(); };
    document.addEventListener('mousedown', md, true); document.addEventListener('mouseup', mu, true);
    let rangeSeen = SS.get('modules.state.opt.range');
    const offSS = SS.subscribe ? SS.subscribe(() => { if (!alive) return; applyPal(); const r = SS.get('modules.state.opt.range'); if (r !== rangeSeen) { rangeSeen = r; if (M.CMN[r]) { ui.mode = r; saveUi(); } } sched(); }) : null;
    S.onChange = () => { if (alive) sched(); }; if (T) T.onChange = () => { if (alive) sched(); };
    const addTagNow = () => {
      const t = newTag.trim().toLowerCase(); if (!t) return; const r = S.addTags(t);
      if (r.added) { r.ids.forEach(id => { if (!sel.includes(id)) sel.push(id); }); err = ''; } else { const ex = D.tags.find(x => !x.deleted_at && x.name.toLowerCase() === t); if (ex && !sel.includes(ex.id)) sel.push(ex.id); err = ex ? '' : (r.msg || ''); }
      newTag = ''; render();
    };
    root.addEventListener('input', ev => { const f = ev.target.dataset && ev.target.dataset.f; if (f === 'newtag') newTag = ev.target.value; else if (f === 'note') note = ev.target.value; else if (f === 'imp') { imp.text = ev.target.value; imp.confirm = false; } });
    root.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.f === 'newtag') { ev.preventDefault(); addTagNow(); } });
    root.addEventListener('change', ev => {
      const i = ev.target, f = i.dataset && i.dataset.f;
      if (f === 'emin') { const v = parseFloat(String(i.value).replace(',', '.')); if (isFinite(v)) { ui.emin = v; saveUi(); } sched(); }
      else if (f === 'impfile') { const file = i.files && i.files[0]; if (!file) return; imp.open = true; const r = new FileReader(); r.onload = () => { imp.text = String(r.result || ''); imp.confirm = false; imp.info = 'Файл прочитан (' + Math.round(imp.text.length / 1024) + ' КБ). Нажмите «Перенести».'; render(); }; r.readAsText(file); }
    });
    root.addEventListener('click', ev => {
      const t = ev.target.closest('[data-act]'); if (!t) return; const a = t.dataset.act, id = t.dataset.id;
      if (a === 'reload') { S.load(); if (T) T.load(); return; }
      if (a === 'pick') { const v = +t.dataset.v; P = P === v ? 0 : v; render(); return; }
      if (a === 'tag') { sel = sel.includes(id) ? sel.filter(x => x !== id) : sel.concat(id); render(); return; }
      if (a === 'deltag') { S.deleteTag(id); sel = sel.filter(x => x !== id); render(); return; }
      if (a === 'addtag') { addTagNow(); return; }
      if (a === 'addmark') { const r = S.addMark({ tagIds: sel, val: P || null, note }); if (r.error) { err = r.error; render(); return; } err = ''; P = 0; sel = []; note = ''; off = 0; render(); return; }
      if (a === 'tl') { ui.tlOpen = !ui.tlOpen; saveUi(); render(); return; }
      if (a === 'delmark') { S.removeMark(id); render(); return; }
      if (a === 'mode') { ui.mode = t.dataset.k; off = 0; saveUi(); render(); return; }
      if (a === 'nav') { off = Math.max(0, off + (+t.dataset.d) * M.CMN[ui.mode]); render(); return; }
      if (a === 'imp-go') {
        imp.open = true; let obj = null; try { obj = JSON.parse(imp.text.trim()); } catch (e) { /* ниже скажем */ }
        const r = obj && M.legacyChecks(obj);
        if (!r) { imp.info = 'Не узнал файл: нужна выгрузка «Данные браузера» старой системы (в ней state.checks).'; imp.confirm = false; render(); return; }
        const sk = r.skipped, skText = (sk.noValue + sk.noTag + sk.bad) ? `; пропущено (без силы ${sk.noValue}, без чувства ${sk.noTag}, с неверной датой ${sk.bad})` : '';
        if (!imp.confirm) { imp.confirm = true; imp.info = `В файле отметок ${r.total}, к переносу ${r.used}${skText}. Нажмите ещё раз, чтобы записать.`; render(); return; }
        imp.confirm = false; const res = S.importRecords(r.records, r.tags, 'Перенос отметок из старой системы');
        imp.info = `Перенос отметок: добавлено ${res.added}, дублей пропущено ${res.dup}${skText}.`; imp.text = ''; render(); return;
      }
    });
    const onAuth = setInterval(() => { if (S.authLost && ctxIn.onAuthLost) { S.authLost = false; ctxIn.onAuthLost(); } }, 800);
    render(); S.load(); if (T) T.load();
    return { panelSpec: [{ title: 'Цвета оценок' }, { key: 'modules.state.opt.colPos', label: 'Плюс' }, { key: 'modules.state.opt.colNeg', label: 'Минус' }, { key: 'modules.state.opt.colZero', label: 'Ноль' }, { title: 'Период' }, { key: 'modules.state.opt.range', label: 'Период по умолчанию' }], reload: () => { S.load(); if (T) T.load(); }, unmount() { alive = false; if (offSS) offSS(); clearInterval(onAuth); clearTimeout(rt); document.removeEventListener('mousedown', md, true); document.removeEventListener('mouseup', mu, true); S.onChange = null; if (T) T.onChange = null; el.innerHTML = ''; } };
  }
  global.LifeModules.state = { mount };
})(window);

<script>
/* ---- modules/timers-store.js ---- */
/* «Таймеры»: данные и действия (без экрана). LifeTimersStore.create(core) → объект S.
   Всё пишется через core.commit (офлайн-очередь, журнал), строки отправляются целиком.
   Время: сессии, ручные записи и поправки лежат в time_entries (meta.card = карточка, meta.target = дело карточки).
   Остановка таймера: строка timer_runs получает deleted_at, а запись времени получает ТОТ ЖЕ id, поэтому повторная отправка ничего не дублирует.
   Всё время идёт на дело, выбранное в момент остановки. */
(function (global) {
  'use strict';
  const M = global.LifeTimersModel;
  const MOD = 'timers', CACHE = 'timers', CACHE_DAYS = 60;
  const TBL = { timer_cards: 'cards', timer_targets: 'targets', timer_runs: 'runs', time_entries: 'entries' };

  function create(core) {
    const TZ = core.TZ;
    const D = { cards: [], targets: [], runs: [], entries: [], items: {} };
    const S = { D, TZ, state: 'loading', note: '', loadedAt: 0, onChange: null };
    const iso = ms => new Date(ms).toISOString();
    const device = () => (core.config && core.config.device) || 'pocket';
    const changed = () => { if (S.onChange) S.onChange(); };
    S.today = () => M.dayKey(Date.now(), TZ);

    /* ---------- чтение и копия для работы без сети ---------- */
    function apply(d) {
      D.cards = (d.cards || []).filter(r => !r.deleted_at);
      D.targets = d.targets || [];
      D.runs = (d.runs || []).filter(r => !r.deleted_at);
      D.entries = (d.entries || []).filter(r => !r.deleted_at);
      D.items = d.items || {};
    }
    function saveCache() {
      const from = M.shiftDay(S.today(), -CACHE_DAYS);
      core.cache.set(CACHE, { cards: D.cards, targets: D.targets, runs: D.runs, items: D.items, entries: D.entries.filter(e => e.local_date >= from) });
    }
    S.load = async function () {
      if (S.state !== 'ready') S.state = 'loading'; changed();
      try { await core.flush(); } catch (e) { /* очередь сама повторит */ }
      try {
        if (core.status().pending > 0) throw Object.assign(new Error('очередь'), { pendingQueue: true });
        const nd = ['deleted_at=is.null'];
        const [cards, targets, runs, entries, items] = await Promise.all([
          core.select('timer_cards', { filters: nd }), core.select('timer_targets'), core.select('timer_runs', { filters: nd }),
          core.select('time_entries', { filters: ['meta->>card=not.is.null', 'deleted_at=is.null'] }),
          core.select('sphere_items', { filters: nd, columns: 'id,title,done,kind' })
        ]);
        const map = {}; items.forEach(i => { map[i.id] = { title: i.title, done: !!i.done, kind: i.kind }; });
        apply({ cards, targets, runs, entries, items: map });
        saveCache(); S.state = 'ready'; S.note = ''; S.loadedAt = Date.now();
      } catch (e) {
        if (e.auth) { S.state = 'error'; S.note = 'нужно войти'; S.authLost = true; changed(); return; }
        const c = core.cache.get(CACHE);
        if (c && (e.net || e.pendingQueue)) {
          apply(c.data); S.state = 'ready';
          S.note = e.pendingQueue ? 'Есть неотправленные изменения, показаны данные на этом телефоне.' : 'Нет связи. Показана копия от ' + new Date(c.ts).toLocaleString('ru-RU') + '.';
        } else { S.state = 'error'; S.note = e.net ? 'нет связи с базой и нет копии на телефоне' : (e.message || 'ошибка чтения'); }
      }
      changed();
    };

    /* ---------- запись одним действием ---------- */
    function tx() {
      const w = {}, j = [], before = [];
      const T = {
        put(table, row) {
          row = Object.assign({}, row, { updated_at: core.now() });
          const arr = D[TBL[table]], i = arr.findIndex(r => r.id === row.id);
          before.push({ table, prev: i >= 0 ? JSON.parse(JSON.stringify(arr[i])) : null, id: row.id });
          const keepDeleted = table === 'timer_targets';
          if (row.deleted_at && !keepDeleted) { if (i >= 0) arr.splice(i, 1); } else if (i >= 0) arr[i] = row; else arr.push(row);
          const out = Object.assign({}, row); delete out.user_id; delete out.updated_by;
          (w[table] = w[table] || {})[row.id] = out; return row;
        },
        del(table, row) { return T.put(table, Object.assign({}, row, { deleted_at: core.now() })); },
        log(op, kind, id, summary) { j.push({ op, module: MOD, entity_kind: kind, entity_id: id, summary }); },
        empty() { return !Object.keys(w).length; },
        commit() {
          saveCache();
          const writes = Object.keys(w).map(t => ({ table: t, rows: Object.keys(w[t]).map(k => w[t][k]) }));
          try { core.commit({ writes, journal: j }); } catch (e) { S.note = 'Не сохранено: ' + (e.message || e); }
          changed(); return T;
        },
        /* отмена: возвращает прежние версии строк (с новой меткой времени), созданные заново помечает удалёнными */
        undo(summary) {
          const U = tx(), seen = {};
          before.slice().reverse().forEach(b => {
            const k = b.table + '/' + b.id; if (seen[k]) return; seen[k] = 1;
            const first = before.find(x => x.table === b.table && x.id === b.id);
            const cur = D[TBL[b.table]].find(r => r.id === b.id);
            if (first.prev) U.put(b.table, first.prev); else if (cur) U.del(b.table, cur);
          });
          U.log('change', 'undo', '', summary || 'Отмена действия'); U.commit();
        }
      };
      return T;
    }
    S.tx = tx;

    /* ---------- полные строки ---------- */
    const cardRow = (o, base) => Object.assign({ id: o.id, name: o.name, sort: 0, last_start: null, last_target: null, archived_from: null, created_at: iso(Date.now()), deleted_at: null }, base || {}, o.over || {});
    const targetRow = o => ({ id: o.id, card_id: o.card_id, kind: o.kind || 'label', label: o.label || '', item_id: o.item_id || null, sort: o.sort || 0, created_at: iso(Date.now()), updated_at: core.now(), deleted_at: null });
    const nextSort = arr => arr.reduce((m, r) => Math.max(m, r.sort || 0), 0) + 1024;
    const newId = p => p + '_' + core.uuid().replace(/-/g, '').slice(0, 12);
    function timeRow(o) {
      const at = o.at || Date.now(), subj = M.subjectOf(o.target);
      return { id: o.id || core.uuid(), subject_module: subj.module, subject_kind: subj.kind, subject_id: subj.id, kind: o.kind, duration_sec: o.sec,
        started_at: o.start ? iso(o.start) : null, ended_at: o.end ? iso(o.end) : null, local_date: o.day || M.dayKey(at, TZ), tz: TZ, comment: o.comment || '', tags: [],
        meta: Object.assign({ card: o.target.card_id, target: o.target.id }, o.meta || {}), source_device: device(), created_at: iso(at), updated_at: core.now(), deleted_at: null };
    }
    const card = id => M.cardOf(D, id), nameOf = id => (card(id) ? card(id).name : '');
    const tname = t => M.targetName(D, t);
    const targetById = id => D.targets.find(t => t.id === id) || null;

    /* ---------- карточки ---------- */
    S.addCard = function (name) {
      name = String(name || '').trim().slice(0, 60); if (!name) return null;
      const T = tx(), id = newId('tc'), c = T.put('timer_cards', cardRow({ id, name }, { sort: nextSort(D.cards) }));
      const tg = T.put('timer_targets', targetRow({ id: newId('tg'), card_id: id, kind: 'label', label: '', sort: 1024 }));

        /* отмена: прежние версии возвращаются, созданное заново помечается удалённым (в т.ч. деньги) */
        undo(summary) {
          const U = tx(), seen = {};
          before.slice().reverse().forEach(b => {
            const k = b.table + '/' + b.id; if (seen[k]) return; seen[k] = 1;
            const first = before.find(x => x.table === b.table && x.id === b.id);
            if (b.table === 'money_entries') { U.putMoney(Object.assign({}, b.money, { deleted_at: core.now() })); return; }
            if (b.table === 'shop_settings') { const cs = D.setts[b.id]; if (first.prev) U.rawPut('shop_settings', first.prev); else if (cs) U.rawPut('shop_settings', Object.assign({}, cs, { deleted_at: core.now() })); return; }
            const cur = arrOf(b.table).find(r => r.id === b.id);
            if (first.prev) U.rawPut(b.table, first.prev); else if (cur) U.rawPut(b.table, Object.assign({}, cur, { deleted_at: core.now() }));
          });
          U.log('change', 'undo', '', summary || 'Отмена действия'); U.commit();
        }
      };
      return T;
    }
    S.tx = tx;
    const pick = (o, ks) => { const r = {}; ks.forEach(k => { r[k] = o[k]; }); return r; };
    const cardOnly = o => pick(o, CARD_F);

    const newId = p => p + '_' + core.uuid().replace(/-/g, '').slice(0, 12);
    const item = id => D.items.find(i => i.id === id) || null;
    const itemRow = (o, base) => Object.assign({ id: o.id, name: '', price: 0, unit: 'шт', days: 1, ref_qty: 1, status: 'on', qty: 1, price_now: null, ord_at: iso(Date.now()), due_on: null, checked: false, created_at: iso(Date.now()), deleted_at: null }, base || {}, o);
    const snap = it => ({ status: it.status, qty: it.qty, ord_at: it.ord_at, due_on: it.due_on, price_now: it.price_now, checked: it.checked });
    const reactivate = (it, ordMs) => Object.assign({}, it, { status: 'on', qty: M.weightKind(it.unit) ? it.ref_qty : (it.qty || 1), price_now: null, checked: false, ord_at: iso(ordMs), due_on: null });
    const toOff = it => Object.assign({}, it, { status: 'off', qty: M.startQty(it), price_now: null, ord_at: iso(Date.now()), due_on: null, checked: false });

    /* купленное возвращается в список в календарный день due_on */
    S.refreshDue = function () {
      const t = today(), T = tx(); let n = 0;
      LISTS.forEach(l => view(l).filter(it => it.status === 'bought' && it.due_on && it.due_on <= t).forEach(it => { T.put('shop_items', reactivate(it, TM.zonedTs(it.due_on, '00:00', TZ))); n++; }));
      if (n) T.commit(); return n > 0;
    };

    S.setList = function (n) { if (LISTS.indexOf(n) < 0) return; S.list = n; core.store.set(LIST_KEY, n); rebuild(); changed(); };
    S.nextList = function () { S.setList(S.list % LISTS.length + 1); return S.list; };

    /* ---------- карточки ---------- */
    S.addItem = function (f) {
      const r = M.readFields(f); if (r.error) return r;
      const T = tx(), id = newId('si'), row = itemRow({ id }, r); row.qty = M.startQty(row); T.put('shop_items', row);
      T.log('create', 'item', id, 'Покупка добавлена в список: ' + r.name); T.commit(); return { ok: true, id, tx: T, name: r.name };
    };
    S.editItem = function (id, f) {
      const r = M.readFields(f), it = item(id); if (r.error) return r; if (!it) return { error: 'Карточка не найдена.' };
      const unitChanged = it.unit !== r.unit, priceChanged = +it.price !== r.price, n = Object.assign({}, it, r);
      if (unitChanged || priceChanged) n.price_now = null;
      if (unitChanged && n.status === 'on') n.qty = M.startQty(n);
      const T = tx(); T.put('shop_items', n); T.log('change', 'item', id, 'Покупка изменена: ' + r.name); T.commit(); return { ok: true };
    };
    S.deleteItem = function (id) { const it = item(id); if (!it) return; const T = tx(); T.del('shop_items', it); T.log('delete', 'item', id, 'Покупка удалена: ' + it.name); T.commit(); };
    S.setChecked = function (id, v) { const it = item(id); if (!it || it.status !== 'on') return; const T = tx(); T.put('shop_items', Object.assign({}, it, { checked: !!v })); T.commit(); };

    /* Правка веса и цены в активной карточке: в памяти сразу, в базу — после паузы или при уходе из поля */
    let pend = {}, pendT = null;
    S.setLive = function (id, patch) {
      const it = item(id); if (!it) return; let r = D.st.find(x => x.list_no === S.list && x.item_id === id);
      if (!r) { r = Object.assign({ id: 'l' + S.list + '_' + id, list_no: S.list, item_id: id, created_at: iso(Date.now()), deleted_at: null }, pick(it, STATE_F)); D.st.push(r); }
      Object.assign(r, patch); rebuild(); pend[id + '|' + S.list] = true; clearTimeout(pendT); pendT = setTimeout(() => S.flushPending(), 700);
    };
    S.flushPending = async function () {
      clearTimeout(pendT); const ids = Object.keys(pend); pend = {}; if (!ids.length) return;
      const T = tx(); ids.forEach(k => { const [id, l] = k.split('|'), it = view(+l).find(x => x.id === id); if (it) T.put('shop_items', it); }); T.commit();
    };

    /* Свайпы: вправо = плюс (или вернуть в список), влево = минус (или перестать ждать) */
    S.swipeRight = function (id) {
      const it = item(id); if (!it) return {};
      const T = tx();
      if (it.status === 'off') T.put('shop_items', Object.assign({}, it, { status: 'on', qty: M.startQty(it), price_now: null, ord_at: iso(Date.now()), due_on: null, checked: false }));
      else if (it.status === 'bought') { T.put('shop_items', reactivate(it, Date.now())); T.commit(); return { msg: 'Вернул в список раньше срока.' }; }
      else { const step = M.stepFor(it.unit); if (it.qty + step > M.MAX_QTY) return { msg: 'Больше ' + M.MAX_QTY + ' не добавляю.' }; T.put('shop_items', Object.assign({}, it, { qty: M.round3(+it.qty + step) })); }
      T.commit(); return {};
    };
    S.swipeLeft = function (id) {
      const it = item(id); if (!it) return {};
      const T = tx();
      if (it.status === 'bought') { T.put('shop_items', toOff(it)); T.commit(); return { msg: 'Перестал ждать: ' + it.name + '.', tx: T }; }
      if (it.status !== 'on') return {};
      const step = M.stepFor(it.unit);
      if (it.qty - step > 1e-9) T.put('shop_items', Object.assign({}, it, { qty: M.round3(+it.qty - step) })); else T.put('shop_items', toOff(it));
      T.commit(); return {};
    };
    /* Поиск: поднять карточку наверх, включив, если она не в списке */
    S.pickFound = function (id) {
      const it = item(id); if (!it) return null; const was = it.status, T = tx();
      if (was === 'off') T.put('shop_items', Object.assign({}, it, { status: 'on', qty: M.startQty(it), price_now: null, ord_at: iso(Date.now()), due_on: null, checked: false }));
      else if (was === 'bought') T.put('shop_items', reactivate(it, Date.now()));
      else T.put('shop_items', Object.assign({}, it, { ord_at: iso(Date.now()), checked: false }));
      T.commit(); return { was, name: it.name, tx: T };
    };

    /* ---------- пакеты ---------- */
    S.bag = function (key, clear) { // key 's' | 'l'
      const f = key === 's' ? 'bags_small' : 'bags_large', set = D.settings; if (!clear && set[f] >= 99) return; const T = tx();
      T.put('shop_settings', Object.assign({}, set, { [f]: clear ? 0 : set[f] + 1 })); T.commit();
    };
    S.setBagPrices = function (small, large) {
      const a = M.parsePrice(small), b = M.parsePrice(large); if (!isFinite(a) || !isFinite(b) || a < 0 || b < 0) return { error: 'Цены пакетов должны быть числами.' };
      const T = tx(); LISTS.forEach(l => { if (l === 1 || D.setts[setId(l)]) T.put('shop_settings', Object.assign({}, D.setts[setId(l)] || defSettings(l), { bag_small_price: a, bag_large_price: b })); }); T.log('change', 'settings', 'main', `Цены пакетов: М ${a}, Б ${b}`); T.commit(); return { ok: true };
    };

    /* ---------- покупка ---------- */
    function money(line, extra) {
      return Object.assign({ id: line.id, subject_module: 'shop', subject_kind: 'purchase', subject_id: line.id, direction: 'out', kind: 'fact', amount: line.amount, currency: 'KZT', fx_rate: null, occurred_on: line.local_date, tz: TZ, category: '', comment: line.name,
        meta: { receipt: line.receipt_id, kind: line.kind }, source_device: device(), created_at: line.created_at, deleted_at: null }, extra || {});
    }
    S.buy = function (id) {
      const it = item(id); if (!it || it.status !== 'on') return null;
      const now = Date.now(), day = TM.dayKey(now, TZ), price = M.effPrice(it), q = +it.qty, supply = M.supplyDaysFor(it, q), T = tx();
      let rid = M.receiptFor(D, now, day);
      if (!rid) { rid = newId('rc'); T.put('shop_receipts', { id: rid, started_at: iso(now), local_date: day, created_at: iso(now), deleted_at: null }); }
      const mk = (kind, item_id, name, unit, pr, qty, amount, extra) => Object.assign({ id: core.uuid(), receipt_id: rid, kind, item_id, name, unit, price: pr, qty, amount, days: 1, ref_qty: 1, supply_days: 1, bought_at: iso(now), local_date: day, thing_id: null, created_at: iso(now), deleted_at: null }, extra || {});
      const g = mk('goods', it.id, it.name, it.unit, price, q, M.round2(price * q), { days: it.days, ref_qty: +it.ref_qty, supply_days: supply });
      T.put('shop_purchases', g); T.putMoney(money(g));
      const set = D.settings, bagsText = [];
      [['s', 'bags_small', 'bag_small_price', 'Пакет М', 'bag_s'], ['l', 'bags_large', 'bag_large_price', 'Пакет Б', 'bag_l']].forEach(b => {
        const n = set[b[1]]; if (!n) return; const pr = +set[b[2]], line = mk('bag', b[4], b[3], 'шт', pr, n, M.round2(pr * n)); T.put('shop_purchases', line); T.putMoney(money(line)); bagsText.push(b[3].slice(-1) + n);
      });
      if (bagsText.length) T.put('shop_settings', Object.assign({}, set, { bags_small: 0, bags_large: 0 }));
      const due = TM.shiftDay(day, supply);
      T.put('shop_items', Object.assign({}, it, { status: 'bought', checked: false, due_on: due }));
      D.lastBought[it.name] = now;
      S.rcSync(T, rid);
      T.log('create', 'purchase', g.id, `Куплено: ${it.name}, ${M.fmtQ(q, it.unit)}, ${M.money(g.amount)}${bagsText.length ? '; пакеты ' + bagsText.join(' ') : ''}`); T.commit();
      return { tx: T, name: it.name, text: `${it.name}, ${M.fmtQ(q, it.unit)}`, due };
    };

    /* ---------- «В базу»: сумма чека в трек расходов ---------- */
    /* Состояние хранится в самих записях трека: id 'te_rc_<чек>_<трек>' (одна на чек). Нет записи — чек «не в базе». Новых таблиц нет. */
    const RC = 'te_rc_';
    S.outTracks = () => D.tracks.filter(t => t.kind === 'out' && !t.deleted_at).slice().sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0) || String(a.name).localeCompare(String(b.name), 'ru'));
    const rcRows = rid => D.rcEntries.filter(e => String(e.id).startsWith(RC + rid + '_') && !e.deleted_at);
    S.receiptBase = rid => { const e = rcRows(rid).find(x => D.tracks.some(t => t.id === x.track_id)); return e ? { track: D.tracks.find(t => t.id === e.track_id), value: +e.value } : null; };
    const thousand = amount => Math.round(amount / 100) / 10; /* 13228 → 13,2; 7587 → 7,6 */
    S.rcValue = thousand;
    /* привести запись трека в соответствие с чеком (сумма изменилась или чек исчез); T — открытая транзакция */
    S.rcSync = function (T, rid) {
      const rows = rcRows(rid); if (!rows.length) return;
      const r = M.receiptsOf(D).find(x => x.id === rid);
      rows.forEach(e => {
        if (!r || !r.amount) T.put('track_entries', Object.assign({}, e, { deleted_at: core.now() }));
        else if (+e.value !== thousand(r.amount) || e.day !== r.date) T.put('track_entries', Object.assign({}, e, { value: thousand(r.amount), day: r.date }));
      });
    };
    /* нажатие: серый → трек 1 → трек 2 … → последний → серый */
    S.cycleReceipt = function (rid) {
      const r = M.receiptsOf(D).find(x => x.id === rid); if (!r) return { ok: false, msg: 'Чек не найден.' };
      const outs = S.outTracks(); if (!outs.length) return { ok: false, msg: 'Нет треков расходов: создайте их во вкладке «Треки».' };
      const cur = S.receiptBase(rid), i = cur ? outs.findIndex(t => t.id === cur.track.id) : -1, T = tx();
      rcRows(rid).forEach(e => T.put('track_entries', Object.assign({}, e, { deleted_at: core.now() })));
      const next = i + 1 < outs.length ? outs[i + 1] : null, v = thousand(r.amount);
      if (next) { T.put('track_entries', { id: RC + rid + '_' + next.id, track_id: next.id, day: r.date, value: v, deleted_at: null }); }
      T.log('change', 'receipt', rid, next ? `Чек ${r.date} (${M.money(r.amount)}) в базу: «${next.name}» +${v}` : `Чек ${r.date} (${M.money(r.amount)}): убран из базы`);
      T.commit(); return { ok: true, track: next, value: v };
    };
    S.deleteLine = function (lineId) {
      const l = D.lines.find(x => x.id === lineId); if (!l) return false; const T = tx();
      T.del('shop_purchases', l); T.putMoney(money(l, { deleted_at: core.now() }));
      if (!D.lines.some(x => x.receipt_id === l.receipt_id)) { const r = D.receipts.find(x => x.id === l.receipt_id); if (r) T.del('shop_receipts', r); }
      S.rcSync(T, l.receipt_id);
      T.log('delete', 'purchase', lineId, `Строка чека удалена: ${l.name}, ${M.money(+l.amount)} (${l.local_date})`); T.commit(); return true;
    };
    /* перенос строки чека в «Вещицы»: одна транзакция в базе, нужна связь; повтор безопасен */
    S.moveToThing = async function (lineId) {
      const l = D.lines.find(x => x.id === lineId); if (!l || l.kind !== 'goods') return { ok: false, msg: 'Переносятся только товары.' };
      try { await core.flush(); } catch (e) { /* ниже проверим очередь */ }
      if (core.status().pending > 0) return { ok: false, msg: 'Сначала дождитесь отправки изменений (вверху «Ожидает отправки»).' };
      try {
        const r = await core.request('/rest/v1/rpc/shop_move_to_thing', { method: 'POST', body: { p_line: lineId } });
        l.thing_id = r.data.thing_id; saveCache(); changed();
        return { ok: true, created: !!r.data.created, thingId: r.data.thing_id };
      } catch (e) { return { ok: false, msg: e.net ? 'Нет связи. Перенос возможен только при подключении.' : (/BAG_NOT/.test(e.message) ? 'Пакеты не переносятся.' : e.message) }; }
    };

    /* ---------- перенос из старого приложения (резервная копия kartochki-vremeni/backup/v1, раздел shop) ---------- */
    const rowStamp = (at, now) => ({ created_at: at, updated_at: now, deleted_at: null });
    S.importLegacy = async function (obj) {
      /* копия «Карточек времени»: shops = три списка ({items, bags}), purchases = общие чеки; в более старой копии один список shop = {items, purchases, bags} */
      const lists = obj && Array.isArray(obj.shops) && obj.shops.length ? obj.shops : (obj && obj.shop && Array.isArray(obj.shop.items) ? [obj.shop] : null);
      const purchases = obj && Array.isArray(obj.purchases) ? obj.purchases : (obj && obj.shop && Array.isArray(obj.shop.purchases) ? obj.shop.purchases : null);
      if (!lists || !lists.every(l => l && Array.isArray(l.items)) || !purchases) return { ok: false, msg: 'В копии нет раздела покупок (нужна кнопка «Резервная копия» старых Карточек времени).' };
      const sh = { purchases, bags: lists[0].bags };
      const at = iso(Date.now()), now = core.now(), uid = s => TM.detUuid(s);
      const items = [], states = [], idMap = {}, seen = {}, setts = [];
      lists.slice(0, 3).forEach((lst, li) => {
        const list = li + 1;
        lst.items.forEach(o => {
          const id = 'si_kv' + uid('item' + o.id).slice(0, 10); idMap[o.id] = id;
          const st = ['on', 'off', 'bought'].includes(o.status) ? o.status : 'off', due = st === 'bought' && o.dueKey ? o.dueKey : null;
          const f = { name: String(o.name || 'Без названия').slice(0, 60), price: M.round2(+o.price || 0), unit: String(o.unit || 'шт'), days: Math.max(1, Math.floor(+o.days) || 1), ref_qty: +o.refQty > 0 ? M.round3(+o.refQty) : 1 };
          if (!seen[id]) { seen[id] = 1; items.push(Object.assign({ id, status: 'off', qty: 1, price_now: null, ord_at: iso(+o.ord || Date.now()), due_on: null, checked: false }, f, rowStamp(at, now))); }
          states.push(Object.assign({ id: 'l' + list + '_' + id, list_no: list, item_id: id, status: st === 'bought' && !due ? 'off' : st, qty: +o.qty > 0 ? M.round3(+o.qty) : 1, price_now: o.priceNow != null ? M.round2(+o.priceNow) : null, ord_at: iso(+o.ord || Date.now()), due_on: due, checked: !!o.checked }, rowStamp(at, now)));
        });
        const b = lst.bags || {}, cur = D.setts[setId(list)] || defSettings(list);
        const row = Object.assign({}, cur, { bags_small: Math.max(0, +b.s || 0), bags_large: Math.max(0, +b.l || 0), updated_at: now, deleted_at: null }); delete row.user_id; delete row.updated_by; setts.push(row);
      });
      /* чеки: подряд идущие покупки одного дня, не дальше 5 минут друг от друга */
      const ps = sh.purchases.filter(p => p && p.at).slice().sort((a, b) => a.at - b.at), receipts = [], lines = [], money = []; let cur = null;
      ps.forEach(p => {
        const day = TM.dayKey(p.at, TZ);
        if (!cur || cur.date !== day || p.at - cur.last > M.RECEIPT_GAP_MS) { cur = { id: 'rc_kv' + uid('receipt' + p.id).slice(0, 10), date: day, last: p.at }; receipts.push({ id: cur.id, started_at: iso(p.at), local_date: day, created_at: at, updated_at: now, deleted_at: null }); }
        cur.last = p.at;
        const base = { receipt_id: cur.id, bought_at: iso(p.at), local_date: day, created_at: iso(p.at), updated_at: now, deleted_at: null, thing_id: null };
        const g = Object.assign({ id: uid('line' + p.id), kind: 'goods', item_id: idMap[p.itemId] || null, name: String(p.name || '').slice(0, 60), unit: String(p.unit || 'шт'), price: M.round2(+p.price || 0), qty: +p.qty > 0 ? M.round3(+p.qty) : 1,
          amount: M.round2(+p.amount || 0), days: Math.max(1, Math.floor(+p.days) || 1), ref_qty: +p.refQty > 0 ? M.round3(+p.refQty) : 1, supply_days: Math.max(1, Math.floor(+p.supplyDays) || 1) }, base);
        lines.push(g);
        if (p.bags) [['s', 'bag_s', 'Пакет М', 25], ['l', 'bag_l', 'Пакет Б', 39]].forEach(b => {
          const n = +p.bags[b[0]] || 0; if (!n) return; const tot = +p.bags.amount || 0, price = b[0] === 's' ? 25 : 39;
          lines.push(Object.assign({ id: uid('bag' + b[0] + p.id), kind: 'bag', item_id: b[1], name: b[2], unit: 'шт', price, qty: n, amount: M.round2(n * price), days: 1, ref_qty: 1, supply_days: 1 }, base, { created_at: iso(p.at) }));
        });
      });
      lines.forEach(l => money.push({ id: l.id, subject_module: 'shop', subject_kind: 'purchase', subject_id: l.id, direction: 'out', kind: 'fact', amount: l.amount, currency: 'KZT', fx_rate: null, occurred_on: l.local_date, tz: TZ, category: '', comment: l.name,
        meta: { receipt: l.receipt_id, kind: l.kind, legacy: 'kv' }, source_device: 'import', created_at: l.created_at, updated_at: now, deleted_at: null }));
      const writes = [['shop_items', items], ['shop_receipts', receipts], ['shop_purchases', lines], ['money_entries', money], ['shop_list_state', states], ['shop_settings', setts]].filter(w => w[1].length).map(w => ({ table: w[0], rows: w[1] }));
      const summary = `Импорт покупок из «Карточек времени»: списков ${lists.length}, карточек ${items.length}, чеков ${receipts.length}, строк ${lines.length}`;
      core.commit({ writes, journal: [{ op: 'create', module: MOD, entity_kind: 'import', entity_id: 'kv', summary }] });
      await S.load(); return { ok: true, text: summary + '.' };
    };

    /* Выгрузка чеков «kartochki-vremeni/purchases/v1» (кнопки выгрузки в старых и новых Покупках). Идентификаторы те же, что у переноса из резервной копии,
       поэтому одна и та же покупка не задвоится при любом порядке переносов. Уже имеющиеся строки и карточки не трогаем. Новые карточки (по одной на товар) создаются
       «не в списке», а если товар куплен недавно, то «куплено» с датой возврата из выгрузки. */
    S.importPurchases = async function (data) {
      if (!data || data.schema !== 'kartochki-vremeni/purchases/v1' || !Array.isArray(data.receipts)) return { ok: false, msg: 'Это не выгрузка чеков (нужен формат purchases/v1).' };
      const at = iso(Date.now()), now = core.now(), uid = x => TM.detUuid(x), today = TM.dayKey(Date.now(), TZ);
      const haveItem = new Set(D.cards.map(i => i.id)), haveLine = new Set(D.lines.map(l => l.id)), haveRc = new Set(D.receipts.map(r => r.id));

<script>
/* ---- modules/overview-model.js ---- */
/* «Обзор»: чистые расчёты для сводных карточек (без экрана и сети). window.LifeOverviewModel.
   Берёт уже загруженные данные других модулей и считает плитки, итоги сфер, сводку покупок. */
(function (global) {
  'use strict';
  const pad = n => String(n).padStart(2, '0');
  const clock = sec => { sec = Math.max(0, Math.floor(sec)); return Math.floor(sec / 3600) + ':' + pad(Math.floor(sec % 3600 / 60)) + ':' + pad(sec % 60); };
  const spc = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  const hmin = min => { min = Math.round(min); if (min <= 0) return '0м'; const h = Math.floor(min / 60), m = min % 60; return h ? h + 'ч ' + pad(m) + 'м' : m + 'м'; };
  const hours = sec => { const m = Math.round(sec / 60); return Math.floor(m / 60) + ' ч ' + (m % 60) + ' м'; };
  const r1 = x => Math.round(x * 10) / 10;
  const dec = x => String(r1(x)).replace('.', ',');
  const plural = (n, a, b, c) => { const k = Math.abs(n) % 100, d = k % 10; return k > 10 && k < 20 ? c : d === 1 ? a : d > 1 && d < 5 ? b : c; };

  /* Время за день: записи таймеров (сессии и поправки) + идущие сейчас. Запусков: записи с началом и идущие. */
  function timersToday(D, today, now) {
    let sec = 0, runs = 0; const by = {};
    D.entries.forEach(e => {
      if (e.local_date !== today) return;
      const s = +e.duration_sec || 0, c = (e.meta || {}).card; sec += s; if (e.started_at) runs++;
      if (c) { const o = by[c] = by[c] || { sec: 0, n: 0 }; o.sec += s; if (e.started_at) o.n++; }
    });
    D.runs.forEach(r => { const s = Math.max(0, (now - Date.parse(r.started_at)) / 1000); sec += s; runs++; const o = by[r.card_id] = by[r.card_id] || { sec: 0, n: 0 }; o.sec += s; o.n++; });
    return { sec, runs, by };
  }

  /* Деньги по трекам за n последних дней (включая сегодня): kind 'in' или 'out'; значения в тыс. ₸ */
  function moneyPeriod(T, TM, today, n, kind) {
    const from = TM.shiftDay(today, -(n - 1)); let total = 0; const parts = [];
    T.D.tracks.filter(t => t.kind === kind && t.status !== 'off').forEach(t => {
      const by = T.byDay(t.id); let s = 0;
      Object.keys(by).forEach(d => { if (d >= from && d <= today) s += TM.sumOf(by[d]); });
      if (s) { total += s; parts.push({ name: t.name, sum: s }); }

  function moodDays(marks, TM, today, n) {

    for (let i = 0; i < n; i++) if (days.has(TM.shiftDay(today, -i))) c++;
    return c;
  }

  /* Сферы: итоги по каждой сфере и дерево «группа → дела» (до depth уровней, не больше lim дел на уровень) */
  function spheres(SM, S, now, opt) {
    opt = opt || {}; const c = SM.buildCtx(S, now), freeOnly = !!opt.freeOnly, lim = opt.lim || 4, depth = opt.depth || 2;
    const sum = list => list.reduce((a, i) => { const t = c.calc(i.id); a.sec += t.sec; a.planMin += t.planMin; a.planMoney += t.planMoney; a.money += t.money; return a; }, { sec: 0, planMin: 0, planMoney: 0, money: 0 });
    const keep = i => !i.done && (!freeOnly || c.calc(i.id).planMoney === 0);
    function node(i, d) {
      const t = c.calc(i.id), st = c.status(i), kids = (c.kids[i.id] || []).filter(keep);

  /* Покупки: что в списке (status on), сколько отмечено в корзине и на какую сумму */

  }

</script>

.se-nav button:hover{background:var(--ui-soft)}.se-nav button.on{background:var(--ui-main-soft);color:var(--ui-main);font-weight:650}
.se-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:var(--ui-gap)}
.se-sec h2{margin:0 0 4px;font-size:16px;font-weight:650}.se-sec>.ui-mut{font-size:12px;margin-bottom:10px}
.se-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--ui-line);flex-wrap:wrap}.se-row:first-of-type{border-top:0}
.se-row>label,.se-row>.l{flex:0 0 210px;font-weight:550}.se-row small{display:block;font-weight:400;color:var(--ui-mut);font-size:11px}
.se-row .v{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.se-row input[type=color]{width:44px;height:30px;padding:0;border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-card);cursor:pointer}
.se-row input[type=range]{width:200px;accent-color:var(--ui-main)}
.se-row input[type=checkbox],.se-li input[type=checkbox],.se-li input[type=radio]{accent-color:var(--ui-main);width:16px;height:16px}
.se-li{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--ui-line);border-radius:var(--ui-r-s);background:var(--ui-soft);margin-bottom:6px}
.se-li.off{opacity:.55}.se-li .n{flex:1;min-width:0}.se-li .n small{color:var(--ui-mut);margin-left:6px}
.se-li .mv{display:flex;gap:4px}.se-li .mv button{width:28px;padding:2px 0}
.se-sample{padding:10px 14px;border:1px dashed var(--ui-line);border-radius:var(--ui-r-s);margin-top:6px}
.se-pv{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.se-chips{display:flex;gap:6px;flex-wrap:wrap}.se-chips .ui-chip{cursor:pointer;font:inherit;font-size:12px}.se-chips .ui-chip.on{background:var(--ui-main-soft);border-color:var(--ui-main)}
.se-sw{display:inline-flex;gap:3px;margin-right:2px}.se-sw i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid var(--ui-line)}
.se-msg{font-size:12px;color:var(--ui-bad);min-height:16px}.se-ok{color:var(--ui-ok)}
.se-sub{font-weight:650;margin:14px 0 6px}
.se-foot{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
@media(max-width:760px){.se{flex-direction:column}.se-nav{width:100%;flex-direction:row;overflow-x:auto;position:static}.se-row>label,.se-row>.l{flex-basis:100%}}`;

</script>
<script>
/* ---- modules/settings.js ---- */
/* «Настройки» (компьютер): профиль, оформление, модули, «Обзор», наборы. Всё пишется сразу, без кнопки «сохранить»
   (кроме имени). Данные и действия — settings-store.js (ctx.settings), каталог — settings-model.js.
   Точка входа: LifeModules.settings.mount(элемент, {core, onAuthLost, settings, profile}) → {unmount, reload}.
   ctx.profile = { name(): строка, saveName(имя): Promise } — имя хранится в profiles.display_name (даёт оболочка). */
(function (global) {
  'use strict';
  const M = global.LifeSettingsModel;
  global.LifeModules = global.LifeModules || {};
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const SECS = [['profile', 'Профиль'], ['theme', 'Оформление'], ['modules', 'Модули'], ['widgets', 'Виджеты'], ['overview', 'Обзор'], ['presets', 'Наборы и сброс']];
  const SEC_KEY = 'lifeerp-settings-sec';
  const START = { bg: '#f1efea', card: '#ffffff', text: '#1f2a24' };

  function resizeImage(file) {
    return new Promise((res, rej) => {
      const u = URL.createObjectURL(file), im = new Image();
      im.onload = () => { const n = 128, c = document.createElement('canvas'); c.width = c.height = n; const k = Math.max(n / im.width, n / im.height), w = im.width * k, h = im.height * k;
        c.getContext('2d').drawImage(im, (n - w) / 2, (n - h) / 2, w, h); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.86)); };
      im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Не удалось прочитать картинку')); }; im.src = u;
    });
  }

  function mount(el, ctx) {
    ctx = ctx || {};
    const core = ctx.core || global.LifeCore, S = ctx.settings, prof = ctx.profile || { name: () => '', saveName: async () => {} };
    if (!document.getElementById('se-css')) { const s = document.createElement('style'); s.id = 'se-css'; s.textContent = global.LifeSettingsCss; document.head.appendChild(s); }
    let sec = core.store.get(SEC_KEY, 'profile'); if (!SECS.some(x => x[0] === sec)) sec = 'profile';
    let alive = true, draft = null, msg = '', ok = '';
    const V = k => S.get(k), C = k => M.CATALOG[k];
    el.innerHTML = '<div class="se"><nav class="se-nav" aria-label="Разделы настроек"></nav><div class="se-body"></div></div>';
    const nav = el.querySelector('.se-nav'), body = el.querySelector('.se-body');

    /* ---------- строительные блоки ---------- */
    const chips = (key, opts) => `<span class="se-chips">${opts.map(o => `<button type="button" class="ui-chip ${String(V(key)) === String(o[0]) ? 'on' : ''}" data-set="${key}" data-val="${esc(o[0])}">${esc(o[1])}</button>`).join('')}</span>`;
    const row = (key, ctl, extra) => `<div class="se-row"><label>${esc(C(key).label)}${C(key).hint ? `<small>${esc(C(key).hint)}</small>` : ''}</label><div class="v">${ctl}${extra || ''}</div></div>`;
    const colorRow = key => {
      const c = C(key), v = V(key);
      if (c.emptyOk && !v) return row(key, '<span class="ui-mut">по умолчанию</span>', `<button type="button" class="ui-btn sm" data-own="${key}">Свой цвет</button>`);
      return row(key, `<input type="color" data-k="${key}" value="${esc(v)}" aria-label="${esc(c.label)}">`, `<span class="ui-mut">${esc(v)}</span>` + (v !== c.def ? `<button type="button" class="ui-btn sm" data-reset="${key}">По умолчанию</button>` : ''));
    };
    const rangeRow = key => { const c = C(key); return row(key, `<input type="range" data-k="${key}" min="${c.min}" max="${c.max}" step="${c.step}" value="${V(key)}"><b data-out="${key}">${V(key)}${c.unit}</b>`); };
    const boolRow = key => row(key, `<input type="checkbox" data-k="${key}" ${V(key) ? 'checked' : ''}>`);
    const selRow = key => row(key, `<select class="ui-in" data-k="${key}">${C(key).opts.map(o => `<option value="${esc(o[0])}" ${String(V(key)) === String(o[0]) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`);
    /* Список с порядком (↑↓) и галочкой «показывать» */
    function orderList(orderKey, hiddenKey, items, opt) {
      opt = opt || {}; const label = {}; items.forEach(x => { label[x[0]] = x; }); const ord = V(orderKey), hid = V(hiddenKey);
      return ord.map((id, i) => { const it = label[id]; if (!it) return '';
        return `<div class="se-li ${hid.includes(id) ? 'off' : ''}"><input type="checkbox" data-show="${hiddenKey}" data-id="${id}" ${hid.includes(id) ? '' : 'checked'} aria-label="Показывать: ${esc(it[1])}">
          <span class="n">${esc(it[1])}${it[2] ? `<small>${esc(it[2])}</small>` : ''}</span>${opt.start ? `<label class="ui-mut" style="font-size:12px"><input type="radio" name="st-start" data-start="${id}" ${V('layout.start') === id ? 'checked' : ''}> при входе</label>` : ''}
          <span class="mv"><button type="button" class="ui-btn sm" data-mv="${orderKey}" data-id="${id}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="Выше">↑</button><button type="button" class="ui-btn sm" data-mv="${orderKey}" data-id="${id}" data-d="1" ${i === ord.length - 1 ? 'disabled' : ''} aria-label="Ниже">↓</button></span></div>`; }).join('');
    }
    const resetBtn = (pref, text) => `<div class="se-foot"><button type="button" class="ui-btn sm" data-resetsec="${pref}">${text || 'Сбросить раздел к умолчанию'}</button></div>`;

    /* ---------- разделы ---------- */
    function secProfile() {
      const nm = draft == null ? prof.name() : draft, img = V('profile.avatar');
      return `<section class="ui-card se-sec"><h2>Профиль</h2><div class="ui-mut">Имя видно в боковой панели и тем, у кого есть доступ к вашим данным. Картинка заполняет квадратик слева вверху.</div>
        <div class="se-pv"><span class="sh-av" data-av></span><div><button type="button" class="ui-btn sm" data-a="pick">Выбрать картинку</button> <button type="button" class="ui-btn sm" data-a="clear" ${img ? '' : 'disabled'}>Убрать</button><input type="file" accept="image/*" hidden>
        <div class="ui-mut" style="font-size:11px;margin-top:6px">Картинка уменьшается до 128×128 и хранится в вашей базе.</div></div></div>
        ${boolRow('profile.showLetter')}<div class="se-row"><label for="st-name">Имя</label><div class="v"><input id="st-name" class="ui-in" data-f="name" maxlength="60" placeholder="Как вас называть" value="${esc(nm)}"><button type="button" class="ui-btn main" data-a="savename">Сохранить имя</button></div></div>
        <div class="se-msg ${ok ? 'se-ok' : ''}" role="status">${esc(msg || ok)}</div></section>`;
    }
    /* Страницы со своим оформлением (задаётся кнопкой-палитрой в верхней строке страницы) */
    function pagesBlock() {
      const list = M.MODULES.filter(m => M.pageOwn(S.all(), m.id).length);
      return `<div class="se-sub">Страницы со своим оформлением</div>` + (list.length ? list.map(m => `<div class="se-li"><span class="n">${esc(m.title)}<small>${M.pageOwn(S.all(), m.id).length} изм.</small></span><button type="button" class="ui-btn sm" data-resetsec="modules.${m.id}.">Сбросить</button></div>`).join('') : '<div class="ui-mut" style="font-size:12px">Нет. Откройте любую страницу и нажмите кнопку-палитру справа вверху: цвета, шрифт и масштаб можно задать только для неё.</div>');
    }
    function secTheme() {
      const f = M.FONTS[V('theme.font')] || M.FONTS.onest;
      return `<section class="ui-card se-sec"><h2>Оформление</h2><div class="ui-mut">Изменения видны сразу. Свои фон, карточки и текст действуют в светлой теме.</div>
        ${row('theme.mode', chips('theme.mode', C('theme.mode').opts))}${colorRow('theme.accent')}${colorRow('theme.income')}${colorRow('theme.expense')}${colorRow('theme.danger')}${colorRow('theme.bg')}${colorRow('theme.card')}${colorRow('theme.text')}
        ${selRow('theme.font')}<div class="se-row"><div class="l">Образец</div><div class="v"><div class="se-sample" style="font-family:${esc(f.stack)}">Съешь ещё этих мягких французских булок — 0123456789 ₸</div></div></div>
        ${rangeRow('theme.fontScale')}${rangeRow('theme.radius')}${row('theme.density', chips('theme.density', C('theme.density').opts))}${boolRow('theme.shadows')}${boolRow('theme.railLabels')}
        ${pagesBlock()}
        ${resetBtn('theme.', 'Сбросить оформление')}<div class="ui-mut" style="font-size:12px;margin-top:8px">Тема, цвета и шрифты действуют на оболочку и экран «Обзор»; остальные экраны подключатся по мере переноса на новый стиль.</div></section>`;
    }
    function secModules() {
      const items = M.MODULES.map(m => [m.id, m.title]);
      return `<section class="ui-card se-sec"><h2>Модули</h2><div class="ui-mut">Порядок вкладок, какие показывать и какой открывать при входе. Скрытые модули не удаляются, их данные остаются. «Данные» и «Настройки» всегда доступны через меню.</div>
        ${orderList('layout.order', 'layout.hidden', items, { start: true })}<div class="se-msg" role="status">${esc(msg)}</div>${row('layout.dockOpen', `<input type="checkbox" data-k="layout.dockOpen" ${V('layout.dockOpen') ? 'checked' : ''}>`)}${resetBtn('layout.', 'Сбросить раскладку')}</section>`;
    }
    function secOverview() {
      return `<section class="ui-card se-sec"><h2>Обзор</h2><div class="ui-mut">Какие блоки показывать, в каком порядке и как их сортировать.</div>
        <div class="se-sub">Основная часть</div>${orderList('overview.blocks', 'overview.hidden', M.OV_BLOCKS)}
        <div class="se-sub">Правая колонка</div>${orderList('overview.side', 'overview.sideHidden', M.OV_SIDE)}
        <div class="se-sub">Строка поиска</div><div class="se-row"><label>Показывать строку поиска и «Быструю запись»<small>всегда вверху страницы</small></label><div class="v"><input type="checkbox" data-show="overview.hidden" data-id="search" ${V('overview.hidden').includes('search') ? '' : 'checked'}></div></div>
        <div class="se-sub">Сферы жизни</div>${selRow('overview.spheresSort')}${rangeRow('overview.spheresOpen')}${rangeRow('overview.itemLimit')}${boolRow('overview.freeOnly')}
        <div class="se-sub">Треки</div>${row('overview.tracksDays', chips('overview.tracksDays', C('overview.tracksDays').opts))}${row('overview.tracksKind', chips('overview.tracksKind', C('overview.tracksKind').opts))}${selRow('overview.tracksSort')}
        ${resetBtn('overview.', 'Сбросить «Обзор»')}</section>`;
    }
    function secWidgets() {
      return `<section class="ui-card se-sec"><h2>Виджеты быстрого просмотра</h2><div class="ui-mut">Маленькие карточки сверху «Обзора». Включайте нужные и расставляйте по порядку; когда включено больше пяти, они ложатся в два ряда. Новые виджеты и настройки каждого будут добавляться сюда.</div>
        ${orderList('overview.tiles', 'overview.tilesHidden', M.OV_TILES)}${resetBtn('overview.tile', 'Сбросить виджеты')}</section>`;
    }
    function secPresets() {
      const sw = d => `<span class="se-sw"><i style="background:${esc(d['theme.accent'] || '#1f5c45')}"></i><i style="background:${esc(d['theme.income'] || '#2f7d7a')}"></i><i style="background:${esc(d['theme.expense'] || '#b7791f')}"></i></span>`;
      const mine = kind => S.presets(kind).map(p => `<div class="se-li"><span class="n">${kind === 'theme' ? sw(p.data || {}) : ''}${esc(p.name)}</span><button type="button" class="ui-btn sm" data-preset="${esc(p.id)}" data-kind="${kind}">Применить</button><button type="button" class="ui-btn sm" data-delpreset="${esc(p.id)}" aria-label="Удалить набор ${esc(p.name)}">Удалить</button></div>`).join('') || '<div class="ui-mut" style="font-size:13px;margin-bottom:8px">Пока нет своих наборов.</div>';
      return `<section class="ui-card se-sec"><h2>Наборы оформления</h2><div class="ui-mut">Готовые наборы меняют режим и цвета. В ваш набор попадает всё оформление: режим, цвета, шрифт, масштаб, скругления, плотность.</div>
        <div class="se-sub">Готовые</div>${M.BUILTIN_THEMES.map(b => `<div class="se-li"><span class="n">${sw(b.data)}${esc(b.name)}</span><button type="button" class="ui-btn sm" data-builtin="${b.id}">Применить</button></div>`).join('')}
        <div class="se-sub">Мои</div>${mine('theme')}<div class="se-foot"><input class="ui-in" data-f="pname" data-kind="theme" maxlength="60" placeholder="Название набора"><button type="button" class="ui-btn" data-savepreset="theme">Сохранить текущее оформление</button></div></section>
        <section class="ui-card se-sec"><h2>Наборы раскладки</h2><div class="ui-mut">Порядок и видимость модулей, стартовая вкладка.</div>${mine('layout')}<div class="se-foot"><input class="ui-in" data-f="pname" data-kind="layout" maxlength="60" placeholder="Название набора"><button type="button" class="ui-btn" data-savepreset="layout">Сохранить текущую раскладку</button></div></section>
        <section class="ui-card se-sec"><h2>Сброс</h2><div class="ui-mut">Вернуть все настройки (кроме имени и картинки) к значениям по умолчанию.</div><div class="se-foot"><button type="button" class="ui-btn" data-resetall>Сбросить всё</button></div><div class="se-msg ${ok ? 'se-ok' : ''}" role="status">${esc(msg || ok)}</div></section>`;
    }
    const SECF = { profile: secProfile, theme: secTheme, modules: secModules, widgets: secWidgets, overview: secOverview, presets: secPresets };

    function paintAv() {
      const av = body.querySelector('[data-av]'); if (!av) return; const img = V('profile.avatar'), inp = body.querySelector('[data-f=name]'), nm = (inp ? inp.value : prof.name()) || core.email() || '?';
      const ch = esc(nm.trim().charAt(0).toUpperCase() || '?');
      av.innerHTML = img ? '<img alt="">' + (V('profile.showLetter') ? '<span class="ltr">' + ch + '</span>' : '') : ch; if (img) av.firstChild.src = img;
    }
    function render() {
      if (!alive) return; const y = global.scrollY;
      if (S.state === 'error') { nav.innerHTML = ''; body.innerHTML = `<section class="ui-card"><h2>Настройки</h2><div class="ov-err" style="color:var(--ui-bad)">${esc(S.note || 'Не удалось прочитать настройки')}</div><button class="ui-btn" data-reload type="button">Повторить</button></section>`; return; }
      nav.innerHTML = SECS.map(s => `<button type="button" class="${s[0] === sec ? 'on' : ''}" data-sec="${s[0]}">${esc(s[1])}</button>`).join('');
      body.innerHTML = (S.note ? `<div class="ui-mut" style="font-size:12px">${esc(S.note)}</div>` : '') + SECF[sec](); paintAv(); global.scrollTo(0, y);
    }

    /* ---------- действия ---------- */
    const fail = r => { msg = r && r.msg ? r.msg : ''; };
    function setVal(key, el2) {
      const c = C(key); let v;
      if (c.type === 'bool') v = el2.checked; else if (c.type === 'int') v = +el2.value; else v = el2.value;
      S.set(key, v);
    }
    body.addEventListener('input', e => {
      const t = e.target; if (t.dataset.f === 'name') { draft = t.value; paintAv(); }
      if (t.type === 'range') { const o = body.querySelector(`[data-out="${t.dataset.k}"]`); if (o) o.textContent = t.value + C(t.dataset.k).unit; }
    });
    body.addEventListener('change', async e => {
      const t = e.target; msg = ''; ok = '';
      if (t.type === 'file') { if (!t.files[0]) return; try { S.set('profile.avatar', await resizeImage(t.files[0])); } catch (ex) { msg = ex.message; render(); } t.value = ''; return; }
      if (t.dataset.k) return setVal(t.dataset.k, t);
      if (t.dataset.show) { /* галочка «показывать» */
        const key = t.dataset.show, id = t.dataset.id; let h = V(key).filter(x => x !== id); if (!t.checked) h = h.concat(id);
        if (key === 'layout.hidden' && M.MODULES.every(m => h.includes(m.id))) { msg = 'Хотя бы один модуль должен быть виден.'; render(); return; }
        S.set(key, h); return;
      }
      if (t.dataset.start) { S.set('layout.start', t.dataset.start); }
    });
    body.addEventListener('click', async e => {
      const t = e.target.closest('button,label'); if (!t) return; msg = ''; ok = '';
      const d = t.dataset;
      if (d.reload !== undefined) { S.load(); return; }
      if (d.set) { S.set(d.set, d.val); return; }
      if (d.own) { S.set(d.own, START[d.own.split('.')[1]]); return; }
      if (d.reset) { S.reset([d.reset]); return; }
      if (d.resetsec) { S.reset(d.resetsec); return; }
      if (d.mv) { const arr = V(d.mv).slice(), i = arr.indexOf(d.id), j = i + +d.d; if (i < 0 || j < 0 || j >= arr.length) return; arr.splice(j, 0, arr.splice(i, 1)[0]); S.set(d.mv, arr); return; }
      if (d.a === 'pick') { body.querySelector('input[type=file]').click(); return; }
      if (d.a === 'clear') { S.set('profile.avatar', ''); return; }
      if (d.a === 'savename') {
        const name = (draft == null ? prof.name() : draft).trim(); t.disabled = true;
        try { await prof.saveName(name); S.set('profile.name', name); draft = null; ok = 'Имя сохранено.'; } catch (ex) { msg = 'Имя не сохранилось: ' + (ex.net ? 'нет связи с базой' : (ex.message || 'ошибка')) + '. Попробуйте ещё раз.'; }
        render(); return;
      }
      if (d.builtin) { const b = M.BUILTIN_THEMES.find(x => x.id === d.builtin); if (b) S.applyData('theme', b.data, 'Применён набор «' + b.name + '»'); return; }
      if (d.preset) { const p = S.presets(d.kind).find(x => x.id === d.preset); if (p) S.applyData(d.kind, p.data, 'Применён набор «' + p.name + '»'); return; }
      if (d.delpreset) { if (confirm('Удалить этот набор?')) S.deletePreset(d.delpreset); return; }
      if (d.savepreset) { const inp = body.querySelector(`[data-f=pname][data-kind=${d.savepreset}]`), r = S.savePreset(d.savepreset, inp.value); if (!r.ok) { msg = r.msg; render(); } else { ok = r.updated ? 'Набор обновлён.' : 'Набор сохранён.'; render(); } return; }
      if (d.resetall !== undefined) { if (confirm('Сбросить все настройки оформления, раскладки и «Обзора»?')) { ['theme.', 'layout.', 'overview.'].forEach(p => S.reset(p)); ok = 'Настройки сброшены.'; render(); } return; }
    });

<script>
/* ---- modules/data-model.js ---- */
/* «Данные»: чистая логика единой выгрузки и восстановления (без экрана и сети). window.LifeDataModel.
   Файл: {app:'lifeerp-backup', format:1, created, user:{id,email}, migrations:[…], tables:{имя:{module, pk:[…], rows:[…]}}}.
   Восстановление только дописывает: новые строки добавляются, более новые версии из файла заменяют старые, более свежее в базе
   остаётся как есть, ничего не удаляется (удалённое помечено deleted_at и едет как обычная строка). */
(function (global) {
  'use strict';
  const APP = 'lifeerp-backup', FORMAT = 1;
  /* родители раньше детей (внешние ключи); неизвестные таблицы идут в конце в порядке файла */
  const ORDER = ['currencies', 'fx_rates', 'thing_groups', 'things', 'sphere_groups', 'spheres', 'sphere_items', 'sphere_comments', 'shop_items', 'shop_receipts', 'shop_settings', 'shop_list_state', 'shop_purchases',
    'timer_cards', 'timer_targets', 'timer_runs', 'time_entries', 'money_entries', 'entity_links', 'mood_tags', 'mood_marks', 'diaries', 'diary_entries', 'tracks', 'track_entries', 'track_day_notes',
    'activities', 'activity_cost_items', 'plan_slots'];
  /* служебные столбцы, которые сервер заполняет сам: при восстановлении не отправляются */
  const STRIP = ['user_id', 'updated_by'], STRIP_TABLE = { track_entries: ['seq'], activity_cost_items: ['seq'] };
  const CHUNK = 200;

  const sortTables = names => { const o = ORDER.filter(n => names.includes(n)); return o.concat(names.filter(n => !ORDER.includes(n))); };
  const keyOf = (row, pk) => pk.map(c => String(row[c])).join('\u0001');
  const ts = v => { const t = Date.parse(v); return isFinite(t) ? t : 0; };
  const chunks = (a, n) => { const o = []; for (let i = 0; i < a.length; i += n || CHUNK) o.push(a.slice(i, i + (n || CHUNK))); return o; };
  const clean = (name, row) => { const o = Object.assign({}, row); STRIP.concat(STRIP_TABLE[name] || []).forEach(c => { delete o[c]; }); return o; };
  const stamp = d => { const p = x => String(x).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()); };

  function buildFile(o) {
    const tables = {}; (o.tables || []).forEach(t => { tables[t.name] = { module: t.module, pk: t.pk, rows: t.rows }; });
    return { app: APP, format: FORMAT, created: o.created || new Date().toISOString(), user: o.user || null, migrations: o.migrations || [], tables };
  }
  function parseFile(text) {
    let f = text; if (typeof text === 'string') { try { f = JSON.parse(text); } catch (e) { return { ok: false, error: 'Это не JSON: файл повреждён или обрезан.' }; } }
    if (!f || f.app !== APP) return { ok: false, error: 'Это не файл выгрузки LifeERP (нет метки app: "' + APP + '").' };
    if (f.format !== FORMAT) return { ok: false, error: 'Формат файла ' + f.format + ' не поддерживается этой версией.' };
    if (!f.tables || typeof f.tables !== 'object') return { ok: false, error: 'В файле нет разделов с данными.' };
    for (const n of Object.keys(f.tables)) { const t = f.tables[n]; if (!t || !Array.isArray(t.rows) || !Array.isArray(t.pk) || !t.pk.length) return { ok: false, error: 'Раздел «' + n + '» повреждён.' }; }
    return { ok: true, file: f };
  }
  const totalRows = f => Object.keys(f.tables).reduce((a, n) => a + f.tables[n].rows.length, 0);

  /* сверка файла с базой: current — {таблица: строки базы}; registered — {таблица: pk_cols} (из core_sync_tables) */
  function plan(file, current, registered) {
    const out = [], skipped = [];
    sortTables(Object.keys(file.tables)).forEach(name => {
      const t = file.tables[name], reg = registered[name];
      if (!reg) { skipped.push(name); return; }
      const pk = reg, have = new Map((current[name] || []).map(r => [keyOf(r, pk), r])), seen = new Set(), write = []; let added = 0, upd = 0, same = 0, newer = 0;
      t.rows.forEach(r => {
        if (pk.some(c => r[c] == null)) return; const k = keyOf(r, pk); seen.add(k); const ex = have.get(k);
        if (!ex) { added++; write.push(r); } else if (ts(r.updated_at) > ts(ex.updated_at)) { upd++; write.push(r); } else if (ts(r.updated_at) === ts(ex.updated_at)) same++; else newer++;
      });
      let extra = 0; have.forEach((v, k) => { if (!seen.has(k)) extra++; });
      out.push({ name, module: t.module, added, upd, same, newer, extra, total: t.rows.length, write });
    });
    const sum = f => out.reduce((a, t) => a + t[f], 0);
    return { tables: out, skipped, added: sum('added'), upd: sum('upd'), same: sum('same'), newer: sum('newer'), extra: sum('extra'), toWrite: sum('added') + sum('upd') };
  }

    const parts = ['Будет добавлено строк ' + p.added, 'обновится ' + p.upd, 'совпало ' + p.same, 'в базе новее, чем в файле, останется как в базе ' + p.newer];
    return parts.join(', ') + (p.extra ? '. Есть в базе, но нет в файле: ' + p.extra + ' (не удаляются)' : '') + (p.skipped.length ? '. Пропущены таблицы, которых нет в базе: ' + p.skipped.join(', ') : '') + '.';
  }
  global.LifeDataModel = { APP, FORMAT, ORDER, CHUNK, sortTables, keyOf, chunks, clean, stamp, buildFile, parseFile, totalRows, plan, planText };
})(window);


</script>

<script>
/* ---- modules/data-store.js ---- */
/* «Данные»: чтение базы и запись при восстановлении. LifeDataStore.create(core) → S. Только через core.select и core.commit. */
(function (global) {
  'use strict';
  const M = global.LifeDataModel;
  function create(core) {
    const S = { lastError: '' };
    async function registry() {
      const r = await core.request('/rest/v1/core_sync_tables?select=table_name,module,pk_cols'), o = {};
      (Array.isArray(r.data) ? r.data : []).forEach(t => { o[t.table_name] = { module: t.module, pk: t.pk_cols }; });
      return o;
    }
    S.exportAll = async function (progress) {
      progress = progress || (() => {});
      const reg = await registry(), names = M.sortTables(Object.keys(reg)), tables = [];
      for (let i = 0; i < names.length; i++) {
        progress('Читаю ' + names[i] + ' (' + (i + 1) + ' из ' + names.length + ')…');
        const rows = await core.select(names[i], {});
        tables.push({ name: names[i], module: reg[names[i]].module, pk: reg[names[i]].pk, rows });
      }
      let migrations = []; try { const r = await core.request('/rest/v1/core_migrations?select=id&order=id'); migrations = (Array.isArray(r.data) ? r.data : []).map(x => x.id); } catch (e) { /* не критично */ }
      return M.buildFile({ tables, migrations, user: { id: core.viewUser(), email: core.email() } });
    };
    S.plan = async function (file, progress) {
      progress = progress || (() => {});
      const reg = await registry(), current = {}, pks = {}, names = Object.keys(file.tables).filter(n => reg[n]);
      for (let i = 0; i < names.length; i++) { progress('Сверяю ' + names[i] + ' (' + (i + 1) + ' из ' + names.length + ')…'); current[names[i]] = await core.select(names[i], {}); pks[names[i]] = reg[names[i]].pk; }
      Object.keys(file.tables).forEach(n => { if (reg[n]) pks[n] = reg[n].pk; });
      return M.plan(file, current, pks);
    };
    /* пишет по таблицам в порядке «родители раньше детей»; после всего один повтор «не принятых» (на случай порядка ключей) */
    S.restore = async function (file, p, progress) {
      progress = progress || (() => {});
      let sent = 0; const before = core.deadList().length;
      for (const t of p.tables) {
        if (!t.write.length) continue;
        progress('Записываю ' + t.name + ' (' + t.write.length + ')…');
        M.chunks(t.write.map(r => M.clean(t.name, r))).forEach(ch => core.commit({ writes: [{ table: t.name, rows: ch }], journal: [] }));
        sent += t.write.length; await core.flush();
      }
      await core.flush();
      let dead = core.deadList().length - before;
      if (dead > 0) { progress('Повторяю не принятые строки…'); await core.retryDead(); await core.flush(); dead = core.status().dead; }
      core.commit({ writes: [], journal: [{ op: 'sys', module: 'shell', entity_kind: 'restore', entity_id: file.created || '', summary: 'Восстановление из файла выгрузки от ' + (file.created || '?') + ': отправлено строк ' + sent }] });
      await core.flush();
      return { sent, dead: Math.max(0, dead), pending: core.status().pending };
    };
    return S;
  }
  global.LifeDataStore = { create };
})(window);


</script>
<script>

(function (global) {
  'use strict';

  const UI_KEY = 'lifeerp-data-ui', STALE_DAYS = 14;

    let alive = true, busy = '', msg = '', msgBad = false, text = '', file = null, planObj = null, foreign = false, okForeign = false, confirm = false, last = core.store.get(UI_KEY, null) || {};
