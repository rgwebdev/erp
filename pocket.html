<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00E6A0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="pocket-icon.svg" type="image/svg+xml">
<link rel="icon" href="pocket-icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="pocket-icon-512.png">
<title>LifeERP: телефон</title>
</head>
<body>
<div id="app"></div>
<script>
/* ---- core/core.js ---- */
/* LifeERP core: вход, сессия, запросы к Supabase, чтение, запись через lifeerp_upsert,
   офлайн-очередь и журнал. Без библиотек, один файл. Подключается обычным <script>, даёт window.LifeCore.

   Ключи localStorage те же, что у старого клиента: lifeerp-conn (адрес и ключ), lifeerp-sess (сессия).
   Поэтому вход, сделанный в старом клиенте на том же адресе, действует и здесь. */
(function (global) {
  'use strict';

  const K = { conn: 'lifeerp-conn', sess: 'lifeerp-sess', queue: 'lifeerp-queue', dead: 'lifeerp-dead', cache: 'lifeerp-cache:' };
  const TZ = 'Asia/Yekaterinburg';
  const OPS = ['create', 'change', 'delete', 'error', 'sys']; // допустимые коды ref_action_type

  /* ---------- localStorage, который не ломается ---------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* нет доступа: ничего страшного */ } }
  };

  /* ---------- события ---------- */
  const handlers = {};
  function on(name, fn) { (handlers[name] = handlers[name] || []).push(fn); return () => { handlers[name] = (handlers[name] || []).filter(f => f !== fn); }; }
  function emit(name, arg) { (handlers[name] || []).slice().forEach(f => { try { f(arg); } catch (e) { console.error('LifeCore handler', name, e); } }); }

  /* ---------- настройки ---------- */
  const cfg = { url: '', key: '', device: 'desktop', timeoutMs: 20000 };
  function init(o) {
    o = o || {};
    const saved = store.get(K.conn, {}) || {};
    cfg.url = String(o.url || saved.url || '').trim().replace(/\/+$/, '');
    cfg.key = String(o.key || saved.key || '').trim();
    if (o.device) cfg.device = o.device;
    sess = store.get(K.sess, null);
    queue = store.get(K.queue, []);
    dead = store.get(K.dead, []);
    viewId = null;
    if (typeof window !== 'undefined' && !init.bound) {
      init.bound = true;
      window.addEventListener('online', () => { emit('net', true); flush(); });
      window.addEventListener('offline', () => emit('net', false));
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') flush(); });
      window.addEventListener('storage', ev => { if (ev.key !== K.sess) return; if (ev.newValue === null) { if (sess) { sess = null; viewId = null; emit('auth', false); } } else reloadSession(); });
    }
    if (me()) flush();
    return api;
  }
  function setConn(url, key) {
    cfg.url = String(url || '').trim().replace(/\/+$/, ''); cfg.key = String(key || '').trim();
    store.set(K.conn, { url: cfg.url, key: cfg.key });
  }
  const configured = () => !!(cfg.url && cfg.key);

  /* ---------- вспомогательное ---------- */
  function uuid() {
    const c = global.crypto;
    if (c && c.randomUUID) return c.randomUUID();
    const b = new Uint8Array(16); (c && c.getRandomValues) ? c.getRandomValues(b) : b.forEach((_, i) => { b[i] = Math.random() * 256; });
    b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  }
  let lastStamp = 0;
  /* Метка времени правки: строго возрастает, чтобы две быстрые правки одной строки не сравнялись. */
  function now() { const t = Math.max(Date.now(), lastStamp + 1); lastStamp = t; return new Date(t).toISOString(); }
  /* День владельца по его часовому поясу (YYYY-MM-DD). */
  function localDate(d, tz) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: tz || TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d || new Date());
  }
  function jwtClaims(t) {
    try {
      let p = String(t).split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      while (p.length % 4) p += '=';
      return JSON.parse(decodeURIComponent(escape(atob(p))));
    } catch (e) { return {}; }
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- сессия ---------- */
  let sess = null, viewId = null, refreshing = null;
  const me = () => (sess ? (sess.uid || jwtClaims(sess.access).sub || null) : null);
  const email = () => (sess ? sess.email || '' : '');
  function setSess(d, em) {
    const cl = jwtClaims(d.access_token);
    sess = { access: d.access_token, refresh: d.refresh_token, exp: Date.now() + (d.expires_in || 3600) * 1000,
      email: (d.user && d.user.email) || em || cl.email || '', uid: (d.user && d.user.id) || cl.sub || null };
    store.set(K.sess, sess);
  }
  /* Чьи данные смотрим. По умолчанию свои; мастер может указать другого пользователя. */
  function setViewUser(uid) { viewId = uid || null; emit('view', viewUser()); }
  const viewUser = () => viewId || me();

  async function signIn(em, pw) {
    em = String(em || '').trim();
    if (!configured()) throw new Error('Не заданы адрес проекта и публичный ключ');
    if (!em || !pw) throw new Error('Введите email и пароль');
    const r = await raw('/auth/v1/token?grant_type=password', { method: 'POST', noAuth: true, body: { email: em, password: pw } });
    setSess(r.data, em);
    emit('auth', true);
    flush();
    return { uid: me(), email: email() };
  }
  async function signOut() {
    try { if (sess) await raw('/auth/v1/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + sess.access } }); } catch (e) { /* выходим локально в любом случае */ }
    sess = null; viewId = null; store.del(K.sess);
    emit('auth', false);
  }
  /* Вход общий с другим клиентом на этой же странице (старая система в окне внутри оболочки): токен обновления
     у сервера одноразовый, поэтому перед обновлением берём то, что уже записал другой, и не расходимся. */
  function reloadSession() {
    const s = store.get(K.sess, null);
    if (s && s.access && (!sess || s.exp >= sess.exp || s.refresh !== sess.refresh)) sess = s;
    return !!sess;
  }
  async function refreshSession(force) {
    if (!sess || !sess.refresh) return;
    if (!force && sess.exp > Date.now() + 60000) return;
    reloadSession();
    if (!sess || !sess.refresh) return;
    if (!force && sess.exp > Date.now() + 60000) return;
    if (!refreshing) {
      refreshing = (async () => {
        try {
          const r = await raw('/auth/v1/token?grant_type=refresh_token', { method: 'POST', noAuth: true, body: { refresh_token: sess.refresh } });
          setSess(r.data, sess.email);
        } catch (e) {
          // Сеть пропала: сессию не трогаем. Сервер отказал (токен отозван): выходим.
          if (e.status === 400 || e.status === 401 || e.status === 403) { sess = null; store.del(K.sess); emit('auth', false); }
          throw e;
        } finally { refreshing = null; }
      })();
    }
    return refreshing;
  }

  /* ---------- HTTP ---------- */
  async function raw(path, o) {
    o = o || {};
    if (!configured()) throw Object.assign(new Error('Не заданы адрес проекта и публичный ключ'), { config: true });
    const h = Object.assign({ apikey: cfg.key, 'Content-Type': 'application/json' }, o.headers || {});
    if (!h.Authorization) h.Authorization = 'Bearer ' + ((!o.noAuth && sess && sess.access) || cfg.key);
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), cfg.timeoutMs) : null;
    let r;
    try {
      r = await fetch(cfg.url + path, { method: o.method || 'GET', headers: h, body: o.body !== undefined ? JSON.stringify(o.body) : undefined, signal: ctl ? ctl.signal : undefined });
    } catch (e) {
      throw Object.assign(new Error('Нет связи с базой'), { net: true });
    } finally { if (timer) clearTimeout(timer); }
    const tx = await r.text();
    let data = null; try { data = tx ? JSON.parse(tx) : null; } catch (e) { data = tx; }
    if (!r.ok) {
      const m = (data && (data.message || data.msg || data.error_description || data.error)) || tx || ('HTTP ' + r.status);
      throw Object.assign(new Error(String(m)), { status: r.status, body: data });
    }
    return { data, headers: r.headers, status: r.status };
  }
  /* Запрос от имени вошедшего пользователя: обновляет токен, добавляет заголовки устройства. */
  async function request(path, o) {
    o = Object.assign({}, o);
    o.headers = Object.assign({ 'X-LifeERP-Device': cfg.device }, o.headers || {});
    for (let attempt = 0; ; attempt++) {
      if (!sess) throw Object.assign(new Error('Нужно войти'), { status: 401, auth: true });
      try { await refreshSession(false); } catch (e) { if (e.net) throw e; if (!sess) throw Object.assign(new Error('Нужно войти'), { status: 401, auth: true }); }
      try { return await raw(path, o); }
      catch (e) {
        if (e.status === 401 && attempt === 0) { try { await refreshSession(true); continue; } catch (e2) { throw e2.net ? e2 : Object.assign(e, { auth: true }); } }
        if (e.status === 401) e.auth = true;
        throw e;
      }
    }
  }

  /* ---------- чтение ---------- */
  /* select('things_view', {filters:['deleted_at=is.null'], order:'name'}) :
     всегда добавляет user_id=eq.<чьи данные смотрим> (мастер по RLS видит строки всех, поэтому фильтр обязателен). */
  async function select(table, o) {
    o = o || {};
    const uid = o.asUser || viewUser();
    if (!uid) throw Object.assign(new Error('Нужно войти'), { status: 401, auth: true });
    const base = ['select=' + encodeURIComponent(o.columns || '*'), 'user_id=eq.' + encodeURIComponent(uid)]
      .concat((o.filters || []).map(f => { const i = f.indexOf('='); return encodeURIComponent(f.slice(0, i)) + '=' + encodeURIComponent(f.slice(i + 1)).replace(/%2C/gi, ',').replace(/%28/g, '(').replace(/%29/g, ')'); }));
    if (o.order) base.push('order=' + o.order);
    const out = [], page = 1000;
    for (let off = 0; ; off += page) {
      const r = await request('/rest/v1/' + table + '?' + base.concat(['limit=' + page, 'offset=' + off]).join('&'));
      const a = Array.isArray(r.data) ? r.data : [];
      out.push(...a);
      if (a.length < page) break;
    }
    return out;
  }

  /* Локальный кэш прочитанного (для запуска без сети). Привязан к пользователю, чьи данные смотрим. */
  const cache = {
    get(key) { const u = viewUser(); return u ? store.get(K.cache + u + ':' + key, null) : null; },
    set(key, data) { const u = viewUser(); if (u) { if (!store.set(K.cache + u + ':' + key, { ts: Date.now(), data })) emit('storage', 'Не удалось сохранить копию данных в браузере'); } },
    clear(key) { const u = viewUser(); if (u) store.del(K.cache + u + ':' + key); }
  };

  /* ---------- офлайн-очередь записи ---------- */
  let queue = [], dead = [], flushing = null, retryTimer = null, retryStep = 0, lastError = '';
  const BACKOFF = [2000, 5000, 15000, 30000, 60000];
  function persist() {
    const ok = store.set(K.queue, queue) && store.set(K.dead, dead);
    if (!ok) emit('storage', 'Не удалось сохранить очередь записи в браузере: пока не закрывайте вкладку, пока не пропадёт «ожидает отправки».');
  }
  function enqueue(it) { it.id = uuid(); it.ts = Date.now(); it.actor = me(); queue.push(it); }
  function retryable(e) { return e.net || e.status === 408 || e.status === 425 || e.status === 429 || e.status >= 500; }
  function scheduleRetry() {
    if (retryTimer) return;
    const ms = BACKOFF[Math.min(retryStep++, BACKOFF.length - 1)];
    retryTimer = setTimeout(() => { retryTimer = null; flush(); }, ms);
  }

  async function sendItem(it) {
    if (it.kind === 'upsert') {
      const body = { p_table: it.table, p_rows: it.rows };
      if (it.owner && it.owner !== it.actor) body.p_user = it.owner;
      const r = await request('/rest/v1/rpc/lifeerp_upsert', { method: 'POST', body, headers: it.corr ? { 'X-LifeERP-Correlation': it.corr } : {} });
      if (r.data && r.data.skipped > 0) emit('conflict', { table: it.table, applied: r.data.applied, skipped: r.data.skipped });
    } else if (it.kind === 'journal') {
      const row = { owner_id: it.owner || it.actor, actor_id: it.actor, op: it.op, module: it.module || '', entity_kind: it.entity_kind || '',
        entity_id: String(it.entity_id == null ? '' : it.entity_id), summary: it.summary || '', client_ts: new Date(it.ts).toISOString(),
        device: cfg.device, correlation_id: it.corr || null, meta: Object.assign({ client_id: it.id }, it.meta || {}) };
      if (it.before !== undefined) row.before = it.before;
      if (it.after !== undefined) row.after = it.after;
      await request('/rest/v1/journal', { method: 'POST', body: row, headers: { Prefer: 'return=minimal' } });
    }
  }

  /* Отправляет очередь по порядку. Сеть пропала: останавливается и повторяет позже (и при событии online).
     Сервер отверг строку (ошибка данных или прав): строка уходит в список «не принято», очередь идёт дальше. */
  function flush() {
    if (flushing) return flushing;
    flushing = (async () => {
      // Без этого пустая очередь завершала бы функцию синхронно: «finally» сбросил бы flushing раньше,
      // чем ему присвоят этот промис, и отправка навсегда считалась бы «уже идёт».
      await null;
      let sentAny = false;
      try {
        for (;;) {
          const uid = me();
          if (!uid) break;
          const it = queue.find(x => x.actor === uid);
          if (!it) { retryStep = 0; break; }
          try {
            await sendItem(it);
            queue.splice(queue.indexOf(it), 1); sentAny = true; persist(); emit('queue', status());
          } catch (e) {
            lastError = e.message || String(e);
            if (e.auth) break;
            if (retryable(e)) { scheduleRetry(); break; }
            queue.splice(queue.indexOf(it), 1);
            dead.push({ item: it, error: lastError, at: Date.now() });
            if (dead.length > 100) dead.shift();
            persist(); emit('dead', status());
          }
        }
      } finally { flushing = null; emit('queue', status()); if (sentAny && !queue.length) emit('drained', status()); }
    })();
    return flushing;
  }

  /* Одно действие пользователя = одна correlation_id на все его записи и строки журнала.
     {writes:[{table, rows:[полные строки]}], journal:[{op, module, entity_kind, entity_id, summary, before?, after?}], owner?}
     Возвращает correlation_id сразу после постановки в очередь (отправка идёт в фоне, офлайн тоже работает). */
  function commit(a) {
    a = a || {};
    if (!me()) throw Object.assign(new Error('Нужно войти'), { auth: true });
    const corr = uuid(), owner = a.owner || viewUser();
    (a.writes || []).forEach(w => { if (w.rows && w.rows.length) enqueue({ kind: 'upsert', table: w.table, rows: w.rows, owner, corr }); });
    (a.journal || []).forEach(j => enqueue({ kind: 'journal', owner, corr, op: OPS.includes(j.op) ? j.op : 'sys', module: j.module, entity_kind: j.entity_kind,
      entity_id: j.entity_id, summary: j.summary, before: j.before, after: j.after, meta: j.meta }));
    persist(); emit('queue', status());
    flush();
    return corr;
  }
  const upsert = (table, rows, o) => commit({ writes: [{ table, rows }], journal: (o && o.journal) || [], owner: o && o.owner });
  const log = (entry, owner) => commit({ journal: [entry], owner });

  function status() {
    const uid = me();
    return { online: typeof navigator === 'undefined' ? true : navigator.onLine !== false, signedIn: !!uid, email: email(),
      pending: queue.filter(x => x.actor === uid).length, dead: dead.length, flushing: !!flushing, lastError };
  }
  const deadList = () => dead.slice();
  function retryDead() { dead.forEach(d => queue.push(d.item)); dead = []; persist(); emit('queue', status()); return flush(); }
  function clearDead() { dead = []; persist(); emit('dead', status()); }

  const api = { init, setConn, configured, config: cfg, on, signIn, signOut, session: () => sess, me, email, setViewUser, viewUser, reloadSession,
    request, select, cache, commit, upsert, log, flush, status, deadList, retryDead, clearDead, uuid, now, localDate, store, TZ };
  global.LifeCore = api;
})(typeof window !== 'undefined' ? window : globalThis);


</script>
<script>
/* ---- core/login-ui.js ---- */
/* Простая форма входа поверх LifeCore. LifeLogin.mount(элемент, {onDone}) */
(function (global) {
  'use strict';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function mount(el, o) {
    o = o || {};
    const core = global.LifeCore;
    const needConn = !core.configured();
    el.innerHTML = `<form class="lg-form" autocomplete="on" style="max-width:360px;margin:40px auto;padding:16px;font:14px system-ui,sans-serif">
      <h2 style="margin:0 0 12px;font-size:18px">Вход в LifeERP</h2>
      ${needConn ? `<label style="display:block;margin-bottom:8px">Адрес проекта Supabase<br><input name="url" style="width:100%;padding:6px" placeholder="https://xxxx.supabase.co"></label>
      <label style="display:block;margin-bottom:8px">Публичный ключ (anon)<br><input name="key" style="width:100%;padding:6px"></label>` : ''}
      <label style="display:block;margin-bottom:8px">Email<br><input name="email" type="email" autocomplete="username" style="width:100%;padding:6px" value="${esc(core.email())}"></label>
      <label style="display:block;margin-bottom:8px">Пароль<br><input name="pass" type="password" autocomplete="current-password" style="width:100%;padding:6px"></label>
      <button type="submit" style="padding:7px 16px">Войти</button>
      <div class="lg-msg" style="margin-top:10px;color:#b3261e;white-space:pre-wrap"></div></form>`;
    const f = el.querySelector('form'), msg = el.querySelector('.lg-msg');
    f.addEventListener('submit', async ev => {
      ev.preventDefault(); msg.textContent = '';
      const v = n => (f.elements[n] ? f.elements[n].value : '');
      try {
        if (needConn) { if (!v('url').trim() || !v('key').trim()) throw new Error('Введите адрес проекта и публичный ключ'); core.setConn(v('url'), v('key')); }
        await core.signIn(v('email'), v('pass'));
        f.elements.pass.value = '';
        if (o.onDone) o.onDone();
      } catch (e) {
        msg.textContent = e.net ? 'Нет связи с базой. Проверьте интернет и адрес проекта.' : (e.message === 'Invalid login credentials' ? 'Неверный email или пароль.' : e.message);
      }
    });
  }
  global.LifeLogin = { mount };
})(window);


</script>
<script>
/* ---- modules/timers-model.js ---- */
/* «Таймеры»: чистые расчёты без экрана и без базы (можно проверять отдельно).
   Данные D = {cards, targets, runs, entries, items}:
     cards    — timer_cards (живые), targets — timer_targets (и удалённые: нужны, чтобы показать название в старых записях),
     runs     — идущие таймеры (timer_runs без deleted_at), entries — time_entries с meta.card (сессии, ручные записи, поправки),
     items    — {id: {title, done}} дела из «Сфер и дел» (для названий).
   День — строка YYYY-MM-DD по поясу владельца (core.TZ). window.LifeTimersModel */
(function (global) {
  'use strict';
  const pad = n => (n < 10 ? '0' + n : '' + n);
  const MAX_TARGETS = 20, BELLS = [0, 1, 3, 5, 7, 10, 15];

  function fmt(ms) { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? h + ':' + pad(m) + ':' + pad(s % 60) : m + ':' + pad(s % 60); }
  function fmtClock(ms) { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? h + ':' + pad(m) + ':' + pad(s % 60) : pad(m) + ':' + pad(s % 60); }
  function fmtCorr(c) { const a = Math.abs(c), h = Math.floor(a / 60), m = a % 60; return (c < 0 ? '−' : '+') + (h ? h + ' ч' + (m ? ' ' + m + ' мин' : '') : m + ' мин'); }
  function fmtCorrShort(c) { const a = Math.abs(c), h = Math.floor(a / 60), m = a % 60; return (c < 0 ? '−' : '+') + (h ? h + 'ч' + (m ? m + 'м' : '') : m + 'м'); }

  /* ---- время и часовой пояс ---- */
  function dayKey(ms, tz) { return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ms)); }
  function offsetMin(ms, tz) { // смещение пояса от UTC в минутах на момент ms
    const p = {}; new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' })
      .formatToParts(new Date(ms)).forEach(x => { p[x.type] = x.value; });
    return Math.round((Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - Math.floor(ms / 1000) * 1000) / 60000);
  }
  /* «2026-11-15» + «10:30» в поясе tz → миллисекунды (NaN, если не разобрать) */

<script>
/* ---- modules/timers-store.js ---- */
/* «Таймеры»: данные и действия (без экрана). LifeTimersStore.create(core) → объект S.
   Всё пишется через core.commit (офлайн-очередь, журнал), строки отправляются целиком.
   Время: сессии, ручные записи и поправки лежат в time_entries (meta.card = карточка, meta.target = дело карточки).
   Остановка таймера: строка timer_runs получает deleted_at, а запись времени получает ТОТ ЖЕ id, поэтому повторная отправка ничего не дублирует.
   Всё время идёт на дело, выбранное в момент остановки. */
(function (global) {
  'use strict';
  const M = global.LifeTimersModel;
  const MOD = 'timers', CACHE = 'timers', CACHE_DAYS = 60;
  const TBL = { timer_cards: 'cards', timer_targets: 'targets', timer_runs: 'runs', time_entries: 'entries' };

  function create(core) {
    const TZ = core.TZ;
    const D = { cards: [], targets: [], runs: [], entries: [], items: {} };
    const S = { D, TZ, state: 'loading', note: '', loadedAt: 0, onChange: null };
    const iso = ms => new Date(ms).toISOString();
    const device = () => (core.config && core.config.device) || 'pocket';
    const changed = () => { if (S.onChange) S.onChange(); };
    S.today = () => M.dayKey(Date.now(), TZ);

    /* ---------- чтение и копия для работы без сети ---------- */
    function apply(d) {
      D.cards = (d.cards || []).filter(r => !r.deleted_at);
      D.targets = d.targets || [];
      D.runs = (d.runs || []).filter(r => !r.deleted_at);
      D.entries = (d.entries || []).filter(r => !r.deleted_at);
      D.items = d.items || {};
    }
    function saveCache() {
      const from = M.shiftDay(S.today(), -CACHE_DAYS);
      core.cache.set(CACHE, { cards: D.cards, targets: D.targets, runs: D.runs, items: D.items, entries: D.entries.filter(e => e.local_date >= from) });
    }
    S.load = async function () {
      if (S.state !== 'ready') S.state = 'loading'; changed();
      try { await core.flush(); } catch (e) { /* очередь сама повторит */ }
      try {
        if (core.status().pending > 0) throw Object.assign(new Error('очередь'), { pendingQueue: true });
        const nd = ['deleted_at=is.null'];
        const [cards, targets, runs, entries, items] = await Promise.all([
          core.select('timer_cards', { filters: nd }), core.select('timer_targets'), core.select('timer_runs', { filters: nd }),
          core.select('time_entries', { filters: ['meta->>card=not.is.null', 'deleted_at=is.null'] }),
          core.select('sphere_items', { filters: nd, columns: 'id,title,done,kind' })
        ]);
        const map = {}; items.forEach(i => { map[i.id] = { title: i.title, done: !!i.done, kind: i.kind }; });
        apply({ cards, targets, runs, entries, items: map });
        saveCache(); S.state = 'ready'; S.note = ''; S.loadedAt = Date.now();
      } catch (e) {
        if (e.auth) { S.state = 'error'; S.note = 'нужно войти'; S.authLost = true; changed(); return; }
        const c = core.cache.get(CACHE);
        if (c && (e.net || e.pendingQueue)) {
          apply(c.data); S.state = 'ready';
          S.note = e.pendingQueue ? 'Есть неотправленные изменения, показаны данные на этом телефоне.' : 'Нет связи. Показана копия от ' + new Date(c.ts).toLocaleString('ru-RU') + '.';
        } else { S.state = 'error'; S.note = e.net ? 'нет связи с базой и нет копии на телефоне' : (e.message || 'ошибка чтения'); }
      }
      changed();
    };

    /* ---------- запись одним действием ---------- */
    function tx() {
      const w = {}, j = [], before = [];
      const T = {
        put(table, row) {
          row = Object.assign({}, row, { updated_at: core.now() });
          const arr = D[TBL[table]], i = arr.findIndex(r => r.id === row.id);
          before.push({ table, prev: i >= 0 ? JSON.parse(JSON.stringify(arr[i])) : null, id: row.id });
          const keepDeleted = table === 'timer_targets';
          if (row.deleted_at && !keepDeleted) { if (i >= 0) arr.splice(i, 1); } else if (i >= 0) arr[i] = row; else arr.push(row);
          const out = Object.assign({}, row); delete out.user_id; delete out.updated_by;
          (w[table] = w[table] || {})[row.id] = out; return row;
        },
        del(table, row) { return T.put(table, Object.assign({}, row, { deleted_at: core.now() })); },
        log(op, kind, id, summary) { j.push({ op, module: MOD, entity_kind: kind, entity_id: id, summary }); },
        empty() { return !Object.keys(w).length; },
        commit() {
          saveCache();
          const writes = Object.keys(w).map(t => ({ table: t, rows: Object.keys(w[t]).map(k => w[t][k]) }));
          try { core.commit({ writes, journal: j }); } catch (e) { S.note = 'Не сохранено: ' + (e.message || e); }
          changed(); return T;
        },
        /* отмена: возвращает прежние версии строк (с новой меткой времени), созданные заново помечает удалёнными */
        undo(summary) {
          const U = tx(), seen = {};
          before.slice().reverse().forEach(b => {
            const k = b.table + '/' + b.id; if (seen[k]) return; seen[k] = 1;
            const first = before.find(x => x.table === b.table && x.id === b.id);
            const cur = D[TBL[b.table]].find(r => r.id === b.id);
            if (first.prev) U.put(b.table, first.prev); else if (cur) U.del(b.table, cur);
          });
          U.log('change', 'undo', '', summary || 'Отмена действия'); U.commit();
        }
      };
      return T;
    }
    S.tx = tx;

    /* ---------- полные строки ---------- */
    const cardRow = (o, base) => Object.assign({ id: o.id, name: o.name, sort: 0, last_start: null, last_target: null, archived_from: null, created_at: iso(Date.now()), deleted_at: null }, base || {}, o.over || {});
    const targetRow = o => ({ id: o.id, card_id: o.card_id, kind: o.kind || 'label', label: o.label || '', item_id: o.item_id || null, sort: o.sort || 0, created_at: iso(Date.now()), updated_at: core.now(), deleted_at: null });
    const nextSort = arr => arr.reduce((m, r) => Math.max(m, r.sort || 0), 0) + 1024;
    const newId = p => p + '_' + core.uuid().replace(/-/g, '').slice(0, 12);
    function timeRow(o) {
      const at = o.at || Date.now(), subj = M.subjectOf(o.target);
      return { id: o.id || core.uuid(), subject_module: subj.module, subject_kind: subj.kind, subject_id: subj.id, kind: o.kind, duration_sec: o.sec,
        started_at: o.start ? iso(o.start) : null, ended_at: o.end ? iso(o.end) : null, local_date: o.day || M.dayKey(at, TZ), tz: TZ, comment: o.comment || '', tags: [],
        meta: Object.assign({ card: o.target.card_id, target: o.target.id }, o.meta || {}), source_device: device(), created_at: iso(at), updated_at: core.now(), deleted_at: null };
    }
    const card = id => M.cardOf(D, id), nameOf = id => (card(id) ? card(id).name : '');
    const tname = t => M.targetName(D, t);
    const targetById = id => D.targets.find(t => t.id === id) || null;

    /* ---------- карточки ---------- */
    S.addCard = function (name) {
      name = String(name || '').trim().slice(0, 60); if (!name) return null;
      const T = tx(), id = newId('tc'), c = T.put('timer_cards', cardRow({ id, name }, { sort: nextSort(D.cards) }));
      const tg = T.put('timer_targets', targetRow({ id: newId('tg'), card_id: id, kind: 'label', label: '', sort: 1024 }));
      T.put('timer_cards', Object.assign({}, c, { last_target: tg.id }));
      T.log('create', 'card', id, 'Таймер добавлен: ' + name); T.commit(); return id;
    };
    S.renameCard = function (id, name) {
      const c = card(id); name = String(name || '').trim().slice(0, 60); if (!c || !name || name === c.name) return;
      const T = tx(); T.put('timer_cards', Object.assign({}, c, { name })); T.log('change', 'card', id, `Таймер переименован: «${c.name}» → «${name}»`); T.commit();
    };
    S.deleteCard = function (id) {
      const c = card(id); if (!c) return;
      const T = tx();
      D.runs.filter(r => r.card_id === id).forEach(r => T.del('timer_runs', r));
      D.targets.filter(t => t.card_id === id && !t.deleted_at).forEach(t => T.del('timer_targets', t));
      D.entries.filter(e => e.meta && e.meta.card === id).forEach(e => T.del('time_entries', e));
      T.del('timer_cards', c); T.log('delete', 'card', id, `Таймер удалён вместе с записями: ${c.name}`); T.commit();
    };

    /* ---------- дела карточки (метки и дела из СД) ---------- */
    const liveTargets = id => M.targetsOf(D, id);
    S.addLabels = function (cardId, text) {
      const c = card(cardId); if (!c) return 0;
      const T = tx(), have = liveTargets(cardId); let added = 0, sort = nextSort(D.targets.filter(t => t.card_id === cardId));
      String(text).split(/[,;\n]/).forEach(raw => {
        const t = raw.replace(/\s+/g, ' ').trim().slice(0, 60);
        if (!t || have.length >= M.MAX_TARGETS) return;
        if (have.some(x => tname(x).toLowerCase() === t.toLowerCase())) return;
        const row = T.put('timer_targets', targetRow({ id: newId('tg'), card_id: cardId, kind: 'label', label: t, sort })); have.push(row); sort += 1024; added++;
      });
      if (added) { T.log('change', 'card', cardId, `Метки добавлены (${added}): ${c.name}`); T.commit(); }
      return added;
    };
    S.addItemTarget = function (cardId, itemId) {
      const c = card(cardId); if (!c || !itemId) return false;
      const have = liveTargets(cardId);
      if (have.length >= M.MAX_TARGETS || have.some(t => t.kind === 'item' && t.item_id === itemId)) return false;
      const T = tx(); T.put('timer_targets', targetRow({ id: newId('tg'), card_id: cardId, kind: 'item', item_id: itemId, sort: nextSort(D.targets.filter(t => t.card_id === cardId)) }));
      const it = D.items[itemId]; T.log('change', 'card', cardId, `В таймер «${c.name}» добавлено дело из СД: ${it ? it.title : itemId}`); T.commit(); return true;
    };
    S.removeTarget = function (cardId, targetId) {
      const c = card(cardId), t = targetById(targetId), list = liveTargets(cardId);
      if (!c || !t || list.length < 2) return false;
      const T = tx(); T.del('timer_targets', t);
      const rest = list.filter(x => x.id !== targetId);
      D.runs.filter(r => r.card_id === cardId && r.target_id === targetId).forEach(r => T.put('timer_runs', Object.assign({}, r, { target_id: rest[0].id })));
      if (c.last_target === targetId) T.put('timer_cards', Object.assign({}, c, { last_target: rest[0].id }));
      T.log('change', 'card', cardId, `Дело убрано из таймера «${c.name}»: ${tname(t)} (записи сохранены)`); T.commit(); return true;
    };
    /* Выбор дела кнопкой на карточке: идущему таймеру меняет дело, неидущему меняет «выбранное». */
    S.cycleTarget = function (cardId, allowRun) {
      const c = card(cardId), list = liveTargets(cardId); if (!c || list.length < 2) return;
      const run = allowRun ? M.runOf(D, cardId) : null;
      const cur = run ? run.target_id : (M.selTarget(D, cardId) || {}).id;
      const next = list[(list.findIndex(t => t.id === cur) + 1) % list.length];
      const T = tx(); if (run) T.put('timer_runs', Object.assign({}, run, { target_id: next.id }));
      T.put('timer_cards', Object.assign({}, c, { last_target: next.id }));
      if (run) T.log('change', 'run', run.id, `Таймер «${c.name}»: дело переключено на «${tname(next)}»`);
      T.commit();
    };

    /* ---------- запуск и остановка ---------- */
    S.start = function (cardId) {
      const c = card(cardId); if (!c) return { ok: false };
      if (M.runOf(D, cardId)) return { ok: false };
      if (D.runs.length && D.runs.some(r => r.locked)) return { ok: false, msg: 'Таймер на замке. Снимите замок: свайп вправо по идущей карточке или значок замка.' };
      if (D.runs.length >= 2) return { ok: false, msg: 'Уже идут два таймера. Остановите один из них.' };
      const sel = M.selTarget(D, cardId); if (!sel) return { ok: false, msg: 'У таймера нет дела.' };
      const now = Date.now(), T = tx(), id = core.uuid();
      T.put('timer_runs', { id, card_id: cardId, target_id: sel.id, started_at: iso(now), note: '', bell_min: 0, bell_at: null, locked: false, created_at: iso(now), updated_at: core.now(), deleted_at: null });
      T.put('timer_cards', Object.assign({}, c, { last_start: iso(now), last_target: sel.id }));
      T.log('create', 'run', id, `Таймер запущен: ${c.name}${liveTargets(cardId).length > 1 ? ' · ' + tname(sel) : ''}`); T.commit();
      return { ok: true, second: D.runs.length === 2 };
    };
    S.stop = function (runId) {
      const r = D.runs.find(x => x.id === runId); if (!r) return false;
      const c = card(r.card_id), t = targetById(r.target_id) || M.selTarget(D, r.card_id), now = Date.now(), st = Date.parse(r.started_at), T = tx();
      T.del('timer_runs', r);
      if (now - st >= 1000 && t && !D.entries.some(e => e.id === r.id)) {
        const sec = Math.round((now - st) / 1000);
        T.put('time_entries', timeRow({ id: r.id, kind: 'session', sec, start: st, end: now, at: st, comment: r.note || '', target: t }));
        T.log('create', 'time_entry', r.id, `Таймер остановлен: ${c ? c.name : ''}${t ? ' · ' + tname(t) : ''}; ${M.fmt(sec * 1000)}${r.note ? '; «' + r.note + '»' : ''}`);
      } else T.log('change', 'run', r.id, `Таймер остановлен без записи (меньше секунды): ${c ? c.name : ''}`);
      T.commit(); return true;
    };
    S.discard = function (runId) {
      const r = D.runs.find(x => x.id === runId); if (!r) return false;
      const T = tx(); T.del('timer_runs', r); T.log('change', 'run', r.id, `Таймер сброшен без записи: ${nameOf(r.card_id)} (${M.fmt(Date.now() - Date.parse(r.started_at))})`); T.commit(); return true;
    };
    S.toggleLock = function () {
      if (D.runs.length !== 1) return { ok: false, msg: 'Замок можно ставить, только когда идёт один таймер.' };
      const r = D.runs[0], T = tx(); T.put('timer_runs', Object.assign({}, r, { locked: !r.locked }));
      T.log('change', 'run', r.id, r.locked ? 'Замок снят' : 'Таймер поставлен на замок'); T.commit(); return { ok: true, locked: !r.locked };
    };
    S.setNote = function (runId, text) {
      const r = D.runs.find(x => x.id === runId); if (!r) return;
      text = String(text || '').slice(0, 500); if (r.note === text) return;
      const T = tx(); T.put('timer_runs', Object.assign({}, r, { note: text })); T.commit();
    };
    S.cycleBell = function (runId) {
      const r = D.runs.find(x => x.id === runId); if (!r) return;
      const next = M.BELLS[(M.BELLS.indexOf(r.bell_min || 0) + 1) % M.BELLS.length];
      const T = tx(); T.put('timer_runs', Object.assign({}, r, { bell_min: next, bell_at: next ? iso(Date.now() + next * 60000) : null })); T.commit();
    };
    /* Сигнал, срок которого вышел: возвращает названия сработавших; давно просроченные (телефон спал) гасит молча. */
    S.dueBells = function () {
      const now = Date.now(), names = []; let any = false; const T = tx();
      D.runs.forEach(r => {
        if (r.bell_min && r.bell_at && now >= Date.parse(r.bell_at)) {
          if (now - Date.parse(r.bell_at) < 15000) names.push(nameOf(r.card_id) + ' · ' + r.bell_min + ' мин');
          T.put('timer_runs', Object.assign({}, r, { bell_min: 0, bell_at: null })); any = true;
        }
      });
      if (any) T.commit(); return names;
    };

    /* ---------- поправки и записи ---------- */
    S.adjust = function (cardId, day, deltaMin) {
      const c = card(cardId), t = M.selTarget(D, cardId); if (!c || !t || !deltaMin) return false;
      let rec = D.entries.find(e => e.kind === 'correction' && e.local_date === day && e.meta.card === cardId && e.meta.target === t.id);
      const T = tx(), total = (rec ? rec.duration_sec : 0) + deltaMin * 60;
      if (rec) { if (total === 0) T.del('time_entries', rec); else T.put('time_entries', Object.assign({}, rec, { duration_sec: total })); }
      else T.put('time_entries', timeRow({ kind: 'correction', sec: deltaMin * 60, day, at: M.zonedTs(day, '12:00', TZ), target: t }));
      T.log('change', 'time_entry', rec ? rec.id : '', `Поправка времени: ${c.name}${liveTargets(cardId).length > 1 ? ' · ' + tname(t) : ''}, ${M.fmtCorr(deltaMin)} (${day})`); T.commit(); return true;
    };
    S.removeEntry = function (id) {
      const e = D.entries.find(x => x.id === id); if (!e) return false;
      const T = tx(); T.del('time_entries', e);
      T.log('delete', 'time_entry', id, `Запись удалена: ${nameOf(e.meta.card)}, ${e.kind === 'correction' ? 'поправка ' + M.fmtCorr(Math.round(e.duration_sec / 60)) : M.fmt(e.duration_sec * 1000)} (${e.local_date})`); T.commit(); return true;
    };
    S.addPast = function (o) { // {cardId, targetId, day, from:'HH:MM', to:'HH:MM', comment}
      const c = card(o.cardId); if (!c) return { ok: false, msg: 'Выберите таймер.' };
      if (!o.day) return { ok: false, msg: 'Выберите дату.' };
      if (!o.from || !o.to) return { ok: false, msg: 'Укажите время начала и конца.' };
      const st = M.zonedTs(o.day, o.from, TZ), en = M.zonedTs(o.day, o.to, TZ);
      if (isNaN(st) || isNaN(en)) return { ok: false, msg: 'Не понял дату или время.' };
      if (en <= st) return { ok: false, msg: 'Конец должен быть позже начала в тот же день. Ночную запись разделите на две.' };
      if (en > Date.now()) return { ok: false, msg: 'Конец записи не может быть в будущем.' };
      const t = targetById(o.targetId) || M.selTarget(D, o.cardId), sec = Math.round((en - st) / 1000), T = tx();
      const row = T.put('time_entries', timeRow({ kind: 'manual', sec, start: st, end: en, at: st, comment: String(o.comment || '').trim().slice(0, 500), target: t }));
      T.log('create', 'time_entry', row.id, `Запись за прошлое: ${c.name}${liveTargets(o.cardId).length > 1 ? ' · ' + tname(t) : ''}, ${o.from}–${o.to}, ${M.fmt(sec * 1000)} (${o.day})`); T.commit();
      return { ok: true, tx: T, text: `${c.name}, ${o.from}–${o.to}, ${M.fmt(sec * 1000)}` };
    };

    /* ---------- объединение таймеров ---------- */
    S.merge = function (ids, name, inHistory) {
      name = String(name || '').trim().slice(0, 60);
      const src = ids.map(card).filter(Boolean);
      if (src.length < 2) return { ok: false, msg: 'Отметьте минимум два таймера.' };
      if (!name) return { ok: false, msg: 'Введите название нового таймера.' };
      if (src.some(c => M.runOf(D, c.id))) return { ok: false, msg: 'Один из выбранных таймеров сейчас идёт. Сначала остановите его.' };
      const low = name.toLowerCase();
      let dest = src.find(c => c.name.toLowerCase() === low) || null;
      if (!dest && D.cards.some(c => !c.archived_from && c.name.toLowerCase() === low)) return { ok: false, msg: 'Таймер с таким названием уже есть. Выберите его в списке или назовите новый иначе.' };
      const today = S.today(), T = tx();
      const destId = dest ? dest.id : newId('tc');
      const destTargets = dest ? liveTargets(dest.id).slice() : [];
      /* какие дела нужны в итоговой карточке */
      const norm = t => String(t).replace(/\s+/g, ' ').trim().slice(0, 60);
      const mapT = {}; let sortN = nextSort(D.targets.filter(t => t.card_id === destId)), planned = destTargets.length;
      const findDest = (kind, key) => destTargets.find(x => x.kind === kind && (kind === 'item' ? x.item_id === key : tname(x).toLowerCase() === key.toLowerCase()));
      const newTargets = [];
      const need = (kind, key, src0) => {
        let t = findDest(kind, key); if (t) return t;
        t = targetRow({ id: newId('tg'), card_id: destId, kind, label: kind === 'label' ? norm(key) : '', item_id: kind === 'item' ? key : null, sort: sortN }); sortN += 1024;
        destTargets.push(t); newTargets.push(t); planned++; return t;
      };
      const moved = e => inHistory || e.local_date >= today;
      src.forEach(c => {
        const list = liveTargets(c.id);
        list.forEach((t, i) => {
          const used = D.entries.some(e => e.meta.card === c.id && e.meta.target === t.id && moved(e));
          if (!(i === 0 || t.kind === 'item' || used)) return;
          mapT[t.id] = t.kind === 'item' ? need('item', t.item_id) : need('label', t.label ? t.label : c.name);
        });
      });
      if (planned > M.MAX_TARGETS) return { ok: false, msg: `Получится ${planned} дел в карточке, а можно не больше ${M.MAX_TARGETS}. Объедините меньше таймеров или удалите лишние метки.` };
      if (!dest) { dest = T.put('timer_cards', cardRow({ id: destId, name }, { sort: nextSort(D.cards) })); }
      newTargets.forEach(t => T.put('timer_targets', t));
      const latest = src.slice().sort((a, b) => (b.last_start ? Date.parse(b.last_start) : 0) - (a.last_start ? Date.parse(a.last_start) : 0))[0];
      const lt = mapT[latest.last_target] || mapT[(liveTargets(latest.id)[0] || {}).id];
      const lastStart = [dest.last_start, latest.last_start].filter(Boolean).sort().pop() || null;
      let count = 0;
      src.forEach(c => {
        D.entries.filter(e => e.meta.card === c.id && moved(e)).forEach(e => {
          const nt = mapT[e.meta.target] || mapT[(liveTargets(c.id)[0] || {}).id]; if (!nt) return;
          const subj = M.subjectOf(nt);
          T.put('time_entries', Object.assign({}, e, { subject_module: subj.module, subject_kind: subj.kind, subject_id: subj.id, meta: Object.assign({}, e.meta, { card: destId, target: nt.id }) })); count++;
        });
        if (c.id !== destId) { if (inHistory) { D.targets.filter(t => t.card_id === c.id && !t.deleted_at).forEach(t => T.del('timer_targets', t)); T.del('timer_cards', c); } else T.put('timer_cards', Object.assign({}, c, { archived_from: today })); }
      });
      T.put('timer_cards', Object.assign({}, dest, { last_start: lastStart, last_target: lt ? lt.id : dest.last_target }));
      /* сливаем и одинаковые поправки одного дня и дела */
      const corr = {}; D.entries.filter(e => e.kind === 'correction' && e.meta.card === destId).forEach(e => {
        const k = e.local_date + '|' + e.meta.target;
        if (!corr[k]) corr[k] = e; else { const keep = corr[k]; T.put('time_entries', Object.assign({}, keep, { duration_sec: keep.duration_sec + e.duration_sec })); T.del('time_entries', e); }
      });
      Object.keys(corr).forEach(k => { const e = D.entries.find(x => x.id === corr[k].id); if (e && e.duration_sec === 0) T.del('time_entries', e); });
      T.log('change', 'card', destId, `Таймеры объединены в «${name}»: ${src.map(c => c.name).join(', ')}${inHistory ? ' (с историей)' : ' (история осталась)'}; записей перенесено ${count}`); T.commit();
      return { ok: true, tx: T, text: `Объединено в «${name}»: дел ${destTargets.length}.` };
    };

    /* ---------- перенос из старых «Карточек времени» (резервная копия kartochki-vremeni/backup/v1) ---------- */
    S.importLegacy = async function (obj) {
      if (!obj || !Array.isArray(obj.projects) || !Array.isArray(obj.sessions)) return { ok: false, msg: 'Это не резервная копия Карточек времени (нужна кнопка «Резервная копия»).' };
      const sph = await core.select('spheres', { filters: ['deleted_at=is.null'] }), grs = await core.select('sphere_groups', { filters: ['deleted_at=is.null'] }), its = await core.select('sphere_items', { filters: ['deleted_at=is.null'] });
      const T = tx(), now = core.now(), at = iso(Date.now());
      let sp = sph.find(s => String(s.name).trim().toLowerCase() === 'развитие');
      const sphereRows = [], groupRows = [], itemRows = [];
      if (!sp) { sp = { id: 'sp_kv' + M.detUuid('развитие').slice(0, 8), name: 'Развитие', color: '#2e7d6b', sort: sph.reduce((m, s) => Math.max(m, s.sort || 0), 0) + 1024, created_at: at, updated_at: now, deleted_at: null }; sphereRows.push(sp); }
      let gr = grs.find(g => g.sphere_id === sp.id && String(g.name).trim().toLowerCase() === 'карточки времени');
      if (!gr) { gr = { id: 'gr_kv' + M.detUuid('карточки времени' + sp.id).slice(0, 8), sphere_id: sp.id, name: 'Карточки времени', collapsed: false, sort: grs.filter(g => g.sphere_id === sp.id).reduce((m, g) => Math.max(m, g.sort || 0), 0) + 1024, created_at: at, updated_at: now, deleted_at: null }; groupRows.push(gr); }
      const existingKv = {}; its.forEach(i => { existingKv[i.id] = i; });
      const tz = TZ, pById = {}; obj.projects.forEach(p => { pById[p.id] = p; });
      const cardRows = [], targetRows = [], entryRows = [], runsSkipped = (obj.active || []).length;
      let sortI = its.filter(i => i.group_id === gr.id).reduce((m, i) => Math.max(m, i.sort || 0), 0), sortC = nextSort(D.cards);
      const tgMap = {}; // pid|tagName|'' → target id
      obj.projects.forEach(p => {
        const cid = 'tc_kv' + M.detUuid('card' + p.id).slice(0, 10), itemId = 'it_kv' + M.detUuid('item' + p.id).slice(0, 10);
        if (!existingKv[itemId]) { sortI += 1024; itemRows.push({ id: itemId, sphere_id: sp.id, parent_id: null, group_id: gr.id, kind: 'project', title: String(p.name || 'Без названия').slice(0, 120), note: 'Перенесено из «Карточек времени»', done: false, importance: 0, shade: null, collapsed: false, act_days: 0, act_min: 0, timer_start: null, sort: sortI, created_at: at, updated_at: now, deleted_at: null }); }
        const first = { id: 'tg_kv' + M.detUuid('t0' + p.id).slice(0, 10), card_id: cid, kind: 'item', label: '', item_id: itemId, sort: 1024, created_at: at, updated_at: now, deleted_at: null };
        targetRows.push(first); tgMap[p.id + '|'] = first.id;
        (p.tags || []).forEach((tag, k) => { const t = { id: 'tg_kv' + M.detUuid('t' + p.id + '|' + tag).slice(0, 10), card_id: cid, kind: 'label', label: String(tag).slice(0, 60), item_id: null, sort: 2048 + k * 1024, created_at: at, updated_at: now, deleted_at: null }; targetRows.push(t); tgMap[p.id + '|' + tag] = t.id; });
        const sel = tgMap[p.id + '|' + (p.lastTag || '')] || first.id;
        cardRows.push({ id: cid, name: String(p.name || 'Таймер').slice(0, 60), sort: sortC, last_start: p.lastStart ? iso(p.lastStart) : null, last_target: sel, archived_from: p.archivedFrom || null, created_at: at, updated_at: now, deleted_at: null }); sortC += 1024;
      });
      const tgOf = (p, tag) => { let k = p.id + '|' + (tag || ''); if (tgMap[k]) return tgMap[k]; if (tag) { const t = { id: 'tg_kv' + M.detUuid('t' + p.id + '|' + tag).slice(0, 10), card_id: 'tc_kv' + M.detUuid('card' + p.id).slice(0, 10), kind: 'label', label: String(tag).slice(0, 60), item_id: null, sort: 9000, created_at: at, updated_at: now, deleted_at: null }; targetRows.push(t); tgMap[k] = t.id; return t.id; } return tgMap[p.id + '|']; };
      const subjFor = (p, tid) => { const t = targetRows.find(x => x.id === tid); return t.kind === 'item' ? ['spheres', 'item', t.item_id] : ['timers', 'target', t.id]; };
      let nSess = 0, nCorr = 0;
      obj.sessions.forEach(s => {
        const p = pById[s.pid]; if (!p || !(s.end > s.start)) return;
        const tid = tgOf(p, s.tag), sj = subjFor(p, tid), cid = 'tc_kv' + M.detUuid('card' + p.id).slice(0, 10);
        entryRows.push({ id: M.detUuid('sess' + (s.id || s.pid + ':' + s.start)), subject_module: sj[0], subject_kind: sj[1], subject_id: sj[2], kind: 'session', duration_sec: Math.round((s.end - s.start) / 1000),
          started_at: iso(s.start), ended_at: iso(s.end), local_date: M.dayKey(s.start, tz), tz, comment: String(s.note || '').slice(0, 500), tags: [], meta: { card: cid, target: tid, legacy: 'kv:' + (s.id || '') }, source_device: 'import', created_at: iso(s.start), updated_at: now, deleted_at: null }); nSess++;
      });
      (obj.corrections || []).forEach(c => {
        const p = pById[c.pid]; if (!p || !c.min) return;
        const tid = tgOf(p, c.tag), sj = subjFor(p, tid), cid = 'tc_kv' + M.detUuid('card' + p.id).slice(0, 10);
        entryRows.push({ id: M.detUuid('corr' + c.pid + '|' + c.day + '|' + (c.tag || '')), subject_module: sj[0], subject_kind: sj[1], subject_id: sj[2], kind: 'correction', duration_sec: c.min * 60,
          started_at: null, ended_at: null, local_date: c.day, tz, comment: '', tags: [], meta: { card: cid, target: tid, legacy: 'kv:corr' }, source_device: 'import', created_at: at, updated_at: now, deleted_at: null }); nCorr++;
      });
      const writes = [['spheres', sphereRows], ['sphere_groups', groupRows], ['sphere_items', itemRows], ['timer_cards', cardRows], ['timer_targets', targetRows], ['time_entries', entryRows]]
        .filter(w => w[1].length).map(w => ({ table: w[0], rows: w[1] }));
      const summary = `Импорт из «Карточек времени»: таймеров ${cardRows.length}, записей ${nSess}, поправок ${nCorr}, новых проектов в сфере «Развитие» ${itemRows.length}`;
      core.commit({ writes, journal: [{ op: 'create', module: MOD, entity_kind: 'import', entity_id: 'kv', summary }] });
      await S.load();
      return { ok: true, text: summary + (runsSkipped ? `. Идущих таймеров в копии было ${runsSkipped}: они не переносятся` : '') + '.' };
    };

    return S;
  }
  global.LifeTimersStore = { create };
})(window);

</script>
<script>
/* ---- modules/timers-tools.js ---- */
/* «Таймеры»: вспомогательные окна под списком — запись за прошлое, объединение таймеров, выгрузка для анализа, перенос из старого приложения,
   и выбор дела из «Сфер и дел» для карточки. window.LifeTimersTools: build(env, box), refresh(env), pickItem(env, cardId, box) */
(function (global) {
  'use strict';
  const M = global.LifeTimersModel, esc = M.esc;
  let refs = null, mergeSel = {}, sdCache = null;

  function build(env, box) {
    const { S, D } = env;
    box.innerHTML = `<details class="data" id="pastBox"><summary>Добавить запись за прошлое</summary>
      <p>Если забыли включить таймер: выберите таймер, дату и время начала и конца. Запись появится в тот день, как будто таймер работал.</p>
      <label class="lbl">Таймер<select class="field p-card"></select></label>
      <label class="lbl p-tw" hidden>Дело<select class="field p-tag"></select></label>
      <label class="lbl">Дата<input class="field p-date" type="date"></label>
      <div class="pastrow"><label class="lbl">Начало<input class="field p-from" type="time"></label><label class="lbl">Конец<input class="field p-to" type="time"></label></div>
      <label class="lbl">Комментарий<input class="field p-cmt" type="text" maxlength="500" autocomplete="off" placeholder="Можно оставить пустым"></label>
      <p class="formerr p-err" hidden></p><div class="btns"><button type="button" class="btn primary p-go">Добавить запись</button></div></details>
    <details class="data" id="mergeBox"><summary>Объединить таймеры</summary>
      <p>Отметьте таймеры, которые нужно слить в один. Их названия станут делами нового таймера, а время распределится по этим делам. Перед объединением таймеры должны быть остановлены.</p>
      <div class="mergelist"></div>
      <label class="lbl">Объединить все в таймер<input class="field m-name" type="text" maxlength="60" autocomplete="off" placeholder="Например, Приём пищи"></label>
      <label class="mrow histrow"><input type="checkbox" class="m-hist"><span>Объединить в истории таймеров</span></label>
      <p class="mergehint m-hint"></p><p class="formerr m-err" hidden></p><div class="btns"><button type="button" class="btn primary m-go">Объединить</button></div></details>
    <details class="data" id="dataBox"><summary>Данные: выгрузка и перенос</summary>
      <p>Выгрузка для анализа в прежнем формате. «День» берёт день, выбранный вверху, «7 дней» заканчивается им, «Всё» — вся история. Копия попадает в буфер и в поле ниже. Сами данные хранятся в базе, резервная копия в телефоне не нужна.</p>
      <div class="btns"><button type="button" class="btn primary x-day">День</button><button type="button" class="btn primary x-week">7 дней</button><button type="button" class="btn primary x-all">Всё</button></div>
      <p class="exportinfo x-info" hidden></p><textarea class="x-out" readonly hidden aria-label="Данные в формате JSON"></textarea>
      <p>Перенос из старых «Карточек времени»: вставьте резервную копию (или выберите файл) и нажмите кнопку. Таймеры станут карточками, а каждое дело получит проект в сфере «Развитие» (группа «Карточки времени»). Повторный перенос дублей не создаёт. Идущие таймеры не переносятся.</p>
      <input type="file" class="i-file" accept=".json,application/json,text/plain" aria-label="Файл резервной копии">
      <textarea class="i-in" aria-label="Резервная копия для переноса" placeholder='{"schema":"kartochki-vremeni/backup/v1", ...}' style="display:block;width:100%;height:90px;font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;"></textarea>
      <div class="btns"><button type="button" class="btn i-go">Перенести</button></div><p class="exportinfo i-info" hidden></p></details>`;
    const q = s => box.querySelector(s);
    refs = { box, q, past: q('#pastBox'), merge: q('#mergeBox') };
    q('#pastBox').addEventListener('toggle', () => refresh(env)); q('#mergeBox').addEventListener('toggle', () => refresh(env));
    q('.m-hist').addEventListener('change', () => refresh(env));
    q('.p-card').addEventListener('change', () => fillTags(env));
    const err = (el, m) => { el.textContent = m; el.hidden = !m; };

    /* запись за прошлое */
    q('.p-go').addEventListener('click', () => {
      err(q('.p-err'), '');
      const r = S.addPast({ cardId: q('.p-card').value, targetId: q('.p-tag').value, day: q('.p-date').value, from: q('.p-from').value, to: q('.p-to').value, comment: q('.p-cmt').value });
      if (!r.ok) return err(q('.p-err'), r.msg);
      q('.p-from').value = ''; q('.p-to').value = ''; q('.p-cmt').value = '';
      env.toast('Добавлено: ' + r.text + '.', 'Отменить', () => r.tx.undo('Отмена записи за прошлое'));
    });
    /* объединение */
    q('.m-name').addEventListener('input', () => err(q('.m-err'), ''));
    q('.m-go').addEventListener('click', () => {
      const ids = Object.keys(mergeSel).filter(k => mergeSel[k]);

    const out = q('.x-out'), info = q('.x-info');
    function run(btn, label, obj) {
      const days = obj.days || [obj]; let l = 0, sec = 0; const ids = {};
      days.forEach(x => { l += x.totals.launches; sec += x.totals.totalSeconds; x.projects.forEach(p => { ids[p.id] = true; }); });
      info.hidden = false; info.textContent = `Выгружено: ${label}, ${obj.days ? obj.range.from + ' – ' + obj.range.to : obj.date}. Запусков ${l}, дел ${Object.keys(ids).length}, время ${M.fmt(sec * 1000)}.`;
      const text = JSON.stringify(obj, null, 2); out.hidden = false; out.value = text;

    }
    const now = () => Date.now();
    q('.x-day').addEventListener('click', e => run(e.currentTarget, 'День', M.buildDayExport(D, env.viewDay, env.TZ, now())));
    q('.x-week').addEventListener('click', e => run(e.currentTarget, '7 дней', M.buildRangeExport(D, M.shiftDay(env.viewDay, -6), env.viewDay, env.TZ, now())));
    q('.x-all').addEventListener('click', e => run(e.currentTarget, 'Всё', M.buildRangeExport(D, M.firstDataDay(D, S.today()), S.today(), env.TZ, now())));

  async function pickItem(env, cid, box) {

    const rows = it.filter(i => !i.done).map(i => ({ i, p: path(i) })).sort((a, b) => (a.p + a.i.title).localeCompare(b.p + b.i.title, 'ru'));

        list.appendChild(b);

  }

<script>

    const $ = s => el.querySelector(s);

    function create(c) {

      e.innerHTML = '<div class="row top"><span class="stats"></span><span class="top-actions"><button type="button" class="discard">Не считать</button><button type="button" class="more" aria-label="Изменить таймер">•••</button></span></div>' +
        '<div class="row mid" hidden><button type="button" class="bellbtn" data-min="0" hidden><svg viewBox="0 0 22 22" aria-hidden="true"><path class="bell-body" d="M4.5 16.5h13l-1.6-2.2V10a4.9 4.9 0 0 0-9.8 0v4.3zM9 18.5a2 2 0 0 0 4 0"/><text class="bell-num" x="11" y="13.2"></text><line class="bell-off" x1="3.5" y1="3.5" x2="18.5" y2="18.5"/></svg></button>' +
        '<button type="button" class="tagbtn" hidden></button><span class="tagstats" hidden></span>' +

        '<button type="button" class="btn small sd-add">+ Дело из «Сфер и дел»</button><div class="sd-box" hidden></div>' +

      const q = s => e.querySelector(s), cid = c.id;

<script>
/* ---- modules/shop-model.js ---- */
/* «Покупки»: чистые расчёты без экрана и без базы. Логика перенесена из старого приложения «Карточки времени» без изменений.
   Данные D = {items, receipts, lines, settings, lastBought}. День — строка YYYY-MM-DD по поясу владельца. window.LifeShopModel */
(function (global) {
  'use strict';
  const T = global.LifeTimersModel;
  const RECEIPT_GAP_MS = 5 * 60 * 1000, MAX_QTY = 9999, DORMANT_MS = 30 * 86400000;
  const round2 = n => Math.round(n * 100) / 100, round3 = n => Math.round(n * 1000) / 1000, round4 = n => Math.round(n * 10000) / 10000;
  const money = n => round2(n).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
  const fmtNum = n => round3(n).toLocaleString('ru-RU', { maximumFractionDigits: 3 });
  const dayDiff = (a, b) => Math.round((Date.parse(a + 'T12:00:00Z') - Date.parse(b + 'T12:00:00Z')) / 86400000);
  const fmtDay = key => new Date(key + 'T12:00:00Z').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', timeZone: 'UTC' });

  /* Весовые товары: в кг или в граммах. Остальное считается штуками. */
  function weightKind(unit) {
    const u = String(unit || '').trim().toLowerCase().replace(/\.$/, '');
    if (u === 'кг' || u === 'kg' || u === 'килограмм') return 'kg';
    if (u === 'г' || u === 'гр' || u === 'грамм' || u === 'g') return 'g';

  }

    const t = String(text).trim().toLowerCase().replace(/\s+/g, ' ');
    const m = t.match(/^(\d+(?:[.,]\d+)?) ?(кг|килограмм[а-я]*|kg|г|гр|грамм[а-я]*|g)?\.?$/);

    else grams = num < 20 ? num * 1000 : num;

  }
  function fmtQ(q, unit) {
    const k = weightKind(unit);
    if (k === 'kg') return q < 1 ? fmtNum(q * 1000) + ' г' : fmtNum(q) + ' кг';
    if (k === 'g') return q >= 1000 ? fmtNum(q / 1000) + ' кг' : fmtNum(q) + ' г';
    return fmtNum(q) + ' ' + unit;
  }
  const effPrice = it => (it.price_now != null ? +it.price_now : +it.price);
  const startQty = it => (weightKind(it.unit) ? +it.ref_qty : 1);
  /* ref_qty хватает на days дней; округляем вниз, не меньше одного дня */
  const supplyDaysFor = (it, q) => Math.max(1, Math.floor(q * it.days / it.ref_qty + 1e-9));

  /* «100 50», «100, 50», «100+50» → 150; «12,5» и «99,50» остаются дробными; «100,200» (три цифры) — сумма */
  function parsePrice(text) {

  }

  function sugMatches(items, q) {

    }).sort((a, b) => a.first - b.first);
  }
  /* К какому чеку отнести покупку сейчас: к последнему за этот день, если с его последней строки прошло не больше 5 минут */
  function receiptFor(D, nowMs, day) {
    const rs = receiptsOf(D).filter(r => r.date === day);
    const last = rs[rs.length - 1];
    return last && nowMs - last.last <= RECEIPT_GAP_MS ? last.id : null;
  }

  /* выгрузка чеков в прежнем формате kartochki-vremeni/purchases/v1; from/to — строки дней */
  function buildPurchasesExport(D, from, to, tz, now) {
    const rs = receiptsOf(D).filter(r => r.date >= from && r.date <= to);
    const receipts = rs.map(r => {
      const items = r.goods.map(p => {
        const ref = +p.ref_qty > 0 ? +p.ref_qty : 1, supply = p.supply_days != null ? p.supply_days : p.days * p.qty;
        return { purchaseId: p.id, itemId: p.item_id, name: p.name, unit: p.unit, unitPrice: +p.price, quantity: +p.qty, amount: +p.amount, daysPerUnit: round4(p.days / ref), referenceQuantity: ref, referenceDays: p.days, supplyDays: supply, purchasedAt: T.isoZoned(lineTs(p), tz), nextDue: T.shiftDay(p.local_date, supply) };
      });

    });

    return { schema: 'kartochki-vremeni/purchases/v1', exportedAt: T.isoZoned(now, tz), timezone: tz, range: { from, to }, rules: { receiptGapMinutes: RECEIPT_GAP_MS / 60000 },

  }

})(window);

</script>

  display: none; min-height: 44px; padding: 10px 16px; border: 0; border-radius: 10px;

.rcp-day{ display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.rcp-daysum{ font-weight: 700; }
.dormant{ margin-top: 14px; }
.dormant summary{ font-weight: 600; }
.sh-set{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.sh-set .lbl{flex:1;min-width:110px}
.rcp-thing{font-size:12px;color:var(--muted)}

.rcp-db.on{ background: #2d9f5a; border-color: #2d9f5a; color: #fff; font-weight: 600; }
