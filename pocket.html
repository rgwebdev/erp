</script>
<script>
/* ---- modules/shop-store.js ---- */
/* «Покупки»: данные и действия (без экрана). LifeShopStore.create(core) → объект S.
   Всё пишется через core.commit (офлайн-очередь, журнал), строки целиком. Каждая строка чека дублируется в money_entries
   (fact / out, subject shop/purchase, тот же uuid). Перенос строки в «Вещицы» — функция базы shop_move_to_thing (нужна связь). */
(function (global) {
  'use strict';
  const M = global.LifeShopModel, TM = global.LifeTimersModel;
  const MOD = 'shop', CACHE = 'shop', CACHE_DAYS = 45;
  const TBL = { shop_items: 'cards', shop_list_state: 'st', shop_receipts: 'receipts', shop_purchases: 'lines', track_entries: 'rcEntries' };
  const LIST_KEY = 'lifeerp-shop-list', LISTS = [1, 2, 3];
  const CARD_F = ['name', 'price', 'unit', 'days', 'ref_qty'], STATE_F = ['status', 'qty', 'price_now', 'ord_at', 'due_on', 'checked'];
  const setId = n => (n === 1 ? 'main' : 'main' + n);

  function create(core) {
    const TZ = core.TZ;
    /* Карточки (cards) общие, состояние карточки в каждом из трёх списков своё (st). D.items — карточки с состоянием текущего списка S.list. */
    const D = { cards: [], st: [], setts: {}, items: [], receipts: [], lines: [], lastBought: {}, tracks: [], rcEntries: [] };
    const S = { D, TZ, state: 'loading', note: '', loadedAt: 0, onChange: null, lists: LISTS };
    S.list = +core.store.get(LIST_KEY, 1); if (LISTS.indexOf(S.list) < 0) S.list = 1;
    const iso = ms => new Date(ms).toISOString();
    const device = () => (core.config && core.config.device) || 'pocket';
    const changed = () => { if (S.onChange) S.onChange(); };
    const today = () => TM.dayKey(Date.now(), TZ);
    S.today = today;
    /* цены пакетов общие на все списки (берутся из 'main'), счётчики пакетов у каждого списка свои */
    const defSettings = n => { const m = D.setts.main; return { id: setId(n), bag_small_price: m ? m.bag_small_price : 25, bag_large_price: m ? m.bag_large_price : 39, bags_small: 0, bags_large: 0, created_at: iso(Date.now()), updated_at: core.now(), deleted_at: null }; };
    Object.defineProperty(D, 'settings', { get() { return D.setts[setId(S.list)] || defSettings(S.list); } });
    const stKey = (list, id) => list + '|' + id;
    function stMap() { const m = {}; D.st.forEach(r => { m[stKey(r.list_no, r.item_id)] = r; }); return m; }
    function view(list, map) {
      map = map || stMap();
      return D.cards.map(c => {
        const s = map[stKey(list, c.id)];
        const base = { status: 'off', qty: M.startQty(c), price_now: null, ord_at: c.ord_at || c.created_at, due_on: null, checked: false };
        const o = Object.assign({}, c, s ? { status: s.status, qty: s.qty, price_now: s.price_now, ord_at: s.ord_at, due_on: s.due_on, checked: s.checked } : base);
        o.list_no = list; return o;
      });
    }
    function rebuild() { D.items = view(S.list); }
    S.view = view;
    function apply(d) {
      D.cards = (d.cards || []).filter(r => !r.deleted_at); D.st = (d.st || []).filter(r => !r.deleted_at); D.receipts = (d.receipts || []).filter(r => !r.deleted_at); D.lines = (d.lines || []).filter(r => !r.deleted_at);
      D.tracks = (d.tracks || []).filter(r => !r.deleted_at); D.rcEntries = (d.rcEntries || []).filter(r => !r.deleted_at && String(r.id).startsWith('te_rc_')); D.setts = d.setts || {}; D.lastBought = d.lastBought || {}; rebuild();
    }
    function lastBoughtOf(lines) { const m = {}; lines.forEach(l => { if (l.kind === 'goods') { const t = Date.parse(l.bought_at); if (!m[l.name] || t > m[l.name]) m[l.name] = t; } }); return m; }
    function saveCache() {
      const from = TM.shiftDay(today(), -CACHE_DAYS), lines = D.lines.filter(l => l.local_date >= from), ids = {}; lines.forEach(l => { ids[l.receipt_id] = 1; });
      core.cache.set(CACHE, { cards: D.cards, st: D.st, setts: D.setts, lines, receipts: D.receipts.filter(r => ids[r.id]), lastBought: D.lastBought, tracks: D.tracks, rcEntries: D.rcEntries });
    }
    function legacyCache(d) { /* копия, сохранённая до трёх списков: все состояния уходят в список 1 */
      const cards = (d.items || []).map(i => ({ id: i.id, name: i.name, price: i.price, unit: i.unit, days: i.days, ref_qty: i.ref_qty, created_at: i.created_at, ord_at: i.ord_at, deleted_at: null }));
      const st = (d.items || []).map(i => ({ id: 'l1_' + i.id, list_no: 1, item_id: i.id, status: i.status, qty: i.qty, price_now: i.price_now, ord_at: i.ord_at, due_on: i.due_on, checked: i.checked, deleted_at: null }));
      return { cards, st, setts: d.settings ? { main: d.settings } : {}, receipts: d.receipts, lines: d.lines, lastBought: d.lastBought };
    }
    S.load = async function () {
      if (S.state !== 'ready') S.state = 'loading'; changed();
      try { await S.flushPending(); await core.flush(); } catch (e) { /* очередь повторит */ }
      try {
        if (core.status().pending > 0) throw Object.assign(new Error('очередь'), { pendingQueue: true });
        const nd = ['deleted_at=is.null'];
        const [cards, st, receipts, lines, set, tracks, rcEntries] = await Promise.all([core.select('shop_items', { filters: nd }), core.select('shop_list_state', { filters: nd }), core.select('shop_receipts', { filters: nd }), core.select('shop_purchases', { filters: nd }), core.select('shop_settings', { filters: nd }), core.select('tracks', { filters: nd.concat('kind=eq.out') }).catch(() => []), core.select('track_entries', { filters: nd.concat('id=like.te_rc_*') }).catch(() => [])]);
        const setts = {}; set.forEach(r => { setts[r.id] = r; });
        apply({ cards, st, receipts, lines, setts, lastBought: lastBoughtOf(lines), tracks, rcEntries });
        saveCache(); S.state = 'ready'; S.note = ''; S.loadedAt = Date.now();
      } catch (e) {
        if (e.auth) { S.state = 'error'; S.note = 'нужно войти'; S.authLost = true; changed(); return; }
        const c = core.cache.get(CACHE);
        if (c && (e.net || e.pendingQueue)) { apply(c.data.cards ? c.data : legacyCache(c.data)); S.state = 'ready'; S.note = e.pendingQueue ? 'Есть неотправленные изменения, показаны данные на этом телефоне.' : 'Нет связи. Показана копия от ' + new Date(c.ts).toLocaleString('ru-RU') + '.'; }
        else { S.state = 'error'; S.note = e.net ? 'нет связи с базой и нет копии на телефоне' : (e.message || 'ошибка чтения'); }
      }
      if (S.state === 'ready') S.refreshDue();
      changed();
    };

    /* ---------- запись одним действием (как в «Таймерах») ---------- */
    function tx() {
      const w = {}, j = [], before = [];
      const arrOf = table => (table === 'shop_settings' ? null : D[TBL[table]]);
      const T = {
        /* строка карточки с состоянием (put 'shop_items') раскладывается: общая часть в shop_items, состояние текущего списка в shop_list_state */
        put(table, row) {
          if (table !== 'shop_items') return T.rawPut(table, row);
          const cur = D.cards.find(c => c.id === row.id), now = iso(Date.now());
          if (row.deleted_at) { const c = cur || row; T.rawPut('shop_items', Object.assign({ status: 'off', qty: 1, price_now: null, ord_at: c.ord_at || now, due_on: null, checked: false }, cardOnly(c), { id: row.id, created_at: c.created_at || now, deleted_at: row.deleted_at })); return row; }
          const card = Object.assign({ status: 'off', qty: 1, price_now: null, ord_at: (cur && cur.ord_at) || row.ord_at || now, due_on: null, checked: false }, cardOnly(row), { id: row.id, created_at: (cur && cur.created_at) || row.created_at || now, deleted_at: null });
          if (!cur || CARD_F.some(k => cur[k] !== card[k])) T.rawPut('shop_items', card);
          const list = row.list_no || S.list;
          T.rawPut('shop_list_state', Object.assign({ id: 'l' + list + '_' + row.id, list_no: list, item_id: row.id, created_at: now, deleted_at: null }, pick(row, STATE_F)));
          return row;
        },
        rawPut(table, row) {
          row = Object.assign({}, row, { updated_at: core.now() });
          if (table === 'shop_settings') { before.push({ table, prev: D.setts[row.id] ? JSON.parse(JSON.stringify(D.setts[row.id])) : null, id: row.id }); D.setts[row.id] = row; }
          else {
            const arr = arrOf(table), i = arr.findIndex(r => r.id === row.id);
            before.push({ table, prev: i >= 0 ? JSON.parse(JSON.stringify(arr[i])) : null, id: row.id });
            if (row.deleted_at) { if (i >= 0) arr.splice(i, 1); } else if (i >= 0) arr[i] = row; else arr.push(row);
          }
          if (table === 'shop_items' || table === 'shop_list_state') rebuild();
          const out = Object.assign({}, row); delete out.user_id; delete out.updated_by; (w[table] = w[table] || {})[row.id] = out; return row;
        },
        putMoney(row) { row = Object.assign({}, row, { updated_at: core.now() }); (w.money_entries = w.money_entries || {})[row.id] = row; before.push({ table: 'money_entries', prev: null, id: row.id, money: row }); return row; },
        del(table, row) { return T.put(table, Object.assign({}, row, { deleted_at: core.now() })); },
        log(op, kind, id, summary) { j.push({ op, module: MOD, entity_kind: kind, entity_id: id, summary }); },
        commit() {
          saveCache();
          const writes = Object.keys(w).map(t => ({ table: t, rows: Object.keys(w[t]).map(k => w[t][k]) }));
          try { core.commit({ writes, journal: j }); } catch (e) { S.note = 'Не сохранено: ' + (e.message || e); }
          changed(); return T;
        },
        /* отмена: прежние версии возвращаются, созданное заново помечается удалённым (в т.ч. деньги) */
        undo(summary) {
          const U = tx(), seen = {};
          before.slice().reverse().forEach(b => {
            const k = b.table + '/' + b.id; if (seen[k]) return; seen[k] = 1;
            const first = before.find(x => x.table === b.table && x.id === b.id);
            if (b.table === 'money_entries') { U.putMoney(Object.assign({}, b.money, { deleted_at: core.now() })); return; }
            if (b.table === 'shop_settings') { const cs = D.setts[b.id]; if (first.prev) U.rawPut('shop_settings', first.prev); else if (cs) U.rawPut('shop_settings', Object.assign({}, cs, { deleted_at: core.now() })); return; }
            const cur = arrOf(b.table).find(r => r.id === b.id);
            if (first.prev) U.rawPut(b.table, first.prev); else if (cur) U.rawPut(b.table, Object.assign({}, cur, { deleted_at: core.now() }));
          });
          U.log('change', 'undo', '', summary || 'Отмена действия'); U.commit();
        }
      };
      return T;
    }
    S.tx = tx;
    const pick = (o, ks) => { const r = {}; ks.forEach(k => { r[k] = o[k]; }); return r; };
    const cardOnly = o => pick(o, CARD_F);

    const newId = p => p + '_' + core.uuid().replace(/-/g, '').slice(0, 12);
    const item = id => D.items.find(i => i.id === id) || null;
    const itemRow = (o, base) => Object.assign({ id: o.id, name: '', price: 0, unit: 'шт', days: 1, ref_qty: 1, status: 'on', qty: 1, price_now: null, ord_at: iso(Date.now()), due_on: null, checked: false, created_at: iso(Date.now()), deleted_at: null }, base || {}, o);
    const snap = it => ({ status: it.status, qty: it.qty, ord_at: it.ord_at, due_on: it.due_on, price_now: it.price_now, checked: it.checked });
    const reactivate = (it, ordMs) => Object.assign({}, it, { status: 'on', qty: M.weightKind(it.unit) ? it.ref_qty : (it.qty || 1), price_now: null, checked: false, ord_at: iso(ordMs), due_on: null });
    const toOff = it => Object.assign({}, it, { status: 'off', qty: M.startQty(it), price_now: null, ord_at: iso(Date.now()), due_on: null, checked: false });

    /* купленное возвращается в список в календарный день due_on */
    S.refreshDue = function () {
      const t = today(), T = tx(); let n = 0;
      LISTS.forEach(l => view(l).filter(it => it.status === 'bought' && it.due_on && it.due_on <= t).forEach(it => { T.put('shop_items', reactivate(it, TM.zonedTs(it.due_on, '00:00', TZ))); n++; }));
      if (n) T.commit(); return n > 0;
    };

    S.setList = function (n) { if (LISTS.indexOf(n) < 0) return; S.list = n; core.store.set(LIST_KEY, n); rebuild(); changed(); };
    S.nextList = function () { S.setList(S.list % LISTS.length + 1); return S.list; };

    /* ---------- карточки ---------- */
    S.addItem = function (f) {
      const r = M.readFields(f); if (r.error) return r;
      const T = tx(), id = newId('si'), row = itemRow({ id }, r); row.qty = M.startQty(row); T.put('shop_items', row);
      T.log('create', 'item', id, 'Покупка добавлена в список: ' + r.name); T.commit(); return { ok: true, id, tx: T, name: r.name };
    };
    S.editItem = function (id, f) {
      const r = M.readFields(f), it = item(id); if (r.error) return r; if (!it) return { error: 'Карточка не найдена.' };
      const unitChanged = it.unit !== r.unit, priceChanged = +it.price !== r.price, n = Object.assign({}, it, r);
      if (unitChanged || priceChanged) n.price_now = null;
      if (unitChanged && n.status === 'on') n.qty = M.startQty(n);
      const T = tx(); T.put('shop_items', n); T.log('change', 'item', id, 'Покупка изменена: ' + r.name); T.commit(); return { ok: true };
    };
    S.deleteItem = function (id) { const it = item(id); if (!it) return; const T = tx(); T.del('shop_items', it); T.log('delete', 'item', id, 'Покупка удалена: ' + it.name); T.commit(); };
    S.setChecked = function (id, v) { const it = item(id); if (!it || it.status !== 'on') return; const T = tx(); T.put('shop_items', Object.assign({}, it, { checked: !!v })); T.commit(); };

    /* Правка веса и цены в активной карточке: в памяти сразу, в базу — после паузы или при уходе из поля */
    let pend = {}, pendT = null;
    S.setLive = function (id, patch) {
      const it = item(id); if (!it) return; let r = D.st.find(x => x.list_no === S.list && x.item_id === id);
      if (!r) { r = Object.assign({ id: 'l' + S.list + '_' + id, list_no: S.list, item_id: id, created_at: iso(Date.now()), deleted_at: null }, pick(it, STATE_F)); D.st.push(r); }
      Object.assign(r, patch); rebuild(); pend[id + '|' + S.list] = true; clearTimeout(pendT); pendT = setTimeout(() => S.flushPending(), 700);
    };
    S.flushPending = async function () {
      clearTimeout(pendT); const ids = Object.keys(pend); pend = {}; if (!ids.length) return;
      const T = tx(); ids.forEach(k => { const [id, l] = k.split('|'), it = view(+l).find(x => x.id === id); if (it) T.put('shop_items', it); }); T.commit();
    };

    /* Свайпы: вправо = плюс (или вернуть в список), влево = минус (или перестать ждать) */
    S.swipeRight = function (id) {
      const it = item(id); if (!it) return {};
      const T = tx();
      if (it.status === 'off') T.put('shop_items', Object.assign({}, it, { status: 'on', qty: M.startQty(it), price_now: null, ord_at: iso(Date.now()), due_on: null, checked: false }));
      else if (it.status === 'bought') { T.put('shop_items', reactivate(it, Date.now())); T.commit(); return { msg: 'Вернул в список раньше срока.' }; }
      else { const step = M.stepFor(it.unit); if (it.qty + step > M.MAX_QTY) return { msg: 'Больше ' + M.MAX_QTY + ' не добавляю.' }; T.put('shop_items', Object.assign({}, it, { qty: M.round3(+it.qty + step) })); }
      T.commit(); return {};
    };
    S.swipeLeft = function (id) {
      const it = item(id); if (!it) return {};
      const T = tx();
      if (it.status === 'bought') { T.put('shop_items', toOff(it)); T.commit(); return { msg: 'Перестал ждать: ' + it.name + '.', tx: T }; }
      if (it.status !== 'on') return {};
      const step = M.stepFor(it.unit);
      if (it.qty - step > 1e-9) T.put('shop_items', Object.assign({}, it, { qty: M.round3(+it.qty - step) })); else T.put('shop_items', toOff(it));
      T.commit(); return {};
    };
    /* Поиск: поднять карточку наверх, включив, если она не в списке */
    S.pickFound = function (id) {
      const it = item(id); if (!it) return null; const was = it.status, T = tx();
      if (was === 'off') T.put('shop_items', Object.assign({}, it, { status: 'on', qty: M.startQty(it), price_now: null, ord_at: iso(Date.now()), due_on: null, checked: false }));
      else if (was === 'bought') T.put('shop_items', reactivate(it, Date.now()));
      else T.put('shop_items', Object.assign({}, it, { ord_at: iso(Date.now()), checked: false }));
      T.commit(); return { was, name: it.name, tx: T };
    };

    /* ---------- пакеты ---------- */
    S.bag = function (key, clear) { // key 's' | 'l'
      const f = key === 's' ? 'bags_small' : 'bags_large', set = D.settings; if (!clear && set[f] >= 99) return; const T = tx();
      T.put('shop_settings', Object.assign({}, set, { [f]: clear ? 0 : set[f] + 1 })); T.commit();
    };
    S.setBagPrices = function (small, large) {
      const a = M.parsePrice(small), b = M.parsePrice(large); if (!isFinite(a) || !isFinite(b) || a < 0 || b < 0) return { error: 'Цены пакетов должны быть числами.' };
      const T = tx(); LISTS.forEach(l => { if (l === 1 || D.setts[setId(l)]) T.put('shop_settings', Object.assign({}, D.setts[setId(l)] || defSettings(l), { bag_small_price: a, bag_large_price: b })); }); T.log('change', 'settings', 'main', `Цены пакетов: М ${a}, Б ${b}`); T.commit(); return { ok: true };
    };

    /* ---------- покупка ---------- */
    function money(line, extra) {
      return Object.assign({ id: line.id, subject_module: 'shop', subject_kind: 'purchase', subject_id: line.id, direction: 'out', kind: 'fact', amount: line.amount, currency: 'KZT', fx_rate: null, occurred_on: line.local_date, tz: TZ, category: '', comment: line.name,
        meta: { receipt: line.receipt_id, kind: line.kind }, source_device: device(), created_at: line.created_at, deleted_at: null }, extra || {});
    }
    S.buy = function (id) {
      const it = item(id); if (!it || it.status !== 'on') return null;
      const now = Date.now(), day = TM.dayKey(now, TZ), price = M.effPrice(it), q = +it.qty, supply = M.supplyDaysFor(it, q), T = tx();
      let rid = M.receiptFor(D, now, day);
      if (!rid) { rid = newId('rc'); T.put('shop_receipts', { id: rid, started_at: iso(now), local_date: day, created_at: iso(now), deleted_at: null }); }
      const mk = (kind, item_id, name, unit, pr, qty, amount, extra) => Object.assign({ id: core.uuid(), receipt_id: rid, kind, item_id, name, unit, price: pr, qty, amount, days: 1, ref_qty: 1, supply_days: 1, bought_at: iso(now), local_date: day, thing_id: null, created_at: iso(now), deleted_at: null }, extra || {});
      const g = mk('goods', it.id, it.name, it.unit, price, q, M.round2(price * q), { days: it.days, ref_qty: +it.ref_qty, supply_days: supply });
      T.put('shop_purchases', g); T.putMoney(money(g));
      const set = D.settings, bagsText = [];
      [['s', 'bags_small', 'bag_small_price', 'Пакет М', 'bag_s'], ['l', 'bags_large', 'bag_large_price', 'Пакет Б', 'bag_l']].forEach(b => {
        const n = set[b[1]]; if (!n) return; const pr = +set[b[2]], line = mk('bag', b[4], b[3], 'шт', pr, n, M.round2(pr * n)); T.put('shop_purchases', line); T.putMoney(money(line)); bagsText.push(b[3].slice(-1) + n);
      });
      if (bagsText.length) T.put('shop_settings', Object.assign({}, set, { bags_small: 0, bags_large: 0 }));
      const due = TM.shiftDay(day, supply);
      T.put('shop_items', Object.assign({}, it, { status: 'bought', checked: false, due_on: due }));
      D.lastBought[it.name] = now;
      S.rcSync(T, rid);
      T.log('create', 'purchase', g.id, `Куплено: ${it.name}, ${M.fmtQ(q, it.unit)}, ${M.money(g.amount)}${bagsText.length ? '; пакеты ' + bagsText.join(' ') : ''}`); T.commit();
      return { tx: T, name: it.name, text: `${it.name}, ${M.fmtQ(q, it.unit)}`, due };
    };

    /* ---------- «В базу»: сумма чека в трек расходов ---------- */
    /* Состояние хранится в самих записях трека: id 'te_rc_<чек>_<трек>' (одна на чек). Нет записи — чек «не в базе». Новых таблиц нет. */
    const RC = 'te_rc_';
    S.outTracks = () => D.tracks.filter(t => t.kind === 'out' && !t.deleted_at).slice().sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0) || String(a.name).localeCompare(String(b.name), 'ru'));
    const rcRows = rid => D.rcEntries.filter(e => String(e.id).startsWith(RC + rid + '_') && !e.deleted_at);
    S.receiptBase = rid => { const e = rcRows(rid).find(x => D.tracks.some(t => t.id === x.track_id)); return e ? { track: D.tracks.find(t => t.id === e.track_id), value: +e.value } : null; };
    const thousand = amount => Math.round(amount / 100) / 10; /* 13228 → 13,2; 7587 → 7,6 */
    S.rcValue = thousand;
    /* привести запись трека в соответствие с чеком (сумма изменилась или чек исчез); T — открытая транзакция */
    S.rcSync = function (T, rid) {
      const rows = rcRows(rid); if (!rows.length) return;
      const r = M.receiptsOf(D).find(x => x.id === rid);
      rows.forEach(e => {
        if (!r || !r.amount) T.put('track_entries', Object.assign({}, e, { deleted_at: core.now() }));
        else if (+e.value !== thousand(r.amount) || e.day !== r.date) T.put('track_entries', Object.assign({}, e, { value: thousand(r.amount), day: r.date }));
      });
    };
    /* нажатие: серый → трек 1 → трек 2 … → последний → серый */
    S.cycleReceipt = function (rid) {
      const r = M.receiptsOf(D).find(x => x.id === rid); if (!r) return { ok: false, msg: 'Чек не найден.' };
      const outs = S.outTracks(); if (!outs.length) return { ok: false, msg: 'Нет треков расходов: создайте их во вкладке «Треки».' };
      const cur = S.receiptBase(rid), i = cur ? outs.findIndex(t => t.id === cur.track.id) : -1, T = tx();
      rcRows(rid).forEach(e => T.put('track_entries', Object.assign({}, e, { deleted_at: core.now() })));
      const next = i + 1 < outs.length ? outs[i + 1] : null, v = thousand(r.amount);
      if (next) { T.put('track_entries', { id: RC + rid + '_' + next.id, track_id: next.id, day: r.date, value: v, deleted_at: null }); }
      T.log('change', 'receipt', rid, next ? `Чек ${r.date} (${M.money(r.amount)}) в базу: «${next.name}» +${v}` : `Чек ${r.date} (${M.money(r.amount)}): убран из базы`);
      T.commit(); return { ok: true, track: next, value: v };
    };
    S.deleteLine = function (lineId) {
      const l = D.lines.find(x => x.id === lineId); if (!l) return false; const T = tx();
      T.del('shop_purchases', l); T.putMoney(money(l, { deleted_at: core.now() }));
      if (!D.lines.some(x => x.receipt_id === l.receipt_id)) { const r = D.receipts.find(x => x.id === l.receipt_id); if (r) T.del('shop_receipts', r); }
      S.rcSync(T, l.receipt_id);
      T.log('delete', 'purchase', lineId, `Строка чека удалена: ${l.name}, ${M.money(+l.amount)} (${l.local_date})`); T.commit(); return true;
    };
    /* перенос строки чека в «Вещицы»: одна транзакция в базе, нужна связь; повтор безопасен */
    S.moveToThing = async function (lineId) {
      const l = D.lines.find(x => x.id === lineId); if (!l || l.kind !== 'goods') return { ok: false, msg: 'Переносятся только товары.' };
      try { await core.flush(); } catch (e) { /* ниже проверим очередь */ }
      if (core.status().pending > 0) return { ok: false, msg: 'Сначала дождитесь отправки изменений (вверху «Ожидает отправки»).' };
      try {
        const r = await core.request('/rest/v1/rpc/shop_move_to_thing', { method: 'POST', body: { p_line: lineId } });
        l.thing_id = r.data.thing_id; saveCache(); changed();
        return { ok: true, created: !!r.data.created, thingId: r.data.thing_id };
      } catch (e) { return { ok: false, msg: e.net ? 'Нет связи. Перенос возможен только при подключении.' : (/BAG_NOT/.test(e.message) ? 'Пакеты не переносятся.' : e.message) }; }
    };

    /* ---------- перенос из старого приложения (резервная копия kartochki-vremeni/backup/v1, раздел shop) ---------- */
    const rowStamp = (at, now) => ({ created_at: at, updated_at: now, deleted_at: null });
    S.importLegacy = async function (obj) {
      /* копия «Карточек времени»: shops = три списка ({items, bags}), purchases = общие чеки; в более старой копии один список shop = {items, purchases, bags} */
      const lists = obj && Array.isArray(obj.shops) && obj.shops.length ? obj.shops : (obj && obj.shop && Array.isArray(obj.shop.items) ? [obj.shop] : null);
      const purchases = obj && Array.isArray(obj.purchases) ? obj.purchases : (obj && obj.shop && Array.isArray(obj.shop.purchases) ? obj.shop.purchases : null);
      if (!lists || !lists.every(l => l && Array.isArray(l.items)) || !purchases) return { ok: false, msg: 'В копии нет раздела покупок (нужна кнопка «Резервная копия» старых Карточек времени).' };
      const sh = { purchases, bags: lists[0].bags };
      const at = iso(Date.now()), now = core.now(), uid = s => TM.detUuid(s);
      const items = [], states = [], idMap = {}, seen = {}, setts = [];
      lists.slice(0, 3).forEach((lst, li) => {
        const list = li + 1;
        lst.items.forEach(o => {
          const id = 'si_kv' + uid('item' + o.id).slice(0, 10); idMap[o.id] = id;
          const st = ['on', 'off', 'bought'].includes(o.status) ? o.status : 'off', due = st === 'bought' && o.dueKey ? o.dueKey : null;
          const f = { name: String(o.name || 'Без названия').slice(0, 60), price: M.round2(+o.price || 0), unit: String(o.unit || 'шт'), days: Math.max(1, Math.floor(+o.days) || 1), ref_qty: +o.refQty > 0 ? M.round3(+o.refQty) : 1 };
          if (!seen[id]) { seen[id] = 1; items.push(Object.assign({ id, status: 'off', qty: 1, price_now: null, ord_at: iso(+o.ord || Date.now()), due_on: null, checked: false }, f, rowStamp(at, now))); }
          states.push(Object.assign({ id: 'l' + list + '_' + id, list_no: list, item_id: id, status: st === 'bought' && !due ? 'off' : st, qty: +o.qty > 0 ? M.round3(+o.qty) : 1, price_now: o.priceNow != null ? M.round2(+o.priceNow) : null, ord_at: iso(+o.ord || Date.now()), due_on: due, checked: !!o.checked }, rowStamp(at, now)));
        });
        const b = lst.bags || {}, cur = D.setts[setId(list)] || defSettings(list);
        const row = Object.assign({}, cur, { bags_small: Math.max(0, +b.s || 0), bags_large: Math.max(0, +b.l || 0), updated_at: now, deleted_at: null }); delete row.user_id; delete row.updated_by; setts.push(row);
      });
      /* чеки: подряд идущие покупки одного дня, не дальше 5 минут друг от друга */
      const ps = sh.purchases.filter(p => p && p.at).slice().sort((a, b) => a.at - b.at), receipts = [], lines = [], money = []; let cur = null;
      ps.forEach(p => {
        const day = TM.dayKey(p.at, TZ);
        if (!cur || cur.date !== day || p.at - cur.last > M.RECEIPT_GAP_MS) { cur = { id: 'rc_kv' + uid('receipt' + p.id).slice(0, 10), date: day, last: p.at }; receipts.push({ id: cur.id, started_at: iso(p.at), local_date: day, created_at: at, updated_at: now, deleted_at: null }); }
        cur.last = p.at;
        const base = { receipt_id: cur.id, bought_at: iso(p.at), local_date: day, created_at: iso(p.at), updated_at: now, deleted_at: null, thing_id: null };
        const g = Object.assign({ id: uid('line' + p.id), kind: 'goods', item_id: idMap[p.itemId] || null, name: String(p.name || '').slice(0, 60), unit: String(p.unit || 'шт'), price: M.round2(+p.price || 0), qty: +p.qty > 0 ? M.round3(+p.qty) : 1,
          amount: M.round2(+p.amount || 0), days: Math.max(1, Math.floor(+p.days) || 1), ref_qty: +p.refQty > 0 ? M.round3(+p.refQty) : 1, supply_days: Math.max(1, Math.floor(+p.supplyDays) || 1) }, base);
        lines.push(g);
        if (p.bags) [['s', 'bag_s', 'Пакет М', 25], ['l', 'bag_l', 'Пакет Б', 39]].forEach(b => {
          const n = +p.bags[b[0]] || 0; if (!n) return; const tot = +p.bags.amount || 0, price = b[0] === 's' ? 25 : 39;
          lines.push(Object.assign({ id: uid('bag' + b[0] + p.id), kind: 'bag', item_id: b[1], name: b[2], unit: 'шт', price, qty: n, amount: M.round2(n * price), days: 1, ref_qty: 1, supply_days: 1 }, base, { created_at: iso(p.at) }));
        });
      });
      lines.forEach(l => money.push({ id: l.id, subject_module: 'shop', subject_kind: 'purchase', subject_id: l.id, direction: 'out', kind: 'fact', amount: l.amount, currency: 'KZT', fx_rate: null, occurred_on: l.local_date, tz: TZ, category: '', comment: l.name,
        meta: { receipt: l.receipt_id, kind: l.kind, legacy: 'kv' }, source_device: 'import', created_at: l.created_at, updated_at: now, deleted_at: null }));
      const writes = [['shop_items', items], ['shop_receipts', receipts], ['shop_purchases', lines], ['money_entries', money], ['shop_list_state', states], ['shop_settings', setts]].filter(w => w[1].length).map(w => ({ table: w[0], rows: w[1] }));
      const summary = `Импорт покупок из «Карточек времени»: списков ${lists.length}, карточек ${items.length}, чеков ${receipts.length}, строк ${lines.length}`;
      core.commit({ writes, journal: [{ op: 'create', module: MOD, entity_kind: 'import', entity_id: 'kv', summary }] });
      await S.load(); return { ok: true, text: summary + '.' };
    };

    /* Выгрузка чеков «kartochki-vremeni/purchases/v1» (кнопки выгрузки в старых и новых Покупках). Идентификаторы те же, что у переноса из резервной копии,
       поэтому одна и та же покупка не задвоится при любом порядке переносов. Уже имеющиеся строки и карточки не трогаем. Новые карточки (по одной на товар) создаются
       «не в списке», а если товар куплен недавно, то «куплено» с датой возврата из выгрузки. */
    S.importPurchases = async function (data) {
      if (!data || data.schema !== 'kartochki-vremeni/purchases/v1' || !Array.isArray(data.receipts)) return { ok: false, msg: 'Это не выгрузка чеков (нужен формат purchases/v1).' };
      const at = iso(Date.now()), now = core.now(), uid = x => TM.detUuid(x), today = TM.dayKey(Date.now(), TZ);
      const haveItem = new Set(D.cards.map(i => i.id)), haveLine = new Set(D.lines.map(l => l.id)), haveRc = new Set(D.receipts.map(r => r.id));
      const price = { s: +(data.bagPrices && data.bagPrices.small) || 25, l: +(data.bagPrices && data.bagPrices.large) || 39 };
      const newItems = {}, receipts = [], lines = [], money = [], dayOf = ts => String(ts).slice(0, 10); let skipped = 0, bad = 0;
      data.receipts.forEach(r => {
        const goods = (r.items || []).filter(p => p && p.purchasedAt && isFinite(Date.parse(p.purchasedAt)));
        bad += (r.items || []).length - goods.length;
        if (!goods.length && !(r.bags && (r.bags.small || r.bags.large))) return;
        const first = goods[0], rid = 'rc_kv' + uid('receipt' + (first ? first.purchaseId : r.id)).slice(0, 10), startMs = Date.parse(r.start || (first && first.purchasedAt)), day = dayOf(r.start || first.purchasedAt);
        if (!haveRc.has(rid)) { receipts.push({ id: rid, started_at: iso(startMs), local_date: day, created_at: at, updated_at: now, deleted_at: null }); haveRc.add(rid); }
        const mk = (id, o) => Object.assign({ id, receipt_id: rid, thing_id: null, deleted_at: null, updated_at: now }, o);
        goods.forEach(p => {
          const id = uid('line' + p.purchaseId); if (haveLine.has(id)) { skipped++; return; } haveLine.add(id);
          const ms = Date.parse(p.purchasedAt), itemId = p.itemId ? 'si_kv' + uid('item' + p.itemId).slice(0, 10) : null;
          lines.push(mk(id, { kind: 'goods', item_id: itemId, name: String(p.name || '').slice(0, 60) || 'Без названия', unit: String(p.unit || 'шт'), price: M.round2(+p.unitPrice || 0), qty: +p.quantity > 0 ? M.round3(+p.quantity) : 1,
            amount: M.round2(+p.amount || 0), days: Math.max(1, Math.floor(+p.referenceDays) || 1), ref_qty: +p.referenceQuantity > 0 ? M.round3(+p.referenceQuantity) : 1, supply_days: Math.max(1, Math.floor(+p.supplyDays) || 1),
            bought_at: iso(ms), local_date: dayOf(p.purchasedAt), created_at: iso(ms) }));
          if (itemId && !haveItem.has(itemId)) { const cur = newItems[itemId]; if (!cur || ms >= cur.ms) newItems[itemId] = { ms, p, itemId }; }
        });
        const endMs = Date.parse(r.end) || startMs;
        [['small', 's', 'bag_s', 'Пакет М'], ['large', 'l', 'bag_l', 'Пакет Б']].forEach(b => {
          const n = +(r.bags && r.bags[b[0]]) || 0; if (!n) return; const id = uid('bag' + b[1] + (first ? first.purchaseId : r.id)); if (haveLine.has(id)) { skipped++; return; } haveLine.add(id);
          lines.push(mk(id, { kind: 'bag', item_id: b[2], name: b[3], unit: 'шт', price: price[b[1]], qty: n, amount: M.round2(n * price[b[1]]), days: 1, ref_qty: 1, supply_days: 1, bought_at: iso(endMs), local_date: day, created_at: iso(endMs) }));
        });
      });
      const items = Object.keys(newItems).map(k => {
        const { ms, p, itemId } = newItems[k], due = p.nextDue && p.nextDue > today ? p.nextDue : null, ref = +p.referenceQuantity > 0 ? M.round3(+p.referenceQuantity) : 1, unit = String(p.unit || 'шт');
        return { id: itemId, name: String(p.name || 'Без названия').slice(0, 60), price: M.round2(+p.unitPrice || 0), unit, days: Math.max(1, Math.floor(+p.referenceDays) || 1), ref_qty: ref, status: due ? 'bought' : 'off',
          qty: M.weightKind(unit) ? ref : 1, price_now: null, ord_at: iso(ms), due_on: due, checked: false, created_at: at, updated_at: now, deleted_at: null };
      });
      const newStates = items.map(i => ({ id: 'l1_' + i.id, list_no: 1, item_id: i.id, status: i.status, qty: i.qty, price_now: null, ord_at: i.ord_at, due_on: i.due_on, checked: false, created_at: at, updated_at: now, deleted_at: null }));
      items.forEach(i => { i.status = 'off'; i.qty = 1; i.due_on = null; });
      lines.forEach(l => money.push({ id: l.id, subject_module: 'shop', subject_kind: 'purchase', subject_id: l.id, direction: 'out', kind: 'fact', amount: l.amount, currency: 'KZT', fx_rate: null, occurred_on: l.local_date, tz: TZ, category: '', comment: l.name,
        meta: { receipt: l.receipt_id, kind: l.kind, legacy: 'kv' }, source_device: 'import', created_at: l.created_at, updated_at: now, deleted_at: null }));
      const writes = [['shop_items', items], ['shop_list_state', newStates], ['shop_receipts', receipts], ['shop_purchases', lines], ['money_entries', money]].filter(w => w[1].length).map(w => ({ table: w[0], rows: w[1] }));
      const summary = `Импорт выгрузки чеков: чеков ${receipts.length}, строк ${lines.length}` + (skipped ? ` (уже были: ${skipped})` : '') + `, новых карточек ${items.length}`;
      if (writes.length) core.commit({ writes, journal: [{ op: 'create', module: MOD, entity_kind: 'import', entity_id: 'kv-purchases', summary }] });
      await S.load(); return { ok: true, text: summary + (bad ? `, с ошибкой ${bad}` : '') + '.', lines: lines.length, skipped };
    };

    return S;
  }
  global.LifeShopStore = { create };
})(window);

</script>
<script>
/* ---- modules/shop-tools.js ---- */
/* «Покупки»: окна под списком — чеки за 7 дней (с переносом в «Вещицы»), выгрузка для анализа, цены пакетов, перенос из старого приложения.
   window.LifeShopTools: build(env, box), refresh(env) */
(function (global) {
  'use strict';
  const M = global.LifeShopModel, TM = global.LifeTimersModel;
  let refs = null;

  function build(env, box) {
    const { S, D } = env;
    box.innerHTML = `<details class="data" id="receiptsBox"><summary>Чеки за 7 дней</summary><div class="rcps"></div></details>
    <details class="data"><summary>Цены пакетов</summary><p>Цена за штуку, тг. Меняется только для будущих покупок.</p>
      <div class="sh-set"><label class="lbl">Малый (М)<input class="field s-small" type="text" inputmode="decimal" autocomplete="off"></label><label class="lbl">Большой (Б)<input class="field s-large" type="text" inputmode="decimal" autocomplete="off"></label><button type="button" class="btn primary s-save">Сохранить</button></div><p class="formerr s-err" hidden></p></details>
    <details class="data"><summary>Данные: выгрузка и перенос</summary>
      <p>Выгрузка чеков для анализа в прежнем формате purchases/v1. «День» берёт сегодня, «7 дней» заканчивается сегодня, «Всё» — вся история. Копия попадает в буфер и в поле ниже.</p>
      <div class="btns"><button type="button" class="btn primary x-day">День</button><button type="button" class="btn primary x-week">7 дней</button><button type="button" class="btn primary x-all">Всё</button></div>
      <div class="pastrow"><label class="lbl">С<input class="field x-from" type="date"></label><label class="lbl">По<input class="field x-to" type="date"></label></div>
      <div class="btns"><button type="button" class="btn x-range">Выгрузить период</button></div>
      <p class="exportinfo x-info" hidden></p><textarea class="x-out" readonly hidden aria-label="Чеки в формате JSON"></textarea>
      <p>Перенос из старых «Карточек времени»: вставьте резервную копию (или выберите файл) и нажмите кнопку. Переносятся карточки покупок, чеки, пакеты. Подойдёт и выгрузка чеков (формат purchases/v1): из неё берутся чеки и строки, недостающие карточки товаров создаются. Повторный перенос дублей не создаёт.</p>
      <input type="file" class="i-file" accept=".json,application/json,text/plain" aria-label="Файл резервной копии">
      <textarea class="i-in" aria-label="Резервная копия для переноса" placeholder='{"schema":"kartochki-vremeni/backup/v1", ...}' style="display:block;width:100%;height:90px;font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;"></textarea>
      <div class="btns"><button type="button" class="btn i-go">Перенести</button></div><p class="exportinfo i-info" hidden></p></details>`;
    const q = s => box.querySelector(s);
    refs = { box, q, rec: q('#receiptsBox'), sIn: false };
    q('#receiptsBox').addEventListener('toggle', () => refresh(env));
    /* цены пакетов */
    q('.s-save').addEventListener('click', () => { const r = S.setBagPrices(q('.s-small').value, q('.s-large').value); q('.s-err').hidden = !r.error; q('.s-err').textContent = r.error || ''; if (r.ok) env.toast('Цены пакетов сохранены.'); });
    /* выгрузка */
    const out = q('.x-out'), info = q('.x-info');
    function run(btn, label, obj) {
      info.hidden = false; info.textContent = `Выгружено: ${label}, ${obj.range.from === obj.range.to ? obj.range.from : obj.range.from + ' – ' + obj.range.to}. Формат purchases/v1. Чеков ${obj.totals.receipts}, позиций ${obj.totals.items}, сумма ${M.money(obj.totals.amount)}.`;

  function renderReceipts(env) {

      const sum = document.createElement('span'); sum.textContent = M.money(g.amount); head.append(t, sum); b.appendChild(head);

      db.textContent = bs ? bs.track.name + ' · ' + String(bs.value).replace('.', ',') : 'В базу'; db.title = bs ? 'Чек записан в трек «' + bs.track.name + '». Нажмите — следующий трек, после последнего — убрать из базы.' : 'Записать сумму чека в тысячах в трек расходов';
      db.addEventListener('click', () => { const r = S.cycleReceipt(g.id); if (!r.ok) env.toast(r.msg); }); b.appendChild(db);

      g.goods.forEach(p => {
        const li = document.createElement('li'), tx = document.createElement('span'); tx.textContent = p.name + ', ' + M.fmtQ(+p.qty, p.unit) + ' · ' + M.money(+p.amount); li.appendChild(tx);
        /* перенос в «Вещицы» делается на компьютере: клетка трека с зелёной точкой → «Детали» */
        const mv = document.createElement('span'); mv.className = 'rcp-thing'; mv.textContent = p.thing_id ? 'в Вещицах' : '';
        if (p.thing_id) { mv.textContent = 'в Вещицах'; mv.disabled = true; } else { mv.textContent = 'В Вещицы'; mv.addEventListener('click', async () => { mv.disabled = true; mv.textContent = '…'; const r = await S.moveToThing(p.id); if (r.ok) { env.toast(r.created ? 'Добавлено в «Вещицы»: ' + p.name + '.' : 'Уже есть в «Вещицах».'); } else { env.toast(r.msg); } renderReceipts(env); }); }
        const del = document.createElement('button'); del.type = 'button'; del.className = 'btn danger small'; del.textContent = 'Удалить';
        del.addEventListener('click', () => { if (!del.dataset.confirm) { del.dataset.confirm = '1'; del.textContent = p.thing_id ? 'Точно? Вещица останется' : 'Точно?'; return; } S.deleteLine(p.id); });
        li.append(mv, del); ul.appendChild(li);

  }
  function refresh(env) {

  }

<script>

(function (global) {

    el.innerHTML = `<div class="app" data-mode="shop">
  <div class="tm-bar"><span class="tm-note" role="status"></span><button type="button" class="tm-refresh">Обновить</button><button type="button" class="tm-refresh sh-torc" aria-label="К чекам" title="К чекам">⚙</button></div>

  <main class="list" aria-label="Покупки"></main>
  <div class="empty sh-empty" hidden><p>Список пуст. Добавьте первую покупку кнопкой ниже: название, цена за единицу, единица измерения и на сколько дней её хватает.</p></div>
  <p class="hint">Свайп вправо включает покупку в список. Ещё один свайп вправо добавляет одну единицу (штуку, кг), свайп влево убирает одну. Если единица на минимуме, свайп влево убирает покупку из списка. У товаров в кг или граммах в активной карточке можно ввести фактический вес и цену, итог и срок пересчитаются. «Купил» убирает покупку в запас и запускает отсчёт в днях: когда срок выйдет, она сама вернётся наверх. Кнопки М и Б в корзине считают пакеты: короткое нажатие добавляет, долгое обнуляет; при «Купил» пакеты попадают в чек.</p>

      <label class="lbl full">Название<input class="field a-name" type="text" maxlength="60" autocomplete="off" placeholder="Например, Пельмени"></label>
      <label class="lbl">Цена за единицу<input class="field a-price" type="text" inputmode="decimal" autocomplete="off" placeholder="250"></label>
      <label class="lbl">Единица<input class="field a-unit" type="text" maxlength="16" autocomplete="off" placeholder="кг, шт, рулон"></label>
      <label class="lbl">Хватает на, дней<input class="field a-days" type="text" inputmode="numeric" autocomplete="off" placeholder="4"></label>

    <div class="tm-tools"></div>
  </footer></div><div class="toast" role="status" aria-live="polite" hidden></div>`;
    const $ = s => el.querySelector(s), listEl = $('.list'), toastEl = $('.toast');
    let toastTimer = null;
    function toast(msg, label, fn) {

      if (label) { const b = document.createElement('button'); b.type = 'button'; b.className = 'toastbtn'; b.textContent = label; b.addEventListener('click', () => { toastEl.hidden = true; clearTimeout(toastTimer); fn(); }); toastEl.appendChild(b); }
      toastEl.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, label ? 7000 : 3200);
    }
    function attachSwipe(c, o) {
      let sw = null;
      c.addEventListener('pointerdown', e => { if (e.button > 0 || e.target.closest('button, input, select, textarea, label, .panel, .wedit')) return; sw = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, on: false }; });
      c.addEventListener('pointermove', e => {
        if (!sw || e.pointerId !== sw.id) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
        if (!sw.on) { if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; } if (Math.abs(dx) > Math.abs(dy) * 1.5 && Math.abs(dx) > 12) { sw.on = true; try { c.setPointerCapture(e.pointerId); } catch (er) { /* не критично */ } c.style.transition = 'none'; } else return; }
        sw.dx = Math.max(-96, Math.min(dx, 96)); c.style.transform = 'translateX(' + sw.dx + 'px)';
      });
      const end = (e, cancelled) => { if (!sw || e.pointerId !== sw.id) return; const d = sw; sw = null; if (!d.on) return; c.style.transition = ''; c.style.transform = ''; if (cancelled) return; if (d.dx >= 64) o.right(); else if (d.dx <= -64) o.left(); };
      c.addEventListener('pointerup', e => end(e, false)); c.addEventListener('pointercancel', e => end(e, true));
    }
    const undoToast = (msg, T, sum) => toast(msg, 'Отменить', () => T.undo(sum));

    /* ---------- карточка ---------- */
    function create(it) {
      const id = it.id, e = document.createElement('div'); e.className = 'card item'; e.tabIndex = 0; e.setAttribute('role', 'group'); e.dataset.item = id;
      e.innerHTML = '<div class="row top"><span class="stats"></span><span class="top-actions"><button type="button" class="more" aria-label="Изменить покупку">•••</button></span></div>' +
        '<div class="row main"><label class="chk"><input type="checkbox" class="chk-in" aria-label="Положил в корзину"></label><span class="name"></span><span class="calc"><span class="q"></span><span class="a"></span></span><span class="cd"><b></b><small>дн. до покупки</small></span><button type="button" class="buy">Купил</button></div>' +
        '<div class="wedit" hidden><label class="lbl">Вес<input class="field w-qty" type="text" inputmode="decimal" autocomplete="off" placeholder="1100 г или 1,1 кг"></label><label class="lbl"><span class="w-plabel">Цена</span><input class="field w-price" type="text" inputmode="decimal" autocomplete="off"></label><div class="wsum"><span class="w-read"></span><b class="w-total"></b></div></div>' +
        '<form class="panel" hidden><div class="fields"><label class="lbl full">Название<input class="field f-name" type="text" maxlength="60" autocomplete="off"></label><label class="lbl">Цена за единицу<input class="field f-price" type="text" inputmode="decimal" autocomplete="off"></label><label class="lbl">Единица<input class="field f-unit" type="text" maxlength="16" autocomplete="off"></label><label class="lbl">Хватает на, дней<input class="field f-days" type="text" inputmode="numeric" autocomplete="off"></label><label class="lbl full ref-wrap" hidden>Обычный вес на эти дни<input class="field f-ref" type="text" inputmode="decimal" autocomplete="off" placeholder="800 г или 0,8 кг"><small class="sub">Если купите больше или меньше, дни пересчитаются под вес, округляя вниз.</small></label></div><p class="formerr" hidden></p><div class="btns"><button type="submit" class="btn primary">Сохранить</button><button type="button" class="btn danger del">Удалить</button><button type="button" class="btn ghost close">Закрыть</button></div></form>';
      const q = s => e.querySelector(s), cur = () => D.items.find(x => x.id === id);
      const fName = q('.f-name'), fPrice = q('.f-price'), fUnit = q('.f-unit'), fDays = q('.f-days'), fRef = q('.f-ref'), err = q('.formerr');
      const syncRef = () => { q('.ref-wrap').hidden = !M.weightKind(fUnit.value.trim() || 'шт'); }; fUnit.addEventListener('input', syncRef);

      [wQty, wPrice].forEach(f => f.addEventListener('blur', () => { f.removeAttribute('aria-invalid'); S.flushPending(); updateTexts(); }));

      els.set(id, e); return e;
    }

    function updateTexts() {
      let total = 0, onCount = 0, cart = 0, cartCount = 0; const set = D.settings;
      D.items.forEach(it => {
        const on = it.status === 'on', wk = M.weightKind(it.unit), price = M.effPrice(it), amount = M.round2(price * it.qty);

      $('.sh-total').textContent = M.money(total); $('.sh-total-label').textContent = onCount ? 'К покупке · ' + onCount + ' поз.' : 'К покупке';
    }

    /* пакеты: короткое нажатие +1, долгое обнуляет */

    /* ---------- добавление ---------- */

      ev.preventDefault(); const r = S.addItem({ name: fields.name.value, price: fields.price.value, unit: fields.unit.value, days: fields.days.value, ref: fields.ref.value });

      updateTexts(); renderSug(); if (global.LifeShopTools) global.LifeShopTools.refresh(env);
      if (animate) { let moved = false; els.forEach((e, id) => { if (!first.has(id)) return; const dy = first.get(id) - e.getBoundingClientRect().top; if (dy) { e.style.transition = 'none'; e.style.transform = 'translateY(' + dy + 'px)'; moved = true; } }); if (moved) { void listEl.offsetHeight; els.forEach(e => { e.style.transition = ''; e.style.transform = ''; }); } }

<script>
/* ---- modules/emo-model.js ---- */
/* «Эмоции» (общие с «Состоянием»): чистые расчёты без экрана и без базы. Логика режима «Эмо» из «Карточек времени» без изменений.
   Данные D = {tags (с убранными), marks}. Запись = отметка (mood_marks): момент ts, сила value (−5…−1, 1…5 или null), комментарий, метки tag_ids.
   День — строка YYYY-MM-DD по поясу владельца. window.LifeEmoModel */
(function (global) {
  'use strict';
  const TM = global.LifeTimersModel;
  const MAX_TAGS = 40, NOTE_MAX = 500, NAME_MAX = 60, HALF = 30 * 60000;
  const clean = (text, max) => String(text == null ? '' : text).replace(/\s+/g, ' ').trim().slice(0, max);
  const norm = s => clean(s, 200).toLowerCase();
  const fmtVal = v => (v == null ? '–' : (v > 0 ? '+' : '−') + Math.abs(v));
  const fmtAvg = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1).replace('.', ',');
  function preview(note) { const ch = Array.from(note || ''); return ch.length > 10 ? ch.slice(0, 10).join('') + '…' : ch.join(''); }
  const MON = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  const chartDate = date => date.slice(8, 10) + MON[+date.slice(5, 7) - 1];
  /* красный при −5, жёлтый около 0, зелёный при +5 */
  const moodColor = (v, dark) => 'hsl(' + Math.round(125 * (v + 5) / 10) + ' ' + (dark ? 80 : 72) + '% ' + (dark ? 60 : 40) + '%)';

  const dayBounds = (date, tz) => ({ from: TM.zonedTs(date, '00:00', tz), to: TM.zonedTs(TM.shiftDay(date, 1), '00:00', tz) });
  const tsOf = m => Date.parse(m.ts);
  const marksOfDay = (D, date) => D.marks.filter(m => m.local_date === date).sort((a, b) => tsOf(a) - tsOf(b) || String(a.id).localeCompare(String(b.id)));
  const tagById = (D, id) => D.tags.find(t => t.id === id) || null;
  const tagName = (D, id) => { const t = tagById(D, id); return t ? t.name : '?'; };
  const markTags = (D, m) => (m.tag_ids || []).map(id => tagName(D, id));
  const activeTags = D => D.tags.filter(t => !t.deleted_at).sort((a, b) => a.sort - b.sort || a.name.localeCompare(b.name, 'ru'));
  /* активная метка с таким названием (без учёта регистра и пробелов); exceptId — не считая этой */
  const findActive = (D, name, exceptId) => { const n = norm(name); return D.tags.find(t => !t.deleted_at && t.id !== exceptId && norm(t.name) === n) || null; };

  /* Куда встанет перетаскиваемая запись. Между двумя: ровно посередине. В начало дня: на 30 минут раньше самой ранней.
     Наверх (самая поздняя): на 30 минут позже самой поздней, но не позже «сейчас». rest — остальные записи дня по убыванию времени (as в списке), idx — место. */
  function dropTime(g, rest, idx, from, to, now) {
    const m = rest.length; let t; if (!m) return g.at;
    if (idx <= 0) { const b = rest[0].at; t = Math.min(b + HALF, now, to - 1000); if (t <= b) t = Math.min(b + 1000, to - 1000); }
    else if (idx >= m) t = Math.max(rest[m - 1].at - HALF, from);
    else t = Math.floor((rest[idx - 1].at + rest[idx].at) / 2000) * 1000;
    return t;
  }

  /* точки графика: период из N дней, заканчивающийся днём endDate; avg — одна точка в день (среднее) */
  function chartPoints(D, endDate, N, avg, tz) {
    const days = []; for (let i = N - 1; i >= 0; i--) days.push(TM.shiftDay(endDate, -i));
    const start = dayBounds(days[0], tz).from, end = dayBounds(endDate, tz).to;
    const pts = D.marks.filter(m => m.value != null).map(m => ({ id: m.id, at: tsOf(m), val: m.value, note: m.note || '', tags: markTags(D, m), date: m.local_date }))
      .filter(p => p.at >= start && p.at < end).sort((a, b) => a.at - b.at);
    if (!avg) return { days, start, end, pts };
    const out = [];
    days.forEach(d => { const b = dayBounds(d, tz), r = pts.filter(p => p.at >= b.from && p.at < b.to); if (!r.length) return; out.push({ id: 'avg' + b.from, at: (b.from + b.to) / 2, val: r.reduce((a, p) => a + p.val, 0) / r.length, n: r.length, avg: true, date: d, tags: [], note: '' }); });
    return { days, start, end, pts: out };
  }

  /* время из импорта: «14:30» с датой дня или полная строка времени */
  function parseTime(t, date, tz) {
    if (typeof t === 'string' && /^\d{1,2}:\d{2}(:\d{2})?$/.test(t.trim()) && /^\d{4}-\d{2}-\d{2}$/.test(date || '')) {
      const p = t.trim().split(':').map(Number); if (p[0] > 23 || p[1] > 59 || (p[2] || 0) > 59) return null;
      const ms = TM.zonedTs(date, String(p[0]).padStart(2, '0') + ':' + String(p[1]).padStart(2, '0') + ':' + String(p[2] || 0).padStart(2, '0'), tz); return isFinite(ms) ? ms : null;
    }
    if (typeof t === 'string' && t.trim()) { const ms = Date.parse(t.trim()); return isNaN(ms) ? null : ms; }
    return null;
  }
  /* разбор файла импорта emo/v1 и emo-days/v1 → записи по одной метке: [{at, val, tag, note}] */
  function parseImport(data, tz) {
    if (data && typeof data.schema === 'string' && data.schema.indexOf('kartochki-vremeni/emo') !== 0) return { error: 'Это не журнал Эмо (формат ' + data.schema.split('/').slice(1).join('/') + '). Нужен emo/v1 или emo-days/v1.' };

    const records = [], bad = [];
    days.forEach((day, di) => {
      const date = day && day.date;
      (day && Array.isArray(day.entries) ? day.entries : []).forEach((r, ri) => {
        const where = 'день ' + (di + 1) + ', запись ' + (ri + 1);
        if (!r || typeof r !== 'object') { bad.push(where + ': не объект'); return; }
        const at = parseTime(r.time, date, tz); if (at === null) { bad.push(where + ': не понял время'); return; }
        const val = Number(r.value); if (!Number.isInteger(val) || val === 0 || Math.abs(val) > 5) { bad.push(where + ': значение должно быть от −5 до −1 или от 1 до 5'); return; }
        const tag = clean(r.tag, NAME_MAX); if (!tag) { bad.push(where + ': нет метки'); return; }
        records.push({ at, val, tag, note: typeof r.comment === 'string' ? r.comment.trim().slice(0, NOTE_MAX) : '' });
      });
    });
    return { records, bad };
  }
  /* копия старых Карточек времени: emo = {tags:[{id,name}], entries:[{id,at,tag,val,note}]} */
  function fromLegacy(emo) {
    const records = [], bad = [];
    (emo.entries || []).forEach((e, i) => {
      const at = Number(e && e.at), val = Number(e && e.val), tag = clean(e && e.tag, NAME_MAX);
      if (!isFinite(at) || !Number.isInteger(val) || val === 0 || Math.abs(val) > 5 || !tag) { bad.push('запись ' + (i + 1)); return; }
      records.push({ at, val, tag, note: typeof e.note === 'string' ? e.note.trim().slice(0, NOTE_MAX) : '' });
    });
    return { records, bad, tags: (emo.tags || []).map(t => clean(t && t.name, NAME_MAX)).filter(Boolean) };
  }

  /* выгрузка: emo/v1 за день и emo-days/v1 за период; одна запись на метку, как раньше. Записи без силы не выгружаются */
  function entriesOf(D, date, tz) {
    const out = [];
    marksOfDay(D, date).forEach(m => { if (m.value == null) return; markTags(D, m).forEach(tag => out.push({ time: TM.isoZoned(tsOf(m), tz), tag, value: m.value, comment: m.note || '' })); });
    return out;
  }
  function buildDay(D, date, tz, now) { const entries = entriesOf(D, date, tz); return { schema: 'kartochki-vremeni/emo/v1', date, timezone: tz, exportedAt: TM.isoZoned(now, tz), count: entries.length, entries }; }
  function buildRange(D, from, to, tz, now) {
    const days = []; for (let d = from, n = 0; d <= to && n < 3700; d = TM.shiftDay(d, 1), n++) { const e = entriesOf(D, d, tz); if (e.length) days.push({ date: d, count: e.length, entries: e }); }
    return { schema: 'kartochki-vremeni/emo-days/v1', timezone: tz, exportedAt: TM.isoZoned(now, tz), range: { from, to }, days };
  }

  global.LifeEmoModel = { MAX_TAGS, NOTE_MAX, NAME_MAX, HALF, clean, norm, fmtVal, fmtAvg, preview, chartDate, moodColor, dayBounds, tsOf, marksOfDay, tagById, tagName, markTags, activeTags,
    findActive, dropTime, chartPoints, parseTime, parseImport, fromLegacy, buildDay, buildRange };
})(window);


</script>

<script>
/* ---- modules/emo-store.js ---- */
/* «Эмоции»: данные и действия (без экрана). LifeEmoStore.create(core) → объект S.
   Всё пишется через core.commit (офлайн-очередь, журнал), строки целиком. Таблицы mood_tags и mood_marks общие с «Состоянием» на компьютере. */
(function (global) {
  'use strict';
  const M = global.LifeEmoModel, TM = global.LifeTimersModel;
  const MOD = 'mood', CACHE = 'emo', CACHE_DAYS = 45;
  const TBL = { mood_tags: 'tags', mood_marks: 'marks' };

  function create(core) {
    const TZ = core.TZ;
    const D = { tags: [], marks: [] };
    const S = { D, TZ, state: 'loading', note: '', loadedAt: 0, onChange: null };
    const iso = ms => new Date(ms).toISOString();
    const changed = () => { if (S.onChange) S.onChange(); };
    const today = () => TM.dayKey(Date.now(), TZ);
    S.today = today;

    function apply(d) { D.tags = d.tags || []; D.marks = (d.marks || []).filter(r => !r.deleted_at); }
    function saveCache() {
      const from = TM.shiftDay(today(), -CACHE_DAYS);
      core.cache.set(CACHE, { tags: D.tags, marks: D.marks.filter(m => m.local_date >= from) });
    }
    S.load = async function () {
      if (S.state !== 'ready') S.state = 'loading'; changed();
      try { await core.flush(); } catch (e) { /* очередь повторит */ }
      try {
        if (core.status().pending > 0) throw Object.assign(new Error('очередь'), { pendingQueue: true });
        const [tags, marks] = await Promise.all([core.select('mood_tags'), core.select('mood_marks', { filters: ['deleted_at=is.null'] })]);
        apply({ tags, marks }); saveCache(); S.state = 'ready'; S.note = ''; S.loadedAt = Date.now();
      } catch (e) {
        if (e.auth) { S.state = 'error'; S.note = 'нужно войти'; S.authLost = true; changed(); return; }
        const c = core.cache.get(CACHE);
        if (c && (e.net || e.pendingQueue)) { apply(c.data); S.state = 'ready'; S.note = e.pendingQueue ? 'Есть неотправленные изменения, показаны данные на этом телефоне.' : 'Нет связи. Показаны данные, сохранённые на телефоне (последние ' + CACHE_DAYS + ' дней).'; S.loadedAt = Date.now(); }
        else { S.state = 'error'; S.note = e.net ? 'нет связи с базой и нет копии на телефоне' : (e.message || 'ошибка чтения'); }
      }
      changed();
    };

    /* ---------- запись одним действием ---------- */
    function tx() {
      const w = {}, j = [], before = [];
      const T = {
        put(table, row) {
          row = Object.assign({}, row, { updated_at: core.now() });
          const arr = D[TBL[table]], i = arr.findIndex(r => r.id === row.id);
          before.push({ table, prev: i >= 0 ? JSON.parse(JSON.stringify(arr[i])) : null, id: row.id });
          if (table === 'mood_marks' && row.deleted_at) { if (i >= 0) arr.splice(i, 1); } else if (i >= 0) arr[i] = row; else arr.push(row);
          const out = Object.assign({}, row); delete out.user_id; delete out.updated_by; (w[table] = w[table] || {})[row.id] = out; return row;
        },
        del(table, row) { return T.put(table, Object.assign({}, row, { deleted_at: core.now() })); },
        log(op, kind, id, summary) { j.push({ op, module: MOD, entity_kind: kind, entity_id: id, summary }); },
        commit() {
          saveCache();
          const writes = Object.keys(w).map(t => ({ table: t, rows: Object.keys(w[t]).map(k => w[t][k]) }));
          try { core.commit({ writes, journal: j }); } catch (e) { S.note = 'Не сохранено: ' + (e.message || e); }
          changed(); return T;
        },
        /* отмена: прежние версии возвращаются, созданное заново помечается удалённым */
        undo(summary) {
          const U = tx(), seen = {};
          before.slice().reverse().forEach(b => {
            const k = b.table + '/' + b.id; if (seen[k]) return; seen[k] = 1;
            const first = before.find(x => x.table === b.table && x.id === b.id), cur = D[TBL[b.table]].find(r => r.id === b.id);
            if (first.prev) U.put(b.table, first.prev); else if (cur) U.del(b.table, cur);
          });
          U.log('change', 'undo', '', summary || 'Отмена действия'); U.commit();
        }
      };
      return T;
    }
    S.tx = tx;
    const newId = p => p + '_' + core.uuid().replace(/-/g, '').slice(0, 12);
    const tagRow = (o, base) => Object.assign({ id: o.id, name: '', sort: 0, created_at: iso(Date.now()), deleted_at: null }, base || {}, o);
    const nextSort = () => D.tags.reduce((a, t) => Math.max(a, t.sort), -1) + 1;
    const activeCount = () => D.tags.filter(t => !t.deleted_at).length;
    S.tags = () => M.activeTags(D);

    /* найти активную метку по названию, вернуть убранную с тем же названием или создать новую (внутри tx T) */
    function ensureTag(T, name, st) {
      const ex = M.findActive(D, name); if (ex) return ex;
      const n = M.norm(name), old = D.tags.find(t => t.deleted_at && M.norm(t.name) === n);
      if (old) { st.sort++; return T.put('mood_tags', Object.assign({}, old, { deleted_at: null, sort: st.sort })); }
      st.sort++; return T.put('mood_tags', tagRow({ id: newId('et'), name: M.clean(name, M.NAME_MAX), sort: st.sort }));
    }

    /* ---------- метки ---------- */
    S.addTags = function (text) {
      const T = tx(), st = { sort: nextSort() - 1 }; let added = 0; const ids = [], names = [];
      String(text).split(/[,;\n]/).forEach(raw => {
        const n = M.clean(raw, M.NAME_MAX); if (!n || M.findActive(D, n) || activeCount() >= M.MAX_TAGS) return;
        const t = ensureTag(T, n, st); ids.push(t.id); names.push(t.name); added++;
      });
      if (!added) return { added: 0, msg: String(text).trim() ? 'Такая метка уже есть, либо меток уже ' + M.MAX_TAGS + '.' : '' };
      T.log('create', 'tag', ids.join(','), 'Добавлены метки: ' + names.join(', ')); T.commit(); return { added, ids, tx: T };
    };
    S.renameTag = function (id, name) {
      const t = D.tags.find(x => x.id === id && !x.deleted_at); if (!t) return { error: 'Метка не найдена.' };
      const n = M.clean(name, M.NAME_MAX); if (!n) return { error: 'Название не может быть пустым.' };
      if (M.findActive(D, n, id)) return { error: 'Метка с таким названием уже есть.' };
      if (n === t.name) return { ok: true };
      const T = tx(); T.put('mood_tags', Object.assign({}, t, { name: n })); T.log('change', 'tag', id, 'Метка «' + t.name + '» переименована в «' + n + '»'); T.commit(); return { ok: true, tx: T };
    };
    S.deleteTag = function (id) {
      const t = D.tags.find(x => x.id === id && !x.deleted_at); if (!t) return;
      const T = tx(); T.del('mood_tags', t); T.log('delete', 'tag', id, 'Метка убрана из списка: ' + t.name); T.commit(); return T;
    };

    /* ---------- записи ---------- */
    const markRow = (o) => Object.assign({ id: o.id, ts: iso(o.at), local_date: TM.dayKey(o.at, TZ), value: o.val == null ? null : o.val, note: o.note || '', tag_ids: o.tagIds || [], created_at: iso(Date.now()), deleted_at: null }, {});
    S.addMark = function ({ tagIds, val, note, at }) {
      const ids = (tagIds || []).filter(id => D.tags.some(t => t.id === id && !t.deleted_at));
      if (!ids.length) return { error: 'Выберите хотя бы одно чувство.' };
      if (!Number.isInteger(val) || val === 0 || Math.abs(val) > 5) return { error: 'Выберите значение от −5 до +5.' };
      at = at == null ? Date.now() : at; if (at > Date.now() + 1000) return { error: 'Время записи не может быть в будущем.' };
      note = String(note || '').trim().slice(0, M.NOTE_MAX);
      const T = tx(), id = newId('mk'); T.put('mood_marks', markRow({ id, at, val, note, tagIds: ids }));
      T.log('create', 'mark', id, 'Эмоция ' + M.fmtVal(val) + ': ' + ids.map(i => M.tagName(D, i)).join(', ') + (note ? ' · ' + note : '')); T.commit();
      return { ok: true, id, tx: T, at, count: ids.length };
    };
    S.removeMark = function (id) {
      const m = D.marks.find(x => x.id === id); if (!m) return null;
      const T = tx(); T.del('mood_marks', m); T.log('delete', 'mark', id, 'Запись удалена: ' + M.fmtVal(m.value) + ' ' + M.markTags(D, m).join(', ')); T.commit(); return T;
    };
    S.setTime = function (id, at) {
      const m = D.marks.find(x => x.id === id); if (!m) return null;
      const T = tx(); T.put('mood_marks', Object.assign({}, m, { ts: iso(at), local_date: TM.dayKey(at, TZ) }));
      T.log('change', 'mark', id, 'Время записи: ' + TM.hm(at, TZ)); T.commit(); return T;
    };

    /* ---------- импорт (общий для файла emo и старой копии) ---------- */
    S.importRecords = function (records, extraTags, label) {
      const T = tx(), st = { sort: nextSort() - 1 }; let added = 0, dup = 0;
      const byKey = {}; D.marks.forEach(m => { byKey[Math.floor(M.tsOf(m) / 1000) + '|' + m.value + '|' + (m.note || '')] = m; });
      (extraTags || []).forEach(n => { if (activeCount() < M.MAX_TAGS || M.findActive(D, n)) ensureTag(T, n, st); });
      records.forEach(r => {
        const tg = ensureTag(T, r.tag, st), k = Math.floor(r.at / 1000) + '|' + r.val + '|' + r.note, ex = byKey[k];
        if (ex) { if (ex.tag_ids.includes(tg.id)) { dup++; return; } byKey[k] = T.put('mood_marks', Object.assign({}, ex, { tag_ids: ex.tag_ids.concat(tg.id) })); added++; return; }
        byKey[k] = T.put('mood_marks', markRow({ id: newId('mk'), at: r.at, val: r.val, note: r.note, tagIds: [tg.id] })); added++;
      });
      const summary = label + ': записей ' + added + ', дублей пропущено ' + dup;
      if (added || (extraTags && extraTags.length)) { T.log('create', 'import', '', summary); T.commit(); }
      return { added, dup, tx: T, summary };
    };
    S.importLegacy = function (obj) {
      const em = obj && obj.emo; if (!em || !Array.isArray(em.entries)) return { ok: false, msg: 'В копии нет раздела «Эмо» (нужна кнопка «Резервная копия» старых Карточек времени).' };
      const p = M.fromLegacy(em), r = S.importRecords(p.records, p.tags, 'Импорт Эмо из «Карточек времени»');
      return { ok: true, added: r.added, text: r.summary + (p.bad.length ? ', с ошибкой ' + p.bad.length : '') + '.', tx: r.tx };
    };
    S.importFile = function (data) {
      const p = M.parseImport(data, TZ); if (p.error) return { error: p.error };
      const r = S.importRecords(p.records, [], 'Импорт Эмо'); let msg = 'Добавлено ' + r.added + ', дублей пропущено ' + r.dup + ', с ошибкой ' + p.bad.length + '.';
      if (p.bad.length) msg += ' ' + p.bad.slice(0, 3).join('; ') + (p.bad.length > 3 ? '…' : '.');
      return { ok: true, added: r.added, msg, tx: r.tx };
    };
    S.firstDay = function () { let min = today(); D.marks.forEach(m => { if (m.local_date < min) min = m.local_date; }); return min; };
    return S;
  }
  global.LifeEmoStore = { create };
})(window);


</script>

    let viewDay = S.today(), sel = [], val = null, editing = false, renameId = null, open = {}, delAsk = null, range = 3, avg = false, pickId = null, pastSel = [], pastVal = null, alive = true, drag = null;
    el.innerHTML = `<div class="app" data-mode="emo">

      <p>Если не успели записать чувство вовремя: укажите дату и время, выберите чувства и значение.</p>

    const $ = s => el.querySelector(s), logEl = $('.emolog'), toastEl = $('.toast'), cloud = $('.emo-cloud'), scaleEl = $('.emo-scale'), noteRow = $('.emo-note'), noteIn = $('.emo-notein');

      toastEl.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, label ? 7000 : 3200);
    }

`;
  function start(el) {
    /* Внутри правого дока компьютерной оболочки (?embed=1) берём её core: общий вход и общая очередь записи. */
    let core = null;
    if (/[?&]embed=1\b/.test(location.search) && global.parent !== global) { try { core = global.parent.LifeShell && global.parent.LifeShell.core; } catch (e) { core = null; } }
    const embedded = !!core;
    if (!core) core = global.LifeCore.init({ device: 'pocket' }); else document.documentElement.classList.add('pk-embed');
    if (!document.getElementById('pk-css')) { const s = document.createElement('style'); s.id = 'pk-css'; s.textContent = global.LifeTimersCss + global.LifeShopCss + global.LifeEmoCss + CSS; document.head.appendChild(s); }
    const modules = [
      { id: 'timers', title: 'Таймеры', mount: (box, ctx) => global.LifeModules.timers.mount(box, ctx) },
      { id: 'shop', title: 'Покупки', mount: (box, ctx) => global.LifeModules.shop.mount(box, ctx) },
      { id: 'emo', title: 'Эмоции', mount: (box, ctx) => global.LifeModules.emo.mount(box, ctx) }
    ];
    let tab = core.store.get(TAB_KEY, 'timers'); if (!modules.some(m => m.id === tab)) tab = 'timers';
    let mod = null;
    const shopTitle = () => { const n = +core.store.get('lifeerp-shop-list', 1); return n > 1 && n <= 3 ? 'Покупки' + n : 'Покупки'; };
    el.innerHTML = '<div class="pk-wrap"><div class="pk-main"></div></div><nav class="pk-nav" hidden></nav><button class="pk-out" type="button">Выйти</button>';
    const main = el.querySelector('.pk-main'), nav = el.querySelector('.pk-nav'), out = el.querySelector('.pk-out');
    function unmount() { if (mod) { try { mod.unmount(); } catch (e) { /* уже убрано */ } mod = null; } main.innerHTML = ''; }
    function show() {
      unmount();
      if (!core.session() && embedded) { nav.hidden = true; try { global.parent.LifeShell.refresh(); } catch (e) { /* оболочка сама покажет вход */ } return; }
      if (!core.session()) { nav.hidden = true; out.style.display = 'none'; global.LifeLogin.mount(main, { onDone: show }); return; }
      core.reloadSession(); nav.hidden = false; out.style.display = 'block';
      nav.innerHTML = modules.map(m => `<button type="button" data-tab="${m.id}" class="${m.id === tab ? 'on' : ''}">${m.id === 'shop' ? shopTitle() : m.title}</button>`).join('');
      const m = modules.find(x => x.id === tab);
      if (m.soon) { main.innerHTML = '<p class="pk-soon"></p>'; main.firstChild.textContent = m.soon; }
      else mod = m.mount(main, { core, onAuthLost: show, onTitle: t => { const b = nav.querySelector('[data-tab=shop]'); if (b) b.textContent = t; } });
    }
    nav.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; if (b.dataset.tab === tab) { if (tab === 'shop' && mod && mod.cycle) mod.cycle(); return; } tab = b.dataset.tab; core.store.set(TAB_KEY, tab); show(); });
    out.addEventListener('click', async () => { if (core.status().pending && !confirm('Есть неотправленные изменения. Выйти всё равно? Они останутся на телефоне до следующего входа.')) return; await core.signOut(); show(); });
    const offAuth = core.on('auth', ok => { if (!ok) show(); });
    if (embedded) global.addEventListener('pagehide', () => { offAuth(); unmount(); });
    show();
    if (!embedded && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* без офлайн-страницы */ } }
  }
  global.LifePocket = { start };

</script>
<script>LifePocket.start(document.getElementById('app'));</script>
